// ---- pinger.js ----
// pinger.js: inside This PC: the live pinger (each ping's round trip to PC Relay, the last 60 drawn) and Restart
// Jon's desktop: one press starts Windows' own countdown, with Cancel beside it (no question first: the countdown is
// the second chance). While a restart is set or under way the pinger keeps going, whatever section is open, and says
// how far it got: Windows going away, Windows back without PC Relay yet, and the PC back (with how long it took). The
// strip at the bottom of every section shows the countdown too.
"use strict";
(function () {
  const { h, $, clear } = S;
  const RATES = [[500, "Twice a second"], [1000, "Every second"], [2000, "Every 2 seconds"], [5000, "Every 5 seconds"], [10000, "Every 10 seconds"], [60000, "Every minute"]];
  const rate = () => { const v = Number(S.store.get("ping-every", 1000)); return RATES.some(([n]) => n === v) ? v : 1000; };
  const pings = [];
  let gen = 0, running = 0, pc = null, pcAt = 0, pcWhy = "", box = null;
  const PG = (S.pinger = { pings, RATES, rate, get pc() { return pc; }, get watch() { return watch; } });

  // ---- the restart being watched: kept on this device, so a reload goes on watching ----
  let watch = S.store.get("restart-watch", null);
  if (watch && Date.now() - (watch.asked || 0) > 60 * 60 * 1000) watch = null;
  const saveWatch = () => S.store.set("restart-watch", watch);
  const watching = () => !!(watch && !watch.done);
  const want = () => document.visibilityState === "visible" && S.app.state !== "leaving" && ((S.app.is("pc") && !!box) || watching());
  const name = () => S.pc.name();

  // Does anything answer at the PC's address, PC Relay or not? (A browser hides Tailscale's own answer when PC Relay is
  // not running, so this asks without reading the answer: any answer means Windows and Tailscale are up.)
  async function knock(ms) {
    const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ms || 4000);
    try { await fetch(`${S.pc.R.base}/relay/ping?knock=1&t=${Date.now()}`, { mode: "no-cors", cache: "no-store", credentials: "omit", signal: ac.signal }); return true; }
    catch (e) { return false; }
    finally { clearTimeout(timer); }
  }
  // one loop at a time: each start is a new generation; an older loop stops at its next step
  const wake = new Set();
  const nap = (ms) => new Promise((res) => { const t = setTimeout(res, ms); wake.add(() => { clearTimeout(t); res(); }); });
  function start() {
    if (!S.pc.R || !want() || (running && running === gen)) return;
    const my = ++gen;
    running = my;
    (async () => {
      while (my === gen && want()) {
        const every = watching() ? Math.min(rate(), 2000) : rate(), t0 = Date.now();
        const r = await S.pc.ping(Math.max(4000, Math.min(every * 2, 8000)));
        if (my !== gen) break;
        const p = Object.assign({}, S.pc.last);
        if (!r.ok && !p.status && r.kind !== "offline" && r.kind !== "off") p.knock = await knock(4000);
        if (my !== gen) break;
        pings.push(p);
        if (pings.length > 600) pings.splice(0, pings.length - 600);
        await onPing(r, p);
        drawPings();
        if (my !== gen) break;
        await nap(Math.max(0, every - (Date.now() - t0)));
      }
      if (running === my) running = 0;
    })();
  }
  function stop() { gen++; running = 0; for (const f of wake) f(); wake.clear(); }
  const again = () => { stop(); start(); };
  PG.start = start; PG.stop = stop;
  document.addEventListener("visibilitychange", () => (document.visibilityState === "visible" ? start() : stop()));

  async function onPing(r, p) {
    const info = r.info || S.pc.info;
    if (r.ok && S.app.state === "away") S.app.connect(true);   // (it answers again: the sections come back at once)
    if (r.ok && info && info.restart_at && (!watch || watch.at !== info.restart_at)) { await loadPC(); beginWatch(); }
    if (watching()) await follow(r, p);
    if (S.app.is("pc") && Date.now() - pcAt > 30000) loadPC();
  }
  async function loadPC() {
    if (!S.pc.can("pc.control")) return;
    const r = await S.pc.api("pc");
    pcAt = Date.now();
    if (r.ok) { pc = r.data; pcWhy = ""; } else pcWhy = r.why;
    S.emit("pc-data", pc);
    drawRestart();
    return r;
  }
  PG.loadPC = loadPC;
  function beginWatch() {
    const rs = pc && pc.restart;
    if (!rs || !rs.pending) return;
    watch = { asked: rs.asked, at: rs.at, name: rs.name, relay: pc.relay_started, windows: pc.windows_started, phase: "set" };
    saveWatch();
    again();
  }
  async function follow(r, p) {
    const w = watch;
    if (r.ok) {
      if (w.phase === "set" || w.phase === "due") {
        if (!(r.info && r.info.restart_at)) {
          await loadPC();
          const last = pc && pc.restart && pc.restart.last;
          if (pc && pc.relay_started === w.relay) {
            w.done = true;
            w.result = last && last.asked === w.asked && last.result === "cancelled" ? "cancelled" : last && last.result === "did-not-happen" ? "not" : "gone";
            w.detail = last ? last.detail || "" : "";
            w.by = last ? last.by_name || last.by || "" : "";
            saveWatch(); drawRestart(); again();
            return;
          }
        }
        if (S.pc.pcNow() >= w.at && w.phase === "set") w.phase = "due";
        drawRestart();
        return;
      }
      await loadPC();   // it answers again after it went away
      const rs = (pc && pc.restart) || {}, winNew = pc && pc.windows_started && pc.windows_started > w.asked;
      if (!winNew && rs.pending && rs.asked === w.asked) { w.phase = S.pc.pcNow() >= w.at ? "due" : "set"; w.relay = pc.relay_started; w.awayAt = 0; saveWatch(); drawRestart(); return; }
      w.backAt = p.at; w.phase = "back"; w.done = true;
      w.result = winNew ? "restarted" : "relay-only";
      w.windowsAt = pc ? pc.windows_started : 0;
      w.relayAt = pc ? pc.relay_started : 0;
      saveWatch(); drawRestart(); again();
      return;
    }
    if (p.status === 502 || p.knock) { if (w.phase !== "windows") { w.phase = "windows"; w.windowsSeen = p.at; if (!w.awayAt) w.awayAt = p.at; } }
    else if (w.phase === "set" || w.phase === "due") { w.phase = "away"; w.awayAt = p.at; }
    saveWatch();
    drawRestart();
  }

  // ---- the pinger ----
  function whyText(p) {
    if (p.status === 502) return "Windows is up, PC Relay is not running";
    if (p.knock) return "Windows is up, PC Relay does not answer";
    if (p.kind === "off") return "PC Relay is switched off";
    return p.why || "no answer";
  }
  function drawPings() {
    if (!box) return;
    const big = $("#pingbig", box), st = $("#pingstate", box), chart = $("#pingchart", box), stats = $("#pingstats", box);
    const last = pings[pings.length - 1];
    if (!last) { big.textContent = "…"; big.className = "pingbig"; st.textContent = "Pinging PC Relay…"; }
    else if (last.ok) { big.textContent = last.ms + " ms"; big.className = "pingbig ok"; st.textContent = `PC Relay answered at ${S.clock(last.at, true)}`; }
    else { big.textContent = "No answer"; big.className = "pingbig bad"; st.textContent = S.sentence(whyText(last)); }
    const N = 60, view = pings.slice(-N), good = view.filter((p) => p.ok).map((p) => p.ms);
    const top = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000].find((n) => n >= Math.max(0, ...good) * 1.15) || 20000;
    // sixty slots, the newest at the right (the empty ones at the left fill as the pings come)
    clear(chart, Array.from({ length: N - view.length }, () => h("span.none")),
      view.map((p) => h("span" + (p.ok ? "" : ".lost"), { style: `height:${p.ok ? Math.max(4, (100 * Math.min(p.ms, top)) / top) : 100}%`, title: `${S.clock(p.at, true)}: ${p.ok ? p.ms + " ms" : whyText(p)}` })));
    chart.setAttribute("aria-label", `The last ${view.length} pings; the tallest bar would be ${top} ms`);
    const all = pings.filter((p) => p.ok).map((p) => p.ms), lost = pings.length - all.length;
    stats.textContent = !pings.length ? "" : (all.length ? `Fastest ${Math.min(...all)} ms · average ${Math.round(all.reduce((a, b) => a + b, 0) / all.length)} ms · slowest ${Math.max(...all)} ms · ` : "") + `${lost} of ${pings.length} lost`;
  }

  // ---- Restart ----
  function afterWords() {
    const a = (pc && pc.after_restart) || {};
    if (a.auto_sign_in === "on") return "Windows signs in by itself, so PC Relay is back a few minutes later.";
    if (a.auto_sign_in === "off") return "Windows does not sign in by itself: PC Relay starts when someone signs in at the PC.";
    return "PC Relay starts once Windows has signed in.";
  }
  function note() {   // the strip's word about a restart, on every section
    if (watching()) {
      const left = watch.at - S.pc.pcNow();
      S.app.note = { kind: "warn", text: watch.phase === "away" ? `${name()} is restarting` : watch.phase === "windows" ? "Windows is back, PC Relay not yet" : left > 0 ? `${name()} restarts in ${S.mmss(left)}` : `${name()} is restarting` };
    } else if (watch && watch.done && watch.result === "restarted") S.app.note = { kind: "ok", text: `${name()} is back` };
    else S.app.note = null;
    S.emit("strip");
  }
  function drawRestart() {
    note();
    const body = box && $("#restartbody", box);
    if (!body) return;
    const say = h("p.say#restartsay");
    const btnText = `Restart ${name()}`;
    if (watch && (watching() || watch.done)) { clear(body, watchView(), say); return; }
    if (!pc) { clear(body, h("button.danger#restartgo", { type: "button", text: btnText, disabled: true }), h("p.muted.small", { text: pcWhy ? S.sentence(pcWhy) : "Asking the PC…" })); return; }
    const rs = pc.restart || {};
    if (rs.pending) { beginWatch(); clear(body, watchView(), say); return; }
    if (!rs.allowed || rs.why) { clear(body, h("button.danger#restartgo", { type: "button", text: btnText, disabled: true }), h("p.only#restartwhy", { text: S.sentence(rs.why || "Restarts from pages are switched off on the PC") })); return; }
    const go = h("button.danger#restartgo", { type: "button", text: btnText });
    go.addEventListener("click", async () => {
      go.disabled = true;
      S.say(say, "Asking the PC…");
      const r = await S.pc.post("restart", { seconds: rs.default || 60 });
      if (!r.ok) { go.disabled = false; S.say(say, S.sentence(r.why), "bad"); return; }
      pc.restart = r.data.restart;
      beginWatch();
      drawRestart();
    });
    clear(body, go, h("p.muted.small#restarthelp", { text: `A one-minute countdown you can cancel. Programs on ${name()} close without saving.` }), say);
  }
  function watchView() {
    const w = watch, out = h("div.watch#watch"), now = S.pc.pcNow();
    if (!w.done && (w.phase === "set" || w.phase === "due")) {
      const left = w.at - now;
      if (left > 0) {
        const say = h("p.say");
        const cancel = h("button.primary.big#restartcancel", { type: "button", text: "Cancel", on: { click: async () => {
          cancel.disabled = true;
          const r = await S.pc.post("restart", { cancel: true });
          if (!r.ok) { cancel.disabled = false; S.say(say, S.sentence(r.why), "bad"); return; }
          watch = Object.assign({}, w, { done: true, result: "cancelled", by: "this page" });
          saveWatch();
          if (pc) pc.restart = r.data.restart;
          drawRestart(); again();
        } } });
        out.append(h("p.countdown#countdown", h("b", { text: `${name()} restarts in ${S.mmss(left)}` }), ` · at ${S.clock(w.at, true)}`), cancel, say,
          h("p.muted.small", { text: `Programs on ${name()} close without saving. ${afterWords()}` }));
      } else out.append(h("p.countdown#countdown", h("b", { text: "The countdown is over: Windows is restarting…" })));
    }
    if (!w.done && w.phase === "away") out.append(h("p.countdown#countdown", h("b", { text: `${name()} is restarting` }), ` · no answer since ${S.clock(w.awayAt, true)}`), h("p.muted.small", { text: afterWords() }));
    if (!w.done && w.phase === "windows") out.append(h("p.countdown#countdown", h("b", { text: "Windows is back, PC Relay not yet" })), h("p.muted.small", { text: afterWords() }));
    if (w.done) {
      let text;
      if (w.result === "restarted") text = `${name()} is back (${S.clock(w.backAt, true)}).` + (w.awayAt ? ` It could not be reached for ${S.span(w.backAt - w.awayAt)}.` : "");
      else if (w.result === "relay-only") text = `PC Relay answers again (${S.clock(w.backAt, true)}), but Windows did not restart.`;
      else if (w.result === "cancelled") text = "The restart was cancelled" + (w.by && w.by !== "this page" ? ` (${w.by === "tray" ? "at the PC" : w.by})` : "") + ".";
      else if (w.result === "not") text = "The restart did not happen" + (w.detail ? ": " + S.sentence(w.detail) : ".");
      else text = "The restart is no longer set on the PC.";
      out.append(h("p#restartresult", S.state(w.result === "restarted" ? "ok" : "off", text)), h("button#restartdone", { type: "button", text: "OK", on: { click: () => { watch = null; saveWatch(); loadPC(); drawRestart(); } } }));
    }
    return out;
  }

  // the two blocks This PC puts in its page
  PG.make = (el) => {
    box = el;
    clear(el, h("div#restartbody"),
      h("div.pingtop", { style: "margin-top:16px" }, h("div.pingbig#pingbig", { text: "…" }), h("div.muted#pingstate", { text: "Pinging PC Relay…" })),
      h("div.pingchart#pingchart", { role: "img" }), h("p.muted.small.num#pingstats"));
    drawPings(); drawRestart();
  };
  PG.rateBox = () => {
    const sel = h("select#pingrate", { "aria-label": "How often to ping", on: { change: () => { S.store.set("ping-every", Number(sel.value)); again(); } } }, RATES.map(([n, l]) => h("option", { value: String(n), text: l, selected: n === rate() })));
    return sel;
  };
  setInterval(() => { if (watching() && document.visibilityState === "visible") { if (box && $("#countdown", box)) drawRestart(); else note(); } }, 500);
  S.on("section", (id) => { if (id === "pc") { start(); loadPC(); } else if (!watching()) stop(); });
  if (watching()) setTimeout(start, 500);
})();

// ---- thispc.js ----
// thispc.js: This PC: the computer itself (PLAN 8.6; for accounts with pc.control: the main admin).
// The PC's name ("Jon's desktop"); the public address, with Copy; the connection check (is the address reachable
// from outside?) with one Fix button; Restart with its countdown and Cancel, and the live pinger (pinger.js). Under
// More: Start with Windows, the version with Update and Go back a version, the PC's name, the pinger's pace. Debug,
// the one place for technical detail: logs, the config file, reload, test buttons, details, Quit.
// Start with Windows, Update, Go back, the folders and Quit work only at the computer.
"use strict";
(function () {
  const { h, $, clear } = S;
  let el, check = null, checkWhy = "", checking = false, logAll = false;

  // ---- the name, the address, the connection ----
  function drawTop() {
    const pc = S.pinger.pc, info = S.pc.info || {};
    $("#pcname", el).textContent = (pc && pc.name) || S.pc.name();
    $("#pcsub", el).textContent = [(pc && pc.pc) || info.pc, `PC Relay ${(pc && pc.version) || info.version || ""}`].filter(Boolean).join(" · ");
    const addr = (pc && pc.address) || info.address || "";
    $("#pcaddr", el).textContent = addr || "None: this PC Relay has no public address.";
    $("#copyaddr", el).disabled = !addr;
    // (a switch that works only at the computer still shows where it stands, when the PC says so)
    const loc = S.app.local;
    const show = (id, known) => { const sw = $(id, el); if (sw) { sw.classList.toggle("unknown", known === null || known === undefined); S.setToggle(sw, !!known); } };
    show("#startup", loc ? loc.startWithWindows : pc && typeof pc.startWithWindows === "boolean" ? pc.startWithWindows : null);
    show("#restartspages", loc && loc.settings ? loc.settings.restartsFromPages : pc && pc.restart ? !!pc.restart.allowed : null);
    for (const [id, key] of [["#voicethreads", "voiceThreads"], ["#readahead", "readAhead"]]) {
      const i = $(id, el);
      if (i && document.activeElement !== i) i.value = loc && loc.settings && loc.settings[key] != null ? String(loc.settings[key]) : "";
    }
  }
  async function runCheck(fix) {
    if (checking) return;
    checking = true;
    drawCheck(fix ? "Fixing… (it can take 20 seconds)" : "Checking…");
    const r = fix ? await S.pc.api("pc/fix", { method: "POST", json: {}, timeout: 45000 }) : await S.pc.api("pc/check", { timeout: 20000 });
    checking = false;
    if (r.ok) { check = r.data; checkWhy = ""; } else { checkWhy = r.status === 404 ? "This PC Relay cannot check its connection." : S.sentence(r.why); if (!fix) check = null; }
    drawCheck();
    if (fix) S.app.loadStatus();
  }
  function drawCheck(busy) {
    const box = $("#checkbox", el), fix = $("#fix", el), again = $("#checknow", el);
    if (!box) return;
    again.disabled = !!busy;
    if (busy) { clear(box, h("span.muted", { text: busy })); fix.hidden = true; return; }
    if (!check) { clear(box, checkWhy ? h("span.muted#checkwhy", { text: checkWhy }) : h("span.muted", { text: "Not checked yet." })); fix.hidden = true; return; }
    const ok = check.tailscale && check.funnel && check.reachable;

  A.start = async function () {
    await S.pc.init("settings");
    document.documentElement.classList.toggle("door", S.pc.door);
    $("#title").textContent = S.pc.door ? "PC Relay" : "Settings";
    document.title = S.pc.door ? "PC Relay" : "Settings";
    addEventListener("hashchange", () => { if (A.state === "ready") show(location.hash.slice(1), true); });
    // signed in, out or changed (here, in the account window, or in another tab): the rights may not be the same
    S.on("account", () => { if (A.state !== "leaving") connect(true); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && A.state === "ready") loadStatus(); });
    // someone changed a picture (the account page marks it in this browser): draw the pictures again
    addEventListener("storage", (e) => { if (e.key === "relay-picture" && A.state === "ready") { S.forgetPictures(); meChip(); S.emit("pictures"); } });
    await connect();
  };
})();
