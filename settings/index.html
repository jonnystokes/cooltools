  }

  function addrCard() {
    const card = h("section.card#addrcard", h("h2", { text: "The PC's address" }));
    const R = S.pc.R, w = R.where || {}, url = R.base;
    const from = w.from === "file" ? "from the Cool tools address file (relay.json), as every page reads it" : w.from === "page" ? "this page's own address (localStorage settings-pc-address: a test or another PC)"
      : w.from === "built-in" ? "built into this page, because the Cool tools address file could not be loaded" : "not looked up yet";
    const copyBtn = h("button.small#copyaddr", { type: "button", text: "Copy", on: { click: async () => {
      const ok = await S.copy(url);
      S.say($("#addrcard .say"), ok ? "Copied: " + url : "This browser did not let the page copy it: select the address and copy it by hand.", ok ? "ok" : "bad");
    } } });
    card.append(h("p.addr", h("span", { text: "This browser reaches the PC at " }), h("code#addrnow", { text: url }), " ", copyBtn));
    card.append(h("p.help#addrfrom", { text: S.sentence(from) }));
    if (w.from === "built-in" && w.why) card.append(h("p.warn", { text: S.sentence(w.why) }));
    const info = S.pc.info;
    const pcSays = h("p#pcsays");
    if (!info) pcSays.textContent = "The PC has not answered yet, so it could not be asked for its own address.";
    else if (!("address" in info)) pcSays.textContent = `The PC runs PC Relay ${info.version}, which does not say its own address (2.1 does).`;
    else if (!info.address) pcSays.textContent = "The PC does not know its public address right now (Tailscale has not given it its name, or this is a test relay).";
    else if (info.address === url) { pcSays.append(h("span.okmark", { text: "✓ " }), "The PC says the same: it answers at that address (its Tailscale name)."); }
    else {
      pcSays.classList.add("warn");
      pcSays.textContent = `The PC says its public address is ${info.address}, but this page uses ${url}. ` +
        (w.from === "file" ? "The Cool tools address file is out of date: edit cool-tools\\relay.json to " + info.address + " and push it (WEB-APP-CONVENTIONS.md 5); every page follows within a minute." : "This page's own address is not the PC's.");
    }
    card.append(pcSays);
    card.append(h("p.help", { text: `If the address file cannot be loaded, pages use the address built into them (this page: ${RelayClient.BUILT_PC}) and say so. ` +
      "The address file is the one place to change after the PC is renamed." }));
    const list = ownAddresses();
    if (!list.length) card.append(h("p.help#ownaddr", { text: "No program in this browser has an address of its own: they all use the one above." }));
    else {
      card.append(h("p#ownaddr", { text: "Programs in this browser with an address of their own (theirs wins over the one above):" }));
      card.append(h("ul.plain#ownlist", list.map(([who, a, where]) => h("li", h("b", { text: who + ": " }), h("code", { text: a }), h("span.help", { text: " · set in " + where })))));
    }
    card.append(h("p.say"));
    return card;
  }

  function browserCard() {
    return h("section.card#browsercard", h("h2", { text: "This browser" }),
      h("p", { text: "Every Cool tools page keeps what it saves in this browser's storage for jonnystokes.github.io: the sign-in above, each program's settings, the Book reader's books and voices. " }),
      h("p", h("a.button#cachelink", { href: "../browser-storage/", text: "Browser app cache manager" }), h("span.help", { text: " · see and delete what these pages keep in this browser" })));
  }

  function render() {
    const p = panel();
    if (!p) return;
    clear(p, signCard(), addrCard(), browserCard());
  }
  function refreshAddr() { const old = $("#addrcard"); if (old) old.replaceWith(addrCard()); }
  function refreshStatus() {   // the sign-in line follows the PC's word without clearing a password being typed
    const card = $("#signcard");
    if (!card) return;
    const typing = $("#pw") && ($("#pw").value || document.activeElement === $("#pw") || document.activeElement === $("#devname"));
    if (!typing) card.replaceWith(signCard());
  }
  let lastAddr = "", lastSigned = null;
  S.on("ping", () => {
    const key = [S.pc.R.base, S.pc.R.where && S.pc.R.where.from, S.pc.info && S.pc.info.address, S.pc.info && S.pc.info.version].join("|");
    if (key !== lastAddr) { lastAddr = key; refreshAddr(); }
    const sig = S.pc.signedIn() + "|" + (S.pc.info && S.pc.info.signed_in) + "|" + (S.pc.info && S.pc.info.device && S.pc.info.device.name);
    if (sig !== lastSigned) { lastSigned = sig; refreshStatus(); }
  });
  S.on("auth", render);
  S.connection = { render };
})();

// ---- pinger.js ----
// pinger.js: the Pinger tab: each ping's round trip to PC Relay on the PC (GET /relay/ping through the PC's public
// address), live, at a rate the person picks (kept on this device); the PC's own details (signed in); and Restart this
// PC (signed in, relay 2.1): a countdown with Cancel, run by Windows on the PC (shutdown /g /t), refused unless the PC
// allows it. While a restart is under way the pinger keeps going (whatever tab is open) and says how far it got:
// Windows going away, Windows back without PC Relay yet (a 502 from Tailscale), and the PC back (with how long).
"use strict";
(function () {
  const { h, $, clear } = S;
  const RATES = [[500, "Every 0.5 s"], [1000, "Every second"], [2000, "Every 2 s"], [5000, "Every 5 s"], [10000, "Every 10 s"], [30000, "Every 30 s"], [60000, "Every minute"]];
  const rate = () => { const v = Number(S.store.get("ping-every", 1000)); return RATES.some(([n]) => n === v) ? v : 1000; };
  const pings = [];             // { at, ok, ms, why, kind, status, knock }
  let paused = false, gen = 0, running = 0;   // running: the generation of the one loop now pinging (0 = none)
  let pcInfo = null, pcAt = 0, pcWhy = "";

  // ---- the restart watch: kept on this device, so a reload goes on watching ----
  let watch = S.store.get("restart-watch", null);
  if (watch && Date.now() - (watch.asked || 0) > 60 * 60 * 1000) watch = null;   // an hour old: over
  const saveWatch = () => S.store.set("restart-watch", watch);
  const watching = () => !!(watch && !watch.done);

  const want = () => document.visibilityState === "visible" && !paused && (S.app.tab === "pinger" || watching());

  // One loop at a time: each start makes a new generation; a loop from an older one stops at its next step and never
  // records what it was waiting for. A ping is not started before the last one answered.
  const nap = (ms, my) => new Promise((res) => { const t = setTimeout(res, ms); wake.add(() => { clearTimeout(t); res(); }); });
  const wake = new Set();
  function start() {
    if (!want() || (running && running === gen)) return;
    const my = ++gen;
    running = my;
    (async () => {
      while (my === gen && want()) {
        const every = watching() ? Math.min(rate(), 2000) : rate();
        const t0 = Date.now();
        const r = await S.pc.ping(Math.max(4000, Math.min(every * 2, 8000)));
        if (my !== gen) break;
        const p = S.pc.last;
        if (!r.ok && !p.status && r.kind !== "offline") p.knock = await S.pc.knock(4000);   // PC Relay silent: is Tailscale up?
        if (my !== gen) break;
        pings.push(p);
        if (pings.length > 600) pings.splice(0, pings.length - 600);
        await onPing(r, p);
        drawPings();
        if (my !== gen) break;
        await nap(Math.max(0, every - (Date.now() - t0)), my);
      }
      if (running === my) running = 0;
    })();
  }
  function stop() { gen++; running = 0; for (const f of wake) f(); wake.clear(); }
  function restartLoop() { stop(); start(); }
  document.addEventListener("visibilitychange", () => (document.visibilityState === "visible" ? start() : stop()));

  // ---- what each ping says about the PC and a restart ----
  async function onPing(r, p) {
    const info = r.info || S.pc.info;
    const pending = r.ok && info && info.restart_at;
    if (pending && (!watch || watch.at !== info.restart_at)) { await loadPC(); beginWatch(); }
    if (watching()) await follow(r, p);
    if (S.pc.signedIn() && S.pc.has21() && Date.now() - pcAt > 30000) loadPC().then(drawPC);
  }

  async function loadPC() {
    if (!S.pc.signedIn()) { pcInfo = null; pcWhy = "signin"; return; }
    if (!S.pc.has21()) { pcInfo = null; pcWhy = "old"; return; }
    const r = await S.pc.api("pc");
    pcAt = Date.now();
    if (r.ok) { pcInfo = r.data; pcWhy = ""; }
    else { pcWhy = r.signin ? "signin" : r.why; }
    drawPC(); drawRestart();
  }

  function beginWatch() {
    const rs = pcInfo && pcInfo.restart;
    if (!rs || !rs.pending) return;
    watch = { asked: rs.asked, at: rs.at, name: rs.name, relay: pcInfo.relay_started, windows: pcInfo.windows_started, phase: "set", events: [] };
    saveWatch();
    restartLoop();
  }
  const note = (text) => { watch.events.push({ at: Date.now(), text }); saveWatch(); };
  async function follow(r, p) {
    const w = watch;
    if (r.ok) {
      if (w.phase === "set" || w.phase === "due") {
        // still the same run of PC Relay: is the restart still set?
        const at = r.info && r.info.restart_at;
        if (!at) {
          await loadPC();
          const last = pcInfo && pcInfo.restart && pcInfo.restart.last;
          if (pcInfo && pcInfo.relay_started === w.relay) {
            w.done = true;
            w.result = last && last.asked === w.asked && last.result === "cancelled" ? "cancelled" : last && last.result === "did-not-happen" ? "not" : "gone";
            w.detail = last ? last.detail || "" : "";
            w.by = last ? (last.by_name || last.by || "") : "";
            saveWatch(); drawRestart(); restartLoop();
            return;
          }
        }
        if (S.pc.pcNow() >= w.at && w.phase === "set") { w.phase = "due"; note("The countdown is over: Windows is restarting."); }
        drawRestart();
        return;
      }
      // it answers again after it went away
      await loadPC();
      const rs = (pcInfo && pcInfo.restart) || {};
      const winNew = pcInfo && pcInfo.windows_started && pcInfo.windows_started > w.asked;
      if (!winNew && rs.pending && rs.asked === w.asked) {   // only PC Relay restarted: Windows' countdown goes on
        w.phase = S.pc.pcNow() >= w.at ? "due" : "set"; w.relay = pcInfo.relay_started; w.awayAt = 0;
        note("PC Relay answers again (it was restarted); Windows' restart is still set.");
        saveWatch(); drawRestart();
        return;
      }
      w.backAt = p.at;
      w.phase = "back"; w.done = true;
      w.result = winNew ? "restarted" : "relay-only";
      w.windowsAt = pcInfo ? pcInfo.windows_started : 0;
      w.relayAt = pcInfo ? pcInfo.relay_started : 0;
      w.detail = rs.last && rs.last.asked === w.asked ? rs.last.detail || "" : "";
      note(winNew ? "The PC is back." : "PC Relay answers again, but Windows did not restart.");
      saveWatch(); drawRestart(); restartLoop();
      return;
    }
    // no answer, or only Tailscale's (Windows is up, PC Relay is not): a 502, or a knock answered
    if (p.status === 502 || p.knock) {
      if (w.phase !== "windows") { w.phase = "windows"; w.windowsSeen = p.at; if (!w.awayAt) w.awayAt = p.at; note("Windows answers again (Tailscale is up), but PC Relay is not running yet."); }
    } else if (w.phase === "set" || w.phase === "due") {
      w.phase = "away"; w.awayAt = p.at; note("No answer: Windows is restarting.");
    }
    drawRestart();
  }

  // ---- drawing ----
  function card(id, title, ...kids) { return h("section.card#" + id, h("h2", { text: title }), ...kids); }

  function pingCard() {
    const sel = h("select#pingrate", { "aria-label": "How often to ping", on: { change: () => { S.store.set("ping-every", Number(sel.value)); restartLoop(); drawPings(); } } },
      RATES.map(([n, l]) => h("option", { value: String(n), text: l, selected: n === rate() })));
    const pause = h("button#pingpause", { type: "button", text: paused ? "Resume" : "Pause", on: { click: () => { paused = !paused; pause.textContent = paused ? "Resume" : "Pause"; paused ? stop() : start(); drawPings(); } } });
    const clr = h("button#pingclear", { type: "button", text: "Clear", on: { click: () => { pings.length = 0; drawPings(); } } });
    return card("pingcard", "Pinger",
      h("div.pingtop", h("div.big#pingbig", { text: "…" }), h("div.pingwhat#pingstate", { text: "Pinging PC Relay…" })),
      h("div.row.controls", sel, pause, clr),
      h("div.chart#pingchart", { role: "img", "aria-label": "The last 60 pings' round trips" }),
      h("p.stats#pingstats"),
      h("ul.pinglog#pinglog"),
      h("p.help", { text: "Each ping is one request to PC Relay on the PC (/relay/ping) and its answer, through the PC's public address, timed in this browser. " +
        "It runs while this tab is open (and while a restart is watched), and pauses while the page is hidden. The rate is kept on this device." }));
  }

  function drawPings() {
    const big = $("#pingbig"), st = $("#pingstate"), chart = $("#pingchart"), stats = $("#pingstats"), log = $("#pinglog");
    if (!big) return;
    const last = pings[pings.length - 1];
    if (!last) { big.textContent = "…"; st.textContent = paused ? "Paused." : "Pinging PC Relay…"; }
    else if (last.ok) { big.textContent = last.ms + " ms"; big.className = "big ok"; st.textContent = `PC Relay answered at ${S.clock(last.at, true)}` + (paused ? " · paused" : ""); }
    else { big.textContent = last.status === 502 || last.knock ? "No PC Relay" : "No answer"; big.className = "big bad"; st.textContent = S.sentence(whyText(last)) + (paused ? " Paused." : ""); }
    // the chart: the last 60, newest on the right; a lost one is a full red bar. The scale fits the slowest one shown
    // (a round number of ms); its two lines are labelled in HTML, so the labels never stretch with the chart.
    const N = 60, view = pings.slice(-N), good = view.filter((p) => p.ok).map((p) => p.ms);
    const top = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000].find((n) => n >= Math.max(0, ...good) * 1.15) || 20000;
    const W = 600, H = 120, bw = W / N;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("preserveAspectRatio", "none");
    for (const y of [H / 2, 0.5]) {
      const l = document.createElementNS(ns, "line");
      Object.entries({ x1: 0, x2: W, y1: y, y2: y, class: "grid" }).forEach(([k, v]) => l.setAttribute(k, v));
      svg.append(l);
    }
    view.forEach((p, i) => {
      const r = document.createElementNS(ns, "rect");
      const hh = p.ok ? Math.max(2, (H * Math.min(p.ms, top)) / top) : H;
      Object.entries({ x: (N - view.length + i) * bw + 1, y: H - hh, width: Math.max(1, bw - 2), height: hh, class: p.ok ? "bar" : "bar lost" }).forEach(([k, v]) => r.setAttribute(k, v));
      const tt = document.createElementNS(ns, "title");
      tt.textContent = `${S.clock(p.at, true)}: ${p.ok ? p.ms + " ms" : whyText(p)}`;
      r.append(tt);
      svg.append(r);
    });
    chart.replaceChildren(svg, h("span.lab.top", { text: top + " ms" }), h("span.lab.mid", { text: top / 2 + " ms" }));
    // the numbers
    const all = pings.filter((p) => p.ok).map((p) => p.ms), lost = pings.length - all.length;
    if (!pings.length) stats.textContent = "";
    else {
      const avg = all.length ? Math.round(all.reduce((a, b) => a + b, 0) / all.length) : 0;
      let jit = 0;
      for (let i = 1; i < all.length; i++) jit += Math.abs(all[i] - all[i - 1]);
      jit = all.length > 1 ? Math.round(jit / (all.length - 1)) : 0;
      stats.textContent = (all.length ? `Fastest ${Math.min(...all)} ms · average ${avg} ms · slowest ${Math.max(...all)} ms · jitter ${jit} ms · ` : "") +
        `${lost} of ${S.plural(pings.length, "ping")} lost (${Math.round((100 * lost) / pings.length)}%) since ${S.clock(pings[0].at, true)} · ${RATES.find(([n]) => n === rate())[1].toLowerCase()}` +
        (watching() && rate() > 2000 ? " (every 2 s while a restart is watched)" : "");
    }
    clear(log, pings.slice(-30).reverse().map((p) => h("li" + (p.ok ? "" : ".bad"), h("span.t", { text: S.clock(p.at, true) }), h("span.v", { text: p.ok ? p.ms + " ms" : whyText(p) }))));
  }
  function whyText(p) {
    if (p.status === 502) return "502 from Tailscale: Windows is up, but PC Relay is not running";
    if (p.knock) return "PC Relay did not answer, but the PC's address does (Tailscale on the PC is up: Windows is running)";
    if (p.kind === "timeout") return p.why || "no answer in time";
    return p.why || "no answer";
  }

  function pcCard() {
    const c = card("pccard", "The PC");
    c.append(h("div#pcbody"));
    return c;
  }
  function drawPC() {
    const body = $("#pcbody");
    if (!body) return;
    const info = S.pc.info, rows = [];
    if (!info) { clear(body, h("p.help", { text: "Waiting for the first answer from the PC…" })); return; }
    rows.push(h("p", h("b", { text: info.pc || "The PC" }), ` · PC Relay ${info.version}` + (info.on === false ? " · switched off in the tray" : "") + (info.game ? " · Game mode on" : "")));
    if (!S.pc.signedIn()) rows.push(h("p.help", { text: "Sign in (Connection tab) to see when Windows and PC Relay started and whether the public address answers." }));
    else if (!S.pc.has21()) rows.push(h("p.help", { text: `PC Relay ${info.version} does not tell more: this needs 2.1.` }));
    else if (!pcInfo) rows.push(h("p.help", { text: pcWhy && pcWhy !== "signin" ? S.sentence(pcWhy) : "Asking the PC…" }));
    else {
      const now = S.pc.pcNow();
      if (pcInfo.windows_started) rows.push(h("p", { text: `Windows started ${S.when(pcInfo.windows_started)} (running for ${S.span(now - pcInfo.windows_started)}).` }));
      if (pcInfo.relay_started) rows.push(h("p", { text: `PC Relay started ${S.when(pcInfo.relay_started)}.` }));
      const d = pcInfo.door || {};
      if (!d.managed) rows.push(h("p.help", { text: "The public address is not looked after by this relay (a test relay)." }));
      else if (d.answering) rows.push(h("p", h("span.okmark", { text: "✓ " }), `The public address answers from the internet` + (d.checked ? ` (tested ${S.when(d.checked)}).` : ".")));
      else rows.push(h("p.warn", { text: "The public address is not answering from the internet" + (d.problem || d.why ? ": " + (d.problem || d.why) : "") + "." }));
      rows.push(h("p.help", { text: `${S.plural(pcInfo.devices, "device")} signed in · a sign-in not used for ${pcInfo.expires_days} days ends.` }));
    }
    clear(body, rows);
  }

  // ---- Restart this PC ----
  function restartCard() { return card("restartcard", "Restart this PC", h("div#restartbody")); }

  function afterWords() {
    const a = (pcInfo && pcInfo.after_restart) || {};
    if (a.auto_sign_in === "on") return "Windows signs in by itself on this PC (automatic sign-in is on), so PC Relay starts again with nobody at the PC, usually a minute or two after Windows starts: the PC should answer here again a few minutes after the countdown ends (longer if Windows installs updates while it restarts). The PC's own screen is then signed in, as after any restart there.";
    if (a.auto_sign_in === "off") return "This PC does not sign in by itself (automatic sign-in is off). PC Relay starts only when someone signs in to Windows at the PC, so after the restart this page cannot reach the PC until then. (If Windows' own \"Use my sign-in info to automatically finish setting up after an update or restart\" is on, Windows may sign in and lock the screen by itself: this restart asks for that, and then PC Relay starts.)";
    return "The PC could not tell whether Windows signs in by itself after a restart" + (a.detail ? ` (${a.detail})` : "") + ". If it does not, PC Relay starts only when someone signs in to Windows at the PC, and this page cannot reach the PC until then.";
  }

  let confirming = false;
  function drawRestart() {
    drawBanner();
    const body = $("#restartbody");
    if (!body) return;
    const say = h("p.say#restartsay");
    if (watch && (watching() || watch.done)) { clear(body, watchView(), say); return; }
    if (!S.pc.signedIn()) { clear(body, h("p", { text: "Only a signed-in device can restart the PC: sign in first (Connection tab). The PC refuses everyone else, whatever a page shows." }), h("button.danger", { type: "button", text: "Restart this PC…", disabled: true })); return; }
    if (S.pc.info && !S.pc.has21()) { clear(body, h("p", { text: `The PC runs PC Relay ${S.pc.version()}, which cannot restart it: this needs PC Relay 2.1.` })); return; }
    if (!pcInfo) { clear(body, h("p.help", { text: pcWhy && pcWhy !== "signin" ? S.sentence(pcWhy) : "Asking the PC…" })); return; }
    const rs = pcInfo.restart || {};
    if (rs.pending) { beginWatch(); clear(body, watchView(), say); return; }
    const last = rs.last ? h("p.help#lastrestart", { text: lastWords(rs.last) }) : null;
    if (!rs.allowed || rs.why) { clear(body, h("p.warn#restartwhy", { text: S.sentence(rs.why || "Restarts from pages are switched off on the PC.") }), last); return; }
    if (!confirming) {
      clear(body, h("p", { text: "Restarts Windows on the PC after a countdown that can be cancelled. Windows does it, and warns whoever is at the PC." }),
        h("button.danger#restartopen", { type: "button", text: "Restart this PC…", on: { click: () => { confirming = true; drawRestart(); } } }), last);
      return;
    }
    const opts = [[30, "in 30 seconds"], [60, "in 1 minute"], [120, "in 2 minutes"], [300, "in 5 minutes"]].filter(([s]) => s >= (rs.min || 30) && s <= (rs.max || 600));
    const sel = h("select#restartwhen", { "aria-label": "When", on: { change: () => { go.textContent = "Restart the PC " + sel.selectedOptions[0].textContent; } } },
      opts.map(([s, l]) => h("option", { value: String(s), text: l, selected: s === (rs.default || 60) })));
    const go = h("button.danger#restartgo", { type: "button", text: "Restart the PC " + (opts.find(([s]) => s === (rs.default || 60)) || opts[0])[1] });
    const no = h("button#restartno", { type: "button", text: "Not now", on: { click: () => { confirming = false; drawRestart(); } } });
    go.addEventListener("click", async () => {
      go.disabled = no.disabled = sel.disabled = true;
      S.say(say, "Asking the PC…");
      const r = await S.pc.api("restart", { json: { seconds: Number(sel.value) } });
      if (!r.ok) { go.disabled = no.disabled = sel.disabled = false; S.say(say, S.sentence(r.why), "bad"); if (r.signin) S.emit("auth"); return; }
      confirming = false;
      pcInfo.restart = r.data.restart;
      beginWatch();
      drawRestart();
    });
    clear(body,
      h("div.confirm#restartconfirm",
        h("p", h("b", { text: "What happens:" })),
        h("ul",
          h("li", "Windows restarts ", sel, ". It shows its own warning on the PC's screen; until then it can be cancelled here or at the PC (PC Relay's tray icon, the restart line)."),
          h("li", { text: "Programs on the PC are closed without asking to save: anything unsaved on the PC is lost." }),
          h("li", { text: "Everything through PC Relay stops until the PC is back: Screen Peek, the PC voice, file transfers, and this page's own connection." }),
          h("li#afterwords", { text: "After the restart: " + afterWords() }),
          h("li", { text: "This page keeps pinging and says when the PC is back." })),
        h("div.row", go, no)),
      say, last);
  }

  function lastWords(l) {
    const when = l.ended ? S.when(Date.parse(l.ended)) : "";
    if (l.result === "done") return `The last restart asked from a page (${l.name || "a device"}, ${S.when(Date.parse(l.asked))}) happened: ${l.detail || "Windows started again"}.`;
    if (l.result === "cancelled") return `The last restart asked from a page was cancelled ${l.by === "tray" ? "at the PC (the tray)" : "from a page" + (l.by_name ? ` (${l.by_name})` : "")}${when ? ", " + when : ""}.`;
    return `The last restart asked from a page (${S.when(Date.parse(l.asked))}) did not happen: ${l.detail || "its time passed"}.`;
  }

  function watchView() {
    const w = watch, out = h("div.watch#watch");
    const rs = (pcInfo && pcInfo.restart) || {};
    const now = S.pc.pcNow();
    if (!w.done && (w.phase === "set" || w.phase === "due")) {
      const left = w.at - now;
      out.append(h("p.countdown#countdown", left > 0 ? [h("b", { text: `Windows restarts at ${S.clock(w.at, true)}` }), ` · in ${S.mmss(left)}`] : [h("b", { text: "The countdown is over: Windows is restarting…" })]));
      out.append(h("p.help", { text: `Asked from ${w.name || "a signed-in device"} at ${S.clock(w.asked, true)}. ` + (left > 0 ? "It can be cancelled until then, here or at the PC (PC Relay's tray icon, the restart line)." : "") }));
      if (left > 0) {
        const say = h("p.say");
        const cancel = h("button.primary#restartcancel", { type: "button", text: "Cancel the restart", on: { click: async () => {
          cancel.disabled = true; S.say(say, "Cancelling…");
          const r = await S.pc.api("restart", { json: { cancel: true } });
          if (!r.ok) { cancel.disabled = false; S.say(say, S.sentence(r.why), "bad"); return; }
          watch = { ...w, done: true, result: "cancelled", by: "this page", detail: r.data.note };
          saveWatch();
          pcInfo.restart = r.data.restart;
          drawRestart(); restartLoop();
        } } });
        out.append(h("div.row", cancel), say);
      }
    }
    if (!w.done && w.phase === "away") out.append(h("p.countdown", h("b", { text: "The PC is restarting" }), ` · no answer since ${S.clock(w.awayAt, true)} (${S.span(Date.now() - w.awayAt)})`));
    if (!w.done && w.phase === "windows") out.append(h("p.countdown", h("b", { text: "Windows is back, PC Relay not yet" }), ` · Tailscale answers (since ${S.clock(w.windowsSeen, true)}), but PC Relay is not running: it starts once Windows has signed in.`));
    if (!w.done && (w.phase === "away" || w.phase === "windows")) out.append(h("p.help", { text: "After the restart: " + afterWords() }));
    if (w.done) {
      let text = "";
      if (w.result === "restarted") text = `✓ The PC is back (${S.clock(w.backAt, true)}). Windows restarted: it started at ${S.clock(w.windowsAt, true)}` +
        (w.relayAt ? `, and PC Relay ${S.span(w.relayAt - w.windowsAt)} after that` : "") + (w.awayAt ? `. The PC could not be reached for ${S.span(w.backAt - w.awayAt)}.` : ".");
      else if (w.result === "relay-only") text = `PC Relay answers again (${S.clock(w.backAt, true)}), but Windows did not restart (it has run since ${S.when(w.windowsAt)}).` + (w.detail ? " " + S.sentence(w.detail) : "");
      else if (w.result === "cancelled") text = "The restart was cancelled" + (w.by && w.by !== "this page" ? ` (${w.by === "tray" ? "at the PC, from the tray" : w.by})` : " from this page") + ".";
      else if (w.result === "not") text = "The restart did not happen: " + (w.detail || "its time passed with PC Relay still running") + ".";
      else text = "The restart is no longer set on the PC" + (w.detail ? `: ${w.detail}` : ".");
      out.append(h("p.result#restartresult" + (w.result === "restarted" ? ".ok" : ""), { text }));
      out.append(h("button#restartdone", { type: "button", text: "OK", on: { click: () => { watch = null; saveWatch(); loadPC(); drawRestart(); } } }));
    }
    if (w.events && w.events.length) out.append(h("ul.events", w.events.map((e) => h("li", h("span.t", { text: S.clock(e.at, true) }), " ", e.text))));
    return out;
  }

  // the bar under the tabs while a restart is set or under way, on every tab: a press goes to it
  function drawBanner() {
    const b = $("#restartbanner");
    if (!b) return;
    let text = "", back = false;
    if (watching()) {
      const left = watch.at - S.pc.pcNow();
      text = watch.phase === "away" ? `The PC is restarting · no answer since ${S.clock(watch.awayAt, true)}`
        : watch.phase === "windows" ? "Windows is back, PC Relay not yet"
        : left > 0 ? `Windows restarts at ${S.clock(watch.at, true)} · in ${S.mmss(left)} · Cancel on the Pinger tab` : "Windows is restarting…";
    } else if (watch && watch.done && watch.result === "restarted") { text = "✓ The PC is back after its restart"; back = true; }
    b.hidden = !text;
    b.classList.toggle("back", back);
    if (b.textContent !== text) b.textContent = text;
  }
  function render() {
    const p = $("#tab-pinger");
    if (!p) return;
    clear(p, pingCard(), restartCard(), pcCard());
    drawPings(); drawPC(); drawRestart();
    if (S.pc.signedIn() && (!pcInfo || Date.now() - pcAt > 5000)) loadPC();
  }
  setInterval(() => { if ($("#countdown") || (watching() && document.visibilityState === "visible")) drawRestart(); drawBanner(); }, 500);
  document.addEventListener("click", (e) => {
    if (e.target.id !== "restartbanner") return;
    location.hash = "#pinger";
    setTimeout(() => { const c = $("#restartcard"); if (c) c.scrollIntoView({ block: "start", behavior: "smooth" }); }, 50);
  });
  S.on("auth", () => { pcInfo = null; pcAt = 0; confirming = false; render(); });
  S.on("tab", (t) => { if (t === "pinger") { render(); start(); } else if (!watching()) stop(); });
  S.pinger = { render, start, stop, get pings() { return pings; }, get watch() { return watch; } };
  if (watching()) setTimeout(start, 0);
})();

// ---- devices.js ----
// devices.js: the Devices tab (signed in, relay 2.1): the devices signed in to the PC, with Rename and Sign out (one,
// or every device), and the recent sign-ins from the PC's security log (right and wrong passwords, sign-outs, ended
// sign-ins; optionally every refusal and change too), each with where its address is: this PC, a device on the
// tailnet, the home's own internet address, or the internet (with the address's name when it has one), and a mark on
// the first sign-in from an address. (2026-11-07: an unfamiliar address signed in, and Jon learned of it only from
// the log file.)
"use strict";
(function () {
  const { h, $, clear } = S;
  let devs = null, devWhy = "", log = null, logWhy = "", all = S.store.get("log-all", false), loading = false;

  async function load() {
    if (loading) return;
    loading = true;
    const [d, l] = await Promise.all([S.pc.api("devices"), S.pc.api("log?kinds=" + (all ? "all" : "sign-ins") + "&limit=" + (all ? 300 : 150))]);
    loading = false;
    devs = d.ok ? d.data : null; devWhy = d.ok ? "" : d.why;
    log = l.ok ? l.data : null; logWhy = l.ok ? "" : l.why;
    if (d.signin || l.signin) S.emit("auth");
    draw();
  }

  function needs() {
    if (!S.pc.signedIn()) return "Sign in (Connection tab) to see the devices signed in to the PC and the recent sign-ins. The PC shows them to signed-in devices only.";
    if (S.pc.info && !S.pc.has21()) return `The PC runs PC Relay ${S.pc.version()}: the devices and the log need PC Relay 2.1 (until then they are in the tray on the PC).`;
    return "";
  }

  function devCard() {
    const c = h("section.card#devcard", h("h2", { text: "Signed in to the PC" }));
    if (!devs) { c.append(h("p.help", { text: devWhy ? S.sentence(devWhy) : "Asking the PC…" })); return c; }
    const list = h("ul.devices#devlist");
    for (const d of devs.devices) {
      const say = h("p.say");
      const name = h("b.devname", { text: d.name });
      const rename = h("button.small", { type: "button", text: "Rename", on: { click: () => {
        const inp = h("input", { type: "text", value: d.name, maxlength: "60", "aria-label": "A new name for this device" });
        const save = h("button.small.primary", { type: "submit", text: "Save" });
        const form = h("form.row.inline", { on: { submit: async (e) => {
          e.preventDefault();
          save.disabled = true;
          const r = await S.pc.api("devices", { json: { rename: d.device, name: inp.value } });
          if (r.ok) { d.name = r.data.name; draw(); } else { save.disabled = false; S.say(say, S.sentence(r.why), "bad"); }
        } } }, inp, save, h("button.small", { type: "button", text: "Cancel", on: { click: draw } }));
        name.replaceWith(form); rename.remove(); inp.focus(); inp.select();
      } } });
      const out = h("button.small", { type: "button", text: d.this ? "Sign out (this device)" : "Sign out", on: { click: async () => {
        out.disabled = true;
        if (d.this) { await S.pc.signOut(); return; }
        const r = await S.pc.api("devices", { json: { sign_out: d.device } });
        if (r.ok) load(); else { out.disabled = false; S.say(say, S.sentence(r.why), "bad"); }
      } } });
      list.append(h("li" + (d.this ? ".this" : ""), { data: { device: d.device } },
        h("div.devhead", name, d.this ? h("span.tag", { text: "this device" }) : null),
        h("div.help", { text: `Signed in ${S.when(d.created)} · last used ${S.when(d.last_used)} from ${d.ip || "an unknown address"} (${d.where ? d.where.text : ""})` }),
        h("div.row", rename, out), say));
    }
    if (!devs.devices.length) list.append(h("li", { text: "No device is signed in." }));
    c.append(list);
    const say = h("p.say");
    const allBtn = h("button.danger#signoutall", { type: "button", text: "Sign out every device…", on: { click: async () => {
      if (allBtn.dataset.sure !== "1") { allBtn.dataset.sure = "1"; allBtn.textContent = "Sign out every device, this one too"; S.say(say, "Every device must sign in again with the PC's password, this browser too (every Cool tools page in it). Press again to do it."); return; }
      allBtn.disabled = true;
      const r = await S.pc.api("devices", { json: { sign_out_all: true } });
      if (!r.ok) { allBtn.disabled = false; S.say(say, S.sentence(r.why), "bad"); return; }
      await S.pc.signOut();   // this browser's pass ended with the rest: forget it here too
    } } });
    c.append(h("div.row", allBtn), say,
      h("p.help", { text: `The same list is in the tray on the PC (Signed in: N devices). A sign-in not used for ${devs.expires_days} days ends by itself; a new password signs every device out.` }));
    return c;
  }

  function what(e) {
    switch (e.event) {
      case "sign-in": return e.ok ? ["ok", "Signed in"] : ["bad", "Refused: " + (e.error || "the sign-in did not work")];
      case "sign-out": return ["", "Signed out" + (e.action === "every device" ? " (every device" + (e.count ? `: ${e.count}` : "") + ")" : e.action === "one device" ? ` by ${e.by === "page" ? "a page" : e.by === "tray" ? "the tray" : e.by}` : "")];
      case "expired": return ["", "Sign-in ended (not used)"];
      case "refused": return ["bad", `Refused (${e.status}): ${e.error || ""}`];
      case "admin": return [e.ok ? "" : "bad", `Changed: ${e.action}${e.detail ? " · " + e.detail : ""}` + (e.by ? ` (by ${e.by})` : "")];
    }
    return ["", e.event];
  }

  function logCard() {
    const c = h("section.card#logcard", h("h2", { text: "Recent sign-ins" }));
    const box = h("input#logall", { type: "checkbox", checked: all, on: { change: () => { all = box.checked; S.store.set("log-all", all); log = null; draw(); load(); } } });
    const refresh = h("button.small#logrefresh", { type: "button", text: "Refresh", on: { click: () => { log = null; devs = null; draw(); load(); } } });
    c.append(h("div.row", h("label.check", box, " Show refusals and changes too"), refresh));
    if (!log) { c.append(h("p.help", { text: logWhy ? S.sentence(logWhy) : "Reading the PC's security log…" })); return c; }
    const ul = h("ul.events#loglist");
    for (const e of log.events) {
      const [kind, text] = what(e);
      const who = e.who || {}, where = e.where;
      const t = Date.parse(e.ts) || 0;
      const name = e.device_name || who.device_name || "";
      const bits = [name || who.browser, who.page ? `page ${who.page}` : "", (who.browser && name && !name.includes(who.browser)) ? who.browser : ""].filter(Boolean);
      ul.append(h("li" + (kind ? "." + kind : ""),
        h("div.evhead", h("span.t", { text: S.when(t, true) }), h("span.what", { text: text }), e.new_address ? h("span.tag.new", { text: "new address" }) : null),
        bits.length ? h("div.help", { text: bits.join(" · ") }) : null,
        who.ip ? h("div.help", { text: `from ${who.ip}${where ? " · " + where.text : ""}` }) : null));
    }
    if (!log.events.length) ul.append(h("li", { text: "Nothing yet." }));
    c.append(ul, h("p.help", { text: `From the PC's security.log (newest first; ${S.plural(log.total, "event")} ${all ? "in all" : "about sign-ins"}). "New address": the first sign-in from that address in the log.` +
      (log.home_ip ? ` Your home's internet address is ${log.home_ip} (as the PC's own test of its public address sees it).` : "") }));
    return c;
  }

  function draw() {
    const p = $("#tab-devices");
    if (!p) return;
    const n = needs();
    if (n) { clear(p, h("section.card", h("h2", { text: "Devices" }), h("p", { text: n }))); return; }
    clear(p, devCard(), logCard());
  }
  function render() { draw(); if (!needs() && (!devs || !log)) load(); }
  S.on("auth", () => { devs = null; log = null; if (S.app && S.app.tab === "devices") render(); });
  S.on("tab", (t) => { if (t === "devices") { devs = null; log = null; render(); } });
  S.devices = { render, load };
})();

// ---- programs.js ----
// programs.js: the Programs tab: the PC's programs (from the ping: state, connected devices, public or private,
// allowed), and, signed in with relay 2.1, the tray's own switches from here: Start now, Stop now (restarting one
// program is often enough, before restarting the PC), Private (sign-in needed), Allowed, Game mode, Make everything
// private. Each is the tray's own code on the PC, logged there with this device's name.
"use strict";
(function () {
  const { h, $, clear } = S;
  let busy = false, say = "", sayKind = "";

  const can = () => S.pc.signedIn() && S.pc.has21();
  async function change(json) {
    busy = true;
    const r = await S.pc.api("programs", { json });
    busy = false;
    if (r.ok) { if (S.pc.info) Object.assign(S.pc.info, { services: r.data.services, game: r.data.game, on: r.data.on }); say = ""; }
    else { say = S.sentence(r.why); sayKind = "bad"; if (r.signin) S.emit("auth"); }
    draw();
    return r;
  }

  function stateText(s) {
    if (s.blocked) return "switched off (Allowed is off)";
    let t = s.state || "stopped";
    if (t === "running" && s.clients) t += ` · ${S.plural(s.clients, "connection")}`;
    if (s.unavailable) t += " · " + s.unavailable;
    if (s.reason && s.state === "failed") t += ": " + s.reason;
    return t;
  }

  function draw() {
    const p = $("#tab-programs");
    if (!p) return;
    const info = S.pc.info;
    if (!info) { clear(p, h("section.card", h("h2", { text: "Programs" }), h("p.help", { text: "Waiting for the PC to answer…" }))); return; }
    const note = !S.pc.signedIn() ? "Sign in (Connection tab) to change these. Signed out, this is what the PC tells every page."
      : !S.pc.has21() ? `The PC runs PC Relay ${info.version}: switching from here needs 2.1 (until then: the tray on the PC).` : "";
    const game = h("section.card#gamecard", h("h2", { text: "Game mode" }),
      h("div.row.switchrow", S.toggle("Game mode", info.game, (on) => change({ action: "game", on }), { disabled: !can() || busy }),
        h("span", { text: info.game ? "On: heavy programs (the PC voice) are stopped and refused." : "Off: every program can start." })),
      h("p.help", { text: "For gaming on the PC: stops heavy programs and refuses them until it is off." }));
    const list = h("ul.programs#proglist");
    for (const s of info.services || []) {
      const row = h("li", { data: { id: s.id } },
        h("div.proghead", h("b", { text: s.name || s.id }), h("span.tag" + (s.private ? ".priv" : ".pub"), { text: s.private ? "private" : "public" })),
        h("div.help", { text: s.description || "" }),
        h("div.state" + (s.state === "failed" ? ".bad" : ""), { text: stateText(s) }));
      if (can()) {
        row.append(h("div.row.progctl",
          h("button.small", { type: "button", text: "Start now", disabled: busy || s.blocked || s.state === "running", on: { click: () => change({ action: "start", id: s.id }) } }),
          h("button.small", { type: "button", text: "Stop now", disabled: busy || s.state === "stopped", on: { click: () => change({ action: "stop", id: s.id }) } }),
          h("label.switchlabel", S.toggle("Private: " + (s.name || s.id), s.private, (on) => change({ action: "private", id: s.id, on }), { disabled: busy }), " Private (sign-in needed)"),
          h("label.switchlabel", S.toggle("Allowed: " + (s.name || s.id), !s.blocked, (on) => change({ action: "allowed", id: s.id, on }), { disabled: busy }), " Allowed")));
      }
      list.append(row);
    }
    const progs = h("section.card#progcard", h("h2", { text: "Programs on the PC" }), note ? h("p.help", { text: note }) : null, list,
      can() ? h("div.row", h("button#allprivate", { type: "button", text: "Make everything private", disabled: busy, on: { click: () => change({ action: "everything-private" }) } }),
        h("span.help", { text: "Every program needs the sign-in (each can be made public again)." })) : null,
      h("p.say" + (sayKind ? "." + sayKind : ""), { text: say }),
      h("p.help", { text: "Private: only signed-in devices can use it. Public: anyone may view and download; changes always need the sign-in. Allowed off: pages hear it is switched off on the PC. " +
        "These are the tray's own switches (Programs) and are logged on the PC with this device's name. Stop now and Start now restart one program, which is often enough before restarting the PC." }));
    clear(p, game, progs);
  }

  let poll = 0;
  S.on("tab", (t) => {
    clearInterval(poll);
    if (t !== "programs") return;
    draw();
    S.pc.ping().then(draw);
    poll = setInterval(() => { if (document.visibilityState === "visible" && !busy) S.pc.ping().then(draw); }, 5000);
  });
  S.on("auth", () => { if (S.app && S.app.tab === "programs") draw(); });
  S.programs = { render: draw };
})();

// ---- app.js ----
// app.js: the page: four tabs (Connection, Pinger, Devices, Programs; the address's #hash names one, so another
// program can link to a tab: ../settings/#pinger), the header's connection chip, the footer's version.
"use strict";
(function () {
  const { h, $, $$ } = S;
  const TABS = ["connection", "pinger", "devices", "programs"];
  S.app = { tab: "" };

  function show(tab, push) {
    if (!TABS.includes(tab)) tab = "connection";
    if (S.app.tab === tab) return;
    S.app.tab = tab;
    for (const b of $$(".tabs button")) { const on = b.dataset.tab === tab; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; }
    for (const p of $$("main > section.panel")) p.hidden = p.id !== "tab-" + tab;
    S.store.set("tab", tab);
    if (push && location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
    if (tab === "connection") S.connection.render();
    S.emit("tab", tab);
  }

  function chip() {
    const c = $("#conn"), R = S.pc.R, st = R.status || {}, last = S.pc.last;
    let text = "Checking…", kind = "wait", title = st.why || "";
    if (last && last.ok) { text = `${last.ms} ms`; kind = "on"; title = `PC Relay ${S.pc.version()} answered in ${last.ms} ms at ${S.clock(last.at, true)}`; }
    else if (st.state === "off") { text = "Switched off"; kind = "off"; }
    else if (st.state === "reload") { text = "Reload the page"; kind = "off"; }
    else if (last && !last.ok) { text = last.status === 502 ? "PC Relay not running" : "Can't reach the PC"; kind = "off"; title = last.why || title; }
    c.className = "chip " + kind;
    c.textContent = text + (S.pc.signedIn() ? " · signed in" : "");
    c.title = title + (S.pc.signedIn() ? " · this device is signed in" : " · not signed in");
  }

  function start() {
    const bar = $(".tabs");
    bar.addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab, true); });
    bar.addEventListener("keydown", (e) => {
      const i = TABS.indexOf(S.app.tab);
      const to = e.key === "ArrowRight" ? TABS[(i + 1) % TABS.length] : e.key === "ArrowLeft" ? TABS[(i + TABS.length - 1) % TABS.length] : e.key === "Home" ? TABS[0] : e.key === "End" ? TABS[TABS.length - 1] : "";
      if (to) { e.preventDefault(); show(to, true); $(`.tabs button[data-tab="${to}"]`).focus(); }
    });
    addEventListener("hashchange", () => show(location.hash.slice(1), false));
    S.on("ping", chip);
    S.on("auth", chip);
    S.pc.R.on(chip);
    const v = $("#ver");
    if (v) v.textContent = `Settings ${S.VERSION} · built ${S.BUILT}`;
    chip();
    const want = location.hash.slice(1);
    show(TABS.includes(want) ? want : S.store.get("tab", "connection"), false);
    // one ping at the start whatever the tab (the Connection tab shows the PC's word on its address; the chip)
    if (S.app.tab !== "pinger") S.pc.ping().catch(() => {});
  }
  S.start = start;
})();

</script>
<script>
S.VERSION = "1.0.11"; S.BUILT = "2026-11-08 2:45 PM";
S.start();
</script>
</body>
