<style>
/* ---- settings.css ---- */
/* settings.css: the Settings page. Light and dark follow the device. No page zoom on phones (the viewport and
   touch-action), nothing wider than the screen. The Apps button's look is the kit's own (never styled here). */
:root {
  --bg: #f3f5fa; --card: #ffffff; --ink: #161b26; --muted: #596377; --line: #dde2ec; --bar: #ffffff;
  --accent: #3655c9; --accent-ink: #ffffff; --accent-soft: #e8edff;
  --ok: #1b7a43; --bad: #c22d28; --bad-soft: #fdeceb; --warn-bg: #fff5dc; --warn-ink: #6e4600;
  --yellow: #ffd23d; --chart: #3655c9; --grid: #c9d0dd;
  --tap: 40px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --card: #161b22; --ink: #e6edf3; --muted: #9ba5b4; --line: #2b3340; --bar: #12161d;
    --accent: #7f97ff; --accent-ink: #0b0f19; --accent-soft: #1d2645;
    --ok: #4cc38a; --bad: #ff6f66; --bad-soft: #3a1715; --warn-bg: #3a2c0d; --warn-ink: #ffd58a;
    --chart: #7f97ff; --grid: #333c4a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; overflow-x: hidden; }
a { color: var(--accent); }
code { font: 0.93em/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace; word-break: break-all; background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; }
b { font-weight: 650; }

/* the top bar: the Apps button first, then the title, the connection chip at the right */
header.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
header.bar apps-button { --apps-h: 36px; --apps-sep: var(--line); flex: none; }
header.bar h1 { margin: 0; font-size: 18px; font-weight: 650; white-space: nowrap; }
.chip { margin-left: auto; padding: 4px 10px; border-radius: 999px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55vw; border: 1px solid var(--line); }
.chip.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.chip.off { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.chip.wait { color: var(--muted); }

/* the tabs */
nav.tabs { position: sticky; top: 56px; z-index: 4; display: flex; gap: 4px; padding: 6px 16px; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: 1 1 0; min-width: 0; min-height: var(--tap); padding: 0 12px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); background: var(--card); }
nav.tabs button[aria-selected="true"] { color: var(--accent); background: var(--card); border-color: var(--line); }

main { max-width: 880px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin: 0 0 16px; min-width: 0; scroll-margin-top: 120px; }
.card h2 { margin: 0 0 10px; font-size: 16px; font-weight: 650; }
.card p { margin: 8px 0; }
.help { color: var(--muted); font-size: 13.5px; }
p.help { margin: 6px 0; }
.warn { background: var(--warn-bg); color: var(--warn-ink); padding: 8px 10px; border-radius: 8px; }
.okmark { color: var(--ok); font-weight: 700; }
.say { min-height: 1.2em; margin: 6px 0 0; font-size: 13.5px; color: var(--muted); }
.say.ok { color: var(--ok); }
.say.bad { color: var(--bad); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
.row > .help { flex: 1 1 200px; }
footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 8px 16px 28px; }

/* buttons, fields, switches */
button, .button, input, select { font: inherit; color: inherit; }
button, a.button { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; font-weight: 600; }
button:hover:not(:disabled), a.button:hover { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
button.small { min-height: 32px; padding: 0 10px; font-size: 13.5px; }
input[type="text"], input[type="password"], select { min-height: var(--tap); padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
.signform input { flex: 1 1 220px; }
label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.switch { position: relative; width: 46px; min-height: 26px; height: 26px; padding: 0; border-radius: 999px; background: var(--grid); border: none; flex: none; }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.35); transition: left 0.15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"] .knob { left: 23px; }
.switchlabel { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
.tag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); vertical-align: 1px; }
.tag.new { background: var(--yellow); color: #3a2c00; }
.tag.priv { background: var(--bad-soft); color: var(--bad); }

/* Connection */
.addr { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
ul.plain { margin: 6px 0; padding-left: 20px; }
ul.plain li { margin: 4px 0; }

/* Pinger */
.pingtop { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
.big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
.big.ok { color: var(--ok); }
.big.bad { color: var(--bad); font-size: 30px; }
.pingwhat { color: var(--muted); }
.chart { position: relative; height: 140px; margin: 8px 0; padding-top: 14px; border-radius: 8px; background: var(--bg); overflow: hidden; }
.chart svg { width: 100%; height: 100%; display: block; }
.chart .bar { fill: var(--chart); }
.chart .bar.lost { fill: var(--bad); opacity: 0.75; }
.chart .grid { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
.chart .lab { position: absolute; left: 6px; font-size: 11px; line-height: 1; color: var(--muted); }
.chart .lab.top { top: 2px; }
.chart .lab.mid { top: calc(14px + (100% - 14px) / 2 - 13px); }
#restartbanner { display: block; width: 100%; min-height: 36px; border: none; border-radius: 0; background: var(--bad); color: #fff; font-weight: 600; text-align: center; cursor: pointer; padding: 6px 12px; }
#restartbanner.back { background: var(--ok); }
#restartbanner[hidden] { display: none; }
ul.devices .say:empty, ul.programs .say:empty, .watch .say:empty { display: none; }
.stats { font-size: 13.5px; font-variant-numeric: tabular-nums; }
ul.pinglog, ul.events { list-style: none; margin: 8px 0; padding: 0; max-height: 280px; overflow-y: auto; border-top: 1px solid var(--line); }
ul.pinglog li { display: flex; gap: 12px; padding: 4px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; font-variant-numeric: tabular-nums; }
ul.pinglog .t, ul.events .t { color: var(--muted); white-space: nowrap; }
ul.pinglog li.bad .v { color: var(--bad); }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 8px 14px; }
.confirm ul { margin: 6px 0; padding-left: 20px; }
.confirm li { margin: 5px 0; }
.confirm select { min-height: 32px; }
.countdown { font-size: 17px; }
.result { font-size: 16px; font-weight: 600; }
.result.ok { color: var(--ok); }
ul.events { max-height: 420px; }
ul.events li { padding: 7px 2px; border-bottom: 1px solid var(--line); }
ul.events li.bad .what { color: var(--bad); }
ul.events li.ok .what { color: var(--ok); }
.evhead { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.what { font-weight: 600; }

/* Devices, Programs */
ul.devices, ul.programs { list-style: none; margin: 0; padding: 0; }
ul.devices > li, ul.programs > li { padding: 10px 0; border-bottom: 1px solid var(--line); }
ul.devices > li.this .devname { color: var(--accent); }
.devhead, .proghead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; }
form.inline { margin: 0; }
form.inline input { flex: 1 1 180px; }
.state { font-size: 13.5px; margin-top: 2px; }
.state.bad { color: var(--bad); }
.progctl { gap: 10px 14px; }
.switchrow { gap: 12px; }

/* a phone */
@media (max-width: 560px) {
  header.bar { height: 52px; gap: 8px; padding: 0 8px; }
  header.bar apps-button { --apps-h: 40px; }
  header.bar h1 { font-size: 17px; }
  .chip { font-size: 12px; padding: 3px 8px; max-width: 44vw; }
  nav.tabs { top: 52px; padding: 6px 8px; gap: 2px; }
  nav.tabs button { padding: 0 6px; font-size: 14px; }
  main { padding: 12px 12px; }
  .card { padding: 14px; border-radius: 12px; }
  .big { font-size: 34px; }
}

<script>
// ---- relay-client.js ----
/* relay-client.js 2: the PC Relay client (ONE source: Projects\pc-relay\client\relay-client.js; each page's build
   copies it in, so never edit a copy). Talks to PC Relay 2 on Jon's PC (Tailscale Funnel). SECURITY.md beside the
   relay says what the PC allows; this file only carries the pass and says plainly what the PC answered.
   - Nothing happens until the page calls something: no background traffic of its own.
   - The PC's address (2026-11-08, after the PC was renamed DESKTOP-KRQ9TI2 -> DESKTOP-42): unless the page names
     one (opts.base: a setting, a test, the relay's own origin for a page it serves), it is read from the address
     file on Jon's Cool tools site, ADDRESS_FILE ({"address": "https://..."}), fresh (never a cached copy) before the
     first connection, and again when a connection fails (at most once a minute), so an open page follows a rename.
     After a rename only that file changes; no page is rebuilt. If the file cannot be loaded (no network, a page
     opened from a file while offline, the site down), the address this copy was built with (BUILT_PC) is used and
     the page is told so: R.where is { from: "built-in", why }, and the page's log function (opts.log) and the
     browser's console get the same words. Never silently. (Tried again before a request, at most once a minute.)
   - ONE pass per browser (localStorage "relay-pass", shared by every page of the same site), from signIn(password).
     It is sent in the X-Relay-Pass header (HTTP) or as the WebSocket subprotocol "pass.<p>" (a browser cannot set
     WebSocket headers); never in a URL, never in cookies. Signed in = everything; signed out = view and download
     public things. The PC decides every request; a page's buttons are only buttons.
   - A 401 from the PC means "sign in": the pass (if one was sent) is no longer valid, so it is forgotten, the status
     becomes "signin", and call() answers { ok: false, signin: true, status: 401, why }.
   - Status events: checking / connected / starting / ready / offline / off / signin / reload, each with a plain `why`.
   - Version-checked: a relay that needs a newer client says so (426), and the status becomes "reload".

   const R = RelayClient.create({ app: "reader", log });  // app names the page in the PC's logs; log(text) hears
                                                           // relay-client's notes (which address, and why)
   await R.address();                                      // { url, from: "file" | "built-in" | "page", why }
   await R.ping();                                         // { ok, info, latency } ; info.signed_in, info.services
   R.signedIn();                                           // this browser holds a pass (the last ping says if it is valid)
   await R.signIn(password);                               // { ok, why, device, name }
   await R.signOut();                                      // { ok }
   await R.call("files", "list?folder=root");              // { ok, status, data, why, signin } (JSON in and out)
   await R.call("files", "mkdir", { method: "POST", json: { parent, name } });
   const r = await R.fetch("files", "file/ID/name");       // a Response (a 401 forgets the pass, as above)
   const ws = R.ws("voice", "ws");                         // a WebSocket carrying the pass
   await R.open("voice", (p) => ..., 60000);               // start a program, with progress
   R.url("files", "file/ID/name?dl=1");                    // a plain link (public things only: a link carries no pass)
   R.url, R.wsUrl and R.ws answer at once, with the address the last call used: call one of the others first.
*/
(function (root) {
  "use strict";
  const VERSION = 2;
  // The address this copy was built with: used only when the address file cannot be loaded, and then said.
  const BUILT_PC = "https://desktop-42.tail46434.ts.net";
  // Where the PC's address is published (WEB-APP-CONVENTIONS.md 5): after a rename, edit only that file.
  const ADDRESS_FILE = "https://jonnystokes.github.io/cooltools/relay.json";
  const RECHECK_MS = 60000;  // the address file is read again after a failed connection at most once a minute
  const ADDRESS_MS = 6000;   // the address file's own time limit
  const trim = (u) => String(u || "").trim().replace(/\/+$/, "");
  const goodAddress = (a) => /^https:\/\/[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:\d{1,5})?$/i.test(a);
  const KEY = "relay-pass";
  const store = {
    get(k) { try { return root.localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { if (v) root.localStorage.setItem(k, v); else root.localStorage.removeItem(k); } catch (e) {} },
    keys() { try { return Object.keys(root.localStorage); } catch (e) { return []; } },
  };
  // relay-client 1 kept a device id and one pass per scope; relay 2 does not accept them: tidied away.
  for (const k of store.keys()) if (k === "relay-device" || k.startsWith("relay-pass:")) store.set(k, "");
  let memPass = null; // when localStorage is not available (a sandboxed page): this page only

  function httpWhy(status) {
    return ({ 400: "the PC refused that address", 401: "sign-in needed", 403: "the PC refused this page",
      404: "the PC has no such program", 410: "this page is out of date: reload it", 426: "this page is out of date: reload it",
      429: "too many requests: wait a minute", 502: "the PC is reachable but the relay is not running (502)",
      503: "the PC said it is busy or switched off (503)" })[status] || `the PC answered ${status}`;
  }
  function netWhy(err, ms) {
    if (err && err.name === "AbortError") return `no answer from the PC within ${Math.round(ms / 1000)} s`;
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "this device is offline";
    return "could not reach the PC (no network, or the PC is off or asleep)";
  }
  // What kind of failure, so a page can say which it was and decide whether trying again can help: "offline" (this
  // device has no network), "timeout", "network" (no connection to the PC), "http" (the PC answered with an error
  // status), "off" (the relay is switched off), "reload", "signin", "start" (a program failed while it started).
  function netKind(err) {
    if (err && err.name === "AbortError") return "timeout";
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "offline";
    return "network";
  }
  async function readError(r) {
    try { const j = await r.clone().json(); if (j && j.error) return j.error; } catch (e) {}
    return httpWhy(r.status);
  }
  const kindOf = (status) => status === 401 ? "signin" : status === 426 || status === 410 ? "reload" : "http";

  class Relay {
    constructor(opts) {
      this.app = (opts.app || "page").replace(/[^A-Za-z0-9_.-]/g, "");
      this.log = typeof opts.log === "function" ? opts.log : null;
      this.status = { state: "idle", why: "", at: Date.now() };
      this.info = null;          // the last /relay/ping answer
      this.latency = 0;          // ms, the last ping's round trip
      this.bytes = 0;            // bytes this client has fetched through call() (approximate)
      this.subs = new Set();
      this._job = null;          // the address file being read (one read at a time)
      this._readAt = 0;          // when it was last asked for
      this._name(opts.base);
      if (typeof opts.onStatus === "function") this.subs.add(opts.onStatus);
    }
    // ---- the PC's address -------------------------------------------------------------------------------------
    // given: the page's own address (opts.base, setBase(url)), or "" = Jon's PC, from the address file.
    // where: { url, from, why }: from "page" (given), "file" (read from the address file in this page's life),
    // "built-in" (the file could not be loaded: why says so, plainly), "unread" (nothing asked yet).
    _name(url) {
      this.given = trim(url);
      this.base = this.given || BUILT_PC;
      this.where = this.given ? { url: this.given, from: "page", why: "" } : { url: BUILT_PC, from: "unread", why: "" };
      this._readAt = 0;
    }
    setBase(url) { if (trim(url) !== this.given) this._name(url); }
    async address() { await this._ready(); return this.where; }
    // before a request: the address file read once per page load (and again at most once a minute while it fails)
    async _ready() {
      if (this.given) return;
      const w = this.where.from;
      if (w === "unread" || (w === "built-in" && Date.now() - this._readAt >= RECHECK_MS)) await this._read();
    }
    _read() {
      if (!this._job) this._job = this._readNow().finally(() => { this._job = null; });
      return this._job;
    }
    // after a connection failed: has the PC moved? Read the file again (at most once a minute); true = a new address
    async _recheck() {
      if (this.given || this._job || Date.now() - this._readAt < RECHECK_MS) return false;
      const was = this.base;
      await this._read();
      return this.base !== was;
    }
    async _readNow() {
      this._readAt = Date.now();
      const was = this.where;
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ADDRESS_MS);
      let why = "";
      try {
        const r = await fetch(`${ADDRESS_FILE}?t=${Date.now()}`, { cache: "no-store", credentials: "omit", signal: ac.signal });
        if (!r.ok) throw new Error(`the site answered ${r.status}`);
        const j = await r.json().catch(() => null);
        const a = trim(j && j.address);
        if (!goodAddress(a)) throw new Error(j ? "it holds no https address" : "it is not JSON");
        if (this.given) return;                    // the page named its own address meanwhile
        this.base = a;
        this.where = { url: a, from: "file", why: "" };
        if (was.from !== "file") this._note(`the PC's address: ${a} (from ${ADDRESS_FILE})`, false);
        else if (was.url !== a) this._note(`the PC's address changed to ${a} (it was ${was.url}; from ${ADDRESS_FILE})`, false);
        return;
      } catch (e) {
        why = e && e.name === "AbortError" ? `no answer within ${ADDRESS_MS / 1000} s`
          : typeof navigator !== "undefined" && navigator.onLine === false ? "this device is offline"
          : e && e.name === "TypeError" ? "the Cool tools site could not be reached"
          : String((e && e.message) || e);
      } finally { clearTimeout(timer); }
      if (this.given || was.from === "file") return;  // read fine earlier in this page's life: that address stays
      const text = `the PC's address file (${ADDRESS_FILE}) could not be loaded (${why}): using the address this page was built with, ${BUILT_PC}`;
      this.base = BUILT_PC;
      this.where = { url: BUILT_PC, from: "built-in", why: text };
      if (was.why !== text) this._note(text, true);
    }
    _note(text, warn) {
      if (this.log) { try { this.log(text); } catch (e) {} }
      try { if (typeof console !== "undefined") (warn ? console.warn : console.info)("relay-client: " + text); } catch (e) {}
    }
    on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); }
    _set(state, extra) {
      this.status = Object.assign({ state, why: "", at: Date.now() }, extra || {});
      for (const f of this.subs) { try { f(this.status); } catch (e) {} }
    }
    // ---- the pass: one per browser --------------------------------------------------------------------------
    _rec() {
      if (memPass) return memPass;
      try { const j = JSON.parse(store.get(KEY) || "null"); return j && typeof j.pass === "string" && j.pass ? j : null; } catch (e) { return null; }
    }
    _pass() { const r = this._rec(); return r ? r.pass : ""; }
    _keep(rec) {
      store.set(KEY, rec ? JSON.stringify(rec) : "");
      memPass = rec && !store.get(KEY) ? rec : null; // storage refused: keep it for this page's life only
    }
    // the PC no longer knows the pass this browser sent: forget it, and say "sign in" (why = what the PC said)
    _lost(why) {
      if (!this._pass()) return;
      this._keep(null);
      this._set("signin", { why: why || "signed out on the PC: sign in again" });
    }
    signedIn() { return !!this._pass(); }
    device() { const r = this._rec(); return r ? { device: r.device || "", name: r.name || "", since: r.at || 0 } : null; }
    headers(extra) {
      const h = { "X-Relay-Client": this.app + "/" + VERSION };
      const p = this._pass();
      if (p) h["X-Relay-Pass"] = p;
      return Object.assign(h, extra || {});
    }
    // ---- addresses ----
    url(service, path) { return `${this.base}/svc/${service}/${String(path || "").replace(/^\/+/, "")}`; }
    wsUrl(service, path) { return this.url(service, path).replace(/^http/, "ws"); }
    wsProtocols() { const p = this._pass(); return p ? ["relay", "pass." + p] : ["relay"]; }
    ws(service, path) { return new WebSocket(this.wsUrl(service, path), this.wsProtocols()); }
    // fetch through the relay: a Response. opts.timeout (ms) aborts a request that has not started answering. A 401
    // forgets this browser's pass (it is not valid any more) and sets the status "signin". A request that could not
    // reach the PC has the address file read again (in the background: the next request goes to a new address).
    async fetch(service, path, opts) {
      opts = Object.assign({}, opts || {});
      const timeout = opts.timeout || 0; delete opts.timeout;
      await this._ready();
      opts.headers = this.headers(opts.headers);
      const sent = !!opts.headers["X-Relay-Pass"];
      let timer = 0, ac = null;
      if (timeout && !opts.signal) { ac = new AbortController(); opts.signal = ac.signal; timer = setTimeout(() => ac.abort(), timeout); }
      try {
        const r = await fetch(this.url(service, path), opts);
        if (r.status === 401) { const why = await readError(r); if (sent) this._lost(why); else this._set("signin", { service, why }); }
        return r;
      } catch (err) {
        if (ac || !(opts.signal && opts.signal.aborted)) this._recheck().catch(() => {});   // (not when the page stopped it)
        throw err;
      } finally { clearTimeout(timer); }
    }
    // call: a request with a JSON answer, as one plain result: { ok, status, data, why, kind, signin }. opts.json
    // sends a JSON body (Content-Type set); opts.method, opts.headers, opts.body, opts.signal, opts.timeout as fetch.
    async call(service, path, opts) {
      opts = Object.assign({ cache: "no-store" }, opts || {});
      if (opts.json !== undefined) {
        opts.body = JSON.stringify(opts.json);
        opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
        delete opts.json;
      }
      const ms = opts.timeout || 0;
      let r;
      try { r = await this.fetch(service, path, opts); }
      catch (err) { return { ok: false, status: 0, data: null, why: netWhy(err, ms), kind: netKind(err), signin: false }; }
      const text = await r.text().catch(() => "");
      this.bytes += text.length;
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
      if (r.ok) return { ok: true, status: r.status, data, why: "", kind: "", signin: false };
      const why = (data && data.error) || httpWhy(r.status);
      if (r.status === 426) this._set("reload", { why });
      return { ok: false, status: r.status, data, why, kind: kindOf(r.status), signin: r.status === 401 };
    }
    // ---- the light check: the PC, its programs, and whether this browser's pass is still valid ----
    // (no answer: the address file is read again, at most once a minute; a new address there is tried at once)
    async ping(timeoutMs) {
      timeoutMs = timeoutMs || 8000;
      this._set("checking", { why: "checking the connection…" });
      await this._ready();
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), timeoutMs), t0 = performance.now();
      try {
        const r = await fetch(`${this.base}/relay/ping?t=${Date.now()}`, { headers: this.headers(), cache: "no-store", signal: ac.signal });
        if (!r.ok) { const why = await readError(r); this._set(r.status === 426 ? "reload" : "offline", { why }); return { ok: false, why, kind: kindOf(r.status), status: r.status }; }
        const info = await r.json();
        this.latency = Math.round(performance.now() - t0);
        this.info = info;
        if ((info.min_client || 0) > VERSION) { const why = "this page is out of date: reload it"; this._set("reload", { why }); return { ok: false, why, info, kind: "reload" }; }
        if (info.pass === "unknown") this._lost("signed out on the PC (or the sign-in ended): sign in again");
        if (!info.on) { const why = "the PC relay is switched off (tray icon on the PC)"; this._set("off", { why, info }); return { ok: false, why, info, kind: "off" }; }
        this._set("connected", { why: `connected (${this.latency} ms)`, info, latency: this.latency, signedIn: !!info.signed_in });
        return { ok: true, info, latency: this.latency, signedIn: !!info.signed_in };
      } catch (err) {
        clearTimeout(timer);
        if (await this._recheck()) return this.ping(timeoutMs);   // the PC has a new address: try it now (once)
        const why = netWhy(err, timeoutMs);
        this._set("offline", { why });
        return { ok: false, why, kind: netKind(err) };
      } finally { clearTimeout(timer); }
    }
    service(id) { return ((this.info && this.info.services) || []).find((s) => s.id === id) || null; }
    // ---- sign-in: the password -> this browser's one pass (the old one, if any, is replaced on the PC) ----
    async signIn(password) {
      await this._ready();
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 15000);
      try {
        const r = await fetch(`${this.base}/relay/login`, { method: "POST", headers: this.headers({ "Content-Type": "application/json" }),
          body: JSON.stringify({ password }), cache: "no-store", signal: ac.signal });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) return { ok: false, why: j.error || httpWhy(r.status), status: r.status, kind: r.status === 401 ? "wrong" : kindOf(r.status) };
        this._keep({ pass: j.pass, device: j.device || "", name: j.name || "", at: Date.now() });
        this._set("connected", { why: "signed in", signedIn: true });
        return { ok: true, device: j.device || "", name: j.name || "", expiresDays: j.expires_days || 0 };
      } catch (err) { this._recheck().catch(() => {}); return { ok: false, why: netWhy(err, 15000), kind: netKind(err) }; }
      finally { clearTimeout(timer); }
    }
    // sign-out: forgotten here at once; the PC ends the pass (and the connections it opened) when it hears it
    async signOut() {
      const p = this._pass();
      this._keep(null);
      if (!p) return { ok: true };
      await this._ready();
      try {
        const r = await fetch(`${this.base}/relay/logout`, { method: "POST", headers: { "X-Relay-Pass": p, "X-Relay-Client": this.app + "/" + VERSION }, cache: "no-store" });
        const j = await r.json().catch(() => ({}));
        return { ok: true, onPC: !!j.signed_out };
      } catch (e) { return { ok: true, onPC: false, why: "signed out here; the PC could not be told (" + netWhy(e, 0) + ")" }; }
    }
    // ---- start a program, with progress ("starting the voice engine…") ----
    async open(service, onProgress, timeoutMs) {
      timeoutMs = timeoutMs || 60000;
      this._set("starting", { service, why: `starting ${service} on the PC…` });
      await this._ready();
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), timeoutMs);
      try {
        const h = this.headers();
        const r = await fetch(`${this.base}/relay/open/${service}`, { headers: h, cache: "no-store", signal: ac.signal });
        if (r.status === 401) { const why = await readError(r); if (h["X-Relay-Pass"]) this._keep(null); this._set("signin", { service, why }); return { ok: false, signin: true, why, kind: "signin", status: 401 }; }
        if (!r.ok) { const why = await readError(r); this._set(r.status === 426 ? "reload" : "offline", { service, why }); return { ok: false, why, kind: kindOf(r.status), status: r.status }; }
        const rd = r.body.getReader(), dec = new TextDecoder();
        let buf = "", last = null;
        for (;;) {
          const { value, done } = await rd.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf("\n")) >= 0) {
            const line = buf.slice(0, i); buf = buf.slice(i + 1);
            if (!line.trim()) continue;
            try { last = JSON.parse(line); } catch (e) { continue; }
            if (onProgress) { try { onProgress(last); } catch (e) {} }
            if (last.state === "starting") this._set("starting", { service, why: last.text || "starting…", seconds: last.seconds || 0 });
          }
        }
        if (last && last.state === "ready") { this._set("ready", { service, why: last.warm ? "ready" : `ready (started in ${(last.ms / 1000).toFixed(1)} s)` }); return { ok: true, warm: !!last.warm, ms: last.ms || 0 }; }
        const why = (last && last.error) || "the PC stopped answering while it was starting";
        this._set("offline", { service, why });
        return { ok: false, why, kind: "start" };
      } catch (err) {
        this._recheck().catch(() => {});
        const why = netWhy(err, timeoutMs);
        this._set("offline", { service, why });
        return { ok: false, why, kind: netKind(err) };
      } finally { clearTimeout(timer); }
    }
    // ---- keep checking (only while the page wants it): backoff 1 s, 2 s, 4 s ... 30 s while it fails ----
    watch(everyMs) {
      everyMs = everyMs || 15000;
      let stopped = false, timer = 0, fails = 0;
      const tick = async () => {
        if (stopped) return;
        const r = await this.ping();
        fails = r.ok ? 0 : fails + 1;

      let data = null;
      try { data = await r.json(); } catch (e) {}
      if (r.ok) return { ok: true, status: r.status, data, why: "", signin: false };
      let why = (data && data.error) || RelayClient.httpWhy(r.status);
      if (r.status === 404 && !P.has21()) why = `the PC runs PC Relay ${P.version() || "older than 2.1"}, which does not know this yet (it needs 2.1)`;
      if (r.status === 401 && sent) await P.ping().catch(() => {});   // relay-client forgets a pass the PC no longer knows
      return { ok: false, status: r.status, data, why, signin: r.status === 401 };
    },
    async signIn(password, name) {
      const r = await R.signIn(password);
      if (!r.ok) return r;   // (nothing changed: the page says why)
      if (name && name.trim()) {
        const n = await P.api("devices", { json: { rename: r.device, name: name.trim() } });
        if (n.ok) r.name = n.data.name;
        else r.nameWhy = n.why;
      }
      held = R.signedIn();
      await P.ping().catch(() => {});
      S.emit("auth");
      return r;
    },
    async signOut() {
      const r = await R.signOut();
      held = R.signedIn();
      S.emit("auth");
      P.ping().catch(() => {});
      return r;
    },
  });
})();

// ---- connection.js ----
// connection.js: the Connection tab: this browser's one sign-in (shared by every Cool tools page), the PC's address
// (where it comes from, what the PC itself says, the programs here with an address of their own), and a link to the
// Browser app cache manager for what this browser keeps.
"use strict";
(function () {
  const { h, $, clear } = S;
  const panel = () => $("#tab-connection");
  // the sign-in card's last message outlives a redraw (a ping can redraw the card a moment after a sign-in or out)
  let said = { text: "", kind: "", at: 0 };
  const sayIn = (el, text, kind) => { said = { text, kind, at: Date.now() }; S.say(el, text, kind); };

  function signCard() {
    const card = h("section.card#signcard", h("h2", { text: "Sign in" }));
    const R = S.pc.R, info = S.pc.info || {}, dev = S.pc.device();

      const name = (info.device && info.device.name) || (dev && dev.name) || "this browser";

      status.append(h("span.okmark", { text: "✓ " }), `Signed in on this device. The PC calls it `, h("b", { text: name }),
        since ? ` (signed in ${S.when(since)}).` : ".");
    } else if (info.pass === "unknown" || (R.status && R.status.state === "signin" && /ended|signed out on the PC/.test(R.status.why || ""))) {
      status.textContent = "The PC ended this device's sign-in (signed out on the PC, a new password, or not used for a long time). Sign in again below.";
      status.classList.add("warn");
    } else status.textContent = "Not signed in on this device.";
    card.append(status);
    card.append(h("p.help", { text: "One sign-in for this whole browser: signing in or out here signs every Cool tools page in this browser in or out " +
      "(the Book reader, the Cloud File Manager, Screen Peek and the rest), because they are one site and share one pass. Signed in: everything on the PC, " +
      "this page's devices, log, switches and Restart included. Signed out: public things only. A sign-in not used for " +
      ((info.expires_days || 30) + " days ends by itself.") }));
    const say = h("p.say");
    if (said.text && Date.now() - said.at < 60000) S.say(say, said.text, said.kind);
    if (!S.pc.signedIn()) {
      const pw = h("input#pw", { type: "password", autocomplete: "current-password", placeholder: "The PC's password", "aria-label": "The PC's password" });
      const nm = h("input#devname", { type: "text", autocomplete: "off", maxlength: "60", placeholder: "Name this device (optional), e.g. Jon's phone", "aria-label": "A name for this device (optional)" });
      const go = h("button.primary#signin", { type: "submit", text: "Sign in" });
      const form = h("form.row.signform", { on: { submit: async (e) => {
        e.preventDefault();
        if (!pw.value) { S.say(say, "Type the PC's password first.", "bad"); pw.focus(); return; }
        go.disabled = true; S.say(say, "Signing in…");
        const r = await S.pc.signIn(pw.value, nm.value);
        go.disabled = false;
        if (r.ok) { pw.value = ""; sayIn(say, r.nameWhy ? `Signed in. The name could not be set: ${r.nameWhy}` : "Signed in.", r.nameWhy ? "bad" : "ok"); render(); }
        else { sayIn(say, S.sentence(r.why || "the sign-in did not work"), "bad"); pw.select(); }
      } } }, pw, nm, go);
      card.append(form);
    } else {
      const out = h("button#signout", { type: "button", text: "Sign out", on: { click: async () => {
        out.disabled = true; S.say(say, "Signing out…");
        const r = await S.pc.signOut();
        sayIn(say, r.onPC ? "Signed out here and on the PC: every Cool tools page in this browser is signed out." :
          "Signed out here (every Cool tools page in this browser)." + (r.why ? " " + S.sentence(r.why) : ""), "ok");
        render();
      } } });
      card.append(h("div.row", out, h("span.help", { text: "Signs this browser out of every Cool tools page, here and on the PC." })));
    }
    card.append(say);

  }

  // the programs in this browser that have their own address for the PC (a test, another PC, an old setting)
  function ownAddresses() {
    const out = [];
    const reader = (() => { try { const j = JSON.parse(S.peek("br1-settings") || "null"); return j && typeof j.pcAddress === "string" ? j.pcAddress.trim() : ""; } catch (e) { return ""; } })();
    if (reader) out.push(["Book reader", reader, "its Settings → Cloud → PC address (blank = the usual address)"]);
    const fm = (() => { const v = S.peek("fm-pc-address"); if (!v) return ""; try { const j = JSON.parse(v); return typeof j === "string" ? j.trim() : ""; } catch (e) { return v.trim(); } })();
    if (fm) out.push(["Cloud File Manager", fm, "localStorage fm-pc-address (a test or another PC)"]);
    if (S.pc.own()) out.push(["Settings (this page)", S.pc.own(), "localStorage settings-pc-address (a test or another PC)"]);
