/* ---- base.css ---- */
/* base.css: the look both pages share (the six sections and the account page). Light and dark follow the device.
   One meaning per colour, everywhere: green is fine, amber needs a look, red is broken, grey is off (--ok, --warn,
   --bad, --off: a fill for dots and bars, an -ink for words). Blue (--accent) only marks what is chosen or pressed.
   Big basic buttons: every control is at least --tap tall. No page zoom on phones, nothing wider than the screen.
   The Apps button's look is the kit's own (never styled here). */
:root {
  --bg: #f2f4f8; --card: #ffffff; --ink: #161b26; --muted: #586174; --line: #dce1ea; --bar: #ffffff; --soft: #f5f7fb;
  --accent: #2f5fd0; --accent-ink: #ffffff; --accent-soft: #e6edff;
  --ok: #17a34a; --ok-ink: #116a34; --ok-soft: #e4f6ea;
  --warn: #f2a31b; --warn-ink: #8a5300; --warn-soft: #fff3d9;
  --bad: #d13a34; --bad-ink: #b3261e; --bad-soft: #fdeceb;
  --off: #9aa3b2; --off-ink: #5d6677; --off-soft: #eceff4;
  --tap: 44px; --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116; --card: #171b22; --ink: #e7ecf3; --muted: #a0a9b8; --line: #2a313c; --bar: #13171d; --soft: #1c2129;
    --accent: #84a2ff; --accent-ink: #0b1020; --accent-soft: #1e2a4d;
    --ok: #35b56a; --ok-ink: #63d391; --ok-soft: #14301f;
    --warn: #f2b33d; --warn-ink: #f6c665; --warn-soft: #3a2c0d;
    --bad: #f0645c; --bad-ink: #ff8a82; --bad-soft: #3a1715;
    --off: #6f7887; --off-ink: #a0a9b8; --off-soft: #232933;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.12em; font-weight: 700; }
h3 { font-size: 1em; font-weight: 700; }
b { font-weight: 650; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 0.875em; }
.num { font-variant-numeric: tabular-nums; }
svg.ico { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* buttons, boxes */
button, input, select, textarea { font: inherit; color: inherit; }
button, a.button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; font-weight: 600; white-space: nowrap; }
button:hover:not(:disabled), a.button:hover { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { border: 2px solid var(--ink); font-weight: 700; }   /* weighty, never red: red means broken, nothing else */
button.danger:hover:not(:disabled) { border-color: var(--accent); }
button.big { min-height: 52px; padding: 0 22px; font-size: 1.06em; }
button.plain { border-color: transparent; background: transparent; padding: 0 10px; color: var(--accent); }
button.wide { width: 100%; }
input[type="text"], input[type="password"], input[type="number"], select { min-height: var(--tap); padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); min-width: 0; }
input[type="number"] { width: 5.5em; }
select { padding-right: 8px; }

/* a switch: green when on, grey when off */
.switch { position: relative; width: 52px; min-height: 30px; height: 30px; padding: 0; border-radius: 999px; background: var(--off); border: none; flex: none; }
.switch::before { content: ""; position: absolute; inset: calc((30px - var(--tap)) / 2) -4px; }   /* the tap area reaches past the knob */
.switch .knob { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.35); transition: left 0.15s; }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"] .knob { left: 25px; }
.switch.unknown { background: var(--off-soft); border: 1px dashed var(--off); }   /* its position is not known here */
.switch.unknown .knob { left: 14px; background: var(--off); box-shadow: none; }
.switch.big { width: 76px; height: 44px; min-height: 44px; }
.switch.big .knob { width: 36px; height: 36px; top: 4px; left: 4px; }
.switch.big[aria-checked="true"] .knob { left: 36px; }

/* a row: the label and one short line at the left, the control at the right (under the label when there is no room) */
.rows { border-top: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rows > .row:last-child, .card > .row:last-child { border-bottom: 0; }
.rl { flex: 1 1 13em; min-width: 0; }
.rn { font-weight: 650; overflow-wrap: anywhere; }
.rh { margin-top: 2px; color: var(--muted); font-size: 0.875em; overflow-wrap: anywhere; }
.rc { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
/* a row whose control is a line of boxes (a path, a name): the line goes under the label, the full width */
.row.wide .rc { flex: 1 1 100%; justify-content: flex-start; }
.row.wide .rc form { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; }
.row.wide .rc input[type="text"] { flex: 1 1 14em; }
.row.resting .rn { color: var(--muted); }
.only { margin-top: 2px; color: var(--off-ink); font-size: 0.875em; font-style: italic; }

/* the More fold */
details.more { border-top: 1px solid var(--line); margin-top: 4px; }
details.more > summary { list-style: none; display: flex; flex-direction: column; justify-content: center; min-height: var(--tap); padding: 8px 0 8px 22px; position: relative; cursor: pointer; border-radius: 6px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: ""; position: absolute; left: 4px; top: 50%; margin-top: -5px; border: 5px solid transparent; border-left: 8px solid var(--accent); border-right: 0; transition: transform 0.12s; }
details.more[open] > summary::before { transform: rotate(90deg); }
.mt { font-weight: 650; color: var(--accent); }
.mh { color: var(--muted); font-size: 0.875em; }
.morebody { padding: 2px 0 6px; }

/* messages */
.say { min-height: 1.2em; margin: 6px 0 0; font-size: 0.9em; color: var(--muted); overflow-wrap: anywhere; }
.say:empty { display: none; }
.say.ok { color: var(--ok-ink); }
.say.bad { color: var(--bad-ink); font-weight: 600; }
.notice { padding: 10px 12px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn-ink); }
.notice.bad { background: var(--bad-soft); color: var(--bad-ink); }

/* the state of something: a dot and a word */
.state { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
.state .dot, .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
.state.ok { color: var(--ok-ink); } .state.ok .dot, .dot.ok { background: var(--ok); }
.state.warn { color: var(--warn-ink); } .state.warn .dot, .dot.warn { background: var(--warn); }
.state.bad { color: var(--bad-ink); } .state.bad .dot, .dot.bad { background: var(--bad); }
.state.off { color: var(--off-ink); }

/* a person's picture, or their initial */
.avatar { --av: 40px; position: relative; display: inline-grid; place-items: center; width: var(--av); height: var(--av); border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: calc(var(--av) * 0.44); line-height: 1; flex: none; overflow: hidden; user-select: none; }
.avatar.guest { background: var(--off-soft); color: var(--off-ink); font-size: calc(var(--av) * 0.3); font-weight: 650; }
.avatar.guest .letter { font-size: calc(var(--av) * 0.44); font-weight: 700; }   /* a guest's "G": the size of any initial */
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
.avatar.has img { opacity: 1; }
.avatar svg.ico { width: 56%; height: 56%; }

/* a small menu under a button */
.menu { position: absolute; z-index: 50; min-width: 180px; max-width: min(340px, calc(100vw - 16px)); padding: 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); box-shadow: 0 10px 30px rgb(0 0 0 / 0.22); display: flex; flex-direction: column; gap: 2px; }
.menu > button { justify-content: flex-start; border-color: transparent; width: 100%; font-weight: 500; }
.menu > button:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
.menu .mhead { padding: 6px 10px 2px; color: var(--muted); font-size: 0.85em; font-weight: 600; }

/* the one confirmation (before deleting) */
dialog.confirm { width: min(420px, calc(100vw - 32px)); padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); box-shadow: 0 18px 50px rgb(0 0 0 / 0.35); }
dialog.confirm::backdrop { background: rgb(10 14 22 / 0.5); }
dialog.confirm h2 { margin-bottom: 6px; }
dialog.confirm p { color: var(--muted); overflow-wrap: anywhere; }
dialog.confirm .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

/* ---- account.css ---- */
/* account.css: the account page. One narrow column of big things, the same in a tab, in the window kit's window and
   in the Apps menu's frame (where the top bar goes: the window has its own title). */
header.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
header.bar apps-button { --apps-h: 36px; --apps-sep: var(--line); flex: none; }
header.bar h1 { font-size: 1.15em; font-weight: 700; white-space: nowrap; }
.framed header.bar, .door header.bar apps-button, .framed footer { display: none; }
body.account { background: var(--card); }
main#acct { width: min(440px, 100%); margin: 0 auto; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 14px; }
footer { text-align: center; color: var(--muted); font-size: 0.8em; padding: 0 16px 20px; }
.topline { display: flex; margin: -6px 0 -6px -10px; }
.backbtn { color: var(--accent); }
.title { font-size: 1.35em; text-align: center; }
.center { text-align: center; justify-content: center; }
.label { font-weight: 650; margin-bottom: 6px; }
.block { display: flex; flex-direction: column; }
.block + .block { padding-top: 14px; border-top: 1px solid var(--line); }
form { display: flex; flex-direction: column; gap: 10px; margin: 0; }
.line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.line > input { flex: 1 1 10em; }
.line.two > * { flex: 1 1 0; }
.line.outline { padding-top: 14px; border-top: 1px solid var(--line); }
input[type="text"], input[type="password"] { min-height: 48px; font-size: 1.05em; width: 100%; }
.line > input[type="text"] { width: auto; }
.pwbox { position: relative; display: flex; }
.pwbox input { padding-right: 76px; }
.pwbox .showpw { position: absolute; right: 4px; top: 4px; min-height: 40px; height: 40px; padding: 0 12px; border-color: transparent; background: transparent; color: var(--accent); }

/* who this is */
.who { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0 2px; }
.whoname { font-size: 1.4em; font-weight: 700; text-align: center; overflow-wrap: anywhere; }
.whokind { color: var(--muted); font-size: 0.9em; margin-top: -6px; }

/* the accounts used from this network: big buttons */
.pick { display: flex; flex-direction: column; gap: 8px; max-height: min(46vh, 340px); overflow-y: auto; padding: 2px; margin: -2px; }
.pick .person { justify-content: flex-start; gap: 12px; min-height: 60px; padding: 6px 12px; width: 100%; font-size: 1.05em; }
.pick .person .pname { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; }
.pick .person svg.ico { color: var(--muted); }

/* the walk-through's three steps */
.steps { display: flex; align-items: center; justify-content: center; gap: 6px; }
.steps > span:not(.stepword) { width: 34px; height: 6px; border-radius: 3px; background: var(--line); }
.steps > span.on, .steps > span.done { background: var(--accent); }
.steps > span.done { opacity: 0.45; }
.stepword { margin-left: 8px; color: var(--muted); font-size: 0.85em; }

.rows .row form { flex: 1 1 100%; }
.val { font-weight: 500; overflow-wrap: anywhere; }
.pickbox { display: flex; flex: 1 1 auto; }
.line.center .pickbox { flex: 0 1 auto; }
.line.center .pickbox button { width: auto; }
.offbox { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 28px 0; }
.bigdot { width: 22px; height: 22px; border-radius: 50%; background: var(--off); }
@media (max-width: 380px) { main#acct { padding: 12px 12px 24px; } }

</style>

<body class="account">
<header class="bar">
  <apps-button app="settings" stack="560"></apps-button>
  <h1>Account</h1>
</header>
<main id="acct" aria-live="polite"></main>
<footer><span id="ver"></span></footer>
<script>
// ---- relay-client.js ----
/* relay-client.js 3: the PC Relay client (ONE source: Projects\pc-relay\client\relay-client.js; each page's build
   copies it in, so never edit a copy). Talks to PC Relay 3 (accounts) on Jon's PC. The relay decides every request;
   this file carries the pass, remembers who this browser is, and says plainly what the PC answered.
   The exact requests: Projects\cool-tools-upgrade\API-relay.md.

   - Nothing happens until the page calls something: no background traffic of its own (seen() is the page's call).
   - The PC's address: read from relay.json beside the programs ("../relay.json" from a program's page, or
     opts.addressFile), fresh before the first connection and again after a failed one (at most once a minute).
     {"address": "https://..."}; http only for 127.0.0.1 and localhost (the stage). No address is built in: if the file
     cannot be read the cloud is simply off, with a plain reason (status "off", where.why). opts.base names the address
     instead (tests, the relay's own window on the local door).
   - Kept in this browser (localStorage, shared by every page of the site): "relay-pass" ({pass, device, at}) and
     "relay-account" ({id, name, kind, number, at}), so the name shows at once, even with the cloud off. Another tab's
     sign-in, sign-out or change arrives as an "account" event.
   - The pass goes in the X-Relay-Pass header (HTTP) or the WebSocket subprotocol "pass.<p>"; never in a URL.
   - When the PC says the pass is not valid any more (X-Relay-Info: pass-unknown, or the ping's pass "unknown"), the
     pass and the account are forgotten and "account" fires with null. me() forgets them only on a whole answer that
     says {account: null}. An answer cut off, garbled or late, a timeout or a network error never ends a sign-in:
     it is a result with ok false and kind "network" or "timeout".
   - Errors from the relay are { why, kind }; every result here carries why and kind.

   const R = RelayClient.create({ app: "plan-cutter", log });
   await R.ping();                 // { ok, latency, info }
   R.account();                    // at once, from this browser: { id, name, kind, number } or null
   await R.me();                   // from the PC: { ok, account, can, programs, network, limited }
   R.can("files.shared.change");  R.canUse("voice");      // from the last me()
   await R.accountsHere();         // { ok, accounts: [{ id, name, kind, number, picture, hasPassword }] }
   await R.signIn(name, password); // { ok, kind, why, account }
   await R.signOut();              // { ok }
   await R.guest();                // { ok, account }  (a guest for this browser; itself when it has an account)
   await R.setup({ name, password });   // { ok, kind, why, account }
   await R.update({ name, password });  // { ok, kind, why, account }   (password: null removes it)
   R.seen();                       // "this app is open" (call once a minute while the page is visible)
   R.on("account", fn);            // fn(account or null)
   R.on("status", fn);             // fn({ state: checking|connected|off|offline|starting|ready|reload, why })
   await R.api("people");          // any /relay/ request: { ok, status, data, why, kind }
   R.call, R.fetch, R.url, R.ws, R.open, R.pcName, R.address, R.watch     // as in relay-client 2
*/
(function (root) {
  "use strict";
  const VERSION = 3;
  const RECHECK_MS = 60000, ADDRESS_MS = 6000;
  const PASS_KEY = "relay-pass", ACCOUNT_KEY = "relay-account", NAME_KEY = "relay-pc-name", YOUR_PC = "your PC";
  const trim = (u) => String(u || "").trim().replace(/\/+$/, "");
  const goodAddress = (a) =>
    /^https:\/\/[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:\d{1,5})?$/i.test(a) ||
    /^http:\/\/(127\.0\.0\.1|localhost)(:\d{1,5})?$/i.test(a);
  const store = {
    get(k) { try { return root.localStorage.getItem(k) || ""; } catch (e) { return mem[k] || ""; } },
    set(k, v) {
      try { if (v) root.localStorage.setItem(k, v); else root.localStorage.removeItem(k); }
      catch (e) { if (v) mem[k] = v; else delete mem[k]; }
    },
  };
  const mem = {}; // when localStorage is not available (a sandboxed page): this page only
  const json = (k) => { try { const j = JSON.parse(store.get(k) || "null"); return j && typeof j === "object" ? j : null; } catch (e) { return null; } };
  const cleanName = (n) => (typeof n === "string" ? Array.from(n.replace(/[\x00-\x1f\x7f-\x9f]/g, "").trim()).slice(0, 64).join("").trim() : "");
  const shortAcct = (a) => (a && a.id ? { id: a.id, name: String(a.name || ""), kind: String(a.kind || ""), number: a.number || 0 } : null);

  function httpWhy(status) {
    return ({ 400: "the PC refused that request", 401: "sign-in needed", 403: "not allowed", 404: "not found on the PC",
      409: "that clashes with something on the PC", 410: "this page is out of date: reload it", 426: "this page is out of date: reload it",
      429: "too many requests: wait a minute", 502: "the program on the PC did not answer", 503: "the PC said it is busy or switched off" })[status] || `the PC answered ${status}`;
  }
  function netWhy(err, ms) {
    if (err && err.name === "AbortError") return `no answer from the PC within ${Math.round(ms / 1000)} s`;
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "this device is offline";
    return "could not reach the PC (no network, or the PC is off or asleep)";
  }
  function netKind(err) {
    if (err && err.name === "AbortError") return "timeout";
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "offline";
    return "network";
  }
  const kindOf = (status) => status === 401 ? "signin" : status === 426 || status === 410 ? "reload" : "http";

  class Relay {
    constructor(opts) {
      opts = opts || {};
      this.app = String(opts.app || "page").toLowerCase().replace(/[^a-z0-9-]/g, "");
      this.log = typeof opts.log === "function" ? opts.log : null;
      this.addressFile = opts.addressFile || "";
      this.status = { state: "idle", why: "", at: Date.now() };
      this.info = null;
      this.latency = 0;
      this.bytes = 0;
      this._me = null;
      this._subs = { status: new Set(), account: new Set() };
      this._job = null;
      this._readAt = 0;
      this._acctSeen = JSON.stringify(shortAcct(json(ACCOUNT_KEY)));
      this._setBase(opts.base);
      if (typeof opts.onStatus === "function") this._subs.status.add(opts.onStatus);
      if (typeof addEventListener === "function") {
        addEventListener("storage", (e) => { if (!e || e.key === ACCOUNT_KEY || e.key === PASS_KEY || e.key === null) this._acctChanged(); });
      }
    }
    // ---- the PC's address ---------------------------------------------------------------------------------------
    _setBase(url) {
      this.given = trim(url);
      this.base = this.given;
      this.where = this.given ? { url: this.given, from: "page", why: "" } : { url: "", from: "unread", why: "" };
      this._readAt = 0;
    }
    setBase(url) { if (trim(url) !== this.given) this._setBase(url); }
    _fileUrl() {
      if (this.addressFile) return this.addressFile;
      try { return new URL("../relay.json", root.location.href).href; } catch (e) { return "../relay.json"; }
    }
    async address() { await this._ready(); return this.where; }
    async _ready() {
      if (this.given) return;
      const w = this.where.from;
      if (w === "unread" || (w === "none" && Date.now() - this._readAt >= RECHECK_MS)) await this._read();
    }
    _read() {
      if (!this._job) this._job = this._readNow().finally(() => { this._job = null; });
      return this._job;
    }
    async _recheck() {
      if (this.given || this._job || Date.now() - this._readAt < RECHECK_MS) return false;
      const was = this.base;
      await this._read();
      return this.base !== was;
    }
    async _readNow() {
      this._readAt = Date.now();
      const file = this._fileUrl(), was = this.where;
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ADDRESS_MS);
      let why = "";
      try {
        const sep = file.includes("?") ? "&" : "?";
        const r = await fetch(`${file}${sep}t=${Date.now()}`, { cache: "no-store", credentials: "omit", signal: ac.signal });
        if (!r.ok) throw new Error(`the site answered ${r.status}`);
        const j = await r.json().catch(() => null);
        const a = trim(j && j.address);
        if (!goodAddress(a)) throw new Error(j ? "it holds no usable address" : "it is not JSON");
        if (this.given) return;
        this.base = a;
        this.where = { url: a, from: "file", why: "" };
        if (was.url !== a) this._note(`the PC's address: ${a} (from ${file})`, false);
        return;
      } catch (e) {
        why = e && e.name === "AbortError" ? `no answer within ${ADDRESS_MS / 1000} s`
          : typeof navigator !== "undefined" && navigator.onLine === false ? "this device is offline"
          : e && e.name === "TypeError" ? "the site could not be reached"
          : String((e && e.message) || e);
      } finally { clearTimeout(timer); }
      if (this.given || was.from === "file") return; // read fine earlier in this page's life: that address stays
      const text = `the PC's address (${file}) could not be read (${why}): the cloud is off`;
      this.base = "";
      this.where = { url: "", from: "none", why: text };
      if (was.why !== text) this._note(text, true);
    }
    _note(text, warn) {
      if (this.log) { try { this.log(text); } catch (e) {} }
      try { if (typeof console !== "undefined") (warn ? console.warn : console.info)("relay-client: " + text); } catch (e) {}
    }
    // ---- events ----
    on(what, fn) {
      if (typeof what === "function") { fn = what; what = "status"; }
      const set = this._subs[what];
      if (!set || typeof fn !== "function") return () => {};
      set.add(fn);
      return () => set.delete(fn);
    }
    _set(state, extra) {
      this.status = Object.assign({ state, why: "", at: Date.now() }, extra || {});
      for (const f of this._subs.status) { try { f(this.status); } catch (e) {} }
    }
    _acctChanged() {
      const now = JSON.stringify(this.account());
      if (now === this._acctSeen) return;
      this._acctSeen = now;
      const a = this.account();
      // another person (or nobody) now: the rights the last me() gave are not theirs; can() says no until me() is asked again
      if (!a || !this._me || !this._me.account || this._me.account.id !== a.id) this._me = null;
      for (const f of this._subs.account) { try { f(a); } catch (e) {} }
    }
    // ---- the pass and the account, kept in this browser ----
    _pass() { const r = json(PASS_KEY); return r && typeof r.pass === "string" ? r.pass : ""; }
    _keep(pass, account) {
      if (pass !== undefined) store.set(PASS_KEY, pass ? JSON.stringify({ pass, at: Date.now() }) : "");
      if (account !== undefined) store.set(ACCOUNT_KEY, account ? JSON.stringify(Object.assign(shortAcct(account), { at: Date.now() })) : "");
      this._acctChanged();
    }
    _forget(why) {
      if (!this._pass() && !this.account()) return;
      this._me = null;
      this._keep("", null);
      this._note("this browser's sign-in ended on the PC" + (why ? ` (${why})` : ""), false);
    }
    // An answer speaks only about the pass its request carried. While it was on its way, another tab of this browser
    // may have signed in or switched user: the browser then holds a new pass, and an answer about the old one ("pass
    // unknown", "no account", an older account) must not wipe or overwrite the new sign-in. _current(sent) says whether
    // the pass sent is still the one kept.
    _current(sent) { return sent === this._pass(); }
    _info(r, sent) { // every answer: the PC may say the pass is not valid any more
      const i = (r.headers && r.headers.get("X-Relay-Info")) || "";
      if (/pass-unknown/.test(i) && this._current(sent)) this._forget("the PC does not know it");
    }
    account() { return shortAcct(json(ACCOUNT_KEY)); }
    signedIn() { return !!this._pass(); }
    can(flag) { return !!(this._me && this._me.can.includes(flag)); }
    canUse(prog) { return prog === "files" || !!(this._me && this._me.programs.includes(prog)); }
    headers(extra) {
      const h = { "X-Relay-Client": this.app + "/" + VERSION };
      const p = this._pass();
      if (p) h["X-Relay-Pass"] = p;
      return Object.assign(h, extra || {});
    }
    // ---- addresses ----
    url(service, path) { return `${this.base}/svc/${service}/${String(path || "").replace(/^\/+/, "")}`; }
    wsUrl(service, path) { return this.url(service, path).replace(/^http/, "ws"); }
    wsProtocols() { const p = this._pass(); return p ? ["relay", "pass." + p] : ["relay"]; }
    ws(service, path) { return new WebSocket(this.wsUrl(service, path), this.wsProtocols()); }
    _off() { return { ok: false, status: 0, data: null, why: this.where.why || "the cloud is off", kind: "off" }; }
    // fetch through the relay: a Response (throws when the PC cannot be reached, or the address is not known)
    async fetch(service, path, opts) {
      opts = Object.assign({}, opts || {});
      const timeout = opts.timeout || 0; delete opts.timeout;
      await this._ready();
      if (!this.base) throw new TypeError(this.where.why || "the cloud is off");
      const sent = this._pass();
      opts.headers = this.headers(opts.headers);
      let timer = 0, ac = null;
      if (timeout && !opts.signal) { ac = new AbortController(); opts.signal = ac.signal; timer = setTimeout(() => ac.abort(), timeout); }
      try {
        const r = await fetch(this.url(service, path), opts);
        this._info(r, sent);
        return r;
      } catch (err) {
        if (ac || !(opts.signal && opts.signal.aborted)) this._recheck().catch(() => {});
        throw err;
      } finally { clearTimeout(timer); }
    }
    // _result: an answer read whole. A body that cannot be read (the page left, the connection dropped, a timeout
    // while reading) or a 2xx body that is not whole JSON is NOT ok: kind "network" (or "timeout"). Only a real,
    // whole answer from the PC may say anything about the sign-in (reader agent's find, 2026-11-12).
    async _result(r) {
      let text, cut = null;
      try { text = await r.text(); } catch (err) { text = ""; cut = err; }
      this.bytes += text.length;
      let data = null, bad = false;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; bad = true; }
      if (cut || (r.ok && bad)) {
        const kind = cut ? netKind(cut) : "network";
        const why = cut && kind === "timeout" ? "the PC's answer did not arrive in time" : "the PC's answer was cut off: try again";
        return { ok: false, status: r.status, data: null, why, kind, cut: true };
      }
      if (r.ok) return { ok: true, status: r.status, data, why: "", kind: "" };
      const why = (data && (data.why || data.error)) || httpWhy(r.status);
      const kind = (data && data.kind) || kindOf(r.status);
      if (r.status === 426) this._set("reload", { why });
      return { ok: false, status: r.status, data, why, kind, signin: r.status === 401 };
    }
    _body(opts) {
      opts = Object.assign({ cache: "no-store" }, opts || {});
      if (opts.json !== undefined) {
        opts.body = JSON.stringify(opts.json);
        opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
        delete opts.json;
      }
      return opts;
    }
    // call: a program's request with a JSON answer: { ok, status, data, why, kind }
    async call(service, path, opts) {
      opts = this._body(opts);
      const ms = opts.timeout || 0;
      let r;
      try { r = await this.fetch(service, path, opts); }
      catch (err) { return this.base ? { ok: false, status: 0, data: null, why: netWhy(err, ms), kind: netKind(err) } : this._off(); }
      return this._result(r);
    }
    // api: the relay's own request /relay/<path>: { ok, status, data, why, kind, current }. current: this browser
    // still holds the pass the request carried (false: its sign-in changed meanwhile, the answer is about the old one).
    async api(path, opts) {
      opts = this._body(opts);
      const ms = opts.timeout || 15000; delete opts.timeout;
      await this._ready();
      if (!this.base) return this._off();
      const sent = this._pass();
      opts.headers = this.headers(opts.headers);
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ms);
      opts.signal = opts.signal || ac.signal;
      try {
        const r = await fetch(`${this.base}/relay/${String(path).replace(/^\/+/, "")}`, opts);
        this._info(r, sent);
        const res = await this._result(r);
        res.current = this._current(sent);
        return res;
      } catch (err) {
        this._recheck().catch(() => {});
        return { ok: false, status: 0, data: null, why: netWhy(err, ms), kind: netKind(err) };
      } finally { clearTimeout(timer); }
    }
    // ---- the light check ----
    async ping(timeoutMs) {
      timeoutMs = timeoutMs || 8000;
      this._set("checking", { why: "checking the connection…" });
      await this._ready();
      if (!this.base) { const why = this.where.why || "the cloud is off"; this._set("off", { why }); return { ok: false, why, kind: "off" }; }
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), timeoutMs), t0 = performance.now();
      try {
        const sent = this._pass();
        const r = await fetch(`${this.base}/relay/ping?t=${Date.now()}`, { headers: this.headers(), cache: "no-store", signal: ac.signal });
        this._info(r, sent);
        if (!r.ok) { const res = await this._result(r); this._set(r.status === 426 ? "reload" : "offline", { why: res.why }); return { ok: false, why: res.why, kind: res.kind, status: r.status }; }
        const info = await r.json();
        this.latency = Math.round(performance.now() - t0);
        this.info = info;

S.icon = (name, size) => {
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"), p = document.createElementNS(ns, "path");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "ico");
  svg.setAttribute("aria-hidden", "true");
  if (size) { svg.style.width = size + "px"; svg.style.height = size + "px"; }
  p.setAttribute("d", ICONS[name] || "");
  svg.append(p);
  return svg;
};

// This page's own settings in this browser (localStorage "settings-<name>": never anything that must not be lost)
S.store = {
  get(k, d) { try { const v = localStorage.getItem("settings-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { if (v === undefined || v === null) localStorage.removeItem("settings-" + k); else localStorage.setItem("settings-" + k, JSON.stringify(v)); } catch (e) {} },
};

// events inside the page
(function () {
  const subs = {};
  S.on = (name, fn) => { (subs[name] = subs[name] || new Set()).add(fn); return () => subs[name].delete(fn); };
  S.emit = (name, data) => { for (const fn of subs[name] || []) { try { fn(data); } catch (e) { console.error(e); } } };
})();

// ---- times: always 12-hour with AM/PM ----
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
S.MON = MON;
S.clock = (t, secs) => {
  const d = new Date(t);
  let hh = d.getHours();
  const ap = hh < 12 ? "AM" : "PM";
  hh = hh % 12 || 12;
  const mm = String(d.getMinutes()).padStart(2, "0"), ss = String(d.getSeconds()).padStart(2, "0");
  return `${hh}:${mm}${secs ? ":" + ss : ""} ${ap}`;
};
S.sameDay = (a, b) => { const x = new Date(a), y = new Date(b); return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate(); };
// "Nov 5" this year, "Nov 5, 2025" another year
S.day = (t, now) => {
  const d = new Date(t), day = `${MON[d.getMonth()]} ${d.getDate()}`;
  return d.getFullYear() === new Date(now || Date.now()).getFullYear() ? day : `${day}, ${d.getFullYear()}`;
};
// "3:04 PM" today, "yesterday 3:04 PM", "Nov 5, 3:04 PM", "Nov 5, 2025, 3:04 PM"
S.when = (t, secs, now) => {
  if (!t) return "";
  now = now || Date.now();
  if (S.sameDay(t, now)) return S.clock(t, secs);
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (S.sameDay(t, y)) return "yesterday " + S.clock(t, secs);
  return `${S.day(t, now)}, ${S.clock(t, secs)}`;
};
S.plural = (n, w, ws) => `${n} ${n === 1 ? w : ws || w + "s"}`;
// how long ago, one unit: "just now", "5 minutes ago", "3 hours ago", "yesterday", "12 days ago", "4 months ago", "2 years ago"
S.ago = (t, now) => {
  if (!t) return "";
  const s = Math.max(0, ((now || Date.now()) - t) / 1000);
  if (s < 90) return "just now";
  if (s < 3600) return S.plural(Math.round(s / 60), "minute") + " ago";
  if (s < 86400) return S.plural(Math.round(s / 3600), "hour") + " ago";
  const days = Math.round(s / 86400);
  if (days === 1) return "yesterday";
  if (days < 60) return S.plural(days, "day") + " ago";
  if (days < 700) return S.plural(Math.round(days / 30.4), "month") + " ago";
  return S.plural(Math.round(days / 365.25), "year") + " ago";
};
// minutes as time spent: "0 min", "45 min", "2 h 5 min", "31 h"
S.mins = (m) => {
  m = Math.max(0, Math.round(m || 0));
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60;
  return h >= 20 || !r ? h + " h" : `${h} h ${r} min`;
};
// a length of time in plain words, the two biggest units: "2 minutes 31 seconds", "45 seconds", "1 hour 5 minutes"
S.span = (ms) => {
  const s = Math.max(0, Math.round(ms / 1000));
  const units = [[86400, "day"], [3600, "hour"], [60, "minute"], [1, "second"]];
  for (let i = 0; i < units.length; i++) {
    const [n, w] = units[i];
    if (s < n && n > 1) continue;
    let k = Math.floor(s / n);
    if (n === 1) return S.plural(k, w);
    const [n2, w2] = units[i + 1];
    let r = Math.round((s - k * n) / n2);
    if (r * n2 >= n) { k++; r = 0; }
    return S.plural(k, w) + (r ? " " + S.plural(r, w2) : "");
  }
  return "0 seconds";
};
S.mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
// a size, as Windows counts it (1 GB = 1024 MB): "0 KB", "340 KB", "96 MB", "1.2 GB", "331 GB"
S.bytes = (n) => {
  n = Number(n) || 0;
  if (n < 1024) return n ? "1 KB" : "0 KB";
  const units = ["KB", "MB", "GB", "TB"];
  let v = n / 1024, i = 0;
  while (v >= 1000 && i < units.length - 1) { v /= 1024; i++; }
  return (v >= 10 || i === 0 ? Math.round(v) : Math.round(v * 10) / 10) + " " + units[i];
};
// a reason as a sentence: a full stop at the end, and a capital at the start when it begins with a plain word
// (relay-client's own reasons do: "could not reach the PC…"). A reason from the PC that begins with a person's name
// keeps it as it is ("jon has no password: …").
const PLAIN = /^(the|this|that|these|those|not|no|nothing|too|could|sign-in|checking|connected|a|an|it|its|there|only)\b/;
S.sentence = (s) => { s = String(s || "").trim(); if (!s) return ""; if (PLAIN.test(s)) s = s[0].toUpperCase() + s.slice(1); return /[.!?…]\)?$/.test(s) ? s : s + "."; };

// copy text; true when it worked
S.copy = async (text) => {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const t = S.h("textarea", { value: text, style: "position:fixed;left:-9999px;top:0" });
    document.body.append(t); t.select();
    const ok = document.execCommand("copy");
    t.remove();
    return ok;
  } catch (e) { return false; }
};

// a small message beside a control: S.say(el, "Saved.", "ok" | "bad" | "")
S.say = (el, text, kind) => { if (!el) return; el.textContent = text || ""; el.className = "say" + (kind ? " " + kind : ""); };

// The page's names for kinds of people
S.KIND = { main: "Main admin", admin: "Admin", user: "User", guest: "Guest", visitor: "Visitor" };
S.KINDS = { main: "Main admin", admin: "Admins", user: "Users", guest: "Guests", visitor: "Visitors" };

// The six sections register themselves here (app.js draws the ones the person has the right to):
// S.section({ id, name, icon, needs: "<flag>", make(el), show(), hide() })
S.sections = [];
S.section = (def) => { S.sections.push(def); return def; };

// do something every so often while it is wanted (the page showing, the section open), never two at once:
// const stop = S.every(5000, fn, () => wanted);  the first run is at once
S.every = (ms, fn, wanted) => {
  let stopped = false, running = false, timer = 0;
  const tick = async () => {
    if (stopped) return;
    if (!running && document.visibilityState === "visible" && (!wanted || wanted())) {
      running = true;
      try { await fn(); } catch (e) { console.error(e); } finally { running = false; }
    }
    if (!stopped) timer = setTimeout(tick, ms);
  };
  tick();
  return () => { stopped = true; clearTimeout(timer); };
};

// ---- pc.js ----
// pc.js: the PC, through PC Relay 3 (relay-client.js 3, copied in at build time from pc-relay\client: one source,
// never edited here). Shared by the two pages. The PC decides every request; a page only shows buttons.
//
// Two doors (CONTRACT 14):
//   - in a browser: the address comes from relay.json beside the programs (relay-client reads it), and the person is
//     whoever this browser is signed in as;
//   - in PC Relay's own window: the page is served by the relay's local door on 127.0.0.1, where the caller is the
//     main admin. The copy built for the window (pc-relay\panel: the same page with one <meta> more) asks its own
//     address for /relay/me, and on "local": true makes its client with base = that door. Only there do the
//     /local/... requests work (S.pc.local).
"use strict";
(function () {
  const notes = [];
  const P = (S.pc = {
    R: null,           // the RelayClient
    door: false,       // true in PC Relay's own window (the local door)
    who: null,         // the last me(): { ok, account, can, programs, network, limited, local }
    info: null,        // the last ping's answer
    last: null,        // the last ping: { ok, at, ms, why, kind, status }
    offset: 0,         // the PC's clock minus this device's (from the quickest ping), ms
    best: Infinity,
    notes,
    SITE: "https://jonnystokes.github.io/cooltools/",   // the public site, for a page that runs elsewhere (the window)

    async init(app) {
      P.door = await atDoor();
      P.R = RelayClient.create({ app: app || "settings", base: P.door ? location.origin : "", log: (text) => { notes.push({ at: Date.now(), text }); if (notes.length > 200) notes.shift(); } });
      P.R.on("account", (a) => S.emit("account", a));
      P.R.on("status", (st) => S.emit("status", st));
      return P;
    },
    name: () => P.R.pcName(),
    account: () => (P.who && P.who.account) || P.R.account(),
    can: (flag) => !!(P.who && P.who.ok && P.who.can.includes(flag)),
    isMain: () => P.door || !!(P.who && P.who.account && P.who.account.kind === "main"),
    // any admin right at all (else the person gets the account page)
    anyAdmin: () => ["settings.admin", "users.manage", "pc.control"].some(P.can),
    pcNow: () => Date.now() + P.offset,

    async ping(timeout) {
      const t0 = Date.now();
      const r = await P.R.ping(timeout || 8000);
      const at = Date.now();
      P.last = { ok: !!r.ok, at, ms: r.ok ? r.latency : at - t0, why: r.why || "", kind: r.kind || "", status: r.status || 0 };
      if (r.info) P.info = r.info;
      if (r.ok && r.info && r.latency <= P.best + 5 && r.info.time) { P.best = Math.min(P.best, r.latency); P.offset = r.info.time - (at - r.latency / 2); }
      S.emit("ping", P.last);
      return r;
    },
    // who am I, and what may I do (asked again on every account change: relay-client's can() says no until then)
    async me() {
      const r = await P.R.me();
      P.who = r;
      S.emit("me", r);
      return r;
    },
    // one of the relay's own requests: { ok, status, data, why, kind }
    api: (path, opts) => P.R.api(path, opts),
    post: (path, json) => P.R.api(path, { method: "POST", json }),
    // the files service: { ok, status, data, why, kind }
    files: (path, opts) => P.R.call("files", path, Object.assign({ timeout: 15000 }, opts || {})),
    // a person's picture (anyone may read it; no picture answers 404, and the page draws the initial)
    picture(id) {
      let v = "";
      try { v = localStorage.getItem("relay-picture") || ""; } catch (e) {}
      return P.R.base && id ? `${P.R.base}/svc/files/picture/${encodeURIComponent(id)}${v ? "?v=" + encodeURIComponent(v) : ""}` : "";
    },
    // what only the computer may do: /local/<path> at the local door. Anywhere else it answers at once.
    async local(path, json, timeout) {
      if (!P.door) return { ok: false, status: 0, data: null, why: "Only at the computer.", kind: "at-the-pc" };
      const ac = new AbortController(), ms = timeout || 30000, timer = setTimeout(() => ac.abort(), ms);
      try {
        const r = await fetch("/local/" + path, { method: json === undefined ? "GET" : "POST", cache: "no-store", signal: ac.signal,
          headers: json === undefined ? {} : { "Content-Type": "application/json" }, body: json === undefined ? undefined : JSON.stringify(json) });
        let data = null;
        try { data = await r.json(); } catch (e) {}
        if (r.ok) return { ok: true, status: r.status, data, why: "", kind: "" };
        const why = (data && data.why) || (r.status === 404 ? "This PC Relay does not know that request." : RelayClient.httpWhy(r.status));
        return { ok: false, status: r.status, data, why, kind: (data && data.kind) || "http" };
      } catch (e) {
        return { ok: false, status: 0, data: null, why: e && e.name === "AbortError" ? `PC Relay did not answer within ${Math.round(ms / 1000)} s.` : "PC Relay did not answer.", kind: "network" };
      } finally { clearTimeout(timer); }
    },
  });

  // In PC Relay's own window? Only the copy built for the window asks (build.py marks it with one <meta>, in
  // pc-relay\panel), and only on 127.0.0.1 or localhost: the copy on the site never asks anything of its own address.
  async function atDoor() {
    if (!document.querySelector('meta[name="pc-relay-window"]')) return false;
    if (location.protocol !== "http:" || !/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) return false;
    const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 2500);
    try {
      const r = await fetch("/relay/me", { cache: "no-store", headers: { "X-Relay-Client": "settings/3" }, signal: ac.signal });
      if (!r.ok) return false;
      const j = await r.json();
      return !!(j && j.local === true);
    } catch (e) { return false; }
    finally { clearTimeout(timer); }
  }
})();

// ---- ui.js ----
// ui.js: the few pieces every screen is made of (shared by the two pages): a person's picture, a switch, a row with a
// label and one short line, the More fold, the "Only at the computer" line, a small menu, and the one confirmation
// (before deleting).
"use strict";
(function () {
  const { h } = S;

  // ---- a person's picture, or their initial ----
  // Each account is asked for its picture once (the answer is remembered while the page lives, and asked again when
  // someone changes a picture: localStorage "relay-picture" is the mark the account page sets).
  const seen = new Map();   // account id -> "has" | "none"
  let stamp = "";
  const mark = () => { try { return localStorage.getItem("relay-picture") || ""; } catch (e) { return ""; } };
  // A guest's circle shows "G" on every page (the main agent's rule, 2026-11-12: the Apps menu and the Cloud File
  // Manager already did; here it was the guest's number). The name beside it says which guest.
  S.initial = (a) => {
    const n = String((a && a.name) || "").trim();
    if (a && a.kind === "guest") return "G";
    return n ? Array.from(n)[0].toUpperCase() : "?";
  };
  S.avatar = (a, size) => {
    const el = h("span.avatar", { "aria-hidden": "true" });
    if (size) el.style.setProperty("--av", size + "px");
    if (a && a.kind === "guest") el.classList.add("guest");
    if (a && (a.id === "visitors" || a.kind === "visitor")) { el.classList.add("guest"); el.append(S.icon("person")); return el; }
    el.append(h("span.letter", { text: S.initial(a) }));
    const id = a && a.id;
    if (mark() !== stamp) { stamp = mark(); seen.clear(); }
    const url = id ? S.pc.picture(id) : "";
    if (!url || seen.get(id) === "none") return el;
    const img = h("img", { alt: "", decoding: "async" });
    img.addEventListener("load", () => { seen.set(id, "has"); el.classList.add("has"); });
    img.addEventListener("error", () => { seen.set(id, "none"); img.remove(); });
    img.src = url;
    el.append(img);
    return el;
  };
  S.forgetPictures = () => { seen.clear(); };

  // ---- a switch (role="switch"): S.toggle(label, on, change(newValue) -> Promise) ----
  S.toggle = (label, on, change, opts = {}) => {
    const b = h("button.switch", { type: "button", role: "switch", "aria-checked": String(!!on), "aria-label": label, disabled: !!opts.disabled });
    b.append(h("span.knob"));
    b.addEventListener("click", async () => {
      if (b.disabled) return;
      const want = b.getAttribute("aria-checked") !== "true";
      b.disabled = true;
      try { await change(want, b); } finally { b.disabled = !!opts.disabled; }
    });
    return b;
  };
  S.setToggle = (b, on) => { if (b) b.setAttribute("aria-checked", String(!!on)); };

  // ---- a row: a label, at most one short line under it, the control at the right ----
  S.row = (label, help, ...ctl) => {
    const r = h("div.row", h("div.rl", h("div.rn", { text: label }), help ? h("div.rh", { text: help }) : null), h("div.rc", ...ctl));
    return r;
  };
  S.setHelp = (row, text) => {
    let e = row.querySelector(".rh");
    if (!text) { if (e) e.remove(); return; }
    if (!e) { e = h("div.rh"); row.querySelector(".rl").append(e); }
    e.textContent = text;
  };

  // ---- the More fold: closed until asked for; its line says what is inside ----
  S.more = (inside, ...kids) => {
    const d = h("details.more", h("summary", h("span.mt", { text: "More" }), inside ? h("span.mh", { text: inside }) : null), h("div.morebody", ...kids));
    return d;
  };

  // ---- "Only at the computer": a control that works only in PC Relay's own window rests anywhere else ----
  // S.pcOnly(row) marks a row (its buttons, switches and boxes rest) and gives it the line; returns true when resting.
  S.ONLY = "Only at the computer";
  S.pcOnly = (row) => {
    if (S.pc.door) return false;
    row.classList.add("resting");
    for (const c of row.querySelectorAll("button, input, select")) c.disabled = true;
    const l = row.querySelector(".rl") || row;
    if (!l.querySelector(".only")) l.append(h("div.only", { text: S.ONLY }));
    return true;
  };
  // the same for something the person has no right to: S.notYours(row, "Only the main admin")
  S.notYours = (row, why) => {
    row.classList.add("resting");
    for (const c of row.querySelectorAll("button, input, select")) c.disabled = true;
    const l = row.querySelector(".rl") || row;
    if (!l.querySelector(".only")) l.append(h("div.only", { text: why }));
  };

  // ---- a small menu under a button: S.menu(button, [{ text, pick }]) ----
  let openMenu = null;
  const closeMenu = () => { if (openMenu) { openMenu.el.remove(); openMenu.btn.setAttribute("aria-expanded", "false"); openMenu = null; } };
  S.closeMenu = closeMenu;
  S.menu = (btn, build) => {
    btn.setAttribute("aria-haspopup", "true");
    btn.setAttribute("aria-expanded", "false");
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (openMenu && openMenu.btn === btn) { closeMenu(); return; }
      closeMenu();
      const el = h("div.menu", { role: "menu" });
      const content = build(closeMenu);
      for (const it of Array.isArray(content) ? content : [content]) {
        if (it instanceof Node) el.append(it);
        else el.append(h("button", { type: "button", role: "menuitem", text: it.text, disabled: !!it.disabled, on: { click: () => { closeMenu(); it.pick(); } } }));
      }
      document.body.append(el);
      const r = btn.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
      el.style.left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - w - 8)) + "px";
      el.style.top = (r.bottom + hh + 8 > innerHeight && r.top - hh - 6 > 0 ? r.top + scrollY - hh - 6 : r.bottom + scrollY + 6) + "px";
      btn.setAttribute("aria-expanded", "true");
      openMenu = { el, btn };
      const first = el.querySelector("button:not(:disabled), input, select");
      if (first) first.focus({ preventScroll: true });
    });
  };
  document.addEventListener("click", (e) => { if (openMenu && !openMenu.el.contains(e.target)) closeMenu(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openMenu) { const b = openMenu.btn; closeMenu(); e.preventDefault(); b.focus(); } });
  addEventListener("resize", closeMenu);

  // ---- the one confirmation: before deleting. Resolves true only on the Delete button. ----
  S.confirmDelete = (title, line, word) => new Promise((resolve) => {
    const dlg = h("dialog.confirm", { "aria-label": title });
    const done = (v) => { if (dlg.open) dlg.close(); dlg.remove(); resolve(v); };
    const no = h("button", { type: "button", text: "Cancel", on: { click: () => done(false) } });
    const yes = h("button.danger", { type: "button", text: word || "Delete", on: { click: () => done(true) } });
    dlg.append(h("h2", { text: title }), line ? h("p", { text: line }) : null, h("div.btns", no, yes));
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); done(false); });
    dlg.addEventListener("click", (e) => { if (e.target === dlg) done(false); });
    document.body.append(dlg);
    dlg.showModal();
    no.focus();
  });

  // ---- a coloured dot with a word: the state of something (green fine, amber look, red broken, grey off) ----
  S.state = (kind, text) => h("span.state." + (kind || "off"), h("span.dot"), h("span", { text }));
})();

// ---- account.js ----
// account.js: the account page (CONTRACT 13): one page that every program shows in the window kit's window, the Apps
