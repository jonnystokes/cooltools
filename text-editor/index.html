<style>
  /* The look: one set of colours (light-dark() with the Look setting on <html data-theme>), sizes from --ui (bars,
     buttons, windows) and --text (the text being written). The search pop-up and the floating window use the same
     names (--bg --fg --muted --line --bar --accent --ui --tap). Blue is this program's accent; green, amber, red and
     grey belong to the cloud indicator (WEB-APP-CONVENTIONS.md 1). */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#fbfbf9, #14171d);
    --paper: light-dark(#ffffff, #1b1f27);
    --fg: light-dark(#1d2230, #e4e7ee);
    --muted: light-dark(#5d6577, #9aa3b5);
    --line: light-dark(#dcdfe6, #2c323d);
    --bar: light-dark(#f1f2f5, #1a1e26);
    --accent: light-dark(#2457d6, #7aa2ff);
    --accent-ink: light-dark(#ffffff, #0d1630);
    --mark: color-mix(in srgb, var(--accent) 26%, transparent);
    --mark-now: color-mix(in srgb, var(--accent) 55%, transparent);
    --ui: 16px;
    --text: 17px;
    --tap: calc(2.75 * var(--ui));
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
  body { margin: 0; height: 100%; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: var(--ui)/1.4 var(--sans); }
  button, input, select { font: inherit; color: inherit; }

  /* The bar: the Apps button first, the file's name, the few buttons, the cloud indicator last. */
  .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px max(10px, 2vw); background: var(--bar); border-bottom: 1px solid var(--line); }
  .top apps-button { --apps-h: var(--tap); --apps-sep: var(--line); }
  .name { flex: 0 1 18em; min-width: 7em; min-height: var(--tap); padding: 0 0.5em; border: 1px solid transparent; border-radius: 8px; background: transparent;
    font-weight: 650; font-size: 1.05em; text-overflow: ellipsis; }
  .name:hover { border-color: var(--line); }
  .name:focus { border-color: var(--accent); background: var(--paper); outline: none; }
  .top button { min-height: var(--tap); padding: 0 1em; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; line-height: 1; }
  .top button:not(:disabled):hover { border-color: var(--accent); }
  .top button:disabled { opacity: 0.45; cursor: default; }
  .top button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .top button.icon { min-width: var(--tap); padding: 0; }
  .top button.icon svg { width: 1.3em; height: 1.3em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; vertical-align: middle; }
  .top button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--paper)); }
  .grow { flex: 1; }
  .top cloud-status { flex: 0 1 auto; max-width: 16em; }
  @media (max-width: 640px) {
    .top { gap: 5px; padding: 6px 8px; }
    .name { order: 9; flex: 1 1 8em; }
    .top #find, .top #more, .top cloud-status { order: 10; }
    .top button { padding: 0 0.8em; }
    .top cloud-status { max-width: 1.7em; overflow: hidden; white-space: nowrap; }
  }

  /* One quiet line under the bar: where the file is and whether it is saved; a button when there is something to do. */
  .info { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 5px max(12px, 2vw); min-height: 2.2em; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 0.92em; }
  .info .where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .info .state { color: var(--fg); }
  .info .state.unsaved { font-weight: 700; }
  .info .state.unsaved::before { content: ""; display: inline-block; width: 0.55em; height: 0.55em; margin-right: 0.4em; border-radius: 50%; background: var(--accent); vertical-align: 0.05em; }
  .info .say { color: var(--fg); }
  .info button { min-height: calc(var(--tap) * 0.8); padding: 0 0.9em; border: 1px solid var(--accent); border-radius: 999px; background: var(--paper); color: var(--accent); font-weight: 650; cursor: pointer; }

  /* The text: a plain textarea over a layer that draws the search's marks in the same place. */
  .ed { flex: 1; min-height: 0; position: relative; padding: 10px max(10px, 2vw) 0; }
  .ed textarea, .ed .back { font: var(--text)/1.55 var(--font, var(--sans)); padding: 14px 16px; tab-size: 4; letter-spacing: normal; word-spacing: normal; }
  .ed textarea { display: block; width: 100%; height: 100%; margin: 0; border: 1px solid var(--line); border-radius: 10px 10px 0 0; border-bottom: 0;
    background: transparent; color: var(--fg); resize: none; outline: none; position: relative; z-index: 1; overflow-wrap: break-word; }
  .ed textarea:focus { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .ed .paper { position: absolute; inset: 10px max(10px, 2vw) 0; background: var(--paper); border-radius: 10px 10px 0 0; }
  .ed .back { position: absolute; overflow: hidden; white-space: pre-wrap; overflow-wrap: break-word; color: transparent; pointer-events: none; z-index: 0; }
  .ed.nowrap .back { white-space: pre; overflow-wrap: normal; }
  .ed .back mark { color: transparent; background: var(--mark); border-radius: 3px; }
  .ed .back mark.now { background: var(--mark-now); box-shadow: 0 0 0 2px var(--accent); }

  .foot { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px max(12px, 2vw) calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--bar); border-top: 1px solid var(--line); color: var(--muted); font-size: 0.88em; }

  /* The ⋯ menu, and the see-through layer under it: a press off the menu only closes it (WEB-APP-CONVENTIONS.md 11). */
  .shield { position: fixed; inset: 0; z-index: 199; background: transparent; }
  .menu { position: fixed; z-index: 200; min-width: 15em; padding: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3); }
  .menu button { display: block; width: 100%; text-align: left; min-height: var(--tap); padding: 0 0.9em; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
  .menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }

  /* The question before leaving changes behind (only after the person's own New or Open). */
  .ask { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.35); }
  .ask > div { width: min(26em, 100%); padding: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); }
  .ask h2 { margin: 0 0 6px; font-size: 1.1em; }
  .ask p { margin: 0 0 14px; color: var(--muted); }
  .ask .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .ask button { min-height: var(--tap); padding: 0 1.1em; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; }
  .ask button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }

  /* The look window (⋯ → Text size, font and look). */
  .view { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
  .view h3 { margin: 0 0 6px; font-size: 1em; }
  .view .seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .view .seg button { min-height: var(--tap); min-width: var(--tap); padding: 0 0.9em; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; }
  .view .seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--paper)); font-weight: 650; }
  .view .size { min-width: 4.5em; text-align: center; font-weight: 650; }
  @media print { .top, .info, .foot { display: none; } }
</style>
</head>
<body>
<header class="top" id="top">
  <apps-button app="text-editor"></apps-button>
  <input class="name" id="name" aria-label="File name (click to change it)" title="The file's name: click to change it" maxlength="120" autocomplete="off" spellcheck="false">
  <button type="button" id="new" title="A new, empty text">New</button>
  <button type="button" id="open" title="Open a text file from the Cloud File Manager or this device (Ctrl+O)">Open</button>
  <button type="button" id="save" class="primary" title="Save (Ctrl+S)">Save</button>
  <button type="button" id="find" class="icon" title="Search and replace (Ctrl+F)" aria-label="Search and replace" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
  <button type="button" id="more" class="icon" title="More" aria-label="More" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  <span class="grow"></span>
  <cloud-status></cloud-status>
</header>
<div class="info" id="info" role="status"><span class="where" id="where"></span><span class="state" id="state"></span><span class="say" id="say"></span><span id="acts"></span></div>
<main class="ed" id="ed">
  <div class="paper"></div>
  <div class="back" id="back" aria-hidden="true"></div>
  <textarea id="text" aria-label="Text" spellcheck="true" autocapitalize="sentences"></textarea>
</main>
<footer class="foot" id="foot"><span id="pos"></span><span id="count"></span><span id="kind"></span></footer>
<script>
/* relay-client.js 3: the PC Relay client (ONE source: Projects\pc-relay\client\relay-client.js; each page's build
   copies it in, so never edit a copy). Talks to PC Relay 3 (accounts) on Jon's PC. The relay decides every request;
   this file carries the pass, remembers who this browser is, and says plainly what the PC answered.
   The exact requests: Projects\cool-tools-upgrade\API-relay.md.

   - Nothing happens until the page calls something: no background traffic of its own (seen() is the page's call).
   - The PC's address: read from relay.json beside the programs ("../relay.json" from a program's page, or
     opts.addressFile), fresh before the first connection and again after a failed one (at most once a minute).
     {"address": "https://..."}; http only for 127.0.0.1 and localhost (the stage). No address is built in: if the file
     cannot be read the cloud is simply off, with a plain reason (status "off", where.why). opts.base names the address
     instead (tests, the relay's own window on the local door).
   - Kept in this browser (localStorage, shared by every page of the site): "relay-pass" ({pass, device, at}) and
     "relay-account" ({id, name, kind, number, at}), so the name shows at once, even with the cloud off. Another tab's
     sign-in, sign-out or change arrives as an "account" event.
   - The pass goes in the X-Relay-Pass header (HTTP) or the WebSocket subprotocol "pass.<p>"; never in a URL.
   - When the PC says the pass is not valid any more (X-Relay-Info: pass-unknown, or the ping's pass "unknown"), the
     pass and the account are forgotten and "account" fires with null. me() forgets them only on a whole answer that
     says {account: null}. An answer cut off, garbled or late, a timeout or a network error never ends a sign-in:
     it is a result with ok false and kind "network" or "timeout".
   - Errors from the relay are { why, kind }; every result here carries why and kind.

   const R = RelayClient.create({ app: "plan-cutter", log });
   await R.ping();                 // { ok, latency, info }
   R.account();                    // at once, from this browser: { id, name, kind, number } or null
   await R.me();                   // from the PC: { ok, account, can, programs, network, limited }
   R.can("files.shared.change");  R.canUse("voice");      // from the last me()
   await R.accountsHere();         // { ok, accounts: [{ id, name, kind, number, picture, hasPassword }] }
   await R.signIn(name, password); // { ok, kind, why, account }
   await R.signOut();              // { ok }
   await R.guest();                // { ok, account }  (a guest for this browser; itself when it has an account)
   await R.setup({ name, password });   // { ok, kind, why, account }
   await R.update({ name, password });  // { ok, kind, why, account }   (password: null removes it)
   R.seen();                       // "this app is open" (call once a minute while the page is visible)
   R.on("account", fn);            // fn(account or null)
   R.on("status", fn);             // fn({ state: checking|connected|off|offline|starting|ready|reload, why })
   await R.api("people");          // any /relay/ request: { ok, status, data, why, kind }
   R.call, R.fetch, R.url, R.ws, R.open, R.pcName, R.address, R.watch     // as in relay-client 2
*/
(function (root) {
  "use strict";
  const VERSION = 3;
  const RECHECK_MS = 60000, ADDRESS_MS = 6000;
  const PASS_KEY = "relay-pass", ACCOUNT_KEY = "relay-account", NAME_KEY = "relay-pc-name", YOUR_PC = "your PC";
  const trim = (u) => String(u || "").trim().replace(/\/+$/, "");
  const goodAddress = (a) =>
    /^https:\/\/[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:\d{1,5})?$/i.test(a) ||
    /^http:\/\/(127\.0\.0\.1|localhost)(:\d{1,5})?$/i.test(a);
  const store = {
    get(k) { try { return root.localStorage.getItem(k) || ""; } catch (e) { return mem[k] || ""; } },
    set(k, v) {
      try { if (v) root.localStorage.setItem(k, v); else root.localStorage.removeItem(k); }
      catch (e) { if (v) mem[k] = v; else delete mem[k]; }
    },
  };
  const mem = {}; // when localStorage is not available (a sandboxed page): this page only
  const json = (k) => { try { const j = JSON.parse(store.get(k) || "null"); return j && typeof j === "object" ? j : null; } catch (e) { return null; } };
  const cleanName = (n) => (typeof n === "string" ? Array.from(n.replace(/[\x00-\x1f\x7f-\x9f]/g, "").trim()).slice(0, 64).join("").trim() : "");
  const shortAcct = (a) => (a && a.id ? { id: a.id, name: String(a.name || ""), kind: String(a.kind || ""), number: a.number || 0 } : null);

  function httpWhy(status) {
    return ({ 400: "the PC refused that request", 401: "sign-in needed", 403: "not allowed", 404: "not found on the PC",
      409: "that clashes with something on the PC", 410: "this page is out of date: reload it", 426: "this page is out of date: reload it",
      429: "too many requests: wait a minute", 502: "the program on the PC did not answer", 503: "the PC said it is busy or switched off" })[status] || `the PC answered ${status}`;
  }
  function netWhy(err, ms) {
    if (err && err.name === "AbortError") return `no answer from the PC within ${Math.round(ms / 1000)} s`;
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "this device is offline";
    return "could not reach the PC (no network, or the PC is off or asleep)";
  }
  function netKind(err) {
    if (err && err.name === "AbortError") return "timeout";
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "offline";
    return "network";
  }
  const kindOf = (status) => status === 401 ? "signin" : status === 426 || status === 410 ? "reload" : "http";

  class Relay {
    constructor(opts) {
      opts = opts || {};
      this.app = String(opts.app || "page").toLowerCase().replace(/[^a-z0-9-]/g, "");
      this.log = typeof opts.log === "function" ? opts.log : null;
      this.addressFile = opts.addressFile || "";
      this.status = { state: "idle", why: "", at: Date.now() };
      this.info = null;
      this.latency = 0;
      this.bytes = 0;
      this._me = null;
      this._subs = { status: new Set(), account: new Set() };
      this._job = null;
      this._readAt = 0;
      this._acctSeen = JSON.stringify(shortAcct(json(ACCOUNT_KEY)));
      this._setBase(opts.base);
      if (typeof opts.onStatus === "function") this._subs.status.add(opts.onStatus);
      if (typeof addEventListener === "function") {
        addEventListener("storage", (e) => { if (!e || e.key === ACCOUNT_KEY || e.key === PASS_KEY || e.key === null) this._acctChanged(); });
      }
    }
    // ---- the PC's address ---------------------------------------------------------------------------------------
    _setBase(url) {
      this.given = trim(url);
      this.base = this.given;
      this.where = this.given ? { url: this.given, from: "page", why: "" } : { url: "", from: "unread", why: "" };
      this._readAt = 0;
    }
    setBase(url) { if (trim(url) !== this.given) this._setBase(url); }
    _fileUrl() {
      if (this.addressFile) return this.addressFile;
      try { return new URL("../relay.json", root.location.href).href; } catch (e) { return "../relay.json"; }
    }
    async address() { await this._ready(); return this.where; }
    async _ready() {
      if (this.given) return;
      const w = this.where.from;
      if (w === "unread" || (w === "none" && Date.now() - this._readAt >= RECHECK_MS)) await this._read();
    }
    _read() {
      if (!this._job) this._job = this._readNow().finally(() => { this._job = null; });
      return this._job;
    }
    async _recheck() {
      if (this.given || this._job || Date.now() - this._readAt < RECHECK_MS) return false;
      const was = this.base;
      await this._read();
      return this.base !== was;
    }
    async _readNow() {
      this._readAt = Date.now();
      const file = this._fileUrl(), was = this.where;
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ADDRESS_MS);
      let why = "";
      try {
        const sep = file.includes("?") ? "&" : "?";
        const r = await fetch(`${file}${sep}t=${Date.now()}`, { cache: "no-store", credentials: "omit", signal: ac.signal });
        if (!r.ok) throw new Error(`the site answered ${r.status}`);
        const j = await r.json().catch(() => null);
        const a = trim(j && j.address);
        if (!goodAddress(a)) throw new Error(j ? "it holds no usable address" : "it is not JSON");
        if (this.given) return;
        this.base = a;
        this.where = { url: a, from: "file", why: "" };
        if (was.url !== a) this._note(`the PC's address: ${a} (from ${file})`, false);
        return;
      } catch (e) {
        why = e && e.name === "AbortError" ? `no answer within ${ADDRESS_MS / 1000} s`
          : typeof navigator !== "undefined" && navigator.onLine === false ? "this device is offline"
          : e && e.name === "TypeError" ? "the site could not be reached"
          : String((e && e.message) || e);
      } finally { clearTimeout(timer); }
      if (this.given || was.from === "file") return; // read fine earlier in this page's life: that address stays
      const text = `the PC's address (${file}) could not be read (${why}): the cloud is off`;
      this.base = "";
      this.where = { url: "", from: "none", why: text };
      if (was.why !== text) this._note(text, true);
    }
    _note(text, warn) {
      if (this.log) { try { this.log(text); } catch (e) {} }
      try { if (typeof console !== "undefined") (warn ? console.warn : console.info)("relay-client: " + text); } catch (e) {}
    }
    // ---- events ----
    on(what, fn) {
      if (typeof what === "function") { fn = what; what = "status"; }
      const set = this._subs[what];
      if (!set || typeof fn !== "function") return () => {};
      set.add(fn);
      return () => set.delete(fn);
    }
    _set(state, extra) {
      this.status = Object.assign({ state, why: "", at: Date.now() }, extra || {});
      for (const f of this._subs.status) { try { f(this.status); } catch (e) {} }
    }
    _acctChanged() {
      const now = JSON.stringify(this.account());
      if (now === this._acctSeen) return;
      this._acctSeen = now;
      const a = this.account();
      // another person (or nobody) now: the rights the last me() gave are not theirs; can() says no until me() is asked again
      if (!a || !this._me || !this._me.account || this._me.account.id !== a.id) this._me = null;
      for (const f of this._subs.account) { try { f(a); } catch (e) {} }
    }
    // ---- the pass and the account, kept in this browser ----
    _pass() { const r = json(PASS_KEY); return r && typeof r.pass === "string" ? r.pass : ""; }
    _keep(pass, account) {
      if (pass !== undefined) store.set(PASS_KEY, pass ? JSON.stringify({ pass, at: Date.now() }) : "");
      if (account !== undefined) store.set(ACCOUNT_KEY, account ? JSON.stringify(Object.assign(shortAcct(account), { at: Date.now() })) : "");
      this._acctChanged();
    }
    _forget(why) {
      if (!this._pass() && !this.account()) return;
      this._me = null;
      this._keep("", null);
      this._note("this browser's sign-in ended on the PC" + (why ? ` (${why})` : ""), false);
    }
    // An answer speaks only about the pass its request carried. While it was on its way, another tab of this browser
    // may have signed in or switched user: the browser then holds a new pass, and an answer about the old one ("pass
    // unknown", "no account", an older account) must not wipe or overwrite the new sign-in. _current(sent) says whether
    // the pass sent is still the one kept.
    _current(sent) { return sent === this._pass(); }
    _info(r, sent) { // every answer: the PC may say the pass is not valid any more
      const i = (r.headers && r.headers.get("X-Relay-Info")) || "";
      if (/pass-unknown/.test(i) && this._current(sent)) this._forget("the PC does not know it");
    }
    account() { return shortAcct(json(ACCOUNT_KEY)); }
    signedIn() { return !!this._pass(); }
    can(flag) { return !!(this._me && this._me.can.includes(flag)); }
    canUse(prog) { return prog === "files" || !!(this._me && this._me.programs.includes(prog)); }
    headers(extra) {
      const h = { "X-Relay-Client": this.app + "/" + VERSION };
      const p = this._pass();
      if (p) h["X-Relay-Pass"] = p;
      return Object.assign(h, extra || {});
    }
    // ---- addresses ----
    url(service, path) { return `${this.base}/svc/${service}/${String(path || "").replace(/^\/+/, "")}`; }
    wsUrl(service, path) { return this.url(service, path).replace(/^http/, "ws"); }
    wsProtocols() { const p = this._pass(); return p ? ["relay", "pass." + p] : ["relay"]; }
    ws(service, path) { return new WebSocket(this.wsUrl(service, path), this.wsProtocols()); }
    _off() { return { ok: false, status: 0, data: null, why: this.where.why || "the cloud is off", kind: "off" }; }
    // fetch through the relay: a Response (throws when the PC cannot be reached, or the address is not known)
    async fetch(service, path, opts) {
      opts = Object.assign({}, opts || {});
      const timeout = opts.timeout || 0; delete opts.timeout;
      await this._ready();
      if (!this.base) throw new TypeError(this.where.why || "the cloud is off");
      const sent = this._pass();
      opts.headers = this.headers(opts.headers);
      let timer = 0, ac = null;
      if (timeout && !opts.signal) { ac = new AbortController(); opts.signal = ac.signal; timer = setTimeout(() => ac.abort(), timeout); }
      try {
        const r = await fetch(this.url(service, path), opts);
        this._info(r, sent);
        return r;
      } catch (err) {
        if (ac || !(opts.signal && opts.signal.aborted)) this._recheck().catch(() => {});
        throw err;
      } finally { clearTimeout(timer); }
    }
    // _result: an answer read whole. A body that cannot be read (the page left, the connection dropped, a timeout
    // while reading) or a 2xx body that is not whole JSON is NOT ok: kind "network" (or "timeout"). Only a real,
    // whole answer from the PC may say anything about the sign-in (reader agent's find, 2026-11-12).
    async _result(r) {
      let text, cut = null;
      try { text = await r.text(); } catch (err) { text = ""; cut = err; }
      this.bytes += text.length;
      let data = null, bad = false;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; bad = true; }
      if (cut || (r.ok && bad)) {
        const kind = cut ? netKind(cut) : "network";
        const why = cut && kind === "timeout" ? "the PC's answer did not arrive in time" : "the PC's answer was cut off: try again";
        return { ok: false, status: r.status, data: null, why, kind, cut: true };
      }
      if (r.ok) return { ok: true, status: r.status, data, why: "", kind: "" };
      const why = (data && (data.why || data.error)) || httpWhy(r.status);
      const kind = (data && data.kind) || kindOf(r.status);
      if (r.status === 426) this._set("reload", { why });
      return { ok: false, status: r.status, data, why, kind, signin: r.status === 401 };
    }
    _body(opts) {
      opts = Object.assign({ cache: "no-store" }, opts || {});
      if (opts.json !== undefined) {
        opts.body = JSON.stringify(opts.json);
        opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
        delete opts.json;
      }
      return opts;
    }
    // call: a program's request with a JSON answer: { ok, status, data, why, kind }
    async call(service, path, opts) {
      opts = this._body(opts);
      const ms = opts.timeout || 0;
      let r;
      try { r = await this.fetch(service, path, opts); }
      catch (err) { return this.base ? { ok: false, status: 0, data: null, why: netWhy(err, ms), kind: netKind(err) } : this._off(); }
      return this._result(r);
    }
    // api: the relay's own request /relay/<path>: { ok, status, data, why, kind, current }. current: this browser
    // still holds the pass the request carried (false: its sign-in changed meanwhile, the answer is about the old one).
    async api(path, opts) {
      opts = this._body(opts);
      const ms = opts.timeout || 15000; delete opts.timeout;
      await this._ready();
      if (!this.base) return this._off();
      const sent = this._pass();
      opts.headers = this.headers(opts.headers);
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ms);
      opts.signal = opts.signal || ac.signal;
      try {
        const r = await fetch(`${this.base}/relay/${String(path).replace(/^\/+/, "")}`, opts);
        this._info(r, sent);
        const res = await this._result(r);
        res.current = this._current(sent);
        return res;
      } catch (err) {
        this._recheck().catch(() => {});
        return { ok: false, status: 0, data: null, why: netWhy(err, ms), kind: netKind(err) };
      } finally { clearTimeout(timer); }
    }
    // ---- the light check ----
    async ping(timeoutMs) {
      timeoutMs = timeoutMs || 8000;
      this._set("checking", { why: "checking the connection…" });
      await this._ready();
      if (!this.base) { const why = this.where.why || "the cloud is off"; this._set("off", { why }); return { ok: false, why, kind: "off" }; }
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), timeoutMs), t0 = performance.now();
      try {
        const sent = this._pass();
        const r = await fetch(`${this.base}/relay/ping?t=${Date.now()}`, { headers: this.headers(), cache: "no-store", signal: ac.signal });
        this._info(r, sent);
        if (!r.ok) { const res = await this._result(r); this._set(r.status === 426 ? "reload" : "offline", { why: res.why }); return { ok: false, why: res.why, kind: res.kind, status: r.status }; }
        const info = await r.json();
        this.latency = Math.round(performance.now() - t0);
        this.info = info;
        const name = cleanName(info && info.name);
        if (name) { this._pc = { base: this.base, name }; this._keepName(this.base, name); }
        if ((info.min_client || 0) > VERSION) { const why = "this page is out of date: reload it"; this._set("reload", { why }); return { ok: false, why, info, kind: "reload" }; }
        if (!this._current(sent)) { /* this browser's sign-in changed while the PC answered: the answer is about the old one */ }
        else if (info.pass === "unknown") this._forget("the PC does not know it");
        else if (info.account && this._pass()) this._keep(undefined, info.account);
        if (!info.on) { const why = "PC Relay is switched off (it is switched on at the computer)"; this._set("off", { why, info }); return { ok: false, why, info, kind: "off" }; }
        this._set("connected", { why: `connected (${this.latency} ms)`, info, latency: this.latency });
        return { ok: true, info, latency: this.latency };
      } catch (err) {
        clearTimeout(timer);
        if (await this._recheck()) return this.ping(timeoutMs);
        const why = netWhy(err, timeoutMs);
        this._set("offline", { why });
        return { ok: false, why, kind: netKind(err) };

    nothing: "There is nothing to save.",
    badKey: "That name cannot be used for a setting.",
    clash: (n) => `“${n}” was changed on another device too. Both versions are kept.`,
    clashTab: (n) => `“${n}” was changed in another tab too. Both versions are kept.`,
    taken: (n) => `There is already a document named “${n}”.`,
    savedAs: (was, now) => `Saved as “${now}”: there is already a document named “${was}”.`,
    cantOpen: (n, why) => `${n ? `“${n}”` : "That file"} could not be opened${why ? ": " + why : "."}`,
  };

  // ---- small things ---------------------------------------------------------------------------------------------
  const pad = (n) => String(n).padStart(2, "0");
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const lower = (s) => String(s).toLowerCase();
  const rnd = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  const soft = (p, v) => p.then((x) => x, () => v);

  const hidden = () => !!root.document && root.document.visibilityState === "hidden";
  const isBlob = (x) => typeof Blob !== "undefined" && x instanceof Blob;
  const savable = (x) => typeof x === "string" || x instanceof ArrayBuffer || ArrayBuffer.isView(x) || isBlob(x);
  // a reason as the PC or relay-client words it ("could not reach the PC (...)"), as a sentence a person reads
  const sentence = (s) => { s = String(s || "").trim(); if (!s) return ""; s = s[0].toUpperCase() + s.slice(1); return /[.!?…]$/.test(s) ? s : s + "."; };
  const keptIn = (rec) => { if (rec.kept) rec.keptIn = rec.app + SEP + rec.owner; else delete rec.keptIn; return rec; };
  // a failed answer that is worth another try by itself (the cloud is off, busy or not answering), not a refusal
  const isLater = (r) => !r.status || r.status === 429 || r.kind === "off" || (r.status >= 500 && r.status !== 507);

  // the PC's version of a file: the first 16 hex characters of its SHA-256 ("" where the browser cannot work it out)
  async function hashOf(bytes) {

  function badName(n) {
    if (!n.trim()) return "A name cannot be empty.";

    const m = /[\\/:*?"<>|]/.exec(n);
    if (m) return `A name cannot contain ${m[0]}`;
    if (/[\x00-\x1f\x7f]/.test(n)) return "A name cannot contain control characters.";
    if (/[. ]$/.test(n)) return "A name cannot end with a dot or a space.";

  function fileId(d, date) {

  // ---- this browser's copy (IndexedDB "cloud-kit") --------------------------------------------------------------
  // docs: one record per document { key, app, owner, name, cloudName, version, date, id, rev, hash, size, at, kept }
  // (key = app \n owner \n name in lower case; owner "" = nobody yet); bodies: its content under the same key;

  function makeDevice() {
    let db = null, opening = null;

    const fail = (e) => { dev.ok = false; dev.why = String((e && e.message) || e || "refused"); };
    function open() {
      if (db) return Promise.resolve(db);
      return opening || (opening = new Promise((res) => {
        let rq;
        try { rq = root.indexedDB.open(DB, 1); } catch (e) { fail(e); return res(null); }
        rq.onupgradeneeded = () => {

    function run(stores, mode, body, strict) {

        const on = (rq, fn) => { rq.onsuccess = () => { try { fn(rq.result); } catch (e) { stop(e); } }; };
        t.oncomplete = () => res(out);

      })).then((v) => { if (mode === "readwrite") { dev.ok = true; dev.why = ""; } return v; }, (e) => { fail(e); throw e; });
    }
    const range = (app, owner) => IDBKeyRange.bound(app + SEP + owner + SEP, app + SEP + owner + SEP + HIGH);
    dev.open = () => open().then((d) => !!d);
    // putDoc: the document's newest content. A version another tab saved here that has not reached the cloud is not
    // lost: it stays as a copy of its own (displaced), and goes up as "<name> <date> (2)".
    dev.putDoc = (rec, body, expect) => run(["docs", "bodies"], "readwrite", (t, done, on) => {
      const docs = t.objectStore("docs"), bodies = t.objectStore("bodies");
      done({});
      on(docs.get(rec.key), (cur) => {
        if (cur && cur.kept && cur.rev !== expect && !(rec.hash && cur.hash === rec.hash)) {
          on(bodies.get(rec.key), (old) => { const c = Object.assign({}, cur, { key: rec.key + SEP + "#" + cur.rev, copyOf: cur.name }); docs.put(c); bodies.put(old, c.key); done({ displaced: true }); });
        }

    dev.putNow = (rec, body) => {
      if (!db) return false;

        const t = db.transaction(["docs", "bodies"], "readwrite", { durability: "strict" });
        t.objectStore("docs").put(rec);
        t.objectStore("bodies").put(body, rec.key);

        return true;
      } catch (e) { return false; }
    };
    // settle: the cloud has taken the content named rev. The record learns the cloud's version either way; it stops
    // being "kept" only if it still holds that content (a newer save may have arrived meanwhile).
    dev.settle = (key, rev, base) => run(["docs"], "readwrite", (t, done, on) => {
      const s = t.objectStore("docs");
      done(false);
      on(s.get(key), (cur) => { if (!cur) return; Object.assign(cur, base); if (cur.rev === rev) cur.kept = false; s.put(keptIn(cur)); done(cur.rev === rev); });

  // ---- what the indicator says ----------------------------------------------------------------------------------
  // tone: ok (green), busy (green, moving), wait (amber: needs a look), off (grey), bad (red)

  // ---- one program's cloud ---------------------------------------------------------------------------------------

      this.R.api("seen", { method: "POST", json: { app: this.app }, timeout: 8000 }).then((r) => { if (!r.ok && isLater(r) && this._reach) this._down(r.why); });

    async _account() { // signed in, out, or another person (this tab or another)

    _heard(m) { // another tab of this browser changed what is kept here

    async _count() {

      let n = await soft(this._dev.count(this.app, me ? [me, ""] : [""], me), -1);
      const open = this._docsOpen().map((d) => meta(d).cur).filter((c) => c && c.rec.kept);
      if (n < 0) n = open.length; // no browser copy: what this page holds

    _docsOpen() {

    _remember(doc) {

<script>
// float.js: a small floating window, used by the chapter list, Settings, the Open window and the rest.
// FLOAT.open(name, { title, width, height, onClose }) makes (or fronts) the window and returns
// { el, body, title(text), close() }; the caller fills body. Movable by its title bar, resizable by its
// corner, a scroll bar when the content needs one, a close button, Escape closes the front one. It
// stays on screen whatever the UI size, and remembers its size and position per name in localStorage.
(function () {
  const KEY = (globalThis.APP_KEY || "br1") + "-win-";
  const MARGIN = 8, MIN_W = 220, MIN_H = 160;
  const open = new Map();     // name -> win, in opening order
  let z = 100;

  function saved(name) {
    try { const g = JSON.parse(localStorage.getItem(KEY + name)); return g && typeof g.w === "number" ? g : null; }
    catch (e) { return null; }
  }
  function remember(name, g) { try { localStorage.setItem(KEY + name, JSON.stringify(g)); } catch (e) {} }

  // A size and place that fits the screen.
  function fit(g) {
    const W = innerWidth, H = innerHeight;
    const w = Math.min(Math.max(g.w, MIN_W), W - 2 * MARGIN), h = Math.min(Math.max(g.h, MIN_H), H - 2 * MARGIN);
    return { x: Math.max(MARGIN, Math.min(g.x, W - w - MARGIN)), y: Math.max(MARGIN, Math.min(g.y, H - h - MARGIN)), w, h };
  }

  function front(win) {
    if (win.el.style.zIndex !== String(z)) win.el.style.zIndex = String(++z);

    el.innerHTML = '<div class="float-head"><span class="float-title"></span><button class="float-close" type="button" aria-label="Close" title="Close">✕</button></div>'
      + '<div class="float-body"></div><div class="float-size" aria-hidden="true"></div>';

    let g = { x: 0, y: 0, w: opts.width || 360, h: opts.height || 420 };
    const place = (next) => {
      g = fit(next);
      el.style.left = g.x + "px"; el.style.top = g.y + "px"; el.style.width = g.w + "px"; el.style.height = g.h + "px";
    };

      name, el, body,

      geometry: () => g,

        if (!open.has(name)) return;

  };
})();

<script>
// search-kit.js: the search pop-up shared by Jon's programs (the Book reader first, the Text editor too).
// One source: Projects\search-kit\search-kit.js. A program's build copies it into the page; never edit a copy.
// The how-to is README.md beside this file.
//
// The whole text is held in memory as ONE string (sections of units: a book's chapters of paragraphs, a file's
// lines), joined with a separator no one types, plus one folded copy (lower case, curly quotes made straight; the
// same length, so every place in one is the same place in the other). The benchmark of 2026-11-13 (README.md):
// indexOf on the folded string was the fastest for plain words (25 M characters: 4 to 20 ms a word, 81 ms for the
// single letter "e", 2.5 million hits), so plain words use it and only a wildcard or "Whole words" uses a RegExp.
// The search runs in slices of about 12 ms, so typing never waits, and a newer keystroke stops the older search.
//
// The pattern (README.md "What a person types"): words = all of them in the same paragraph (line); "two words" =
// exactly that; drag* = words starting with drag (* is any letters); -word = leave out what has it.
// A result is a SENTENCE holding a match, shown under where it is, the matched words marked.
(function () {
  "use strict";
  const VERSION = 1;
  const SEP = "\u0001";                 // between units: never typed, so no match runs across two
  const LIMIT = 1000;                   // results listed (the count goes on past it)
  const PAGE = 60;                      // results drawn at a time as the list scrolls
  const SLICE_MS = 12;
  const RECENT_MAX = 6;
  const WORD = "\\p{L}\\p{M}\\p{N}";     // the letters of a word, for wildcards and whole words
  const fmt = (n) => n.toLocaleString("en-US");

    const at = await locate(id, name).catch(() => null);
    const d = { key: "cloud:" + id, name, source: "cloud", id, parent: at ? at.parent : "", where: at ? at.where : "", writable: at ? at.writable : null,
      enc: t.enc, bom: t.bom, eol: t.eol, saved: t.text, savedAt: 0 };
    return { ok: true, doc: d, text: t.text };
  }
  async function openCloud(id, file, kept) {
    const r = await fromCloud(id, file);
    if (!r.ok) return r;
    const rec = await rescued(kept || (await getRec("cloud:" + id)));
    if (rec && rec.text !== rec.saved) {
      if (rec.saved === r.text) { show(r.doc, rec.text, `Your changes from ${clock(rec.at)} that were not saved are back.`); return { ok: true }; }
      show(r.doc, r.text);
      say(`Changes you did not save (${clock(rec.at)}) were made to an older copy of this file.`, { label: "Show them", run: () => {
        const stem = rec.name.replace(/(\.[^.]*)?$/, ""), ext = (/\.[^.]*$/.exec(rec.name) || [""])[0];
        show(Object.assign(newDoc(`${stem} (my changes)${ext}`), { enc: rec.enc, bom: rec.bom, eol: rec.eol }), rec.text, "These are your changes. Save keeps them as a file of their own.");
      } });
      return { ok: true };
    }
    show(r.doc, r.text);
    return { ok: true };
  }
  async function openDevice(file) {
    if (file.size > MAX_BYTES * 4) { say(`This file is too big to open here (${fmt(Math.round(file.size / 1048576))} MB).`); return; }
    let t;
    try { t = decode(await file.arrayBuffer()); } catch (e) { say(e.message); return; }
    show({ key: "device:" + Date.now().toString(36), name: file.name, source: "device", id: "", parent: "", where: "", writable: true, enc: t.enc, bom: t.bom, eol: t.eol, saved: t.text, savedAt: 0 }, t.text);
  }

  // Before New or Open: changes not saved are asked about (the person's own press; nothing pops up by itself).
  function ask(title, line, buttons) {
    return new Promise((done) => {
      const box = document.createElement("div");
      box.className = "ask";
      box.innerHTML = `<div role="alertdialog" aria-modal="true"><h2></h2><p></p><div class="row"></div></div>`;
      box.querySelector("h2").textContent = title;
      box.querySelector("p").textContent = line;
      const end = (v) => { box.remove(); removeEventListener("keydown", key, true); done(v); };
      const key = (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); end(null); } };
      for (const b of buttons) {
        const el = document.createElement("button");
        el.type = "button"; el.textContent = b.label; if (b.primary) el.className = "primary";
        el.addEventListener("click", () => end(b.value));
        box.querySelector(".row").append(el);
      }
      box.addEventListener("click", (e) => { if (e.target === box) end(null); });
      addEventListener("keydown", key, true);
      document.body.append(box);
      box.querySelector("button.primary").focus();
    });
  }
  async function leaveOk() {
    if (!dirty()) return true;
    const v = await ask(`Save the changes to ${doc.name}?`, "If you do not, they are thrown away.", [
      { label: "Cancel", value: null }, { label: "Don't save", value: "drop" }, { label: "Save", value: "save", primary: true }]);
    if (v === "save") { await save(); return !dirty(); }
    if (v === "drop") { await putRec(Object.assign({}, doc, { text: doc.saved, at: Date.now() })); return true; }
    return false;
  }

  $("new").addEventListener("click", async (e) => {
    if (e.detail > 0) e.currentTarget.blur();
    if (!(await leaveOk())) return;
    show(newDoc());
    ta.focus();
  });
  async function openChooser(anchor) {
    if (!(await leaveOk())) return;
    const d = await cloud.open({ anchor });          // Cloud File Manager first, then This device; any kind of file
    if (!d) return;
    if (d.source === "cloud" && d.id) {
      say("Opening…");
      const r = await openCloud(d.id, d.file);
      if (!r.ok) say(r.notText ? r.why : `${d.file ? d.file.name : "The file"} could not be opened: ${r.why}`);
    } else if (d.file) await openDevice(d.file);
  }
  $("open").addEventListener("click", (e) => openChooser(e.currentTarget));
  $("save").addEventListener("click", (e) => { if (e.detail > 0) e.currentTarget.blur(); save(); });

  // The name: click, type, Enter (Escape puts it back). A file in the Cloud File Manager is renamed there too.
  nameEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); nameEl.blur(); }
    else if (e.key === "Escape") { e.preventDefault(); nameEl.value = doc ? doc.name : ""; nameEl.blur(); }
  });
  nameEl.addEventListener("change", async () => {
    const want = nameEl.value.trim().replace(/[\\/:*?"<>|]+/g, "-");
    if (!doc || !want || want === doc.name) { nameEl.value = doc ? doc.name : ""; return; }
    if (doc.source === "cloud" && doc.id && doc.writable !== false) {
      const r = await R.call("files", "rename", { method: "POST", json: { id: doc.id, name: want }, timeout: 20000 });
      if (!r.ok) { nameEl.value = doc.name; say((r.data && r.data.kind) === "exists" ? `There is already a file called ${want} there.` : `Not renamed: ${r.why}`, null, 8000); return; }
      const oldKey = doc.key;
      Object.assign(doc, { id: r.data.item.id, name: r.data.item.name, key: "cloud:" + r.data.item.id });
      idb("readwrite", (s) => s.delete(oldKey));
    } else doc.name = want;
    nameEl.value = doc.name;
    ls.set(lastKey(), doc.key);
    keep(true); paint();
  });

  // ---- More: a copy on this device, the look ----------------------------------------------------------------
  function menu(anchor, items) {
    const shield = document.createElement("div"), m = document.createElement("div");
    shield.className = "shield"; m.className = "menu"; m.setAttribute("role", "menu");
    const close = () => { m.remove(); removeEventListener("keydown", key, true); };
    const key = (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); shield.remove(); anchor.focus(); } };
    // A press off the menu only closes it: the layer stays until that press's click has come, and takes it.
    shield.addEventListener("pointerdown", (e) => { e.preventDefault(); close(); setTimeout(() => shield.remove(), 600); });
    shield.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); shield.remove(); }, true);
    shield.addEventListener("contextmenu", (e) => { e.preventDefault(); close(); shield.remove(); });
    for (const it of items) {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "menuitem"); b.textContent = it.label;
      b.addEventListener("click", () => { close(); shield.remove(); it.run(); });
      m.append(b);
    }
    document.body.append(shield, m);
    const r = anchor.getBoundingClientRect(), w = m.offsetWidth;
    m.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + "px";
    m.style.top = r.bottom + 6 + "px";
    addEventListener("keydown", key, true);
    m.querySelector("button").focus();
  }
  $("more").addEventListener("click", (e) => menu(e.currentTarget, [
    { label: "Save a copy on this device", run: download },
    { label: "Text size, font and look", run: viewWindow },
  ]));

  const VIEW_KEY = "te-view";
  let view = { size: 100, font: "sans", wrap: true, theme: "auto" };
  try { Object.assign(view, JSON.parse(ls.get(VIEW_KEY)) || {}); } catch (e) {}
  function applyView() {
    const root = document.documentElement;
    root.dataset.theme = view.theme;
    root.style.setProperty("--text", (17 * view.size) / 100 + "px");
    root.style.setProperty("--font", view.font === "mono" ? "var(--mono)" : "var(--sans)");
    ed.classList.toggle("nowrap", !view.wrap);
    ta.wrap = view.wrap ? "soft" : "off";
    ls.set(VIEW_KEY, JSON.stringify(view));
    fitBack(); drawMarks();
  }
  function viewWindow() {
    const w = FLOAT.open("view", { title: "Text size, font and look", width: 380, height: 430 });
    const seg = (label, key, opts) => {
      const box = document.createElement("div");
      box.innerHTML = `<h3></h3><div class="seg"></div>`;
      box.querySelector("h3").textContent = label;
      for (const [v, text] of opts) {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = text; b.setAttribute("aria-pressed", String(view[key] === v));
        b.addEventListener("click", () => { view[key] = v; applyView(); for (const x of box.querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b)); });
        box.lastChild.append(b);
      }
      return box;
    };
    const size = document.createElement("div");
    size.innerHTML = `<h3>Text size</h3><div class="seg"><button type="button" aria-label="Smaller">A−</button><span class="size"></span><button type="button" aria-label="Bigger">A+</button></div>`;
    const showSize = () => { size.querySelector(".size").textContent = view.size + " %"; };
    const [minus, plus] = size.querySelectorAll("button");
    minus.addEventListener("click", () => { view.size = Math.max(60, view.size - 10); applyView(); showSize(); });
    plus.addEventListener("click", () => { view.size = Math.min(250, view.size + 10); applyView(); showSize(); });
    showSize();
    const box = document.createElement("div");
    box.className = "view";
    box.append(size, seg("Font", "font", [["sans", "Normal"], ["mono", "Typewriter"]]), seg("Long lines", "wrap", [[true, "Wrap"], [false, "Do not wrap"]]),
      seg("Look", "theme", [["auto", "Automatic"], ["light", "Light"], ["dark", "Dark"]]));
    w.body.replaceChildren(box);
  }

  // ---- Search and replace (the shared search kit) ----------------------------------------------------------
  let lineStarts = [0];
  const S = SearchKit.create({
    app: APP,
    words: { section: "file", sections: "", unit: "line", whole: "file" },
    placeholder: "Search this text",
    source: {
      key: () => String(version),
      load: async () => {
        const lines = ta.value.split("\n");
        lineStarts = new Array(lines.length);
        let p = 0;
        for (let i = 0; i < lines.length; i++) { lineStarts[i] = p; p += lines[i].length + 1; }
        return [{ label: doc ? doc.name : "", units: lines }];
      },
      where: (s, u) => ["Line " + fmt(u + 1), ""],
    },
    after: () => ({ s: 0, u: (ta.value.slice(0, ta.selectionStart).match(/\n/g) || []).length }),
    onPick: pick,
    replace: doReplace,
  });
  let win = null, now = null;       // now: the place chosen [start, end] in the whole text
  function openSearch() {
    const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
    const w = narrow() ? innerWidth - 16 : 480, h = narrow() ? Math.round(innerHeight * 0.62) : Math.min(640, innerHeight - 40);
    const fresh = !FLOAT.get("search");
    win = FLOAT.open("search", { title: "Search and replace", width: w, height: h, onClose: () => { win = null; $("find").setAttribute("aria-pressed", "false"); clearMarks(); } });
    if (fresh) {
      if (!ls.get(APP_KEY + "-win-search")) win.place(narrow() ? { x: 8, y: innerHeight - h - 8, w, h } : { x: innerWidth - w - 16, y: $("top").getBoundingClientRect().bottom + 8, w, h });
      S.mount(win.body);
    }
    if (sel && sel.length < 80 && !sel.includes("\n") && sel !== S.query) S.query = sel;
    $("find").setAttribute("aria-pressed", "true");
    S.focus();
    drawMarks();
  }
  $("find").addEventListener("click", (e) => { if (e.detail > 0) e.currentTarget.blur(); if (FLOAT.get("search")) FLOAT.close("search"); else openSearch(); });
  let searchTimer = 0;
  function textChanged() {        // the text changed by typing: the search looks again a moment later
    clearTimeout(searchTimer);
    now = null;
    if (win && S.query) searchTimer = setTimeout(() => S.invalidate(true), 300);
    else clearMarks();
  }
  S.on("results", () => { if (!S.results.length) now = null; drawMarks(); });
  function pick(r) {
    const a = lineStarts[0] === 0 && lineStarts[r.u] != null ? lineStarts[r.u] + r.start : 0, b = a + (r.end - r.start);
    now = [a, b];
    ta.setSelectionRange(a, b);
    drawMarks();
    const m = back.querySelector("mark.now");
    if (m) { ta.scrollTop = Math.max(0, m.offsetTop - ta.clientHeight / 3); if (!view.wrap) ta.scrollLeft = Math.max(0, m.offsetLeft - ta.clientWidth / 3); sync(); }
    counts();                                        // on a phone the window sits low on the screen: the place shows above it
  }
  async function doReplace({ all, with: w, hits }) {
    const v = ta.value;
    const abs = hits.map((h) => [lineStarts[h.u] + h.start, lineStarts[h.u] + h.end]).sort((x, y) => x[0] - y[0]);
    const focusBack = document.activeElement;
    quiet = true;
    try {
      ta.focus({ preventScroll: true });
      if (all) {
        let out = "", at = 0;
        for (const [a, b] of abs) { if (a < at) continue; out += v.slice(at, a) + w; at = b; }
        out += v.slice(at);
        ta.select();
        if (!document.execCommand("insertText", false, out)) ta.value = out;     // one step back with Ctrl+Z
      } else {
        const [a, b] = abs[0];
        ta.setSelectionRange(a, b);
        if (!(w ? document.execCommand("insertText", false, w) : document.execCommand("delete"))) ta.setRangeText(w, a, b, "end");
      }
      if (ta.value !== v) { version++; keep(); paint(); counts(); }
    } finally {
      quiet = false;
      if (focusBack && focusBack !== ta && focusBack.focus) focusBack.focus({ preventScroll: true });
    }
    return abs.length;
  }

  // The marks: a layer under the textarea with the same text, the places found marked, the chosen one strongly.
  function fitBack() {
    const cs = getComputedStyle(ta);
    back.style.left = ta.offsetLeft + parseFloat(cs.borderLeftWidth) + "px";
    back.style.top = ta.offsetTop + parseFloat(cs.borderTopWidth) + "px";
    back.style.width = ta.clientWidth + "px";
    back.style.height = ta.clientHeight + "px";
  }
  function sync() { back.scrollTop = ta.scrollTop; back.scrollLeft = ta.scrollLeft; }
  ta.addEventListener("scroll", sync, { passive: true });
  new ResizeObserver(() => { fitBack(); sync(); }).observe(ta);
  function clearMarks() { back.replaceChildren(); }
  const esc = (s) => s.replace(/[&<]/g, (c) => (c === "&" ? "&amp;" : "&lt;"));
  function drawMarks() {
    if (!win || !S.query || !S.results.length || !doc) { clearMarks(); return; }
    const v = ta.value, hits = S.hitsIn(0).map((h) => [lineStarts[h.u] + h.start, lineStarts[h.u] + h.end]).sort((x, y) => x[0] - y[0]);
    let html = "", at = 0;
    for (const [a, b] of hits) {
      if (a < at) continue;
      const cls = now && now[0] === a ? ' class="now"' : "";
      html += esc(v.slice(at, a)) + `<mark${cls}>` + esc(v.slice(a, b)) + "</mark>";
      at = b;
    }
    html += esc(v.slice(at)) + "\n ";
    back.innerHTML = html;
    fitBack(); sync();
  }

  // ---- Keys ---------------------------------------------------------------------------------------------------
  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase(), mod = (e.ctrlKey || e.metaKey) && !e.altKey;
    if (mod && k === "s") { e.preventDefault(); save(); }
    else if (mod && k === "f") { e.preventDefault(); if (win) S.focus(); else openSearch(); }
    else if (mod && k === "h") { e.preventDefault(); openSearch(); }
    else if (mod && k === "o") { e.preventDefault(); openChooser($("open")); }
    else if (e.key === "F3" || (mod && k === "g")) { if (S.results.length) { e.preventDefault(); if (e.shiftKey) S.prev(); else S.next(); } }
  });

  // ---- Someone else at this browser, the start ------------------------------------------------------------
  cloud.on("account", async () => {
    if (makingGuest || !doc) return;
    if (dirty()) { keep(true); if (doc.source === "cloud") { const at = await locate(doc.id, doc.name).catch(() => null); if (at) Object.assign(doc, at); paint(); } return; }
    await startWith(null);
  });
  // What to show: a file the Cloud File Manager sent (#open=<id>), else what this person had open last, else a new text.
  async function startWith(id) {
    if (id) {
      say("Opening…");
      const r = await openCloud(id, null);
      if (r.ok) return;
      await startWith(null);       // what was open last stays, and the line says why the file did not open
      say(r.notText ? r.why : `The file could not be opened: ${r.why}${R.account() ? "" : " Sign in if it is yours."}`);
      return;
    }
    const key = ls.get(lastKey());
    const rec = key ? await rescued(await getRec(key)) : null;
    if (!rec) { show(newDoc()); return; }
    if (rec.source === "cloud" && rec.id && cloud.state.cloud === "on") {
      const r = await openCloud(rec.id, null, rec);
      if (r.ok) return;
      if (r.status === 404) {   // gone from the Cloud File Manager (deleted or moved): the text is still here
        show(Object.assign({}, rec, newDoc(rec.name), { enc: rec.enc, bom: rec.bom, eol: rec.eol, saved: "" }), rec.text, `${rec.name} is not in the Cloud File Manager any more (moved or deleted). Your text is here: Save puts it in ${FOLDER}.`);
        return;
      }
    }
    const d = Object.assign({}, rec); delete d.text; delete d.at;
    show(d, rec.text, rec.source === "cloud" && cloud.state.cloud !== "on" ? "Cloud File Manager is off: this is the copy kept on this device." : "");
  }

  applyView();
  window.EDITOR = { cloud, relay: R, search: S, get doc() { return doc; }, save, dirty, decode, encode, get ready() { return ready; } };
  let ready = false;
  (async () => {
    show(newDoc(), "", "", true);           // at once, while the cloud answers
    await cloud.start();
    const m = /[#&]open=([0-9a-f]{20})/.exec(location.hash);
    await startWith(m ? m[1] : null);
    if (m) history.replaceState(null, "", location.pathname + location.search);   // a reload opens the last file, not this one again
    ready = true;
    prune();
  })();
  // While the page is in view the cloud kit tells the relay once a minute that the program is open (it does it itself).
})();
</script>
</body>
</html>
