<style>
/* ==== markdown-kit/markdown-kit.css ==== */
/* markdown-kit.css: the look of rendered Markdown, inside an element with class md-body. Uses the page's own colour
   names (--fg --muted --line --accent --paper --bar), with fallbacks. The alerts' own colours: vendor\mdit-plugin-alert.css. */
.md-body { color: var(--fg, #1d2230); line-height: 1.6; overflow-wrap: break-word; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.md-body > :first-child { margin-top: 0; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 { margin: 1.4em 0 .5em; line-height: 1.25; font-weight: 650; scroll-margin-top: 8px; }
.md-body h1 { font-size: 1.85em; padding-bottom: .25em; border-bottom: 1px solid var(--line, #dcdfe6); }
.md-body h2 { font-size: 1.45em; padding-bottom: .2em; border-bottom: 1px solid var(--line, #dcdfe6); }
.md-body h3 { font-size: 1.2em; }
.md-body h4 { font-size: 1.05em; }
.md-body h5 { font-size: .95em; }
.md-body h6 { font-size: .9em; color: var(--muted, #5d6577); }
.md-body p, .md-body ul, .md-body ol, .md-body dl, .md-body table, .md-body blockquote, .md-body pre, .md-body details, .md-body .md-math { margin: 0 0 1em; }
.md-body ul, .md-body ol { padding-left: 1.8em; }
.md-body li + li { margin-top: .2em; }
.md-body li > ul, .md-body li > ol { margin: .2em 0 0; }
.md-body a { color: var(--accent, #2457d6); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.md-body a.md-wikilink { text-decoration-style: dotted; }
.md-body img { max-width: 100%; height: auto; }
.md-body img.md-held { display: inline-block; min-width: 6em; min-height: 2.2em; padding: .3em .6em; border: 1px dashed var(--line, #dcdfe6); border-radius: 6px; color: var(--muted, #5d6577); font-size: .9em; }
.md-body hr { height: 0; margin: 1.6em 0; border: 0; border-top: 2px solid var(--line, #dcdfe6); }
.md-body blockquote { padding: 0 1em; border-left: .25em solid var(--line, #dcdfe6); color: var(--muted, #5d6577); }
.md-body code, .md-body kbd, .md-body pre { font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; font-size: .9em; }
.md-body :not(pre) > code { padding: .1em .35em; border-radius: 5px; background: color-mix(in srgb, var(--fg, #1d2230) 8%, transparent); }
.md-body kbd { padding: .1em .4em; border: 1px solid var(--line, #dcdfe6); border-bottom-width: 2px; border-radius: 5px; }
.md-body pre { padding: .8em 1em; overflow: auto; border-radius: 8px; background: color-mix(in srgb, var(--fg, #1d2230) 5%, var(--paper, #fff)); border: 1px solid var(--line, #dcdfe6); line-height: 1.45; }
.md-body pre code.hljs { padding: 0; background: transparent; }
.md-body pre.md-diagram { text-align: center; white-space: pre; }
.md-body pre.md-diagram.md-drawn { background: transparent; border-color: transparent; white-space: normal; }
.md-body pre.md-diagram svg { max-width: 100%; height: auto; }
.md-body pre.md-diagram-error { border-color: #c0392b; }
.md-body table { border-collapse: collapse; display: block; max-width: 100%; overflow: auto; }
.md-body th, .md-body td { padding: .35em .8em; border: 1px solid var(--line, #dcdfe6); }
.md-body th { font-weight: 650; background: color-mix(in srgb, var(--fg, #1d2230) 4%, transparent); }
.md-body tr:nth-child(2n) td { background: color-mix(in srgb, var(--fg, #1d2230) 2.5%, transparent); }
.md-body .task-list-item { list-style: none; }
.md-body .task-list-item-checkbox { margin: 0 .45em 0 -1.4em; vertical-align: -.1em; }
.md-body dt { font-weight: 650; }
.md-body dd { margin: 0 0 .6em 1.6em; }
.md-body mark { padding: 0 .15em; border-radius: 3px; background: color-mix(in srgb, #f5c518 55%, transparent); color: inherit; }
.md-body details { padding: .4em .8em; border: 1px solid var(--line, #dcdfe6); border-radius: 8px; }
.md-body summary { cursor: pointer; font-weight: 600; }
.md-body .md-math { overflow-x: auto; overflow-y: hidden; }
.md-body .md-tex { white-space: pre-wrap; }
.md-body .katex-error { color: #c0392b; }
.md-body .footnotes-sep { margin-top: 2.4em; }
.md-body .footnotes { font-size: .9em; color: var(--muted, #5d6577); }
.md-body .footnote-ref a { text-decoration: none; }
.md-body .markdown-alert { border-radius: 0 6px 6px 0; }
/* ==== markdown-kit/vendor/mdit-plugin-alert.css ==== */
.markdown-alert {
  padding: 8px 16px;
  margin-bottom: 16px;
  color: inherit;
  border-left: 0.25em solid;
}
.markdown-alert > :first-child {
  margin-top: 0;
}
.markdown-alert > :last-child {

<style>
/* editor.css: the Text editor's look. One set of colours (light-dark() with the Look setting on <html data-theme>);
   sizes from --ui (bars, buttons, windows: the UI size setting) and --text (the text: the Text size setting). The
   floating window (float.css) uses the same names. Blue is this program's accent; green, amber, red and grey belong to
   the cloud indicator (WEB-APP-CONVENTIONS.md 1). The editing area's own look is the EditorView.theme in editor.js. */
:root {
  color-scheme: light dark;
  --bg: light-dark(#fbfbf9, #14171d);
  --paper: light-dark(#ffffff, #1b1f27);
  --fg: light-dark(#1d2230, #e4e7ee);
  --muted: light-dark(#5d6577, #9aa3b5);
  --faint: light-dark(#9aa1b0, #5f687a);
  --line: light-dark(#dcdfe6, #2c323d);
  --bar: light-dark(#f1f2f5, #1a1e26);
  --gutter: light-dark(#f6f7f9, #171b22);
  --accent: light-dark(#2457d6, #7aa2ff);
  --accent-ink: light-dark(#ffffff, #0d1630);
  --mark: color-mix(in srgb, var(--accent) 24%, transparent);
  --mark-all: color-mix(in srgb, var(--accent) 40%, transparent);
  --mark-now: color-mix(in srgb, var(--accent) 60%, transparent);
  --ui: 16px;
  --text: 16px;
  --tap: calc(2.75 * var(--ui));
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font: var(--mono);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
body { margin: 0; height: 100%; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: var(--ui)/1.4 var(--sans); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* The bar: the Apps button first, the file's name, the few buttons, the cloud indicator last. */
.top { display: flex; align-items: center; gap: calc(var(--ui) * .375); flex-wrap: wrap; padding: calc(var(--ui) * .375) max(10px, 2vw); background: var(--bar); border-bottom: 1px solid var(--line); flex: none; }
.top apps-button { --apps-h: var(--tap); --apps-sep: var(--line); }
.name { flex: 0 1 18em; min-width: 7em; min-height: var(--tap); padding: 0 .5em; border: 1px solid transparent; border-radius: 8px; background: transparent; font-weight: 650; font-size: 1.05em; text-overflow: ellipsis; }
.name:hover { border-color: var(--line); }
.name:focus { border-color: var(--accent); background: var(--paper); outline: none; }
.name::placeholder { color: var(--fg); opacity: .75; }
.top button { min-height: var(--tap); padding: 0 1em; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; line-height: 1; }
.top button:not(:disabled):hover { border-color: var(--accent); }
.top button:disabled { opacity: .45; cursor: default; }
.top button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
.top button.icon { min-width: var(--tap); padding: 0; }
.top button.icon svg { width: 1.3em; height: 1.3em; vertical-align: middle; }
.top button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--paper)); }
.grow { flex: 1; }
.top cloud-status { flex: 0 1 auto; max-width: 16em; }
@media (max-width: 640px) {
  .top { gap: 5px; padding: 6px 8px; }
  .name { order: 9; flex: 1 1 8em; }
  .top #mdview, .top #find, .top #gear, .top #more, .top cloud-status { order: 10; }
  .top button { padding: 0 .8em; }
  .top cloud-status { max-width: 1.7em; overflow: hidden; white-space: nowrap; }
}

/* The tabs: one per open file, kept live (tabs.js). A dot: changes kept live only, not saved to a file yet. */
.tabs { display: flex; align-items: stretch; background: var(--bar); border-bottom: 1px solid var(--line); flex: none; min-height: calc(var(--tap) * .9); }
.tabstrip { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: none; }
.tabstrip::-webkit-scrollbar { display: none; }
.tab { flex: none; display: flex; align-items: center; gap: .35em; max-width: 16em; min-width: 6em; padding: 0 .35em 0 .8em; border-right: 1px solid var(--line); color: var(--muted);
  cursor: pointer; user-select: none; -webkit-user-select: none; position: relative; touch-action: pan-x; }   /* a finger swipe scrolls the tab strip (Jon, 2026-11-14: keep it; finger-drag of tabs is not wanted) */
.tab:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.tab.on { background: var(--paper); color: var(--fg); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }
.tab .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab.new .tt { font-style: italic; }
.tab .tx { flex: none; width: calc(var(--tap) * .62); height: calc(var(--tap) * .62); display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; padding: 0; cursor: pointer; color: inherit; }
.tab .tx svg { width: .9em; height: .9em; }
.tab .tx:hover { background: var(--line); }
.tab .tx .dot { display: none; width: .6em; height: .6em; border-radius: 50%; background: var(--accent); }
.tab.live .tx .dot { display: block; }
.tab.live .tx svg { display: none; }
.tab.live .tx:hover .dot { display: none; }
.tab.live .tx:hover svg { display: block; }
.tab.loading .tt::after { content: " …"; }
.tab.drag { opacity: .55; }
.tabarrows { display: flex; flex: none; border-left: 1px solid var(--line); }
.tabarrows button { width: calc(var(--tap) * .9); border: 0; background: transparent; cursor: pointer; padding: 0; color: var(--fg); }
.tabarrows button svg { width: 1.1em; height: 1.1em; }
.tabarrows button:disabled { opacity: .3; cursor: default; }
.tabarrows button:not(:disabled):hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* One quiet line under the tabs: where the file is and whether it is saved; a button when there is something to do. */
.info { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 4px max(12px, 2vw); min-height: 2em; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .9em; flex: none; }
.info .where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.info .state { color: var(--fg); }
.info .state.unsaved { font-weight: 700; }
.info .state.unsaved::before { content: ""; display: inline-block; width: .55em; height: .55em; margin-right: .4em; border-radius: 50%; background: var(--accent); vertical-align: .05em; }
.info .say { color: var(--fg); }
.info button { min-height: calc(var(--tap) * .8); padding: 0 .9em; border: 1px solid var(--accent); border-radius: 999px; background: var(--paper); color: var(--accent); font-weight: 650; cursor: pointer; }

/* The editing area fills the rest (CodeMirror draws only the lines in view). */
.ed { flex: 1; min-height: 0; display: flex; position: relative; }
.ed > .cm-editor { flex: 1; min-width: 0; height: 100%; }
.loading { margin: auto; color: var(--muted); }

/* The Markdown preview (preview.js): beside the text, under it on a phone. The look of the Markdown itself:
   markdown-kit.css (class md-body). */
.ed.split > .cm-editor { flex: 1 1 50%; }
.mdpane { flex: 1 1 50%; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; border-left: 1px solid var(--line); background: var(--paper); }
.mdhead { flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-bottom: 1px solid var(--line); background: var(--bar); font-size: .9em; }
.mdhead button { min-height: calc(var(--tap) * .75); padding: 0 .8em; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; }
.mdhead button:not(:disabled):hover { border-color: var(--accent); }
.mdhead button:disabled { opacity: .45; cursor: default; }
.mdhead button[aria-expanded="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--paper)); }
.mdhead #mdupdate { border-color: var(--accent); color: var(--accent); font-weight: 650; }
.mdnote { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mdtoc { position: absolute; z-index: 4; left: 8px; right: 8px; top: calc(var(--tap) * .75 + 14px); max-height: min(70%, 32em); overflow: auto; padding: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
.mdtoc button { display: block; width: 100%; text-align: left; min-height: calc(var(--tap) * .8); padding: .25em .7em; border: 0; border-radius: 6px; background: transparent; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mdtoc button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.mdtoc button.on { background: color-mix(in srgb, var(--accent) 18%, transparent); font-weight: 650; }
.mdscroll { flex: 1; min-height: 0; overflow: auto; padding: 16px max(18px, 3%) 40vh; }
.mdscroll .md-body { max-width: 52em; margin: 0 auto; font-size: var(--text); }
@media (max-width: 760px) {
  .ed.split { flex-direction: column; }
  .ed.split > .cm-editor { height: auto; min-height: 0; }
  .ed.split > .mdpane { border-left: 0; border-top: 2px solid var(--line); }
  .mdscroll { padding: 12px 14px 30vh; }
}
/* Opening a big file: the progress and Cancel, over the editing area. */
.loadbox { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 88%, transparent); }
.loadbox > div { width: min(30em, calc(100% - 32px)); padding: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
.loadbox h2 { margin: 0 0 4px; font-size: 1.05em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loadbox p { margin: 0 0 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.loadbox .lbar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin-bottom: 14px; }
.loadbox .lbar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.loadbox button { min-height: var(--tap); padding: 0 1.2em; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; }
.loadbox button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
.loadbox .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* The find bar (search.js), at the bottom like Sublime Text's. */
.sbar { flex: none; background: var(--bar); border-top: 1px solid var(--line); padding: 6px max(10px, 2vw); display: flex; flex-direction: column; gap: 6px; }
.srow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sbar button { min-height: calc(var(--tap) * .85); padding: 0 .85em; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; line-height: 1; white-space: nowrap; }
.sbar button:not(:disabled):hover { border-color: var(--accent); }
.sbar button:disabled { opacity: .45; cursor: default; }
.sbar .sopt { min-width: calc(var(--tap) * .85); padding: 0 .5em; font-weight: 700; }
.sbar .sopt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--paper)); color: var(--accent); }
.sbar .sq { flex: 1 1 14em; min-width: 8em; min-height: calc(var(--tap) * .85); padding: 0 .7em; border: 2px solid var(--line); border-radius: 8px; background: var(--paper); font-family: var(--font); }
.sbar .sq:focus { outline: none; border-color: var(--accent); }
.sbar .sq.none { border-color: color-mix(in srgb, var(--fg) 45%, var(--line)); background: color-mix(in srgb, var(--fg) 6%, var(--paper)); }
.sbar .scount { min-width: 7em; color: var(--muted); font-size: .9em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sbar .sx { margin-left: auto; min-width: calc(var(--tap) * .85); padding: 0; }
@media (max-width: 640px) { .sbar .scount { order: 5; min-width: 0; } }

.foot { display: flex; gap: 6px 16px; flex-wrap: wrap; padding: 4px max(12px, 2vw) calc(4px + env(safe-area-inset-bottom, 0px)); background: var(--bar); border-top: 1px solid var(--line); color: var(--muted); font-size: .84em; font-variant-numeric: tabular-nums; flex: none; }

/* The ⋯ menu, and the see-through layer under it: a press off the menu only closes it (WEB-APP-CONVENTIONS.md 11). */
.shield { position: fixed; inset: 0; z-index: 199; background: transparent; }
.menu { position: fixed; z-index: 200; min-width: 16em; padding: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, .3); }
.menu button { display: flex; justify-content: space-between; gap: 2em; width: 100%; text-align: left; min-height: var(--tap); padding: 0 .9em; align-items: center; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
.menu button kbd { font: inherit; font-size: .85em; color: var(--muted); }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }

/* A question after the person's own press (closing a tab with changes, a line to go to). */
.ask { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .35); }
.ask > div { width: min(26em, 100%); padding: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, .35); }
.ask h2 { margin: 0 0 6px; font-size: 1.1em; }
.ask p { margin: 0 0 14px; color: var(--muted); }
.ask .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.ask button { min-height: var(--tap); padding: 0 1.1em; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; }
.ask button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
.ask input { width: 100%; min-height: var(--tap); margin-bottom: 14px; padding: 0 .7em; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); }
.ask input:focus { outline: none; border-color: var(--accent); }

/* Another tab of this browser has the editor: one screen, one button. */
.elsewhere { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; background: var(--bg); padding: 16px; }
.elsewhere > div { max-width: 28em; text-align: center; }
.elsewhere h2 { margin: 0 0 8px; }
.elsewhere p { color: var(--muted); }
.elsewhere button { min-height: var(--tap); padding: 0 1.3em; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 650; cursor: pointer; }

/* Settings (settings.js) and Keys windows. */
.set { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.set h3 { margin: 0 0 6px; font-size: 1em; }
.set .hint { margin: -2px 0 6px; color: var(--muted); font-size: .88em; }
.set .seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.set .seg button { min-height: var(--tap); min-width: var(--tap); padding: 0 .9em; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; }
.set .seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--paper)); font-weight: 650; }
.set .val { min-width: 4.5em; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; }

.set .logbox { height: 16em; overflow: auto; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: .82em/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }

<script>
/* relay-client.js 3: the PC Relay client (ONE source: Projects\pc-relay\client\relay-client.js; each page's build
   copies it in, so never edit a copy). Talks to PC Relay 3 (accounts) on Jon's PC. The relay decides every request;
   this file carries the pass, remembers who this browser is, and says plainly what the PC answered.
   The exact requests: Projects\cool-tools-upgrade\API-relay.md.

   - Nothing happens until the page calls something: no background traffic of its own (seen() is the page's call).
   - The PC's address: read from relay.json beside the programs ("../relay.json" from a program's page, or
     opts.addressFile), fresh before the first connection and again after a failed one (at most once a minute).
     {"address": "https://..."}; http only for 127.0.0.1 and localhost (the stage). No address is built in: if the file
     cannot be read the cloud is simply off, with a plain reason (status "off", where.why). opts.base names the address
     instead (tests, the relay's own window on the local door).
   - Kept in this browser (localStorage, shared by every page of the site): "relay-pass" ({pass, device, at}) and
     "relay-account" ({id, name, kind, number, at}), so the name shows at once, even with the cloud off. Another tab's
     sign-in, sign-out or change arrives as an "account" event.
   - The pass goes in the X-Relay-Pass header (HTTP) or the WebSocket subprotocol "pass.<p>"; never in a URL.
   - When the PC says the pass is not valid any more (X-Relay-Info: pass-unknown, or the ping's pass "unknown"), the
     pass and the account are forgotten and "account" fires with null. me() forgets them only on a whole answer that
     says {account: null}. An answer cut off, garbled or late, a timeout or a network error never ends a sign-in:
     it is a result with ok false and kind "network" or "timeout".
   - Errors from the relay are { why, kind }; every result here carries why and kind.

   const R = RelayClient.create({ app: "plan-cutter", log });
   await R.ping();                 // { ok, latency, info }
   R.account();                    // at once, from this browser: { id, name, kind, number } or null
   await R.me();                   // from the PC: { ok, account, can, programs, network, limited }
   R.can("files.shared.change");  R.canUse("voice");      // from the last me()
   await R.accountsHere();         // { ok, accounts: [{ id, name, kind, number, picture, hasPassword }] }
   await R.signIn(name, password); // { ok, kind, why, account }
   await R.signOut();              // { ok }
   await R.guest();                // { ok, account }  (a guest for this browser; itself when it has an account)
   await R.setup({ name, password });   // { ok, kind, why, account }
   await R.update({ name, password });  // { ok, kind, why, account }   (password: null removes it)
   R.seen();                       // "this app is open" (call once a minute while the page is visible)
   R.on("account", fn);            // fn(account or null)
   R.on("status", fn);             // fn({ state: checking|connected|off|offline|starting|ready|reload, why })
   await R.api("people");          // any /relay/ request: { ok, status, data, why, kind }
   R.call, R.fetch, R.url, R.ws, R.open, R.pcName, R.address, R.watch     // as in relay-client 2
*/
(function (root) {
  "use strict";
  const VERSION = 3;
  const RECHECK_MS = 60000, ADDRESS_MS = 6000;
  const PASS_KEY = "relay-pass", ACCOUNT_KEY = "relay-account", NAME_KEY = "relay-pc-name", YOUR_PC = "your PC";
  const trim = (u) => String(u || "").trim().replace(/\/+$/, "");
  const goodAddress = (a) =>
    /^https:\/\/[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:\d{1,5})?$/i.test(a) ||
    /^http:\/\/(127\.0\.0\.1|localhost)(:\d{1,5})?$/i.test(a);
  const store = {
    get(k) { try { return root.localStorage.getItem(k) || ""; } catch (e) { return mem[k] || ""; } },
    set(k, v) {
      try { if (v) root.localStorage.setItem(k, v); else root.localStorage.removeItem(k); }
      catch (e) { if (v) mem[k] = v; else delete mem[k]; }
    },
  };
  const mem = {}; // when localStorage is not available (a sandboxed page): this page only
  const json = (k) => { try { const j = JSON.parse(store.get(k) || "null"); return j && typeof j === "object" ? j : null; } catch (e) { return null; } };
  const cleanName = (n) => (typeof n === "string" ? Array.from(n.replace(/[\x00-\x1f\x7f-\x9f]/g, "").trim()).slice(0, 64).join("").trim() : "");
  const shortAcct = (a) => (a && a.id ? { id: a.id, name: String(a.name || ""), kind: String(a.kind || ""), number: a.number || 0 } : null);

  function httpWhy(status) {
    return ({ 400: "the PC refused that request", 401: "sign-in needed", 403: "not allowed", 404: "not found on the PC",
      409: "that clashes with something on the PC", 410: "this page is out of date: reload it", 426: "this page is out of date: reload it",
      429: "too many requests: wait a minute", 502: "the program on the PC did not answer", 503: "the PC said it is busy or switched off" })[status] || `the PC answered ${status}`;
  }
  function netWhy(err, ms) {
    if (err && err.name === "AbortError") return `no answer from the PC within ${Math.round(ms / 1000)} s`;
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "this device is offline";
    return "could not reach the PC (no network, or the PC is off or asleep)";
  }
  function netKind(err) {
    if (err && err.name === "AbortError") return "timeout";
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "offline";
    return "network";
  }
  const kindOf = (status) => status === 401 ? "signin" : status === 426 || status === 410 ? "reload" : "http";

  class Relay {
    constructor(opts) {
      opts = opts || {};
      this.app = String(opts.app || "page").toLowerCase().replace(/[^a-z0-9-]/g, "");
      this.log = typeof opts.log === "function" ? opts.log : null;
      this.addressFile = opts.addressFile || "";
      this.status = { state: "idle", why: "", at: Date.now() };
      this.info = null;
      this.latency = 0;
      this.bytes = 0;
      this._me = null;
      this._subs = { status: new Set(), account: new Set() };
      this._job = null;
      this._readAt = 0;
      this._acctSeen = JSON.stringify(shortAcct(json(ACCOUNT_KEY)));
      this._setBase(opts.base);
      if (typeof opts.onStatus === "function") this._subs.status.add(opts.onStatus);
      if (typeof addEventListener === "function") {
        addEventListener("storage", (e) => { if (!e || e.key === ACCOUNT_KEY || e.key === PASS_KEY || e.key === null) this._acctChanged(); });
      }
    }
    // ---- the PC's address ---------------------------------------------------------------------------------------
    _setBase(url) {
      this.given = trim(url);
      this.base = this.given;
      this.where = this.given ? { url: this.given, from: "page", why: "" } : { url: "", from: "unread", why: "" };
      this._readAt = 0;
    }
    setBase(url) { if (trim(url) !== this.given) this._setBase(url); }
    _fileUrl() {
      if (this.addressFile) return this.addressFile;
      try { return new URL("../relay.json", root.location.href).href; } catch (e) { return "../relay.json"; }
    }
    async address() { await this._ready(); return this.where; }
    async _ready() {
      if (this.given) return;
      const w = this.where.from;
      if (w === "unread" || (w === "none" && Date.now() - this._readAt >= RECHECK_MS)) await this._read();
    }
    _read() {
      if (!this._job) this._job = this._readNow().finally(() => { this._job = null; });
      return this._job;
    }
    async _recheck() {
      if (this.given || this._job || Date.now() - this._readAt < RECHECK_MS) return false;
      const was = this.base;
      await this._read();
      return this.base !== was;
    }
    async _readNow() {
      this._readAt = Date.now();
      const file = this._fileUrl(), was = this.where;
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ADDRESS_MS);
      let why = "";
      try {
        const sep = file.includes("?") ? "&" : "?";
        const r = await fetch(`${file}${sep}t=${Date.now()}`, { cache: "no-store", credentials: "omit", signal: ac.signal });
        if (!r.ok) throw new Error(`the site answered ${r.status}`);
        const j = await r.json().catch(() => null);
        const a = trim(j && j.address);
        if (!goodAddress(a)) throw new Error(j ? "it holds no usable address" : "it is not JSON");
        if (this.given) return;
        this.base = a;
        this.where = { url: a, from: "file", why: "" };
        if (was.url !== a) this._note(`the PC's address: ${a} (from ${file})`, false);
        return;
      } catch (e) {
        why = e && e.name === "AbortError" ? `no answer within ${ADDRESS_MS / 1000} s`
          : typeof navigator !== "undefined" && navigator.onLine === false ? "this device is offline"
          : e && e.name === "TypeError" ? "the site could not be reached"
          : String((e && e.message) || e);
      } finally { clearTimeout(timer); }
      if (this.given || was.from === "file") return; // read fine earlier in this page's life: that address stays
      const text = `the PC's address (${file}) could not be read (${why}): the cloud is off`;
      this.base = "";
      this.where = { url: "", from: "none", why: text };
      if (was.why !== text) this._note(text, true);
    }
    _note(text, warn) {
      if (this.log) { try { this.log(text); } catch (e) {} }
      try { if (typeof console !== "undefined") (warn ? console.warn : console.info)("relay-client: " + text); } catch (e) {}
    }
    // ---- events ----
    on(what, fn) {
      if (typeof what === "function") { fn = what; what = "status"; }
      const set = this._subs[what];
      if (!set || typeof fn !== "function") return () => {};
      set.add(fn);
      return () => set.delete(fn);
    }
    _set(state, extra) {
      this.status = Object.assign({ state, why: "", at: Date.now() }, extra || {});
      for (const f of this._subs.status) { try { f(this.status); } catch (e) {} }
    }
    _acctChanged() {
      const now = JSON.stringify(this.account());
      if (now === this._acctSeen) return;
      this._acctSeen = now;
      const a = this.account();
      // another person (or nobody) now: the rights the last me() gave are not theirs; can() says no until me() is asked again
      if (!a || !this._me || !this._me.account || this._me.account.id !== a.id) this._me = null;
      for (const f of this._subs.account) { try { f(a); } catch (e) {} }
    }
    // ---- the pass and the account, kept in this browser ----
    _pass() { const r = json(PASS_KEY); return r && typeof r.pass === "string" ? r.pass : ""; }
    _keep(pass, account) {
      if (pass !== undefined) store.set(PASS_KEY, pass ? JSON.stringify({ pass, at: Date.now() }) : "");
      if (account !== undefined) store.set(ACCOUNT_KEY, account ? JSON.stringify(Object.assign(shortAcct(account), { at: Date.now() })) : "");
      this._acctChanged();
    }
    _forget(why) {
      if (!this._pass() && !this.account()) return;
      this._me = null;
      this._keep("", null);
      this._note("this browser's sign-in ended on the PC" + (why ? ` (${why})` : ""), false);
    }
    // An answer speaks only about the pass its request carried. While it was on its way, another tab of this browser
    // may have signed in or switched user: the browser then holds a new pass, and an answer about the old one ("pass
    // unknown", "no account", an older account) must not wipe or overwrite the new sign-in. _current(sent) says whether
    // the pass sent is still the one kept.
    _current(sent) { return sent === this._pass(); }
    _info(r, sent) { // every answer: the PC may say the pass is not valid any more
      const i = (r.headers && r.headers.get("X-Relay-Info")) || "";
      if (/pass-unknown/.test(i) && this._current(sent)) this._forget("the PC does not know it");
    }
    account() { return shortAcct(json(ACCOUNT_KEY)); }
    signedIn() { return !!this._pass(); }
    can(flag) { return !!(this._me && this._me.can.includes(flag)); }
    canUse(prog) { return prog === "files" || !!(this._me && this._me.programs.includes(prog)); }
    headers(extra) {
      const h = { "X-Relay-Client": this.app + "/" + VERSION };
      const p = this._pass();
      if (p) h["X-Relay-Pass"] = p;
      return Object.assign(h, extra || {});
    }
    // ---- addresses ----
    url(service, path) { return `${this.base}/svc/${service}/${String(path || "").replace(/^\/+/, "")}`; }
    wsUrl(service, path) { return this.url(service, path).replace(/^http/, "ws"); }
    wsProtocols() { const p = this._pass(); return p ? ["relay", "pass." + p] : ["relay"]; }
    ws(service, path) { return new WebSocket(this.wsUrl(service, path), this.wsProtocols()); }
    _off() { return { ok: false, status: 0, data: null, why: this.where.why || "the cloud is off", kind: "off" }; }
    // fetch through the relay: a Response (throws when the PC cannot be reached, or the address is not known)
    async fetch(service, path, opts) {
      opts = Object.assign({}, opts || {});
      const timeout = opts.timeout || 0; delete opts.timeout;
      await this._ready();
      if (!this.base) throw new TypeError(this.where.why || "the cloud is off");
      const sent = this._pass();
      opts.headers = this.headers(opts.headers);
      let timer = 0, ac = null;
      if (timeout && !opts.signal) { ac = new AbortController(); opts.signal = ac.signal; timer = setTimeout(() => ac.abort(), timeout); }
      try {
        const r = await fetch(this.url(service, path), opts);
        this._info(r, sent);
        return r;
      } catch (err) {
        if (ac || !(opts.signal && opts.signal.aborted)) this._recheck().catch(() => {});
        throw err;
      } finally { clearTimeout(timer); }
    }
    // _result: an answer read whole. A body that cannot be read (the page left, the connection dropped, a timeout
    // while reading) or a 2xx body that is not whole JSON is NOT ok: kind "network" (or "timeout"). Only a real,
    // whole answer from the PC may say anything about the sign-in (reader agent's find, 2026-11-12).
    async _result(r) {
      let text, cut = null;
      try { text = await r.text(); } catch (err) { text = ""; cut = err; }
      this.bytes += text.length;
      let data = null, bad = false;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; bad = true; }
      if (cut || (r.ok && bad)) {
        const kind = cut ? netKind(cut) : "network";
        const why = cut && kind === "timeout" ? "the PC's answer did not arrive in time" : "the PC's answer was cut off: try again";
        return { ok: false, status: r.status, data: null, why, kind, cut: true };
      }
      if (r.ok) return { ok: true, status: r.status, data, why: "", kind: "" };
      const why = (data && (data.why || data.error)) || httpWhy(r.status);
      const kind = (data && data.kind) || kindOf(r.status);
      if (r.status === 426) this._set("reload", { why });
      return { ok: false, status: r.status, data, why, kind, signin: r.status === 401 };
    }
    _body(opts) {
      opts = Object.assign({ cache: "no-store" }, opts || {});
      if (opts.json !== undefined) {
        opts.body = JSON.stringify(opts.json);
        opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
        delete opts.json;
      }
      return opts;
    }
    // call: a program's request with a JSON answer: { ok, status, data, why, kind }
    async call(service, path, opts) {
      opts = this._body(opts);
      const ms = opts.timeout || 0;
      let r;
      try { r = await this.fetch(service, path, opts); }
      catch (err) { return this.base ? { ok: false, status: 0, data: null, why: netWhy(err, ms), kind: netKind(err) } : this._off(); }
      return this._result(r);
    }
    // api: the relay's own request /relay/<path>: { ok, status, data, why, kind, current }. current: this browser
    // still holds the pass the request carried (false: its sign-in changed meanwhile, the answer is about the old one).
    async api(path, opts) {
      opts = this._body(opts);
      const ms = opts.timeout || 15000; delete opts.timeout;
      await this._ready();
      if (!this.base) return this._off();
      const sent = this._pass();
      opts.headers = this.headers(opts.headers);
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ms);
      opts.signal = opts.signal || ac.signal;
      try {
        const r = await fetch(`${this.base}/relay/${String(path).replace(/^\/+/, "")}`, opts);
        this._info(r, sent);
        const res = await this._result(r);
        res.current = this._current(sent);
        return res;
      } catch (err) {
        this._recheck().catch(() => {});
        return { ok: false, status: 0, data: null, why: netWhy(err, ms), kind: netKind(err) };
      } finally { clearTimeout(timer); }
    }
    // ---- the light check ----
    async ping(timeoutMs) {
      timeoutMs = timeoutMs || 8000;
      this._set("checking", { why: "checking the connection…" });
      await this._ready();
      if (!this.base) { const why = this.where.why || "the cloud is off"; this._set("off", { why }); return { ok: false, why, kind: "off" }; }
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), timeoutMs), t0 = performance.now();
      try {
        const sent = this._pass();
        const r = await fetch(`${this.base}/relay/ping?t=${Date.now()}`, { headers: this.headers(), cache: "no-store", signal: ac.signal });
        this._info(r, sent);
        if (!r.ok) { const res = await this._result(r); this._set(r.status === 426 ? "reload" : "offline", { why: res.why }); return { ok: false, why: res.why, kind: res.kind, status: r.status }; }
        const info = await r.json();
        this.latency = Math.round(performance.now() - t0);
        this.info = info;
        const name = cleanName(info && info.name);
        if (name) { this._pc = { base: this.base, name }; this._keepName(this.base, name); }
        if ((info.min_client || 0) > VERSION) { const why = "this page is out of date: reload it"; this._set("reload", { why }); return { ok: false, why, info, kind: "reload" }; }
        if (!this._current(sent)) { /* this browser's sign-in changed while the PC answered: the answer is about the old one */ }
        else if (info.pass === "unknown") this._forget("the PC does not know it");
        else if (info.account && this._pass()) this._keep(undefined, info.account);
        if (!info.on) { const why = "PC Relay is switched off (it is switched on at the computer)"; this._set("off", { why, info }); return { ok: false, why, info, kind: "off" }; }
        this._set("connected", { why: `connected (${this.latency} ms)`, info, latency: this.latency });
        return { ok: true, info, latency: this.latency };
      } catch (err) {

      if (performance.now() - last > 40) { await yieldNow(); last = performance.now(); if (o.signal && o.signal.aborted) throw new Cancelled(); }
    }
    const r = await put();
    if (r === "exists") return { ok: false, exists: true, why: `${name} is already there` };
    if (r !== "done" || !item) return { ok: false, why: "the PC did not keep it" };
    return { ok: true, item };
  } catch (e) {
    if (e instanceof Cancelled) throw e;
    return { ok: false, why: e.message, status: e.status, kind: e.kind };

}

// Save as: the Cloud File Manager's chooser in its save mode, at the top of the person's files. name: the name offered;
// fixed: the person typed it (else the chooser makes it free in each folder shown: "New file (2).txt"). Gives
// { folderId, folder, path, name, replace } or null. The window kit's own pick() asks for files; this asks for a place,
// with the same request on the same channel and one field more (save), which only the Cloud File Manager reads.
function savePick(name, fixed) {
  return new Promise((resolve) => {
    let port = null, done = false;
    const win = WindowKit.open("../file-manager/", { name: "file-manager-pick", title: `${NAME}: save as`, onClose: () => end(null) });
    const end = (v) => { if (done) return; done = true; try { if (port) port.close(); } catch (e) {} try { win.close(); } catch (e) {} resolve(v); };
    win.on("ready", () => {
      if (port) try { port.close(); } catch (e) {}
      const ch = new MessageChannel();
      port = ch.port1;
      port.onmessage = (e) => {
        const d = e.data || {};
        if (d.type === "picked" && d.kind === "save") end(d);
        else if (d.type === "cancel") end(null);
        else if (d.type === "error") { say(d.why || "The Cloud File Manager could not choose a place."); end(null); }
      };
      win.post({ wk: 1, type: "pick", version: WindowKit.VERSION, accept: [], multiple: false, files: false, folder: false, host: NAME, app: APP, keep: null, start: "", save: { name, fixed: !!fixed } }, [ch.port2]);
    });
  });
}

// ==== src/search.js ====
// search.js: the find bar at the bottom, like Sublime Text's (Jon, 2026-11-13). Only 🔍 or Ctrl+F opens it; a word
// selected then goes into the box. It searches as you type (no search button): the place found after the cursor is
// scrolled to the middle and marked strongly, every other place faintly. Next / Previous (Enter / Shift+Enter) step;
// Find All (Alt+Enter) marks them all as one set; Select makes real selections: the current place, or every place after
// Find All. Aa: capital letters must match; “ ”: whole words. The text is found exactly as typed, spaces and all.
// Replace (Ctrl+H) adds a row: Replace (this place, then the next) and Replace All (one step back with Ctrl+Z).
// The search reads CodeMirror's own text line by line: no copy of the text is made (Jon: "only one stored in memory").
// It runs in slices of about 12 ms, so typing never waits, even in a 600 MB file; a newer keystroke stops the older one.
// The places found are kept as numbers (where each starts); only the ones in view are drawn.
const MAXM = 2000000;                 // places kept (the count goes on past it)
const FIND = { open: false, q: "", caseOn: false, wordOn: false, M: [], len: 0, total: 0, cur: -1, mode: "one", gen: 0, done: true, stale: false, progress: 0, anchor: null, note: "" };

function buildMarks(v) {

  const b = new C.RangeSetBuilder(), M = FIND.M, len = FIND.len, end = v.state.doc.length;

      const a = M[i];

const searchMarks = C.ViewPlugin.fromClass(class {

const $f = (id) => document.getElementById(id);

function makeRe() {

        const a = pos + m.index;

        if (!m[0].length) re.lastIndex++;

  else if (!FIND.total) t = "No matches";
  else if (FIND.mode === "all") t = `All ${fmt(FIND.total)}${FIND.done ? "" : "…"}`;
  else t = `${FIND.cur >= 0 ? fmt(FIND.cur + 1) + " of " : ""}${fmt(FIND.total)}${FIND.done ? "" : "…"}${FIND.note ? " · " + FIND.note : ""}`;

// live in the Cloud File Manager's hidden program data (the files service's app/text-editor/data/<key>, under the person's

// only when something changed on it (typing, a tab opened, closed, moved, saved, renamed); a device that just opens and
// reads writes nothing, so it can never replace changes made elsewhere.

//   tab.<id>      { id, meta, content | parts, editedAt, device, title }: content is { text } (a small tab) or { changes }
//                 (a big tab whose file is in the Cloud File Manager: the file plus the changes); a value over 200,000
//                 characters is cut into parts tp.<id>.<device>.<a|b>.<n> (two slots per device, used in turn)

async function syncNow(why) {

// ==== src/preview.js ====
// preview.js: the Markdown preview, beside the text (under it on a phone). One button in the bar shows or hides it; a
// .md or .markdown file shows it by itself, any other tab when the button is pressed. Drawn by the Markdown kit
// (markdown-kit\markdown-kit.js: markdown-it, sanitized by DOMPurify); math, code colours and Mermaid diagrams are
// loaded the first time a file has them (md\ beside the page). The preview follows the text as it changes and as it

// other files in the Cloud File Manager open them in a tab, web links open in a new browser tab.
const MDP = { on: false, tab: null, gen: 0, timer: 0, outline: [], marks: null, ys: null, lock: "", lockUntil: 0, dark: null, pending: false };

const MD_NAME = /\.(md|markdown|mdown|mkd|mkdn)$/i;

const $p = (id) => document.getElementById(id);
const mdBtn = $p("mdview");
const pane = document.createElement("section");
pane.className = "mdpane";
pane.id = "mdpane";
pane.hidden = true;
pane.setAttribute("aria-label", "Preview");
pane.innerHTML = `<div class="mdhead"><button type="button" id="mdoutline" aria-expanded="false" title="The headings: click one to go there">Outline</button><span class="mdnote" id="mdnote"></span><button type="button" id="mdupdate" hidden>Update</button></div>`
  + `<div class="mdtoc" id="mdtoc" hidden></div><div class="mdscroll" id="mdscroll"><article class="md-body" id="mdbody"></article></div>`;
edEl.append(pane);
const mdScroll = $p("mdscroll"), mdBody = $p("mdbody"), mdToc = $p("mdtoc"), mdNote = $p("mdnote"), mdUpd = $p("mdupdate"), mdOut = $p("mdoutline");

// ---- Which tabs show it (per device, by tab: localStorage te-preview) -------------------------------------------------
const PV_KEY = "te-preview";

const wantsPreview = (tab) => !!tab && !tab.loading && (tab.id in pvChoice ? pvChoice[tab.id] : MD_NAME.test(tab.name || ""));
function togglePreview() {

  for (const k of Object.keys(pvChoice)) if (!tabs.some((t) => t.id === k)) delete pvChoice[k];
  try { localStorage.setItem(PV_KEY, JSON.stringify(pvChoice)); } catch (e) {}
  previewSync(true);
}
mdBtn.addEventListener("click", (e) => { if (e.detail > 0) e.currentTarget.blur(); togglePreview(); });

// Called when a tab is shown, painted or renamed: the pane on or off for it, drawn again when the tab changed.
function previewSync(force) {
  const tab = active, on = wantsPreview(tab);
  mdBtn.setAttribute("aria-pressed", String(on));
  if (on === MDP.on && tab === MDP.tab && !force) { if (on && tab.parent) fillImages(tab); return; }   // its folder may be known only now
  const fresh = tab !== MDP.tab;

  if (!on) { clearTimeout(MDP.timer); mdBody.replaceChildren(); MDP.marks = MDP.ys = null; MDP.outline = []; drawToc(); return; }
  if (fresh || force) { mdBody.replaceChildren(); mdScroll.scrollTop = 0; }
  renderPreview("show");
}
// Every change of the text: drawn again after a pause (longer for longer texts); past 2 MB only on Update.
function previewChanged() {
  if (!MDP.on) return;
  const n = cm.state.doc.length;
  clearTimeout(MDP.timer);
  if (n > LIVE_MAX) { MDP.pending = true; showNote(); return; }
  MDP.timer = setTimeout(() => renderPreview("live"), n < 100000 ? 150 : n < 1000000 ? 400 : 1000);
}
function showNote() {
  const n = cm.state.doc.length;
  mdUpd.hidden = !(n > LIVE_MAX && n <= PREVIEW_MAX && MDP.pending);
  mdNote.textContent = n > PREVIEW_MAX ? "Too big to preview (over 20 MB)" : n > LIVE_MAX ? (!MDP.pending ? "Big file: the preview is not live" : mdBody.childElementCount ? "Big file: press Update to see the changes" : "Big file: press Update to see the preview") : "";

mdUpd.addEventListener("click", () => renderPreview("user"));

const isDark = () => view.theme === "dark" || (view.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
function previewTheme() {
  const d = isDark();
  if (d === MDP.dark) return;
  const redraw = MDP.dark !== null && mdBody.querySelector(".md-drawn");
  MDP.dark = d;
  MarkdownKit.theme(d);

// mode: "show" (the tab was just shown), "live" (typing), "user" (Update, or again once a library came). Over 2 MB only
// "user" draws: laying out a few MB of HTML holds the page for seconds.
function renderPreview(mode) {
  const tab = MDP.tab;
  if (!MDP.on || !tab || tab.loading || tab !== shownTab) return;
  const n = cm.state.doc.length;
  showNote();
  if (n > PREVIEW_MAX) { mdBody.replaceChildren(); MDP.outline = []; drawToc(); return; }
  if (n > LIVE_MAX && mode !== "user") { MDP.pending = true; if (!mdBody.childElementCount) MDP.outline = []; showNote(); drawToc(); return; }
  MDP.pending = false;
  showNote();
  previewTheme();
  const gen = ++MDP.gen, t0 = performance.now();
  let d;
  try { d = MarkdownKit.renderDoc(cm.state.doc.toString(), { localImages: false }); }
  catch (e) { mdNote.textContent = "The preview failed: " + (e.message || e); log("error", "preview: " + (e.message || e), e); return; }
  morph(d.html);
  MDP.outline = d.outline;
  MDP.marks = MDP.ys = null;
  drawToc();
  const ms = performance.now() - t0;
  if (ms > 300) log("preview", `${titleOf(tab)} drawn in ${Math.round(ms)} ms (${fmt(n)} characters)`);
  fillImages(tab);
  const need = Object.keys(d.needs).filter((k) => d.needs[k] && k !== "diagrams");
  if (need.length) MarkdownKit.load(need).then(() => { if (gen === MDP.gen) { mdBody.replaceChildren(); renderPreview("user"); } }, (e) => log("preview", "not loaded: " + (e.message || e)));
  if (d.needs.diagrams) MarkdownKit.diagrams(mdBody, { dark: isDark() }).then(() => { MDP.ys = null; }, (e) => log("preview", "diagrams not drawn: " + (e.message || e)));
  requestAnimationFrame(() => syncFromEditor(true));
}

// The new HTML into the pane, changing only the blocks that changed: the same blocks at the start and at the end stay
// (their line numbers brought up to date), so pictures, diagrams and the place on screen do not jump.
const keyOf = (html) => html.replace(/ data-line="\d+"/g, "");
function morph(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  const next = [...tpl.content.children];
  const old = [...mdBody.children];
  const nk = next.map((el) => keyOf(el.outerHTML));
  let a = 0;
  while (a < old.length && a < next.length && old[a].__k === nk[a]) a++;
  let b = 0;
  while (b < old.length - a && b < next.length - a && old[old.length - 1 - b].__k === nk[next.length - 1 - b]) b++;
  const copyLines = (o, nw) => {
    if (nw.hasAttribute("data-line")) o.setAttribute("data-line", nw.getAttribute("data-line"));
    const x = o.querySelectorAll("[data-line]"), y = nw.querySelectorAll("[data-line]");
    if (x.length === y.length) for (let i = 0; i < x.length; i++) x[i].setAttribute("data-line", y[i].getAttribute("data-line"));
  };
  for (let i = 0; i < a; i++) copyLines(old[i], next[i]);
  for (let i = 0; i < b; i++) copyLines(old[old.length - 1 - i], next[next.length - 1 - i]);
  const before = b ? old[old.length - b] : null;
  for (let i = a; i < old.length - b; i++) old[i].remove();
  const frag = document.createDocumentFragment();
  for (let i = a; i < next.length - b; i++) { next[i].__k = nk[i]; frag.append(next[i]); }
  mdBody.insertBefore(frag, before);
}

// ---- Scroll sync, both ways, by source lines ----------------------------------------------------------------------------
// marks: the blocks with data-line, in order (lines never going back: the footnotes at the end are left out); ys: where
// each one starts in the pane, measured when first needed after a change.
function marks() {
  if (MDP.marks) return MDP.marks;
  const out = [];

    const l = Number(el.getAttribute("data-line"));

function ys() {

new ResizeObserver(() => { MDP.ys = null; }).observe(mdBody);
mdBody.addEventListener("load", () => { MDP.ys = null; }, true);          // a picture came in: the blocks moved
const lockFor = (side, ms = 120) => { MDP.lock = side; MDP.lockUntil = performance.now() + ms; };

// The line at the top of the text, with the part of it above the top: 12.25.
function editorLine() {
  const h = cm.scrollDOM.scrollTop, b = cm.lineBlockAtHeight(h);

}
function syncFromEditor(force) {
  if (!MDP.on || (!force && locked("preview"))) return;
  const m = marks();
  if (!m.length) return;
  const sd = cm.scrollDOM;
  let y;
  if (sd.scrollTop <= 1) y = 0;
  else if (sd.scrollTop + sd.clientHeight >= sd.scrollHeight - 2) y = mdScroll.scrollHeight;
  else {
    const L = editorLine(), Y = ys();
    let lo = 0, hi = m.length - 1, i = -1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (m[mid].l <= L) { i = mid; lo = mid + 1; } else hi = mid - 1; }
    if (i < 0) y = (Y[0] * (L - 1)) / Math.max(1, m[0].l - 1);
    else {
      let j = i + 1;
      while (j < m.length && m[j].l === m[i].l) j++;
      const nl = j < m.length ? m[j].l : cm.state.doc.lines + 1, ny = j < m.length ? Y[j] : mdBody.offsetHeight;
      y = Y[i] + ((L - m[i].l) / Math.max(1, nl - m[i].l)) * (ny - Y[i]);

}
function syncFromPreview() {
  if (!MDP.on || locked("editor")) return;
  const m = marks();
  if (!m.length) return;
  let L;
  const y = mdScroll.scrollTop + 6;
  if (mdScroll.scrollTop <= 1) L = 1;
  else {
    const Y = ys();
    let lo = 0, hi = m.length - 1, i = -1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (Y[mid] <= y) { i = mid; lo = mid + 1; } else hi = mid - 1; }
    if (i < 0) L = 1;
    else {
      let j = i + 1;
      while (j < m.length && Y[j] <= Y[i] + 0.5) j++;
      const nl = j < m.length ? m[j].l : cm.state.doc.lines + 1, ny = j < m.length ? Y[j] : mdBody.offsetHeight;
      L = m[i].l + ((y - Y[i]) / Math.max(1, ny - Y[i])) * (nl - m[i].l);
    }

  const b = cm.lineBlockAt(doc.line(n).from);

  cm.scrollDOM.scrollTop = b.top + (L - n) * b.height;

}
cm.scrollDOM.addEventListener("scroll", () => syncFromEditor(false), { passive: true });
mdScroll.addEventListener("scroll", syncFromPreview, { passive: true });
// A double click in the preview puts the cursor on that line of the text.
mdBody.addEventListener("dblclick", (e) => {
  const el = e.target.closest("[data-line]");
  if (!el) return;
  const doc = cm.state.doc, line = doc.line(Math.max(1, Math.min(doc.lines, Number(el.getAttribute("data-line")))));
  cm.dispatch({ selection: { anchor: line.from }, effects: C.EditorView.scrollIntoView(line.from, { y: "center" }) });

// ---- The outline ------------------------------------------------------------------------------------------------------
function drawToc() {
  mdOut.disabled = !MDP.outline.length;
  mdOut.textContent = MDP.outline.length ? `Outline (${fmt(MDP.outline.length)})` : "Outline";
  if (mdToc.hidden) return;
  const min = Math.min(...MDP.outline.map((h) => h.level));
  mdToc.replaceChildren(...MDP.outline.slice(0, 5000).map((h, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = h.text || "(no words)"; b.dataset.i = i;
    b.style.paddingLeft = `calc(${(h.level - min) * 1.1}em + .7em)`;
    return b;
  }));

  markToc(editorLine());
}
function markToc(L) {

mdOut.addEventListener("click", () => {

mdToc.addEventListener("click", (e) => {

  if (!el) return false;

  const doc = cm.state.doc, line = doc.line(Math.max(1, Math.min(doc.lines, Number(el.getAttribute("data-line")) || 1)));
  cm.scrollDOM.scrollTop = cm.lineBlockAt(line.from).top;

// ---- Links and pictures -------------------------------------------------------------------------------------------------
// A path relative to the tab's folder in the Cloud File Manager: the file's entry, or null. Folder lists kept 10 s.
const folderCache = new Map();
async function listFolder(id) {
  const c = folderCache.get(id);
  if (c && Date.now() - c.at < 10000) return c.data;
  const r = await R.call("files", "list?folder=" + encodeURIComponent(id), { timeout: 20000 });
  if (!r.ok || !r.data) return null;
  folderCache.set(id, { at: Date.now(), data: r.data });
  return r.data;
}
async function findCloud(parent, rel) {
  let parts;
  try { parts = decodeURIComponent(rel).replace(/\\/g, "/").split("/"); } catch (e) { parts = rel.split("/"); }
  parts = parts.filter((p) => p && p !== ".");
  let folder = parent;
  for (let k = 0; k < parts.length; k++) {
    const d = await listFolder(folder);
    if (!d) return null;
    if (parts[k] === "..") { folder = d.folder && d.folder.parent; if (!folder) return null; continue; }
    const it = (d.items || []).find((x) => x.name.toLowerCase() === parts[k].toLowerCase());
    if (!it) return null;
    if (k === parts.length - 1) return it.dir ? null : it;
    if (!it.dir) return null;
    folder = it.id;
  }
  return null;
}
async function findByName(name) {        // a wiki link names a note, wherever it is: the files service's search
  const r = await R.call("files", "search?q=" + encodeURIComponent(name), { timeout: 20000 });
  const items = (r.ok && r.data && r.data.items) || [];
  return items.find((x) => !x.dir && x.name.toLowerCase() === name.toLowerCase()) || null;
}
mdBody.addEventListener("click", async (e) => {
  const a = e.target.closest("a[href]");
  if (!a || e.button !== 0) return;
  e.preventDefault();
  const href = a.getAttribute("href");
  if (href.startsWith("#")) { let id = href.slice(1); try { id = decodeURIComponent(id); } catch (x) {} goToId(id); return; }
  if (/^(https?:|mailto:|tel:)/i.test(href)) { window.open(href, "_blank", "noopener,noreferrer"); return; }
  if (/^[a-z][a-z0-9+.-]*:/i.test(href)) return;
  const tab = MDP.tab;
  const [path, hash] = [href.split("#")[0], href.includes("#") ? href.slice(href.indexOf("#") + 1) : ""];
  if (!path) return;
  if (!tab || tab.source !== "cloud" || !tab.parent) { say("This file is not in the Cloud File Manager, so the files it links to cannot be found.", null, 8000); return; }
  say("Opening the link…");
  let it = await findCloud(tab.parent, path);
  if (!it && a.classList.contains("md-wikilink")) { let n = path.split("/").pop(); try { n = decodeURIComponent(n); } catch (x) {} it = await findByName(n); }
  if (!it) { say(`Not found in the Cloud File Manager: ${decodeURIComponentSafe(path)}`, null, 8000); return; }
  say("");
  if ((await openCloud(it.id)) && hash) setTimeout(() => goToId(decodeURIComponentSafe(hash)), 80);   // the new tab's preview is drawn by now
});
function decodeURIComponentSafe(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
// Pictures with a relative path: read from the tab's folder in the Cloud File Manager (kept while the page is open).
const images = new Map();
function fillImages(tab) {
  const held = mdBody.querySelectorAll("img.md-held[data-src]");
  if (!held.length) return;
  for (const img of held) {
    if (img.dataset.miss) continue;
    const src = img.getAttribute("data-src");
    if (!/^([a-z][a-z0-9+.-]*:|\/\/)/i.test(src)) {
      if (tab.source !== "cloud" || !tab.parent) { img.title = "This picture is beside the file, and this file is not in the Cloud File Manager"; continue; }
      const key = tab.parent + "|" + src;
      if (!images.has(key)) images.set(key, findCloud(tab.parent, src).then(async (it) => {
        if (!it) return "";
        const res = await R.fetch("files", "file/" + it.id, { cache: "no-store" });
        return res.ok ? URL.createObjectURL(await res.blob()) : "";
      }).catch(() => ""));
      images.get(key).then((url) => {
        if (!img.isConnected) return;
        if (url) { img.src = url; img.classList.remove("md-held"); img.removeAttribute("data-src"); }
        else { images.delete(key); img.dataset.miss = "1"; img.title = "Not found in the Cloud File Manager: " + src; }
      });
    }
  }
}

// ==== src/app.js ====
// app.js: the bar's buttons, the keys, the line under the tabs, dropping files, one editor per browser, and the start.
const $a = (id) => document.getElementById(id);

// ---- The line under the tabs, the name box, the counts -----------------------------------------------------------

  $a("pos").textContent = `Line ${fmt(line.number)}, column ${fmt(main.head - line.from + 1)}` + (sel > 1 ? ` · ${fmt(sel)} cursors` : "") + (chars ? ` · ${fmt(chars)} selected` : "");
  if (onlyPos) return;
  if (fresh) words = null;
  drawCount();
  clearTimeout(countTimer);
  if (st.doc.length > 50 * MB) { words = -1; drawCount(); return; }
  const gen = ++countGen;
  countTimer = setTimeout(async () => {
    let n = 0, t0 = performance.now();
    const it = cm.state.doc.iterLines();
    for (let r = it.next(); !r.done; r = it.next()) {
      const s = r.value;
      let inWord = false;
      for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i), sp = c === 32 || c === 9 || c === 160 || c === 12; if (!sp && !inWord) n++; inWord = !sp; }
      if (performance.now() - t0 > 12) { await yieldNow(); if (gen !== countGen) return; t0 = performance.now(); }
    }
    words = n; drawCount();
  }, cm.state.doc.length > 2 * MB ? 800 : 60);
}
function drawCount() {
  const d = cm.state.doc;
  const w = words === -1 ? "" : words === null ? " · counting words…" : ` · ${fmt(words)} ${words === 1 ? "word" : "words"}`;
  $a("count").textContent = `${fmt(d.lines)} ${d.lines === 1 ? "line" : "lines"}${w} · ${fmt(d.length)} characters`;
}

// ---- Questions after the person's own press, the ⋯ menu, Go to line, Keys ----------------------------------------
function ask(title, line, buttons, input) {
  return new Promise((done) => {
    const box = document.createElement("div");
    box.className = "ask";
    box.innerHTML = `<div role="alertdialog" aria-modal="true"><h2></h2><p></p><div class="row"></div></div>`;
    box.querySelector("h2").textContent = title;
    box.querySelector("p").textContent = line;
    let field = null;
    if (input) { field = document.createElement("input"); Object.assign(field, input); box.querySelector("p").after(field); }
    const end = (v) => { box.remove(); removeEventListener("keydown", key, true); done(v === null ? null : field ? { v, value: field.value } : v); };
    const key = (e) => {
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); end(null); }
      else if (e.key === "Enter" && field && document.activeElement === field) { e.preventDefault(); end(buttons.find((b) => b.primary).value); }
    };
    for (const b of buttons) {
      const el = document.createElement("button");
      el.type = "button"; el.textContent = b.label; if (b.primary) el.className = "primary";
      el.addEventListener("click", () => end(b.value));
      box.querySelector(".row").append(el);
    }
    box.addEventListener("click", (e) => { if (e.target === box) end(null); });
    addEventListener("keydown", key, true);
    document.body.append(box);
    (field || box.querySelector("button.primary")).focus();
    if (field) field.select();
  });
}
async function goToLine() {
  if (!active || active.loading) return;
  const n = cm.state.doc.lines;
  const r = await ask("Go to line", `1 to ${fmt(n)}. A colon adds the column: 120:8`, [{ label: "Cancel", value: null }, { label: "Go", value: "go", primary: true }],
    { type: "text", inputMode: "numeric", value: String(cm.state.doc.lineAt(cm.state.selection.main.head).number), autocomplete: "off" });
  if (!r) { cm.focus(); return; }
  const m = /^\s*(\d+)\s*(?::\s*(\d+))?\s*$/.exec(r.value);
  if (m) {
    const line = cm.state.doc.line(Math.max(1, Math.min(n, Number(m[1]))));
    const pos = Math.min(line.to, line.from + Math.max(0, Number(m[2] || 1) - 1));
    cm.dispatch({ selection: { anchor: pos }, effects: C.EditorView.scrollIntoView(pos, { y: "center" }) });
  }
  cm.focus();
}
function menu(anchor, items) {
  const shield = document.createElement("div"), m = document.createElement("div");
  shield.className = "shield"; m.className = "menu"; m.setAttribute("role", "menu");
  const close = () => { m.remove(); removeEventListener("keydown", key, true); };
  const key = (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); shield.remove(); anchor.focus(); } };
  // A press off the menu only closes it: the layer stays until that press's click has come, and takes it.
  shield.addEventListener("pointerdown", (e) => { e.preventDefault(); close(); setTimeout(() => shield.remove(), 600); });
  shield.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); shield.remove(); }, true);
  shield.addEventListener("contextmenu", (e) => { e.preventDefault(); close(); shield.remove(); });
  for (const it of items) {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "menuitem");
    const l = document.createElement("span"); l.textContent = it.label; b.append(l);
    if (it.keys) { const k = document.createElement("kbd"); k.textContent = it.keys; b.append(k); }
    b.addEventListener("click", () => { close(); shield.remove(); it.run(); });
    m.append(b);
  }
  document.body.append(shield, m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth;
  m.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + "px";
  m.style.top = r.bottom + 6 + "px";
  addEventListener("keydown", key, true);
  m.querySelector("button").focus();
}
function keysWindow() {
  const w = FLOAT.open("keys", { title: "Keys", width: 480, height: 640 });
  const rows = [
    ["Files and tabs", [["Ctrl+S", "Save"], ["Ctrl+O", "Open"], ["Middle-click a tab", "Close it"], ["Drag a tab", "Put it somewhere else"], ["Drop a file", "Open it in a new tab"], ["Ctrl+G", "Go to line"]]],
    ["Find", [["Ctrl+F", "Find (a selected word goes in)"], ["Ctrl+H", "Find and replace"], ["Enter, Shift+Enter", "Next, previous (F3, Shift+F3 too)"], ["Alt+Enter", "Find all"], ["Escape", "Close the find bar"]]],
    ["Cursors and selecting", [["Ctrl+D", "Add the next match of the word or selection"], ["Alt+F3", "Select every match"], ["Ctrl+click", "Add a cursor"], ["Middle-drag", "Select a block (columns)"],
      ["Ctrl+Alt+↑ ↓", "Add a cursor above or below"], ["Ctrl+Shift+L", "A cursor at the end of each selected line"], ["Ctrl+L", "Select the line"], ["Escape", "Back to one cursor"]]],
    ["Lines and text", [["Tab", "A tab character (its width: Settings)"], ["Ctrl+Shift+↑ ↓", "Move the line up or down"], ["Ctrl+Shift+D", "Duplicate the line"], ["Ctrl+Shift+K", "Delete the line"],
      ["Ctrl+Enter", "A new line below"], ["Ctrl+Shift+Enter", "A new line above"], ["Ctrl+J", "Join with the next line"], ["Ctrl+] Ctrl+[", "Indent, outdent the line"], ["F9", "Sort the selected lines"],
      ["Ctrl+Z, Ctrl+Y", "Undo, redo"], ["Ctrl+K Ctrl+U", "UPPER CASE"], ["Ctrl+K Ctrl+L", "lower case"], ["Ctrl+T", "Swap two letters"]]],
  ];
  const box = document.createElement("div");
  box.className = "keys";
  for (const [h, list] of rows) {
    const h3 = document.createElement("h3"); h3.textContent = h; box.append(h3);
    const t = document.createElement("table");
    for (const [k, what] of list) {
      const tr = t.insertRow(), a = tr.insertCell(), b = tr.insertCell();
      for (const part of k.split(/(, )/)) { if (part === ", ") a.append(part); else { const kb = document.createElement("kbd"); kb.textContent = part; a.append(kb); } }
      b.textContent = what;
    }
    box.append(t);
  }
  w.body.replaceChildren(box);
}

// ---- The buttons, the name, dropping files, the keys --------------------------------------------------------------
const blurAfter = (fn) => (e) => { if (e.detail > 0) e.currentTarget.blur(); fn(e); };
$a("new").addEventListener("click", blurAfter(() => newTab()));
async function openChooser(anchor) {
  if (active && active.loading) return say(`Wait for ${titleOf(active)} to open, or press Cancel.`, null, 5000);
  const d = await cloud.open({ anchor });         // Cloud File Manager first, then This device; any kind of file
  if (!d) return;
  if (d.source === "cloud" && d.id) await openCloud(d.id, d.file);
  else if (d.file) await openDevice(d.file);
}
$a("open").addEventListener("click", (e) => openChooser(e.currentTarget));
$a("save").addEventListener("click", blurAfter(() => save()));
$a("find").addEventListener("click", blurAfter(() => (FIND.open ? closeFind() : openFind(false))));
$a("gear").addEventListener("click", blurAfter(() => settingsWindow()));
$a("more").addEventListener("click", (e) => menu(e.currentTarget, [
  { label: "Go to line", keys: "Ctrl+G", run: goToLine },
  { label: "Save a copy on this device", run: downloadCopy },
  { label: "Keys", run: keysWindow },
]));
// The name: click, type, Enter (Escape puts it back). A file in the Cloud File Manager is renamed there too; a tab with
// no file keeps it as the name Save offers.
nameEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); nameEl.blur(); }
  else if (e.key === "Escape") { e.preventDefault(); nameEl.value = active && active.named ? active.name : ""; nameEl.blur(); }
});
nameEl.addEventListener("change", async () => {
  const tab = active;
  const want = cleanName(nameEl.value);
  if (!tab || !want || want === tab.name) { paintName(); return; }
  if (tab.source === "cloud" && tab.fileId && tab.writable !== false) {
    const r = await R.call("files", "rename", { method: "POST", json: { id: tab.fileId, name: want }, timeout: 20000 });
    if (!r.ok) { say((r.data && r.data.kind) === "exists" ? `There is already a file called ${want} there.` : `Not renamed: ${r.why}`, null, 8000); paintName(); return; }
    Object.assign(tab, { fileId: r.data.item.id, name: r.data.item.name });
    if (tab.large && tab.base && tab.base.kind === "cloud") tab.base.id = r.data.item.id;
  } else Object.assign(tab, { name: want, named: true, typed: true });
  keepNow(tab); markChanged(tab); updateTab(tab); paint(); paintName();
});
nameEl.addEventListener("blur", () => setTimeout(paintName, 0));
// Files dropped on the page from this computer: each in a new tab.
addEventListener("dragover", (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
addEventListener("drop", async (e) => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  for (const f of [...e.dataTransfer.files]) { if (active && active.loading) break; await openDevice(f); }
});
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(), mod = (e.ctrlKey || e.metaKey) && !e.altKey;
  if (mod && !e.shiftKey && k === "s") { e.preventDefault(); save(); }
  else if (mod && !e.shiftKey && k === "f") { e.preventDefault(); openFind(false); }
  else if (mod && !e.shiftKey && k === "h") { e.preventDefault(); openFind(true); }
  else if (mod && !e.shiftKey && k === "o") { e.preventDefault(); openChooser($a("open")); }
  else if (mod && !e.shiftKey && k === "g" && !cm.hasFocus) { e.preventDefault(); goToLine(); }
  else if (e.key === "F3" && !e.altKey && FIND.q) { e.preventDefault(); if (!FIND.open) openFind(false); step(e.shiftKey ? -1 : 1); }
});
// Another person at this browser (signed in, out, switched): each person has their own tabs. Everything is kept, then the
// page starts again for the new person (a guest made silently at a first save is the same person: nothing to do).
let startedAs = null;
cloud.on("account", () => {
  if (makingGuest || !ready) return;
  const now = (R.account() || {}).id || "none";
  if (startedAs && now !== startedAs && !(startedAs === "none" && makingGuest)) { keepAll(); saveSession(); log("tab", "another person at this browser: their tabs"); setTimeout(() => location.reload(), 400); }
});

// ---- One editor per browser ------------------------------------------------------------------------------------------
// Two tabs of the browser writing the same live tabs would undo each other. The first one keeps them; a second one sends
// a file it was opened for to the first, and says the editor is open there, with one button to move it here instead.
const chan = "BroadcastChannel" in window ? new BroadcastChannel("text-editor") : null;
const me = Math.random().toString(36).slice(2);
let owner = false;
function hearOthers() {
  if (!chan) return;
  chan.onmessage = async (e) => {
    const m = e.data || {};
    if (!owner) return;
    if (m.type === "hello") chan.postMessage({ type: "here", to: m.from });
    else if (m.type === "open" && m.id) { log("tab", "a file sent from another browser tab"); await openCloud(m.id); chan.postMessage({ type: "opened", to: m.from }); try { window.focus(); } catch (x) {} }
    else if (m.type === "take" && m.from !== me) { keepAll(); owner = false; elsewhere("The Text editor moved to another tab.", false); }
  };
}
function someoneThere() {
  if (!chan) return Promise.resolve(false);
  return new Promise((ok) => {
    const t = setTimeout(() => { chan.removeEventListener("message", on); ok(false); }, 350);
    const on = (e) => { if (e.data && e.data.type === "here" && e.data.to === me) { clearTimeout(t); chan.removeEventListener("message", on); ok(true); } };
    chan.addEventListener("message", on);
    chan.postMessage({ type: "hello", from: me });
  });
}
function elsewhere(text, canTake) {
  const box = document.createElement("div");
  box.className = "elsewhere";
  box.innerHTML = `<div><h2></h2><p>Your tabs are kept there. Closing this browser tab loses nothing.</p><button type="button">Use the editor here instead</button></div>`;
  box.querySelector("h2").textContent = text;
  box.querySelector("button").addEventListener("click", () => { chan.postMessage({ type: "take", from: me }); location.reload(); });
  document.body.append(box);
}

// ---- The start ---------------------------------------------------------------------------------------------------
let ready = false;
window.EDITOR = {
  cm, cloud, relay: R, FIND, get tabs() { return tabs; }, get active() { return active; }, get ready() { return ready; },
  save, newTab, openCloud, openDevice, closeTab, activate, isDirty, text: () => cm.state.doc.toString(), syncNow, SYNC,
  openFind, closeFind, step, findAll, selectFound, replaceOne, replaceAll, keepAll, settingsWindow, readText, view, applyView,
  togglePreview, PREVIEW: MDP,
};
(async () => {
  applyView(false);
  hearOthers();
  const openId = (/[#&]open=([0-9a-f]{20})/.exec(location.hash) || [])[1] || "";
  if (await someoneThere()) {
    if (openId) { chan.postMessage({ type: "open", id: openId, from: me }); elsewhere("This file opened in your other Text editor tab.", true); try { window.close(); } catch (e) {} }
    else elsewhere("The Text editor is open in another tab of this browser.", true);
    log("tab", "another tab of this browser has the editor");
    return;
  }
  owner = true;
  startedAs = (R.account() || {}).id || "none";
  const want = await startTabs();
  log("start", `${window.APP_VERSION}: ${tabs.length} ${tabs.length === 1 ? "tab" : "tabs"} brought back${memoryText() ? "; " + memoryText() : ""}`);
  cloud.start().then(() => { paint(); syncNow("start"); });
  if (openId) {
    history.replaceState(null, "", location.pathname + location.search);   // a reload opens the tabs, not this file again
    await cloud.start();
    await activate(want);
    await openCloud(openId);
  } else await activate(want);
  ready = true;
})();
})();
</script>
