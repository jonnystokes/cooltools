<script>
// relay-client:begin (copied from Projects\pc-relay\client\relay-client.js by build_page.py; edit it there)
/* relay-client.js 3: the PC Relay client (ONE source: Projects\pc-relay\client\relay-client.js; each page's build
   copies it in, so never edit a copy). Talks to PC Relay 3 (accounts) on Jon's PC. The relay decides every request;
   this file carries the pass, remembers who this browser is, and says plainly what the PC answered.
   The exact requests: Projects\cool-tools-upgrade\API-relay.md.

   - Nothing happens until the page calls something: no background traffic of its own (seen() is the page's call).
   - The PC's address: read from relay.json beside the programs ("../relay.json" from a program's page, or
     opts.addressFile), fresh before the first connection and again after a failed one (at most once a minute).
     {"address": "https://..."}; http only for 127.0.0.1 and localhost (the stage). No address is built in: if the file
     cannot be read the cloud is simply off, with a plain reason (status "off", where.why). opts.base names the address
     instead (tests, the relay's own window on the local door).
   - Kept in this browser (localStorage, shared by every page of the site): "relay-pass" ({pass, device, at}) and
     "relay-account" ({id, name, kind, number, at}), so the name shows at once, even with the cloud off. Another tab's
     sign-in, sign-out or change arrives as an "account" event.
   - The pass goes in the X-Relay-Pass header (HTTP) or the WebSocket subprotocol "pass.<p>"; never in a URL.
   - When the PC says the pass is not valid any more (X-Relay-Info: pass-unknown, or the ping's pass "unknown"), the
     pass and the account are forgotten and "account" fires with null. me() forgets them only on a whole answer that
     says {account: null}. An answer cut off, garbled or late, a timeout or a network error never ends a sign-in:
     it is a result with ok false and kind "network" or "timeout".
   - Errors from the relay are { why, kind }; every result here carries why and kind.

   const R = RelayClient.create({ app: "plan-cutter", log });
   await R.ping();                 // { ok, latency, info }
   R.account();                    // at once, from this browser: { id, name, kind, number } or null
   await R.me();                   // from the PC: { ok, account, can, programs, network, limited }
   R.can("files.shared.change");  R.canUse("voice");      // from the last me()
   await R.accountsHere();         // { ok, accounts: [{ id, name, kind, number, picture, hasPassword }] }
   await R.signIn(name, password); // { ok, kind, why, account }
   await R.signOut();              // { ok }
   await R.guest();                // { ok, account }  (a guest for this browser; itself when it has an account)
   await R.setup({ name, password });   // { ok, kind, why, account }
   await R.update({ name, password });  // { ok, kind, why, account }   (password: null removes it)
   R.seen();                       // "this app is open" (call once a minute while the page is visible)
   R.on("account", fn);            // fn(account or null)
   R.on("status", fn);             // fn({ state: checking|connected|off|offline|starting|ready|reload, why })
   await R.api("people");          // any /relay/ request: { ok, status, data, why, kind }

(function (root) {

  const goodAddress = (a) =>
    /^https:\/\/[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:\d{1,5})?$/i.test(a) ||
    /^http:\/\/(127\.0\.0\.1|localhost)(:\d{1,5})?$/i.test(a);
  const store = {
    get(k) { try { return root.localStorage.getItem(k) || ""; } catch (e) { return mem[k] || ""; } },
    set(k, v) {
      try { if (v) root.localStorage.setItem(k, v); else root.localStorage.removeItem(k); }
      catch (e) { if (v) mem[k] = v; else delete mem[k]; }
    },
  };

      this.info = null;
      this.latency = 0;
      this.bytes = 0;

      if (typeof addEventListener === "function") {

      }
    }
    // ---- the PC's address ---------------------------------------------------------------------------------------
    _setBase(url) {
      this.given = trim(url);
      this.base = this.given;
      this.where = this.given ? { url: this.given, from: "page", why: "" } : { url: "", from: "unread", why: "" };
      this._readAt = 0;
    }
    setBase(url) { if (trim(url) !== this.given) this._setBase(url); }
    _fileUrl() {
      if (this.addressFile) return this.addressFile;
      try { return new URL("../relay.json", root.location.href).href; } catch (e) { return "../relay.json"; }
    }
    async address() { await this._ready(); return this.where; }
    async _ready() {
      if (this.given) return;
      const w = this.where.from;
      if (w === "unread" || (w === "none" && Date.now() - this._readAt >= RECHECK_MS)) await this._read();
    }
    _read() {
      if (!this._job) this._job = this._readNow().finally(() => { this._job = null; });
      return this._job;
    }
    async _recheck() {
      if (this.given || this._job || Date.now() - this._readAt < RECHECK_MS) return false;
      const was = this.base;
      await this._read();
      return this.base !== was;
    }
    async _readNow() {
      this._readAt = Date.now();
      const file = this._fileUrl(), was = this.where;
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ADDRESS_MS);
      let why = "";
      try {
        const sep = file.includes("?") ? "&" : "?";
        const r = await fetch(`${file}${sep}t=${Date.now()}`, { cache: "no-store", credentials: "omit", signal: ac.signal });

          : typeof navigator !== "undefined" && navigator.onLine === false ? "this device is offline"
          : e && e.name === "TypeError" ? "the site could not be reached"
          : String((e && e.message) || e);
      } finally { clearTimeout(timer); }
      if (this.given || was.from === "file") return; // read fine earlier in this page's life: that address stays

    clearTimeout(C.connectTimer);
    C.ready = true; C.sid = m.sid;
    if (C.boot && m.boot !== C.boot) { sync.samples = []; sync.ok = false; log("clock sync: the PC's server restarted, starting over"); }
    C.boot = m.boot;
    if (C.down) log(`control: reconnected after ${r0((now() - C.down) / 1000)} s and ${C.attempt} ${C.attempt === 1 ? "try" : "tries"}`);
    log(`control: signed in in ${r0(now() - C.openedAt)} ms (PC capture ${m.be})`);
    C.attempt = 0; C.down = 0; C.unanswered = 0;
    for (let i = 0; i < 5; i++) setTimeout(() => ctlPing(true), i * 150);    // a burst for clock sync
    if (conn.want) dataStart("control connected");
    else setState("wait", "Connected to {pc} (Continuous off).");
    return;
  }
  if (m.type === "pong") {
    C.unanswered = 0;
    if (typeof m.t === "number") { addSync(m.t, m.srv, now()); C.rtts.push(now() - m.t); if (C.rtts.length > 8) C.rtts.shift(); }
    return;
  }
  if (m.type === "auth") return ctlDown("the PC refused this account", "auth");
  if (m.gen == null || !conn.live || m.gen !== conn.live.gen) return;      // about an older data path: ignored
  if (m.type === "srv" || m.type === "auto") pcReport(m);
  else if (conn.live.rtc) conn.live.rtc(m);
}
function ctlSend(o) {
  if (!C.ws || !C.ready || C.ws.readyState !== 1) return false;
  try { C.ws.send(JSON.stringify(o)); return true; } catch (e) { return false; }
}
function ctlPing(force) {
  const t = now();
  if (!C.ready || (!force && t - C.lastPing < 900)) return;
  C.lastPing = t; C.unanswered++;
  ctlSend({ type: "ping", t });
}
function heartbeat(late) {                          // once a second, and whenever the PC sends something
  if (!C.ws || !C.ready) return;
  const t = now();
  if (late) { C.unanswered = 0; C.lastRx = Math.max(C.lastRx, t - 1000); }  // we were held back, not the connection
  // Dead: 4+ pings unanswered and nothing at all for 6 s, or for 2.5 times the slowest of the last 8 round trips if
  // that is longer (at most 20 s). Any message counts. On a very slow link a big frame ahead of a pong in the
  // network's queue can hold it for seconds; that is a slow path, not a dead one.
  const limit = Math.min(20000, Math.max(6000, 2.5 * Math.max(0, ...C.rtts)));
  if (C.unanswered >= 4 && t - C.lastRx > limit) return ctlDown(`no answer to ${C.unanswered} pings in ${r0((t - C.lastRx) / 1000)} s`);
  ctlPing(false);
}

// -- the data path --
function dataStart(why) {
  dataStop(why);                                   // never reused: the old one is stopped first, on both sides
  clearTimeout(conn.timer); conn.timer = 0;
  if (!conn.want || !signedIn()) return;
  if (!C.ready) { if (!C.ws && !C.timer) ctlOpen("the data path needs it"); return; }
  const gen = ++conn.gen;
  D.ep = null; D.seq = 0; D.waitSince = 0; D.askedAt = 0;
  for (const w of D.wait.splice(0)) drop(w);
  for (const q of Q.splice(0)) drop(q);
  PC_.srv = null; FZ.on = false; T.paths++;
  conn.pathAt = now(); conn.firstOnPath = null; conn.lastData = now(); conn.upAt = 0;
  if (conn.attempt <= 10 || conn.attempt % 10 === 0) log(`data: starting path ${gen}: ${S.transport} (${why})`);
  if (!conn.down) setState("wait", `Starting ${S.transport}…`);
  conn.live = TRANSPORTS[S.transport](gen);
}
function dataStop(why, ctlGone) {
  const t = conn.live;
  if (!t) return;
  conn.live = null;
  try { t.close(why); } catch (e) {}
  if (!ctlGone) ctlSend({ type: "stop", gen: t.gen, why: String(why).slice(0, 150) });
  if (conn.attempt <= 10 || conn.attempt % 10 === 0) log(`data: path ${t.gen} (${t.kind}) stopped: ${why}`);
}
function onUp(gen, what) {
  if (!conn.live || conn.live.gen !== gen) return;
  if (conn.down) log(`data path back after ${r0((now() - conn.down) / 1000)} s and ${conn.attempt} ${conn.attempt === 1 ? "try" : "tries"}`);
  conn.attempt = 0; conn.down = 0; conn.lastData = now(); conn.upAt = now();
  log(`connected: ${what} (data path ${gen}, ${r0(now() - conn.pathAt)} ms after it started)`);
  setState("live", `Watching {pc} (${S.transport}).`);
}
function onFail(gen, why, kind) {
  if (!conn.live || conn.live.gen !== gen) return;
  dataStop(why);
  if (kind === "auth") return ctlDown(why, "auth");
  if (kind === "session") return ctlDown(why);       // the PC closed this page's session: a new control connection first
  if (!conn.want) return;
  if (!conn.down) conn.down = now();
  conn.attempt++; conn.retries++; conn.why = why;
  const delay = backoff(conn.attempt);
  if (conn.attempt <= 10 || conn.attempt % 10 === 0) log(`disconnected: ${why}; retry ${conn.attempt} in ${delay} ms (down ${r0((now() - conn.down) / 1000)} s)`);
  setState("bad", `Disconnected, retrying… (attempt ${conn.attempt}, ${r0((now() - conn.down) / 1000)} s): ${why}`);
  conn.timer = setTimeout(() => {
    conn.timer = 0;
    if (!conn.want || conn.live) return;
    if (C.ready) dataStart(`retry ${conn.attempt}`);
    else if (!C.ws && !C.timer) ctlOpen("retry");   // (otherwise the control connection's reconnect starts it)
  }, delay);
}

// ---- Data paths (transports) ------------------------------------------------------------------------
// Each returns { gen, kind, ready, close(why), fail(why, kind), full() } and, for UDP, rtc(msg) and tick().
// close() tears down everything this path made (socket, fetches, peer, timers); after it, no handler of the old
// path does anything. fail() reports a failure to the supervisor, which stops the path and retries with backoff.
const ackTcp = (gen, hdr) => () => ctlSend({ type: "ack", gen, ep: hdr.ep, seq: hdr.seq });
const TRANSPORTS = {
  ws(gen) {                                          // frames on a data WebSocket; acks on the control connection
    const ws = R.ws("screen", "ws");
    ws.binaryType = "arraybuffer";
    const t = { gen, kind: "ws", ready: false };
    let dead = false;
    const startTimer = setTimeout(() => t.fail("the data WebSocket did not start within 10 s"), 10000);
    t.fail = (why, kind) => { if (!dead) onFail(gen, why, kind); };
    t.close = () => { dead = true; clearTimeout(startTimer); ws.onopen = ws.onmessage = ws.onclose = null; try { ws.close(); } catch (e) {} };
    t.full = () => ctlSend({ type: "full", gen });
    ws.onopen = () => ws.send(JSON.stringify({ type: "hello", token: KEY, sid: C.sid, gen, ...S, win: +S.win }));
    ws.onmessage = (ev) => {
      if (dead) return;
      conn.lastData = now();
      if (typeof ev.data === "string") {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === "hello") { clearTimeout(startTimer); t.ready = true; onUp(gen, `WebSocket, PC capture ${m.be}`); }
        else if (m.type === "ka") { W.idle++; T.idle++; }
        else if (m.type === "auth") t.fail("the PC refused this account", "auth");
        else if (m.type === "gone") t.fail("the PC does not know this page's control session", "session");
        else if (m.type === "reload") t.fail(m.why || "reload the page");
        return;
      }
      const dv = new DataView(ev.data), hl = dv.getUint32(0);
      const hdr = JSON.parse(dec.decode(new Uint8Array(ev.data, 4, hl))), body = new Uint8Array(ev.data, 4 + hl);
      verify(hdr, body);
      show(hdr, new Blob([body], { type: "image/" + hdr.fmt }), ackTcp(gen, hdr));
    };
    ws.onclose = (ev) => {
      if (dead) return;
      if (ev.code === 4401 || ev.code === 4403) return t.fail("the PC refused this account", "auth");
      if (ev.code === 4410) return t.fail("the PC does not know this page's control session", "session");
      t.fail(ev.code === 1001 ? `the PC said: ${ev.reason || "going away"}` : t.ready ? `the data WebSocket closed (code ${ev.code})` : `the data WebSocket could not connect (code ${ev.code})`);
    };
    return t;
  },

  stream(gen) {                                      // one long HTTP response; acks on the control connection
    const ac = new AbortController();
    const t = { gen, kind: "stream", ready: false };
    let dead = false;
    const startTimer = setTimeout(() => t.fail("the stream did not start within 10 s"), 10000);
    t.fail = (why, kind) => { if (!dead) onFail(gen, why, kind); };
    t.close = () => { dead = true; clearTimeout(startTimer); ac.abort(); };
    t.full = () => ctlSend({ type: "full", gen });
    (async () => {
      let r;
      try { r = await fetch(`${BASE}stream?sid=${encodeURIComponent(C.sid)}&gen=${gen}&${qs()}`, { headers: auth(), cache: "no-store", signal: ac.signal }); }
      catch (e) { return t.fail("the stream could not connect: sharing off, or no network"); }
      if (r.status === 401 || r.status === 403) return t.fail("the PC refused this account", "auth");
      if (!r.ok) return t.fail(httpWhy(r.status), r.status === 410 ? "session" : undefined);
      const reader = r.body.getReader();
      let buf = new Uint8Array(1 << 20), len = 0;
      try {
        for (;;) {
          const { value, done } = await reader.read();
          if (dead) return;
          if (done) return t.fail("the stream ended");
          conn.lastData = now();
          if (len + value.length > buf.length) { const nb = new Uint8Array(Math.max(buf.length * 2, len + value.length)); nb.set(buf.subarray(0, len)); buf = nb; }
          buf.set(value, len); len += value.length;
          let off = 0;
          while (len - off >= 8) {
            const dv = new DataView(buf.buffer, off, 8), hl = dv.getUint32(0), pl = dv.getUint32(4);
            if (len - off < 8 + hl + pl) break;
            const hdr = JSON.parse(dec.decode(buf.subarray(off + 8, off + 8 + hl)));
            if (pl) {
              const body = buf.slice(off + 8 + hl, off + 8 + hl + pl);
              verify(hdr, body);
              show(hdr, new Blob([body], { type: "image/" + hdr.fmt }), ackTcp(gen, hdr));
            }
            else if (hdr.type === "hello") { clearTimeout(startTimer); t.ready = true; onUp(gen, `stream, PC capture ${hdr.be}`); }
            else if (hdr.type === "ka") { W.idle++; T.idle++; }
            else if (hdr.type === "auth") return t.fail("the PC refused this account", "auth");
            else if (hdr.type === "bye") return t.fail(`the PC said: ${hdr.why}`);
            off += 8 + hl + pl;
          }
          if (off) { buf.copyWithin(0, off, len); len -= off; }
        }
      } catch (e) { if (!dead) t.fail(`connection lost (${e.name})`); }
    })();
    return t;
  },

  pull(gen) { return pullers(gen, 1, "pull"); },
  pipe(gen) { return pullers(gen, Math.max(1, +S.win), "pipe"); },
};

function pullers(gen, n, kind) {                     // n requests in flight; each long-polls for the next update and
  const t = { gen, kind, ready: false };             // carries the ack of the frame before it (?ack=epoch.seq)
  let dead = false, wantFull = false;
  const acs = new Set();
  const startTimer = setTimeout(() => { if (!t.ready) t.fail("no answer to the first request within 10 s"); }, 10000);
  t.fail = (why, k) => { if (!dead) onFail(gen, why, k); };
  t.close = () => { dead = true; clearTimeout(startTimer); for (const a of acs) a.abort(); };
  t.full = () => { wantFull = true; };
  async function loop() {
    let ack = "";
    while (!dead) {
      const ac = new AbortController(); acs.add(ac);
      let timedOut = false, timer = 0;
      const arm = () => { clearTimeout(timer); timer = setTimeout(() => { timedOut = true; ac.abort(); }, 8000); };
      arm();                                         // 8 s for the answer to start, then 8 s without a byte = stalled
      try {                                          // (a big frame on a slow link may take longer: that is not a stall)
        const extra = (wantFull ? "&full=1" : "") + (ack ? `&ack=${encodeURIComponent(ack)}` : "");
        wantFull = false; ack = "";
        const r = await fetch(`${BASE}frame?sid=${encodeURIComponent(C.sid)}&gen=${gen}&kind=${kind}&${qs()}&wait=2${extra}`, { headers: auth(), cache: "no-store", signal: ac.signal });
        if (dead) return;
        if (r.status === 401 || r.status === 403) return t.fail("the PC refused this account", "auth");
        if (r.status !== 200 && r.status !== 204) return t.fail(httpWhy(r.status), r.status === 410 ? "session" : undefined);
        if (!t.ready) { clearTimeout(startTimer); t.ready = true; onUp(gen, kind === "pipe" ? `${n} requests in flight` : "one request per frame"); }
        conn.lastData = now();
        if (r.status === 204) { W.idle++; T.idle++; continue; }
        const hdr = JSON.parse(r.headers.get("X-Frame"));
        const reader = r.body.getReader(), parts = [];
        let got = 0;
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          parts.push(value); got += value.length; conn.lastData = now(); arm();
        }
        const body = new Uint8Array(got);
        for (let i = 0, off = 0; i < parts.length; off += parts[i].length, i++) body.set(parts[i], off);
        if (dead) return;
        ack = `${hdr.ep}.${hdr.seq}`;
        verify(hdr, body);
        show(hdr, new Blob([body], { type: "image/" + hdr.fmt }), null);
      } catch (e) {
        if (dead) return;
        return t.fail(timedOut ? "stalled: a request got no answer for 8 s" : (t.ready ? `connection lost (${e.name})` : "could not connect: sharing off, or no network"));
      } finally { clearTimeout(timer); acs.delete(ac); }
    }
  }
  for (let i = 0; i < n; i++) loop();
  return t;
}

// UDP: pictures over WebRTC data channels, direct (peer to peer, STUN only: no TURN relay); the control connection
// carries the offer and answer (and the PC's reports). If no direct path exists, it fails and says so: it never falls
// back to TCP by itself.
const CHUNK = 16 * 1024 - 64;                        // must match rtc.py
function udp(gen, mode) {
  const t = { gen, kind: "udp-" + mode, ready: false };
  let dead = false, pc = null, dc = null, openTimer = 0, iceTimer = 0, lastDc = 0, lastAck = 0, wasOpen = false;
  const R = new Map(), done = new Set(), lastId = [null, null];
  const deadline = () => (mode === "fast" ? 250 : mode === "mid" ? +S.life + 150 : 3000);
  // Acks go back over the data channel (direct, like the pictures): the PC's flow control waits for them.
  const ackDc = (o) => { lastAck = now(); if (dc && dc.readyState === "open") { try { dc.send(JSON.stringify(o)); return; } catch (e) {} } ctlSend({ type: "have", gen, seq: o.s, ep: o.e }); };
  let lastStall = 0;
  const sweeper = setInterval(() => { sweep(); stallCheck(); }, 100);
  // If every frame in the PC's window vanished (not one piece arrived), nothing more comes and nothing tells the
  // PC. So after 0.5 s without a picture while the PC was sending, ask for a full frame (the PC then frees its
  // window), and don't leave an update waiting for its base until the once-a-second tick either.
  function stallCheck() {
    if (!t.ready || !conn.want || dead) return;
    const n = now();
    if (D.waitSince && n - D.waitSince > 300) needFull();
    else if (PC_.srv && PC_.srv.fps > 5 && T.lastDraw && n - T.lastDraw > 500 && n - lastStall > 2000 && conn.firstOnPath != null) {
      lastStall = n;
      log(`UDP: nothing drawn for ${r0(n - T.lastDraw)} ms while the PC was sending: asked for a full frame`);
      D.askedAt = 0; needFull(true);
    }
  }
  const cleanup = () => { clearTimeout(openTimer); clearTimeout(iceTimer); clearInterval(sweeper); try { if (pc) pc.close(); } catch (e) {} };
  t.fail = (why, kind) => { if (!dead) onFail(gen, why, kind); };
  t.close = () => { dead = true; t.ready = false; cleanup(); };
  t.full = () => ctlSend({ type: "full", gen });
  t.tick = () => {                                   // once a second: keepalive to the PC, and is the path alive?
    if (!t.ready || dead) return;
    if (now() - lastAck > 900 && dc && dc.readyState === "open") { try { dc.send("ka"); lastAck = now(); } catch (e) {} }
    if (now() - lastDc > 3500) t.fail(`UDP: nothing over the data channel for ${r0((now() - lastDc) / 1000)} s (the PC sends a keepalive every second)`);
  };
  t.killPc = () => { try { pc.close(); } catch (e) {} return "test: closed this page's peer connection (no events fire)"; };
  t.rtc = async (m) => {                             // the PC's messages about this path (control connection)
    if (dead) return;
    if (m.type === "rtc-answer") {
      const kinds = [...new Set((m.sdp.match(/ typ (\w+)/g) || []).map((s) => s.slice(5)))];
      log(`UDP: the PC answered with candidates: ${kinds.join(", ") || "none"}`);
      try { await pc.setRemoteDescription({ type: "answer", sdp: m.sdp }); }
      catch (e) { t.fail(`UDP: the PC's answer did not apply: ${e.message}`); }
    }
    else if (m.type === "rtc-error") t.fail(`UDP: the PC could not set up its side: ${m.error}`);
    else if (m.type === "rtc-down") t.fail(`UDP: the PC dropped the peer (${m.why})`);
  };
  async function start() {
    pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun.cloudflare.com:3478" }] });
    const opts = mode === "fast" ? { ordered: false, maxRetransmits: 0 } : mode === "mid" ? { ordered: false, maxPacketLifeTime: +S.life } : { ordered: true };
    dc = pc.createDataChannel("peek", opts);
    dc.binaryType = "arraybuffer";
    dc.onopen = () => { if (dead) return; clearTimeout(openTimer); t.ready = wasOpen = true; lastDc = now(); onUp(gen, `UDP ${mode} (${JSON.stringify(opts)})`); stats(); };
    dc.onclose = () => t.fail("UDP: the data channel closed");
    dc.onmessage = chunk;
    const kc = pc.createDataChannel("key");          // reliable: full frames (the base picture) must arrive
    kc.binaryType = "arraybuffer";
    kc.onmessage = chunk;
    kc.onclose = () => t.fail("UDP: the keyframe channel closed");
    const kinds = new Set();
    pc.onicecandidate = (e) => { if (e.candidate && e.candidate.type) kinds.add(e.candidate.type); };
    const noPath = "UDP: no direct path (ICE failed). This network needs a TURN relay, which Screen Peek does not have: pick a TCP transport.";
    pc.oniceconnectionstatechange = () => {
      if (dead) return;
      const st = pc.iceConnectionState;
      log(`UDP: ICE ${st}`);
      if (st === "failed") t.fail(wasOpen ? "UDP: ICE failed" : noPath);
      else if (st === "disconnected") {              // a short grace: Wi-Fi hiccups recover by themselves
        clearTimeout(iceTimer);
        iceTimer = setTimeout(() => { if (pc && pc.iceConnectionState === "disconnected") t.fail("UDP: ICE disconnected for 2 s"); }, 2000);
      } else clearTimeout(iceTimer);
    };
    pc.onconnectionstatechange = () => {
      if (dead) return;
      log(`UDP: connection ${pc.connectionState}`);
      if (pc.connectionState === "failed") t.fail(wasOpen ? "UDP: connection failed" : noPath);
    };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((ok) => { pc.addEventListener("icegatheringstatechange", () => pc.iceGatheringState === "complete" && ok()); setTimeout(ok, 3000); });
    if (dead) return;
    log(`UDP: offer sent with this device's candidates: ${[...kinds].join(", ") || "none"}`);
    if (!ctlSend({ type: "rtc-offer", ...S, win: +S.win, gen, sdp: pc.localDescription.sdp, udp: mode })) return t.fail("UDP: the control connection is not up to send the offer");
    openTimer = setTimeout(() => t.fail("UDP: no direct path within 15 s (ICE did not connect): pick a TCP transport."), 15000);
  }
  function chunk(ev) {
    if (dead) return;
    lastDc = now();
    if (typeof ev.data === "string") return;         // the PC's keepalive ("ka")
    const dv = new DataView(ev.data), idx = dv.getUint16(2), n = dv.getUint16(4), total = dv.getUint32(12);
    const fid = dv.getUint8(1) * 4294967296 + dv.getUint32(8);   // flag 1 = the keyframe channel's own numbering
    conn.lastData = now(); U.chunks++;
    if (done.has(fid)) { U.late++; return; }
    const lane = dv.getUint8(1), raw = dv.getUint32(8);   // frame ids that never showed up at all = lost frames
    if (lastId[lane] != null && raw > lastId[lane] + 1 && raw - lastId[lane] < 1000) U.dropped += raw - lastId[lane] - 1;
    if (lastId[lane] == null || raw > lastId[lane]) lastId[lane] = raw;
    let f = R.get(fid);
    if (!f) R.set(fid, (f = { n, got: 0, seen: new Uint8Array(n), buf: new Uint8Array(total), t0: now() }));
    if (!f.seen[idx]) { f.seen[idx] = 1; f.got++; f.buf.set(new Uint8Array(ev.data, 16), idx * CHUNK); }
    if (f.got === f.n) { R.delete(fid); finish(fid); U.complete++; frame(f.buf, lane, raw); }
    sweep();
  }
  // A frame still missing pieces at its deadline is lost: drop it and give its credit back to the PC at once.
  // Runs on every piece and every 100 ms (with the PC's window full, no more pieces come to trigger it).
  function sweep() {
    if (dead) return;
    const t0 = now(), dl = deadline();
    // Keyframes travel on the reliable channel and always complete; they get 5 s (a 300 KB frame sharing
    // a busy link takes far longer than the fast channel's 250 ms, and was being thrown away).
    for (const [id, g] of R) if (t0 - g.t0 > (id >= 4294967296 ? 5000 : dl)) {
      R.delete(id); finish(id); U.dropped++;
      ackDc({ t: "a", f: id % 4294967296, l: id >= 4294967296 ? 1 : 0, lost: 1, s: D.seq, e: D.ep });   // its credit comes back now
      if (id >= 4294967296 || !D.seq) { log("keyframe lost, requested again"); D.askedAt = 0; needFull(true); }
    }
  }
  function finish(fid) { done.add(fid); if (done.size > 1024) done.delete(done.values().next().value); }
  function frame(buf, lane, raw) {
    const hl = new DataView(buf.buffer).getUint32(0);
    const hdr = JSON.parse(dec.decode(buf.subarray(4, 4 + hl))), body = buf.subarray(4 + hl);
    verify(hdr, body);
    // Acked once drawn (or dropped as old): s / e = the picture the canvas shows, which partial updates build on.
    show(hdr, new Blob([body], { type: "image/" + hdr.fmt }), () => ackDc({ t: "a", f: raw, l: lane, s: D.seq, e: D.ep }));
  }
  async function stats() {                          // the chosen candidate pair and its round trip, from WebRTC stats
    if (!pc || dead) return;
    try {
      const st = await pc.getStats();
      let pair = null;
      st.forEach((r) => { if (r.type === "transport" && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId); });
      if (!pair) st.forEach((r) => { if (r.type === "candidate-pair" && r.nominated && r.state === "succeeded") pair = r; });
      if (!pair) return;
      const l = st.get(pair.localCandidateId), r = st.get(pair.remoteCandidateId);
      const desc = `${l ? l.candidateType : "?"} ↔ ${r ? r.candidateType : "?"} over ${l ? l.protocol : "?"}` +
                   `${l && r && l.candidateType !== "relay" && r.candidateType !== "relay" ? " (direct)" : " (relayed)"}`;
      if (desc !== U.pair) log(`UDP: path ${desc}`);
      U.pair = desc;
      if (pair.currentRoundTripTime != null) U.rtt = pair.currentRoundTripTime * 1000;
    } catch (e) {}
  }
  t.stats = stats;
  start().catch((e) => t.fail(`UDP setup failed: ${e.message}`));
  return t;
}
for (const m of ["fast", "mid", "rel"]) TRANSPORTS["udp-" + m] = (gen) => udp(gen, m);

// ---- Single picture (any transport, Continuous on or off) ---------------------------------------------
$("one").onclick = async () => {
  if (!signedIn()) return access("Single");
  await ADDR;
  const t0 = now(), ac = new AbortController(), timer = setTimeout(() => ac.abort(), 10000);
  try {
    const r = await fetch(`${BASE}frame?once=1&${qs()}`, { headers: auth(), cache: "no-store", signal: ac.signal });
    if (r.status === 401 || r.status === 403) { log("single picture: the PC refused this account"); return access("the PC refused a picture"); }
    if (!r.ok) throw new Error(httpWhy(r.status));
    if (r.status === 204) throw new Error("the PC had no picture within 2 s");
    const hdr = JSON.parse(r.headers.get("X-Frame"));
    show(hdr, await r.blob(), null);
    log(`single picture: ${r0(now() - t0)} ms round trip, ${r0(hdr.n / 1024)} KB, PC grab ${hdr.g} ms + encode ${hdr.e} ms`);
  } catch (e) { log(`single picture failed: ${e.name === "AbortError" ? "no answer within 10 s" : e.message === "Failed to fetch" ? "the PC did not answer (sharing off, or no network)" : e.message}`); }
  finally { clearTimeout(timer); }
};
$("cont").onclick = () => setCont(!conn.want);
// ---- Access: may this browser's account use Screen Peek? (relay 3's program access, the "screen" right) --------
// The PC decides (R.me(), then R.canUse("screen")). Asked at the start, when the account changes in any tab of this
// browser (the account page signs in there), when the account window closes, and when the PC refuses a connection.
// No right: the box with one line and one button (the account page); the control connection is closed. Could not ask
// (the PC off, no network): what was known stays; nothing known yet: the status line says why and it asks again.
let accessJob = null, accessTimer = 0, accessTries = 0, accountWin = null;
function access(why) {
  if (!accessJob) accessJob = checkAccess(why).finally(() => { accessJob = null; });
  return accessJob;
}
async function checkAccess(why) {
  clearTimeout(accessTimer); accessTimer = 0;
  await ADDR;
  let r;
  // relay-client 3 (as of relay 3.1.1) throws in me() when the PC answers "no account" for an account this browser
  // still remembered (it forgets it, then reads what it just cleared): asked again, the second answer is plain.
  try { r = await R.me(); } catch (e) { log(`access: asked again (relay-client: ${e.message})`); r = await R.me(); }
  if (!r.ok) {
    log(`access: could not ask the PC (${why}): ${r.why}`);
    if (!ACCESS.known) {
      accessTries++;
      setState("bad", `Can't reach {pc}: ${sentence(r.why)} Trying again…`);
      accessTimer = setTimeout(() => access("again"), Math.min(15000, 2000 * accessTries));
    }
    return ACCESS.ok;
  }
  accessTries = 0;
  const was = ACCESS.ok, wasKnown = ACCESS.known, a = r.account;
  ACCESS.known = true; ACCESS.account = a; ACCESS.ok = R.canUse("screen");
  const who = a ? a.name : "a visitor";
  if (ACCESS.ok) {
    const opening = !was;
    gate(false);
    if (opening) {
      log(`access: ${who} may use Screen Peek${r.local ? " (at the computer)" : ""} (${why})`);
      if (accountWin) accountWin.close();            // signed in through the account window: back to the picture
    }
    if (!C.ws && !C.timer) ctlOpen(opening ? "allowed" : why);
  } else {
    if (was || !wasKnown) log(`access: ${who} may not use Screen Peek (${why})`);
    lockOut();
    gate(true);
  }
  return ACCESS.ok;
}
function lockOut() {                                // everything that carried this browser's pass is closed
  dataStop("no access"); ctlDrop();
  clearTimeout(C.timer); C.timer = 0; C.down = 0; C.attempt = 0;
  clearTimeout(conn.timer); conn.timer = 0; conn.down = 0; conn.attempt = 0;
}
function gate(show) {
  $("login").classList.toggle("show", show);
  if (!show) return;
  const a = ACCESS.account;
  $("lwhat").textContent = a ? `${a.name} may not watch ${R.pcName()}.` : `Sign in to watch ${R.pcName()}.`;
  $("signin").textContent = a ? "Switch user" : "Sign in";
  $("lerr").textContent = "";
  setState("", "Sign in needed.");
}
$("signin").onclick = () => {
  if (own) { location.href = SITE_PAGE; return; }   // served by the relay: the account page lives on the Cool tools site
  if (accountWin) { accountWin.front(); return; }
  if (!window.WindowKit) { $("lerr").textContent = "The account page could not be opened on this page."; return; }
  accountWin = WindowKit.open("../settings/account.html", { title: "Account", name: "account", width: 440, height: 660,
    onClose: () => { accountWin = null; access("the account window closed"); } });
};
R.on("account", (a) => {                            // signed in, out or switched, in any tab of this browser
  log(`account: ${a ? a.name : "nobody"} is signed in in this browser now`);
  if (C.ws || C.timer || conn.live) lockOut();      // those carried the old pass
  ACCESS.ok = false;
  access("the account changed");
});

// ---- Screen Wake Lock (on by default): asked for whenever the page is shown -------------------------
let wakeLock = null;
const wakeState = (s) => { $("wakestate").textContent = s; };
async function wake(why) {
  store.set("peek-settings-v3", JSON.stringify({ ...S, wake: $("wake").checked }));
  if (!$("wake").checked) { if (wakeLock) { const w = wakeLock; wakeLock = null; await w.release().catch(() => {}); } wakeState("off"); return; }
  if (!("wakeLock" in navigator)) { wakeState("not supported here"); log("wake lock: not supported by this browser"); return; }
  if (document.visibilityState !== "visible") { wakeState("waits until the page is shown"); return; }
  if (wakeLock && !wakeLock.released) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeState("on"); log(`wake lock acquired (${why})`);
    wakeLock.addEventListener("release", () => {
      const hidden = document.visibilityState !== "visible";
      log(`wake lock released (${hidden ? "page hidden: the browser lets go" : "released"})`);
      wakeState(hidden ? "released while hidden; asked again when shown" : "off");
      wakeLock = null;
    });
  } catch (e) {
    wakeState(`refused: ${e.name}`);
    log(`wake lock refused (${why}): ${e.name}: ${e.message}`);
    if (e.name === "NotAllowedError") document.addEventListener("pointerdown", () => wake("after a tap"), { once: true });
  }
}
$("wake").onchange = () => wake("toggle");

// ---- Page lifecycle: never pause; log what the browser does to us ------------------------------------
function cameBack() { conn.lastData = Math.max(conn.lastData, now() - 3000); heartbeat(true); }
document.addEventListener("visibilitychange", () => {
  log(`visibilitychange: ${document.visibilityState}`);
  if (document.visibilityState === "visible") { cameBack(); wake("page shown again"); }
});
window.addEventListener("pagehide", (e) => log(`pagehide (persisted: ${e.persisted})`));
window.addEventListener("pageshow", (e) => log(`pageshow (persisted: ${e.persisted})`));
document.addEventListener("freeze", () => log("freeze: the browser froze this page"));
document.addEventListener("resume", () => { log("resume: the page runs again"); cameBack(); });
window.addEventListener("online", () => { log("online"); if (!ACCESS.known) access("back online"); else if (signedIn() && !C.ready) { C.attempt = 0; ctlOpen("back online"); } });
window.addEventListener("offline", () => log("offline"));

// Automation hooks for the headless tests (test/chrome_page.mjs).
window.PEEK = { S, sync, conn, C, log: LOG, cont: setCont,
  killUdp: () => (conn.live && conn.live.killPc ? conn.live.killPc() : "no UDP connection"),
  muteCtl: () => { C.mute = true; return "test: the control connection's messages are ignored from now on (a stalled connection)"; },
  dropCtl: () => { if (C.ws) { const ws = C.ws; ws.onclose = null; try { ws.close(); } catch (e) {} } return "test: closed the control WebSocket with no event"; },
  set: (k, v) => { const e = $(k); if (e.type === "checkbox") e.checked = !!v; else e.value = String(v); e.dispatchEvent(new Event("change")); return `${k} = ${v}`; },
  state: () => ({ live: conn.live ? conn.live.kind : null, gen: conn.live ? conn.live.gen : null, ready: !!(conn.live && conn.live.ready), want: conn.want,
                  ctl: C.ready, retries: conn.retries, text: $("conntext").textContent, first: T.first, firstOnPath: conn.firstOnPath,
                  drawn: T.drawn, lastDraw: T.lastDraw ? Math.round(now() - T.lastDraw) : null, warm: conn.warmAtOn }),
  summary: () => {                                   // since Continuous went on
    const p = (a, q) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return Math.round(s[Math.min(s.length - 1, Math.floor(s.length * q))] * 10) / 10; };
    const secs = (now() - T.t) / 1000;
    return { drawn: T.drawn, full: T.full, partial: T.part, dropped: T.dropped, bad: T.bad, idle: T.idle, asked: T.asked,
             fps: Math.round((T.drawn / secs) * 100) / 100, interval: p(T.ivs, 0.5), jitter: Math.round(sd(T.ivs) * 10) / 10,
             lat_p50: p(T.lats, 0.5), lat_p95: p(T.lats, 0.95), net_p50: p(T.nets, 0.5), decode_p50: p(T.decs, 0.5),
             kb: T.recv ? Math.round(T.bytes / T.recv / 102.4) / 10 : null, full_kb: T.recv ? Math.round(T.fullBytes / T.recv / 102.4) / 10 : null,
             mbps: Math.round(T.bytes * 8 / secs / 1e4) / 100, first_ms: T.first == null ? null : Math.round(T.first), warm: conn.warmAtOn,
             ping: sync.best == null ? null : Math.round(sync.best), retries: conn.retries, paths: T.paths, firsts: T.firsts.map(Math.round),
             udp: S.transport.startsWith("udp") ? { ...U, rtt: U.rtt == null ? null : Math.round(U.rtt * 10) / 10 } : undefined,
             crc: S.verify ? { ...CHK } : undefined, pc: PC_.srv, freezes: FZ.n, freeze_longest_ms: Math.round(FZ.longest), auto_steps: AUTO_LOG.slice(-8) }; },
  win: (() => {                                      // stats since the previous call (time series in the soak tests)
    let m = null;
    return () => {
      const c = { t: now(), drawn: T.drawn, bytes: T.bytes, recv: T.recv, li: T.lats.length, full: T.full, part: T.part, dropped: T.dropped, T };
      const p = m && m.T === T ? m : { t: T.t, drawn: 0, bytes: 0, recv: 0, li: 0, full: 0, part: 0, dropped: 0 };
      m = c;
      const secs = (c.t - p.t) / 1000, lats = T.lats.slice(p.li).sort((x, y) => x - y);
      const q = (f) => (lats.length ? Math.round(lats[Math.min(lats.length - 1, Math.floor(lats.length * f))]) : null);
      return { secs: Math.round(secs * 10) / 10, fps: Math.round((c.drawn - p.drawn) / secs * 10) / 10, p50: q(0.5), p95: q(0.95), max: q(1),
               kb: c.recv > p.recv ? Math.round((c.bytes - p.bytes) / (c.recv - p.recv) / 102.4) / 10 : null,
               mbps: Math.round((c.bytes - p.bytes) * 8 / secs / 1e4) / 100, full: c.full - p.full, part: c.part - p.part, dropped: c.dropped - p.dropped,
               freezes: FZ.n, retries: conn.retries, live: conn.live ? conn.live.kind : null, ready: !!(conn.live && conn.live.ready),
               ping: sync.rtt == null ? null : Math.round(sync.rtt), ctl: C.ready,
               udp: S.transport.startsWith("udp") ? { complete: U.complete, dropped: U.dropped, late: U.late, rtt: U.rtt == null ? null : Math.round(U.rtt) } : undefined, pc: PC_.srv };
    };
  })() };

$("ver").textContent = `Screen Peek ${APP_VERSION}${APP_BUILT ? " · built " + APP_BUILT : ""}`;
log(`Screen Peek ${APP_VERSION}${APP_BUILT ? " (built " + APP_BUILT + ")" : ""}: page loaded (${own ? "served by the PC" : "Cool tools"}); ${settingsText()}`);
ADDR.then(() => log(R.base ? `talks to ${BASE}${own ? " (the relay that served this page)" : " (from the Cool tools address file)"}` : `no PC to talk to: ${R.where.why}`));
// the PC's name ("Jon's desktop") from one light check at the start: the connection line and the Sign in box
ADDR.then(() => R.ping(8000)).then(() => { setState(lastState.kind, lastState.text); if ($("login").classList.contains("show")) gate(true); }).catch(() => {});
wake("page loaded");
