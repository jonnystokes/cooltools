/* ---- base.css ---- */
/* base.css: colours (light and dark follow the device), type, the page frame, buttons. Blue and amber to match
   the Relay Files icon: blue for actions and selection, amber for private. */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #f8f9fc; --raised: #ffffff;
  --text: #171c28; --muted: #5d667a; --faint: #8b93a5; --line: #e2e6ef; --line-2: #eef1f6;
  --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #e3ecff; --accent-soft-2: #d2e0ff; --focus: #2563eb;
  --folder: #3b82f6; --folder-tab: #93c5fd;
  --priv: #c27803; --priv-soft: #fff4dd; --danger: #c62828; --danger-soft: #fdecec; --ok: #16794a; --ok-soft: #e6f6ee;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .08);
  --radius: 10px; --row: 42px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0f17; --surface: #131826; --surface-2: #171d2d; --raised: #1b2234;
    --text: #e8ecf6; --muted: #a0a9bd; --faint: #737d93; --line: #262e42; --line-2: #1d2436;
    --accent: #5b9bff; --accent-ink: #08101f; --accent-soft: #18284a; --accent-soft-2: #213767; --focus: #7cb0ff;
    --folder: #5b9bff; --folder-tab: #2f5aa8;
    --priv: #f5b544; --priv-soft: #33270f; --danger: #ff7a7a; --danger-soft: #3a1717; --ok: #5ad69a; --ok-soft: #12301f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 16px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow: hidden; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
kbd { font: 600 11px/1 var(--font); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }

.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; min-height: 0; }

/* the header: brand, path, search, account */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 16px; padding-top: env(safe-area-inset-top); flex: none; }
.top-row { display: flex; align-items: center; gap: 12px; height: 56px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 16px; white-space: nowrap; color: var(--text); }
.brand-name { display: none; }
.brand-mark { width: 26px; height: 26px; padding: 4px; border-radius: 8px; background: var(--accent); color: #fff; }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; overflow: hidden; }
.crumb { border: 0; background: none; padding: 5px 8px; border-radius: 7px; color: var(--muted); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.crumb:hover { background: var(--line-2); color: var(--text); }
.crumb.here { color: var(--text); font-weight: 600; cursor: default; }
.crumb.here:hover { background: none; }
.crumb.drop-on { background: var(--accent-soft); color: var(--accent); outline: 2px dashed var(--accent); }
.crumb-sep { width: 14px; height: 14px; color: var(--faint); }
.crumbs-row { display: none; }
.search { position: relative; display: flex; align-items: center; width: min(340px, 34vw); }
.search svg { position: absolute; left: 10px; width: 17px; height: 17px; color: var(--faint); pointer-events: none; }
.search input { width: 100%; height: 36px; padding: 0 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); outline: none; }
.search input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input::-webkit-search-cancel-button { cursor: pointer; }
.search .hint-key { position: absolute; right: 9px; pointer-events: none; }
.search input:focus ~ .hint-key, .search input:not(:placeholder-shown) ~ .hint-key { display: none; }
.account { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.account:hover { border-color: var(--accent); }
.account svg { width: 17px; height: 17px; }
.account.signed { background: var(--priv-soft); border-color: transparent; color: var(--priv); font-weight: 600; }
.account.signed:hover { border-color: var(--priv); }

/* buttons */
.iconbtn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 9px; background: none; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--line-2); color: var(--text); }
.top .search-btn, .top .up-btn { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 550; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { height: 30px; padding: 0 10px; font-size: 13px; }

/* the toolbar */
.toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; min-height: 52px; overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
.toolbar .grow { flex: 1; }
.toolbar .btn { height: 34px; padding: 0 11px; }
.toolbar .hint { color: var(--muted); font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.toolbar .hint svg { width: 16px; height: 16px; color: var(--priv); }

/* the pick bar (a page asked for a file) and notices */
.pickbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--accent-soft-2); flex: none; flex-wrap: wrap; }
.pickbar .pick-text { flex: 1; min-width: 200px; }
.pickbar .pick-text b { font-weight: 650; }
.pickbar .pick-sub { color: var(--muted); font-size: 13px; }
.pickbar .pick-progress { flex-basis: 100%; }
.notice { padding: 10px 16px; background: var(--priv-soft); color: var(--text); border-bottom: 1px solid var(--line); flex: none; display: flex; gap: 10px; align-items: center; }
.notice.bad { background: var(--danger-soft); }
.notice b { font-weight: 650; }

/* main area */
.main { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.loadbar { position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; z-index: 3; }
.loadbar::after { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; background: var(--accent); animation: load 1s ease-in-out infinite; }
@keyframes load { to { left: 100%; } }

/* the status line */
.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 16px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12.5px; flex: none; min-height: 32px; }
.status-left { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-right { display: flex; gap: 12px; align-items: center; white-space: nowrap; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.conn.on::before { background: #22c55e; }
.conn.off::before { background: var(--danger); }
.conn.wait::before { background: #f59e0b; }
.build { color: var(--faint); }

/* ---- list.css ---- */
/* list.css: the file list (a grid of rows), its header, the empty and error states, the drop zone. */
.list { flex: 1; overflow: auto; outline: none; background: var(--surface); position: relative; overscroll-behavior: contain; }
.list-head, .row { display: grid; grid-template-columns: 40px 30px minmax(120px, 1fr) 150px 190px 40px; align-items: center; column-gap: 8px; padding: 0 12px 0 8px; }
.list.trash-view .list-head, .list.trash-view .row { grid-template-columns: 40px 30px minmax(120px, 1fr) minmax(90px, .6fr) 110px 190px 8px; }
.list.search-view .list-head, .list.search-view .row { grid-template-columns: 40px 30px minmax(120px, 1fr) minmax(90px, .7fr) 120px 170px 40px; }
.list-head { position: sticky; top: 0; z-index: 2; height: 36px; background: var(--surface-2); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: .01em; }
.list-head .col { border: 0; background: none; padding: 4px 6px; margin-left: -6px; border-radius: 6px; text-align: left; color: inherit; font-weight: inherit; display: inline-flex; align-items: center; gap: 4px; justify-self: start; }
.list-head .col.num { justify-self: end; margin-left: 0; margin-right: -6px; }
.list-head .col:hover { background: var(--line-2); color: var(--text); }
.list-head .col.sorted { color: var(--text); }
.list-head .col .arrow { font-size: 10px; }
.row { height: var(--row); border-bottom: 1px solid var(--line-2); cursor: default; user-select: none; -webkit-user-select: none; position: relative; }
.row:hover { background: var(--surface-2); }
.row.sel { background: var(--accent-soft); }
.row.sel:hover { background: var(--accent-soft-2); }
.row.focus { box-shadow: inset 2px 0 0 var(--accent); }
.list:focus-visible .row.focus { box-shadow: inset 0 0 0 2px var(--focus); }
.row.cut { opacity: .55; }
.row.drop-on { background: var(--accent-soft-2); box-shadow: inset 0 0 0 2px var(--accent); }
.row.nomatch { opacity: .42; }
.row.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: var(--ok-soft); } }
.row .check, .list-head .check { width: 22px; height: 22px; border-radius: 6px; border: 1.6px solid var(--line); background: var(--surface); display: grid; place-items: center; margin: auto; padding: 0; color: transparent; transition: border-color .12s; }
.row:hover .check { border-color: var(--faint); }
.row.sel .check, .list-head .check[aria-checked=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.list-head .check:hover { border-color: var(--faint); }
.row .check svg, .list-head .check svg { width: 16px; height: 16px; }
.row .ico { width: 24px; height: 24px; color: var(--muted); justify-self: center; }
.row .ico.folder { color: var(--folder); }
.row .ico.image { color: #0ea5a4; } .row .ico.audio { color: #a855f7; } .row .ico.video { color: #e11d48; }
.row .ico.pdf { color: #dc2626; } .row .ico.archive { color: #b45309; } .row .ico.book { color: #0f766e; } .row .ico.code { color: #4f46e5; }
.row .name { display: flex; align-items: center; gap: 7px; min-width: 0; }
.row .name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.dir .name-text { font-weight: 550; }
.row .badge { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px; border-radius: 10px; background: var(--priv-soft); color: var(--priv); font-size: 11.5px; font-weight: 650; flex: none; }
.row .badge svg { width: 12px; height: 12px; }
.row .badge.inherited { background: none; padding: 0 2px; }
.row .sub { display: none; }
.row .size, .row .when, .row .from { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.row .size { text-align: right; }
.row .more { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--faint); display: grid; place-items: center; opacity: 0; }
.row:hover .more, .row.sel .more, .row .more:focus-visible { opacity: 1; }
.row .more:hover { background: var(--line); color: var(--text); }
.row.locked .name-text { color: var(--muted); }
.row.locked .ico { color: var(--priv); }
.row .rename-input { flex: 1; min-width: 0; height: 30px; padding: 0 8px; border: 1.5px solid var(--accent); border-radius: 7px; background: var(--surface); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

.empty { display: grid; place-items: center; text-align: center; padding: 64px 24px; color: var(--muted); }
.empty svg { width: 56px; height: 56px; color: var(--line); margin-bottom: 10px; }
.empty .empty-title { color: var(--text); font-weight: 600; font-size: 16px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }
.fail { display: grid; place-items: center; text-align: center; padding: 56px 24px; }
.fail .fail-card { max-width: 460px; }
.fail .fail-title { font-weight: 650; font-size: 17px; margin-bottom: 6px; }
.fail .fail-why { color: var(--muted); margin-bottom: 14px; }
.fail .fail-retry { color: var(--faint); font-size: 13px; margin-top: 10px; }

.dropzone { position: absolute; inset: 8px; z-index: 5; border: 2.5px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent-soft) 82%, transparent); display: grid; place-items: center; pointer-events: none; }
.dropzone-card { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--accent); font-weight: 650; font-size: 17px; background: var(--surface); padding: 18px 28px; border-radius: 14px; box-shadow: var(--shadow-lg); }
.dropzone-card svg { width: 34px; height: 34px; }

/* ---- ui.css ---- */
/* ui.css: menus, dialogs, toasts, the transfers panel, the selection bar and the add button (phones). */
.menu { position: fixed; z-index: 50; min-width: 220px; max-width: calc(100vw - 16px); padding: 6px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
.menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; text-align: left; white-space: nowrap; }
.menu .mi:hover:not(:disabled), .menu .mi:focus-visible { background: var(--line-2); outline: none; }
.menu .mi svg { width: 18px; height: 18px; color: var(--muted); }
.menu .mi .k { margin-left: auto; color: var(--faint); font-size: 12px; padding-left: 18px; }
.menu .mi.danger { color: var(--danger); }
.menu .mi.danger svg { color: var(--danger); }
.menu .mi:disabled { opacity: .45; cursor: default; }
.menu .msep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu .mhead { padding: 6px 10px 4px; color: var(--muted); font-size: 12px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(8, 12, 22, .42); display: grid; place-items: center; padding: 16px; animation: fade .12s ease-out; }
@keyframes fade { from { opacity: 0; } }
.dialog { width: min(460px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--raised); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 20px; border: 1px solid var(--line); animation: pop .14s ease-out; }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
.dialog h2 { margin: 0 0 8px; font-size: 17px; font-weight: 650; }
.dialog .d-body { color: var(--muted); }
.dialog .d-body p { margin: 0 0 10px; }
.dialog .d-body b { color: var(--text); font-weight: 600; }
.dialog .d-list { margin: 8px 0 12px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); max-height: 180px; overflow: auto; font-size: 13px; color: var(--text); }
.dialog .d-list div { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dialog .d-list .d-meta { color: var(--muted); }
.dialog input[type=text], .dialog input[type=password] { width: 100%; height: 40px; margin: 6px 0 4px; padding: 0 12px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); outline: none; }
.dialog input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dialog .d-msg { min-height: 20px; font-size: 13px; color: var(--danger); margin-top: 4px; }
.dialog .d-msg.info { color: var(--muted); }
.dialog .d-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.dialog .d-check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text); font-size: 13.5px; }
.dialog table.keys { width: 100%; border-collapse: collapse; font-size: 13.5px; color: var(--text); }
.dialog table.keys td { padding: 5px 4px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.dialog table.keys td:first-child { white-space: nowrap; width: 42%; }

.toasts { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(560px, calc(100vw - 24px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px 11px 16px; border-radius: 12px; background: #1f2633; color: #f1f4fa; box-shadow: var(--shadow-lg); animation: pop .16s ease-out; }
@media (prefers-color-scheme: dark) { .toast { background: #e8ecf6; color: #121826; } }
.toast.bad { background: var(--danger); color: #fff; }
.toast .t-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast .t-btn { border: 0; background: none; color: inherit; font-weight: 700; padding: 6px 10px; border-radius: 8px; text-decoration: underline; text-underline-offset: 3px; }
.toast .t-btn:hover { background: rgba(127, 127, 127, .2); }
.toast .t-x { border: 0; background: none; color: inherit; opacity: .8; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; padding: 0; }
.toast .t-x svg { width: 16px; height: 16px; }

.transfers { position: fixed; right: 16px; bottom: 44px; z-index: 40; width: min(400px, calc(100vw - 24px)); max-height: min(60vh, 480px); display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; }
.transfers .tr-head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.transfers.collapsed .tr-head { border-bottom: 0; }
.transfers .tr-title { flex: 1; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.transfers .tr-total { height: 3px; background: var(--line-2); }
.transfers .tr-total i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.transfers .tr-list { overflow: auto; }
.transfers.collapsed .tr-list { display: none; }
.tr-item { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--line-2); }
.tr-item svg { width: 18px; height: 18px; color: var(--muted); }
.tr-item .tr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.tr-item .tr-line { grid-column: 2; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.tr-item .tr-bar { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
.tr-item .tr-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .2s; }
.tr-item.done .tr-bar i { background: var(--ok); }
.tr-item.error .tr-bar i { background: var(--danger); }
.tr-item.error .tr-line { color: var(--danger); }
.tr-item .tr-acts { grid-row: 1 / 3; grid-column: 3; display: flex; gap: 2px; }
.tr-item .tr-acts button { width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.tr-item .tr-acts button:hover { background: var(--line-2); color: var(--text); }
.tr-item .tr-acts svg { width: 16px; height: 16px; }

.selbar { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 45; display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 16px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
.selbar .sb-count { flex: 1; min-width: 0; font-weight: 650; font-size: 14px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.selbar .iconbtn { width: 40px; height: 44px; color: var(--text); }
.selbar .iconbtn.danger { color: var(--danger); }
.fab { position: fixed; right: 18px; bottom: calc(52px + env(safe-area-inset-bottom)); z-index: 44; width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-lg); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; }
.blocked { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; color: var(--muted); }

/* ---- phone.css ---- */
/* phone.css: narrow screens (a phone, or the floating window's full-screen sheet). Two-line rows with big
   targets, the path on its own row, search behind a button, actions in a bar that appears with a selection,
   an add button for upload / new folder. Same features, laid out for a thumb. */
@media (max-width: 720px) {
  body { font-size: 15.5px; }
  :root { --row: 60px; }
  .top { padding: 0 6px 0 4px; padding-top: env(safe-area-inset-top); }
  .top-row { height: 52px; gap: 4px; }
  .top .up-btn { display: inline-grid; }
  .brand-name { display: block; }
  .app.at-root .crumbs-row { display: none; }
  .app.at-root .up-btn { visibility: hidden; }
  .brand { flex: 1; min-width: 0; font-size: 17px; }
  .brand-mark { display: none; }
  .brand-name { overflow: hidden; text-overflow: ellipsis; }
  .top-row > .crumbs { display: none; }
  .crumbs-row { display: block; padding: 0 6px 6px; }
  .crumbs-phone { overflow-x: auto; scrollbar-width: none; flex: none; }
  .crumbs-phone::-webkit-scrollbar { display: none; }
  .crumb { font-size: 13.5px; padding: 4px 6px; }
  .search { display: none; }
  .app.searching .search { display: flex; position: absolute; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top)); width: auto; z-index: 20; }
  .app.searching .search input { height: 40px; font-size: 16px; box-shadow: var(--shadow-lg); }
  .search .hint-key { display: none; }
  .top .search-btn { display: inline-grid; }
  .account { height: 36px; padding: 0 9px; font-size: 13px; }
  .account .acc-text { display: none; }
  .toolbar { display: none; }
  .toolbar.phone-keep { display: flex; padding: 6px 8px; min-height: 0; }
  .list-head { display: none; }
  .row, .list.trash-view .row, .list.search-view .row { grid-template-columns: 34px minmax(0, 1fr) 44px; grid-template-rows: auto auto; column-gap: 10px; row-gap: 0; padding: 0 2px 0 12px; height: var(--row); align-content: center; }
  .row .check { display: none; }
  .row .ico { grid-row: 1 / 3; grid-column: 1; width: 28px; height: 28px; }
  .row .name { grid-column: 2; grid-row: 1; }
  .row .sub { display: block; grid-column: 2; grid-row: 2; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .size, .row .when, .row .from { display: none; }
  .row .more { grid-column: 3; grid-row: 1 / 3; opacity: 1; width: 44px; height: 44px; }
  .row.dir .more.chev { color: var(--faint); }
  .app.selecting .row .check { display: grid; grid-row: 1 / 3; grid-column: 1; width: 26px; height: 26px; border-radius: 13px; }
  .app.selecting .row .ico { display: none; }
  .row.sel { background: var(--accent-soft); }
  .row.focus { box-shadow: none; }
  .status { padding: 4px 12px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .status .build { display: none; }
  .app.selecting .status, .app.selecting .fab { visibility: hidden; }
  .list { padding-bottom: 84px; }
  .transfers { left: 8px; right: 8px; width: auto; bottom: calc(52px + env(safe-area-inset-bottom)); }
  .app.selecting .transfers { bottom: calc(76px + env(safe-area-inset-bottom)); }
  .toasts { bottom: calc(118px + env(safe-area-inset-bottom)); }
  .scrim { place-items: end center; padding: 0; }
  .dialog { width: 100%; border-radius: 18px 18px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); animation: rise .18s ease-out; }

<script>
// ---- relay-client.js ----
/* relay-client.js: the PC Relay client (ONE source: Projects\pc-relay\client\relay-client.js; each page's build
   copies it in, so never edit a copy). Talks to PC Relay on Jon's PC (Tailscale Funnel).
   - Nothing happens until the page calls something: no background traffic of its own.
   - Status events: checking / connected / starting / ready / offline / off / signin / reload, each with a plain `why`.
   - Sign-in passes are per device and per scope ("screen", "files-private"), kept in localStorage, sent in the
     X-Relay-Pass header (HTTP) or as WebSocket subprotocols "pass.<p>" (a browser cannot set WebSocket headers);
     never in a URL, never cookies.
   - Version-checked: a relay that needs a newer client says so, and the status becomes "reload". */
(function (root) {
  "use strict";
  const VERSION = 1;
  const DEFAULT_PC = "https://desktop-krq9ti2.tail46434.ts.net";
  const store = {
    get(k) { try { return root.localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { if (v) root.localStorage.setItem(k, v); else root.localStorage.removeItem(k); } catch (e) {} },
    keys() { try { return Object.keys(root.localStorage); } catch (e) { return []; } },
  };
  let memDevice = "";
  function deviceId() {
    let d = store.get("relay-device") || memDevice;
    if (!/^[A-Za-z0-9_-]{8,64}$/.test(d)) {
      d = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, "0")).join("");
      store.set("relay-device", d);
      memDevice = d;
    }
    return d;
  }
  function httpWhy(status) {
    return ({ 401: "the PC wants the password", 403: "the PC refused this page", 404: "the PC has no such program",
      410: "this page is out of date: reload it", 426: "this page is out of date: reload it",
      429: "too many requests: wait a minute", 502: "the PC is reachable but the relay is not running (502)",
      503: "the PC said it is busy or switched off (503)" })[status] || `the PC answered ${status}`;
  }
  function netWhy(err, ms) {
    if (err && err.name === "AbortError") return `no answer from the PC within ${Math.round(ms / 1000)} s`;
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "this device is offline";
    return "could not reach the PC (no network, or the PC is off or asleep)";
  }

  // HTTP answer), so a page can say which it was and decide whether trying again can help:
  // "offline" (this device has no network), "timeout", "network" (no connection to the PC), "http" (the PC
  // answered with an error status), "off" (the relay is switched off), "reload", "signin", "start" (a program
  // failed or stopped answering while it started).
  function netKind(err) {

    if (typeof navigator !== "undefined" && navigator.onLine === false) return "offline";
    return "network";

    return httpWhy(r.status);

    constructor(opts) {

      this.base = String(opts.base || DEFAULT_PC).replace(/\/+$/, "");

      this.latency = 0;          // ms, the last ping's round trip
      this.bytes = 0;            // bytes this client has fetched through fetchJSON / fetch (approximate)
      this.subs = new Set();

    setBase(url) { this.base = String(url || DEFAULT_PC).replace(/\/+$/, ""); }
    on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); }
    _set(state, extra) {

    pass(scope) { try { const j = JSON.parse(store.get("relay-pass:" + scope) || "null"); return (j && j.pass) || ""; } catch (e) { return ""; } }
    hasPass(scope) { return !!this.pass(scope); }
    passes() {
      const out = [];
      for (const k of store.keys()) if (k.startsWith("relay-pass:")) { const p = this.pass(k.slice(11)); if (p) out.push(p); }
      return out;
    }
    adoptPass(scope, pass) { if (pass) store.set("relay-pass:" + scope, JSON.stringify({ pass, at: Date.now() })); }
    forget(scope) { store.set("relay-pass:" + scope, ""); }

    wsUrl(service, path) { return this.url(service, path).replace(/^http/, "ws"); }
    wsProtocols() { return ["relay", "dev." + deviceId(), ...this.passes().map((p) => "pass." + p)]; }
    ws(service, path) { return new WebSocket(this.wsUrl(service, path), this.wsProtocols()); }

        const r = await fetch(`${this.base}/relay/ping?t=${Date.now()}`, { headers: this.headers(), cache: "no-store", signal: ac.signal });
        if (!r.ok) { const why = await readError(r); this._set(r.status === 426 ? "reload" : "offline", { why }); return { ok: false, why, kind: r.status === 426 || r.status === 410 ? "reload" : "http", status: r.status }; }

        this._set("connected", { why: `connected (${this.latency} ms)`, info, latency: this.latency });
        return { ok: true, info, latency: this.latency };
      } catch (err) {

        return { ok: false, why, kind: netKind(err) };

// api.js: talking to Relay Files on Jon's PC through PC Relay (relay-client.js, copied in at build time).
// Every failure becomes an FM.ApiError with a plain message (and .status, .code, .data, .signin, .net). The PC's

// ---- report.js ----
// report.js: the page's own failures go to the PC's log (Relay Files' files.log, through PC Relay: POST log), so a
// failure Jon saw can be looked up later: what was being done, on what, the message he saw, the PC's answer (its
// status and error), the transfer's tries, the page's version. Script errors too. Sent in the background, a few at
// a time; kept in this browser (up to 100, localStorage "fm-reports") while the PC cannot be reached, and sent when
// it answers again. Never a password, a pass or a download ticket (a ticket link is blanked; the PC blanks again).
//   FM.report(action, error, extra)   error: an FM.ApiError, an Error or a plain message; extra: { what, items,
//                                     name, path, folder, transfer, detail, ... } (anything JSON)
"use strict";
(function () {
  const KEY = "reports", MAX = 100, BATCH = 20;
  let queue = FM.store.get(KEY, []);
  if (!Array.isArray(queue)) queue = [];

  const save = () => FM.store.set(KEY, queue);
  const clean = (s, n) => String(s == null ? "" : s).replace(/\/t\/[A-Za-z0-9_-]{16,}/g, "/t/[ticket]").slice(0, n || 2000);

  function plain(v, depth) {
    if (v == null || typeof v === "number" || typeof v === "boolean") return v;
    if (typeof v === "string") return clean(v);
    if (depth > 3) return "[cut]";
    if (Array.isArray(v)) return v.slice(0, 50).map((x) => plain(x, depth + 1));
    if (typeof v === "object") {
      const out = {};
      for (const [k, x] of Object.entries(v).slice(0, 40)) if (typeof x !== "function") out[k] = plain(x, depth + 1);
      return out;
    }
    return clean(String(v));
  }
  function itemOf(it) {
    if (!it) return null;
    if (typeof it === "string") return { name: it };
    return { id: it.id || it.tid || undefined, name: it.name, path: it.path || undefined, dir: it.dir || undefined, size: it.size || undefined, private: it.private || undefined };
  }

  function report(action, e, extra) {
    try {
      if (e && e.aborted) return; // the person stopped it
      const S = FM.S || {};
      const r = { at: new Date().toISOString(), action: String(action || "page"), page: (window.FM_BUILD && FM_BUILD.version) || "" };
      if (e != null) {
        if (typeof e === "string") r.error = clean(e);
        else {
          r.error = clean(e.message || String(e));
          if (e.status != null) r.status = e.status;
          if (e.code) r.code = clean(e.code, 100);
          if (e.net) r.net = true;
          if (e.signin) r.signin = clean(e.signin, 60);
          if (e.data && typeof e.data === "object" && Object.keys(e.data).length) r.answer = plain(e.data, 1); // the PC's own answer
          if (e.stack && !(e instanceof FM.ApiError)) r.detail = clean(e.stack, 6000);
        }
      }
      const x = Object.assign({}, extra || {});
      if (x.items) x.items = [].concat(x.items).slice(0, 50).map(itemOf);
      for (const [k, v] of Object.entries(x)) if (v !== undefined) r[k] = plain(v, 1);
      if (!r.folder && S.folder) r.folder = { id: S.folder.id, name: S.folder.name };
      if (S.view && S.view !== "folder") r.view = S.view;
      r.signed = !!S.signed;
      if (FM.embedded) r.embedded = (S.pick && clean(S.pick.host, 80)) || true; // inside another page's window
      r.online = navigator.onLine;
      if (navigator.connection && navigator.connection.effectiveType) r.network = navigator.connection.effectiveType;
      r.where = location.origin + location.pathname;
      if (FM.api && FM.api.custom) r.pc = FM.api.base; // only when it is not the usual PC
      queue.push(r);
      if (queue.length > MAX) queue.splice(0, queue.length - MAX);
      save();
      soon(600);
    } catch (x) { /* a report must never break the page */ }
  }
  function soon(ms) { clearTimeout(timer); timer = setTimeout(flush, ms); }

  // Send what is waiting, BATCH at a time. A failure keeps them (and waits longer); a refusal of the report
  // itself (400: the PC cannot read it) drops that batch, so it is not sent for ever.
  async function flush() {
    clearTimeout(timer);
    if (sending || !queue.length || !FM.api) return;
    sending = true;
    try {
      while (queue.length) {
        const batch = queue.slice(0, BATCH);
        let r;
        try { r = await FM.api.raw("POST", "log", { json: { reports: batch }, timeout: 15000 }); }
        catch (e) { break; }
        if (r.ok || r.status === 400 || r.status === 413) { queue.splice(0, batch.length); save(); sent += batch.length; wait = 3000; continue; }
        break; // the PC is busy, switched off or not reachable: later
      }
    } finally { sending = false; }
    if (queue.length) { soon(wait); wait = Math.min(300000, wait * 2); }
  }

  addEventListener("error", (ev) => {
    const src = ev.filename || "";
    if (/^(chrome|moz|safari)-extension:/.test(src) || /ResizeObserver loop/.test(ev.message || "")) return;
    report("page-error", ev.error || ev.message || "a script error", { source: src ? `${src}:${ev.lineno}:${ev.colno}` : undefined });
  });
  addEventListener("unhandledrejection", (ev) => {
    const e = ev.reason;
    if (e && (e.aborted || e.name === "AbortError")) return;
    report("page-error", e instanceof Error ? e : String(e), { what: "a promise failed with nothing to catch it" });
  });
  addEventListener("online", () => { wait = 3000; soon(500); });
  if (queue.length) soon(4000); // the ones kept from an earlier visit

  FM.report = report;
  FM.reports = { flush, get waiting() { return queue.slice(); }, get sent() { return sent; } };
})();

// ---- unzip.js ----
// unzip.js: a zip into File objects, with the browser's own decompressor (stored and deflated entries; zip64).

// ---- ops.js ----
// ops.js: what the buttons, menus and keys do. Every change goes to the PC, which has the last word; when it
// answers 409 the page asks (an existing name: Replace / Keep both / Skip; something private going somewhere
// public: say so first) and sends the answer. Every result is said in a toast; delete, move, copy and rename
// can be undone from it. Nothing fails silently: the reason goes in a toast that stays until closed.
"use strict";
