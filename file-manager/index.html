  }

  function render() {
    renderHeader(); renderNotes(); renderToolbar(); renderWhose(); renderList(); renderStatus();
    $(".loadbar").hidden = !(S.loading || S.refreshing || S.picking);
  }
  function sel() {
    for (const r of document.querySelectorAll(".list .row")) {
      const id = r.dataset.id, on = S.sel.has(id);
      r.classList.toggle("sel", on);
      r.classList.toggle("focus", S.focus === id && !r.classList.contains("recent"));
      r.setAttribute("aria-selected", String(on));
      const c = r.querySelector(".check"); if (c) c.setAttribute("aria-checked", String(on));
    }
    const headCheck = document.querySelector(".list-head .check");
    if (headCheck) {
      const can = S.items.filter(FM.tickable);
      headCheck.setAttribute("aria-checked", String(!!(can.length && can.every((i) => S.sel.has(key(i))))));
    }
    renderToolbar(); renderStatus();
  }
  function focusRow(id) {
    const r = document.querySelector(`.list .row:not(.recent)[data-id="${CSS.escape(id)}"]`);
    if (r) r.scrollIntoView({ block: "nearest" });
  }
  function flash(ids) {
    for (const id of ids) { const r = document.querySelector(`.list .row:not(.recent)[data-id="${CSS.escape(id)}"]`); if (r) { r.classList.add("flash"); setTimeout(() => r.classList.remove("flash"), 1500); } }
  }
  FM.view = { render, sel, focusRow, flash, renderStatus, renderToolbar, renderNotes, rowEl };
})();

// ---- ops.js ----
// ops.js: what the buttons, menus and keys do. Every change goes to the PC, which has the last word; when it
// answers 409 the page asks (an existing name: Replace / Keep both / Skip; something private going where everyone
// sees it: say so first) and sends the answer. Every result is said in a toast; delete, move, copy and rename
// can be undone from it. Nothing fails silently: the reason goes in a toast that stays until closed.
"use strict";
(function () {
  const S = FM.S;
  // Downloads up to this size come through the page (progress, Cancel, plain errors); bigger ones go to the
  // browser's own download manager, straight to disk (a page would have to hold them in memory).
  FM.limits = FM.limits || { inPage: 300e6 };
  const toast = (t, o) => FM.ui.toast(t, o);
  const reload = (o) => FM.app.reload(o);

  // A failure: said in a toast that stays, and sent to the PC's log (report.js) with what was being done.
  function fail(e, what, ctx) {
    if (e && e.aborted) return;
    FM.report((ctx && ctx.action) || "action", e, Object.assign({ what }, ctx || {}, { action: undefined }));
    if (e && e.signin && !S.me.account) return toast(`${what}: sign in first.`, { bad: true, action: () => account(), actionText: "Sign in" });
    toast(`${what}: ${(e && e.message) || e}`, { bad: true });
  }

  // ---- the account page ----------------------------------------------------------------------------------------------
  // Signing in, setting up a user, the person's own account, signing out and switching user are one shared page
  // (settings\account.html, published beside this one), shown in the window kit's window. This page has no sign-in box
  // of its own: it hears the change (relay-client's account event, app.js) and lists again as that person.
  let acctWin = null;
  function account() {
    if (acctWin) { acctWin.front(); acctWin.focus(); return acctWin; }
    const url = new URL("../settings/account.html", location.href.split("#")[0]).href;
    const win = (acctWin = WindowKit.open(url, { title: "Account", name: "account", width: 440, height: 660, onClose: () => { if (acctWin === win) acctWin = null; } }));
    // The account page says "ready" as soon as it has loaded. A frame that loaded something else (the site's "not
    // found" page, the browser's own error page) never does: then the window goes, and one line says what failed.
    let ready = false;
    win.ready.then(() => { ready = true; });
    win.frame.addEventListener("load", () => setTimeout(() => {
      if (ready || acctWin !== win) return;
      win.close();
      FM.report("account", "the account page did not load", { what: "the account window", url });
      toast("The account page could not be opened. Try again in a moment.", { bad: true });
    }, 4000), { once: true });
    return win;
  }

  // ---- questions ------------------------------------------------------------------------------------------
  async function askConflicts(conflicts, where) {
    const n = conflicts.length;
    const rows = conflicts.map((c) => FM.h("div", null, FM.h("b", { text: c.name || c.path }), FM.h("span.d-meta", { text: c.existing ? `  (there now: ${c.existing.dir ? "a folder" : FM.size(c.existing.size) + ", " + FM.when(c.existing.mtime)})` : "" })));
    const r = await FM.ui.dialog({
      title: n === 1 ? `“${conflicts[0].name || conflicts[0].path}” is already there` : `${n} of them are already there`,
      body: [`${where ? `“${where}” has` : "That folder has"} ${n === 1 ? "something" : `${n} things`} with the same name. A replaced one goes to the trash.`],
      list: n > 1 ? rows : null,
      actions: [{ text: "Cancel", value: false }, { text: "Skip", value: "skip" }, { text: "Keep both", value: "keep" }, { text: "Replace", value: "replace", primary: true }],
    });
    return r ? r.value : null;
  }
  const askPublic = (names, where) => FM.ui.confirm(`Let everyone see ${names.length === 1 ? "it" : "them"}?`,
    [`“${where}” is not private: everyone can see what is in it. ${names.length === 1 ? "This private item" : "These private items"} would be seen there:`],
    "Move anyway", { list: names, danger: true });

  // send(body) until the PC says yes or the user says stop; asks about conflicts and privacy on the way.
  async function asking(send, body, where) {
    for (let round = 0; round < 4; round++) {
      try { return await send(body); }
      catch (e) {
        if (e.status === 409 && e.code === "exists" && e.data && e.data.conflicts) {
          const pol = await askConflicts(e.data.conflicts, where);
          if (!pol) return null;
          body.conflict = pol; continue;
        }
        if (e.status === 409 && e.code === "public") {
          if (!(await askPublic(e.data.public || [], where))) return null;
          body.public_ok = true; continue;
        }
        throw e;
      }
    }
    throw new FM.ApiError("The PC kept refusing; nothing more was changed.");
  }
  function sayResults(results, verbDone, where) {
    const ok = results.filter((r) => r.ok && !r.skipped), skipped = results.filter((r) => r.skipped), bad = results.filter((r) => !r.ok);
    for (const r of bad) toast(`“${r.name || "An item"}” was not ${verbDone}: ${r.error}`, { bad: true });
    if (bad.length) FM.report(verbDone, `${bad.length} of ${results.length} not ${verbDone}`, { what: `the PC refused ${bad.length === 1 ? "one item" : bad.length + " items"}`, where, results: bad.slice(0, 50) });
    return { ok, skipped, bad };
  }
  const named = (list, nameOf) => (list.length === 1 ? `“${nameOf(list[0])}”` : FM.plural(list.length, "item"));

  // ---- folders and names --------------------------------------------------------------------------------------
  async function newFolder() {
    if (!S.writable || S.view !== "folder" || S.pick) return;
    const names = new Set(S.items.map((i) => i.name.toLowerCase()));
    let name = "New folder";
    for (let n = 2; names.has(name.toLowerCase()); n++) name = `New folder (${n})`;
    const v = await FM.ui.prompt("New folder", { value: name, okText: "Make folder", label: "Folder name", validate: (t) => FM.badName(t.trim()) || (names.has(t.trim().toLowerCase()) ? `“${t.trim()}” is already in this folder.` : "") });
    if (v == null) return;
    try {
      const r = await FM.api.post("mkdir", { parent: S.folder.id, name: v.trim() });
      await reload({ select: [r.item && r.item.id] });
      toast(`Made the folder “${v.trim()}”.`);
    } catch (e) { fail(e, "The folder could not be made", { action: "mkdir", name: v.trim(), parent: S.folder && S.folder.name }); }
  }
  async function rename(it) {
    if (!FM.canChange(it)) return;
    const dot = !it.dir ? it.name.lastIndexOf(".") : -1;
    const v = await FM.ui.prompt(`Rename ${it.dir ? "folder" : "file"}`, { value: it.name, select: [0, dot > 0 ? dot : it.name.length], okText: "Rename", label: "New name", validate: (t) => FM.badName(t.trim()) });
    if (v == null || v.trim() === it.name) return;
    const body = { id: it.id, name: v.trim() };
    try {
      const r = await asking((b) => FM.api.post("rename", b), body, S.folder && S.folder.name);
      if (!r) return;
      await reload({ select: [r.item && r.item.id] });
      const back = { id: r.item && r.item.id, name: it.name };
      toast(`Renamed to “${r.item ? r.item.name : v.trim()}”.`, { action: async () => { try { await FM.api.post("rename", back); await reload({ select: [it.id] }); } catch (e) { fail(e, "It could not be renamed back", { action: "rename", items: [back], name: it.name }); } } });
    } catch (e) { fail(e, `“${it.name}” could not be renamed`, { action: "rename", items: [it], name: v.trim() }); }
  }

  // ---- delete (to the trash) ---------------------------------------------------------------------------------
  async function del(items) {
    items = items.filter(FM.canChange);
    if (!items.length) return;
    try {
      const r = await FM.api.post("delete", { ids: items.map((i) => i.id) });
      const { ok } = sayResults(r.results, "moved to the trash");
      await reload();
      if (ok.length) {
        const tids = r.trash;
        toast(`${named(ok, (x) => x.name)} moved to the trash.`, { action: () => restore(tids.map((tid) => ({ tid }))), actionText: "Undo" });
      }
    } catch (e) { fail(e, "Nothing was deleted", { action: "delete", items }); }
  }

  // ---- move and copy -----------------------------------------------------------------------------------------
  function pickUp(items, mode) {
    items = items.filter((i) => (mode === "copy" ? !i.locked && !i.kind : FM.canChange(i)));
    if (!items.length || !S.me.account || S.pick) return;
    S.clip = { mode, items: items.map((i) => ({ id: i.id, name: i.name, dir: i.dir, size: i.size, private: i.private, parent: i.parent })), from: S.folder ? S.folder.id : "root" };
    S.sel.clear();
    FM.view.render(); // the notice line says what to do next; the buttons become Paste here and Cancel
  }
  async function paste() {
    if (!S.clip || S.view !== "folder" || !S.writable) return;
    const clip = S.clip;
    const done = await moveTo(clip.items, S.folder, clip.mode === "copy");
    if (done) S.clip = null;
    FM.view.render();
  }
  // items -> the folder `to` ({id, name}); returns true when something was done.
  async function moveTo(items, to, copy) {
    if (!items.length) return false;
    const where = FM.S.folder && to.id === FM.S.folder.id && FM.S.crumbs.length <= 1 ? FM.topName() : to.name;
    if (!copy && items.every((i) => FM.parentOf(i) === to.id)) { toast(`${items.length === 1 ? "It is" : "They are"} already in “${where}”.`); return false; }
    const body = { ids: items.map((i) => i.id), to: to.id };
    if (copy && items.some((i) => FM.parentOf(i) === to.id)) body.conflict = "keep"; // a copy into its own folder: "name (2)"
    if (!copy) {
      try {
        const r = await asking((b) => FM.api.post("move", b), body, where);
        if (!r) return false;
        const { ok } = sayResults(r.results, "moved");
        await reload({ select: ok.map((x) => x.new_id) });
        if (ok.length) {
          const from = FM.S.clip ? FM.S.clip.from : null;
          toast(`Moved ${named(ok, (x) => x.new_name || x.name)} to “${where}”.`, from ? { action: async () => {
            try { const b = await asking((x) => FM.api.post("move", x), { ids: ok.map((x) => x.new_id), to: from }, "where they were"); if (b) await reload(); } catch (e) { fail(e, "They could not be moved back", { action: "move", items: ok.map((x) => ({ id: x.new_id, name: x.new_name || x.name })), to: from }); }
          } } : {});
        }
        return true;
      } catch (e) { fail(e, "Nothing was moved", { action: "move", items, to: { id: to.id, name: to.name } }); return false; }
    }
    // A copy runs on the PC with progress, shown with the transfers. The PC answers its questions (409: a name
    // in the way, something private going where everyone sees it) before it starts copying, so they are asked here first.
    const total = items.reduce((a, i) => a + (i.size || 0), 0);
    const t = FM.transfers.add({
      kind: "copy", name: items.length === 1 ? items[0].name : `${items.length} items`, total, where,
      run: async (tr) => {
        const res = await asking((b) => FM.api.copy(b, (p) => { tr.progress(p.bytes, p.total); if (p.total_files > 1) tr.say(`${FM.size(p.bytes)} of ${FM.size(p.total)} · ${p.files} of ${p.total_files} files`); }, tr.ac.signal), body, where);
        if (!res) return { cancelled: true };
        const { ok } = sayResults(res.results, "copied");
        await reload({ select: ok.map((x) => x.new_id) });
        if (ok.length) toast(`Copied ${named(ok, (x) => x.new_name || x.name)} to “${where}”.`, { action: () => delById(ok.map((x) => x.new_id)), actionText: "Undo" });
        return {};
      },
    });
    await t.done;
    return t.state === "done";
  }
  // Undo of a copy: the copies go to the trash (by their ids: they may not be in the folder shown any more)
  async function delById(ids) {
    try { await FM.api.post("delete", { ids }); await reload(); }
    catch (e) { fail(e, "The copies could not be removed", { action: "delete", ids }); }
  }

  // ---- private / not private: folders of the Shared Folder ------------------------------------------------------
  async function setPrivate(it, on) {
    if (!FM.canMark(it)) return;
    if (!on) {
      if (!it.own_private) return toast(`“${it.name}” is private because it is inside “${it.priv_from}”.`, { bad: true, ms: 7000 });
      const ok = await FM.ui.confirm(`Make “${it.name}” public?`, [`Everyone will be able to see its ${FM.plural(it.files || 0, "file")}.`], "Make public", { danger: true });
      if (!ok) return;
    }
    try {
      const r = await FM.api.post("private", { id: it.id, private: on });
      await reload({ select: [r.item && r.item.id] });
      toast(on ? `“${it.name}” is private now.` : `“${it.name}” is public now.`);
    } catch (e) { fail(e, on ? "It is not private" : "It is still private", { action: "private", items: [it], private: on }); }
  }

  // ---- download and open ---------------------------------------------------------------------------------------
  // returns the transfer (its .done settles when it ends; .state says how), or null when there is nothing to download
  function download(items) {
    items = items.filter((i) => !i.locked && i.id);
    if (!items.length) return null;
    const one = items.length === 1 ? items[0] : null;
    const zip = !one || one.dir;
    const total = items.reduce((a, i) => a + (i.size || 0), 0);
    const here = (S.folder && S.crumbs.length > 1 && S.folder.name) || "Cloud File Manager";
    const name = one ? (one.dir ? one.name + ".zip" : one.name) : `${here} (${items.length} items).zip`;
    return FM.transfers.add({
      kind: "down", name, total,
      run: async (t) => {
        if (total > FM.limits.inPage) { // straight to disk through the browser
          const url = await FM.api.link(items, { zip, name });
          // asked first, so a refusal is said here instead of the page going to an error
          const head = await fetch(url, { method: "HEAD", cache: "no-store", signal: t.ac.signal }).catch((e) => { throw new FM.ApiError(t.ac.signal.aborted ? "Stopped." : "Could not reach the PC (no network, or the PC is off or asleep).", { aborted: t.ac.signal.aborted, net: true }); });
          if (!head.ok) throw new FM.ApiError(head.status === 404 ? "It is no longer there, or the download link ran out: try again." : FM.sentence(RelayClient.httpWhy(head.status)), { status: head.status });
          FM.navigateDownload(url);
          t.say(`Large (${FM.size(total)}): it goes straight to your browser's downloads.`);
          if (zip) leftOut(name, FM.zipInfo(head.headers), null);
          return { handed: true };
        }
        let hdr = null;
        const b = await FM.api.blob(zip ? FM.api.zipPath(items, name) : FM.api.filePath(one) + "?dl=1", { onProgress: t.progress, signal: t.ac.signal, expect: total, type: zip ? "application/zip" : "", onHeaders: (h) => { hdr = h; } });
        FM.saveBlob(b, name);
        if (zip) leftOut(name, FM.zipInfo(hdr), await FM.unzip.count(b).catch(() => null));
        return {};
      },
    });
  }
  // A zip the PC made without some files (open in another program, moved or changed while it was packed): said in
  // a toast that stays (the PC's headers name them; its log says why). files = the files really in the zip (null =
  // not counted): fewer than the PC said means some failed while it was being sent.
  function leftOut(name, info, files) {
    const late = files != null && info.files != null ? Math.max(0, info.files - files) : 0;
    const n = info.skipped + late;
    if (!n) return;
    const shown = info.names.slice(0, 3), more = n - shown.length;
    const names = shown.map((p) => `“${p.split("/").pop()}”`).join(", ");
    toast(`“${name}” ${files == null ? "will be saved" : "was saved"} without ${FM.plural(n, "file")} the PC could not read${names ? ": " + names + (more > 0 ? ` and ${more} more` : "") : ""}.`, { bad: true });
  }

  // Open. A file one of Jon's programs owns (its extension is that program's in the one list) opens in that program,
  // in a new tab: ../<program>/#open=<file id>. Any other file: its own link in a new tab, where the browser shows
  // what it can (text, Markdown, pages, pictures, PDF, sound, video; the PC sends each with a type a tab shows) and
  // downloads the rest, closing the tab. A file of the Shared Folder that is not private has a plain link, known at
  // once; any other gets a 10-minute ticket link first (a link cannot carry the pass). Never a blank tab filled in
  // later: a download then left it stuck on "Opening…" (2026-11-07).
  function tab(url, name) {
    const w = window.open(url, "_blank");
    if (w) { try { w.opener = null; } catch (e) {} return; }
    FM.report("open", "the browser blocked the new tab", { name });
    toast(`The browser blocked the new tab for “${name}”.`, { bad: true, action: () => tab(url, name), actionText: "Open it" });
  }
  async function open(it) {
    if (!it || it.locked) return;
    if (it.dir) return FM.app.go(it.id);
    if (!FM.apps.loaded && !FM.apps.failed) await FM.apps.load(); // a click before the one list has arrived waits for it
    const prog = FM.apps.owner(it.name);
    if (prog) return tab(FM.apps.url(prog, it.id), it.name);
    if (FM.isPublic(it)) return tab(FM.api.client.url("files", FM.api.filePath(it)), it.name);
    try { tab(await FM.api.link([it], { inline: true }), it.name); }
    catch (e) { fail(e, `“${it.name}” could not be opened`, { action: "open", items: [it] }); }
  }
  // "Open with": the file in one of the programs that can open it, in a new tab
  const openWith = (it, prog) => tab(FM.apps.url(prog, it.id), it.name);
  // Open for what is ticked (the Open button, the menu): one file in a new tab, one folder here; several, each in its
  // own new tab.
  function openMany(items) {
    if (items.length === 1) return items[0].dir ? FM.app.go(items[0].id) : open(items[0]);
    return openTabs(items);
  }
  // Several at once, in the list's order: each by its row's own link in a new tab (view.js linkOf), all in this one
  // click. More than 10 asks first. A browser lets a page open one tab per click unless the site may open pop-ups:
  // the tabs it blocked are said, and a button opens the rest (never a silent part of them).
  async function openTabs(items, asked) {
    const order = FM.sorted();
    items = items.filter((i) => FM.linkOf(i)).sort((a, b) => order.indexOf(a) - order.indexOf(b));
    const n = items.length;
    if (!n) return;
    if (n > 10 && !asked && !(await FM.ui.confirm(`Open ${n} tabs?`, [`Each of the ${n} opens in its own new tab.`], `Open ${n} tabs`))) return;
    const blocked = [];
    for (const it of items) {
      const w = window.open(FM.linkOf(it), "_blank");
      if (w) { try { w.opener = null; } catch (e) {} } else blocked.push(it);
    }
    if (!blocked.length) return;
    const b = blocked.length, site = location.host || "this page";
    FM.report("open", `the browser blocked ${b} of ${n} new tabs (pop-ups not allowed for ${site})`, { what: "several opened at once", items: blocked.slice(0, 50) });
    toast(`${b < n ? `Opened ${n - b} of ${n}: the browser blocked the other ${b}` : `The browser blocked all ${n} new tabs`}. Allow pop-ups for this site in the browser, then press “Open the other ${b}”.`,
      { bad: true, action: () => openTabs(blocked, true), actionText: `Open the other ${b}` });
  }

  // ---- the trash -------------------------------------------------------------------------------------------------
  async function restore(items) {
    if (!items.length) return;
    const body = { tids: items.map((i) => i.tid) };
    try {
      const r = await asking((b) => FM.api.post("trash/restore", b), body, "its old folder");
      if (!r) return;
      const { ok } = sayResults(r.results, "restored");
      await reload({ select: ok.map((x) => x.new_id) });
      if (ok.length) {
        const first = ok[0];
        const folder = first.path && first.path.includes("/") ? first.path.slice(0, first.path.lastIndexOf("/")) : "";
        toast(`Restored ${named(ok, (x) => x.new_name || x.name)}${folder ? ` to “${folder}”` : ""}.`, S.view === "trash" && first.path ? { action: () => FM.app.goPath(folder, first.new_id), actionText: "Show" } : {});
      }
    } catch (e) { fail(e, "Nothing was restored", { action: "restore", items }); }
  }
  async function purge(items) {
    if (!items.length) return;
    const size = items.reduce((a, i) => a + (i.size || 0), 0);
    if (!(await FM.ui.confirm(`Delete ${named(items, (x) => x.name)} for good?`, [`${FM.size(size)} will be gone. This cannot be undone.`], "Delete for good", { danger: true }))) return;
    try {
      const r = await FM.api.post("trash/delete", { tids: items.map((i) => i.tid) });
      const { ok } = sayResults(r.results, "deleted");
      await reload();
      if (ok.length) toast(`Deleted ${FM.plural(ok.length, "item")} for good.`);
    } catch (e) { fail(e, "Nothing was deleted", { action: "delete-forever", items }); }
  }
  async function emptyTrash() {
    const n = S.items.length, size = S.items.reduce((a, i) => a + (i.size || 0), 0);
    if (!n) return;
    // with the right to everyone's files the trash holds what everyone deleted, and Empty removes all of it
    const whose = S.rights.everyone ? `Everything in the trash, from everyone: ${FM.plural(n, "item")} (${FM.size(size)}).` : `All ${FM.plural(n, "item")} (${FM.size(size)}).`;
    if (!(await FM.ui.confirm("Empty the trash?", [`${whose} This cannot be undone.`], "Empty the trash", { danger: true }))) return;
    try {
      const r = await FM.api.post("trash/empty", {});
      sayResults(r.results, "deleted");
      await reload();
      toast("The trash is empty.");
    } catch (e) { fail(e, "The trash was not emptied", { action: "empty-trash" }); }
  }

  FM.ops = { fail, account, newFolder, rename, del, pickUp, paste, moveTo, setPrivate, download, open, openWith, openMany, openTabs, restore, purge, emptyTrash, askConflicts, asking };
})();

// ---- upload.js ----
// upload.js: files into the current folder (or a folder row they were dropped on): from the Upload button, a
// folder picker, a drop (folders walked, their paths kept) or a paste. Only where this person may add files (the
// folder shown says so, FM.S.writable; a row dropped on, FM.canWriteInto). Before anything is sent the PC checks the
// names, the space and what is already there (POST /check); names the cloud hides are left out and said; an existing
// name is asked about once for all. Then each file goes up in one piece (up to 16 MB) or in 8 MB chunks that resume
// after a dropped connection (5 tries, waiting 1, 2, 4, 8, 16 s, said in the panel).
"use strict";
(function () {
  const S = FM.S;
  const SINGLE = 16 * 1024 * 1024, CHUNK = 8 * 1024 * 1024;

  // A drop's folders, walked (the entries must be taken before the first await).
  async function fromDrop(dt) {
    const entries = [...(dt.items || [])].filter((i) => i.kind === "file").map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
    const plain = [...(dt.files || [])];
    if (!entries.length) return { files: plain.map((f) => ({ file: f, path: f.name })), dirs: [] };
    const files = [], dirs = [];
    const readAll = (reader) => new Promise((res, rej) => { const out = []; const step = () => reader.readEntries((b) => { if (!b.length) res(out); else { out.push(...b); step(); } }, rej); step(); });
    async function walk(e, prefix) {
      if (e.isFile) files.push({ file: await new Promise((res, rej) => e.file(res, rej)), path: prefix + e.name });
      else if (e.isDirectory) {
        const kids = await readAll(e.createReader());
        if (!kids.length) dirs.push(prefix + e.name);
        for (const k of kids) await walk(k, prefix + e.name + "/");
      }
    }
    for (const e of entries) await walk(e, "");
    return { files, dirs };
  }
  const fromInput = (list) => ({ files: [...list].map((f) => ({ file: f, path: f.webkitRelativePath || f.name })), dirs: [] });

  async function start(batch, to) {
    to = to || S.folder;
    const here = !!to && !!S.folder && to.id === S.folder.id;
    if (S.pick || !to || !(here ? S.writable : FM.canWriteInto(to))) return FM.ui.toast("Files cannot be added here.", { bad: true, ms: 6000 });
    const toName = here && S.crumbs.length <= 1 ? FM.topName() : to.name;
    let { files, dirs } = batch;
    const hidden = files.filter((f) => f.path.split("/").some(FM.hiddenName));
    files = files.filter((f) => !hidden.includes(f));
    dirs = dirs.filter((d) => !d.split("/").some(FM.hiddenName));
    if (hidden.length) FM.ui.toast(`Left out ${FM.plural(hidden.length, "file")} with a hidden kind of name (a dot or ~$ at the start, or a temporary file): ${hidden.slice(0, 3).map((f) => f.path).join(", ")}${hidden.length > 3 ? "…" : ""}`, { ms: 9000 });
    if (!files.length && !dirs.length) return;
    let check;
    try {
      const paths = files.map((f) => ({ path: f.path, size: f.file.size }));
      for (const d of dirs) paths.push({ path: d, dir: true });
      for (const top of new Set(files.filter((f) => f.path.includes("/")).map((f) => f.path.split("/")[0]))) paths.push({ path: top, dir: true });
      check = await FM.api.post("check", { to: to.id, paths });
    } catch (e) { return FM.ops.fail(e, "Nothing was uploaded", { action: "upload-check", to: { id: to.id, name: to.name }, files: files.length, first: files.slice(0, 5).map((f) => f.path) }); }
    if (check.problems.length) {
      const bad = new Set(check.problems.map((p) => p.path));
      const go = await FM.ui.dialog({ title: `${FM.plural(check.problems.length, "name")} cannot go to the PC`,
        body: [files.length > bad.size ? "These are left out; the rest can go up:" : "None of them can go up:"],
        list: check.problems.map((p) => FM.h("div", null, FM.h("b", { text: p.path }), FM.h("span.d-meta", { text: `: ${p.error}` }))),
        actions: files.length > bad.size ? [{ text: "Cancel", value: false }, { text: "Upload the rest", value: true, primary: true }] : [{ text: "OK", value: false, primary: true }] });
      if (!go) return;
      files = files.filter((f) => !bad.has(f.path));
      dirs = dirs.filter((d) => !bad.has(d));
    }
    const need = files.reduce((a, f) => a + f.file.size, 0);
    if (check.low_space) { // the PC is low on space: for now each person's own files have a limit, and these would go over it
      FM.report("upload", "over the low-space limit", { limit: check.limit, need, files: files.length, to: { id: to.id, name: to.name } });
      return FM.ui.toast(`The PC is low on space, so for now each person can store ${FM.size(check.limit)}. These files (${FM.size(need)}) would go over that. Nothing was uploaded.`, { bad: true });
    }
    if (check.free >= 0 && need > check.free - 256e6) {
      FM.report("upload", "not enough space on the PC", { free: check.free, need, files: files.length, to: { id: to.id, name: to.name } });
      return FM.ui.toast(`The PC has ${FM.size(check.free)} free; these files need ${FM.size(need)}. Nothing was uploaded.`, { bad: true });
    }
    let policy = "ask";
    const clash = new Set();
    if (check.conflicts.length) {
      policy = await FM.ops.askConflicts(check.conflicts, toName);
      if (!policy) return;
      for (const c of check.conflicts) clash.add(c.path);
    }
    for (const d of dirs) {
      try { await FM.api.post("mkdir", { parent: to.id, path: d }); }
      catch (e) { FM.ops.fail(e, `The folder “${d}” was not made`, { action: "mkdir", path: d, to: { id: to.id, name: to.name } }); }
    }
    const ts = files.map((f) => FM.transfers.add({
      kind: "up", name: f.path, total: f.file.size, where: toName,
      run: (t) => one(t, f.file, to, f.path, clash.has(f.path) ? policy : "ask", toName),
    }));
    if (!ts.length) { FM.app.reload(); return; }
    const done = await Promise.all(ts.map((t) => t.done));
    const ok = done.filter((t) => t.state === "done");
    await FM.app.reload({ select: ok.map((t) => t.result && t.result.item && t.result.item.id).filter(Boolean), wait: true });
    if (ok.length) FM.ui.toast(`Uploaded ${ok.length === 1 ? `“${ok[0].name}”` : FM.plural(ok.length, "file")} to “${toName}”.`);
  }

  // One file: in one piece, or chunk by chunk with a resume after a dropped connection.
  async function one(t, file, to, path, policy, toName) {
    let uid = FM.uid(), offset = 0, tries = 0, restarted = false;
    const total = file.size;
    const q = (off) => "upload?" + new URLSearchParams({ uid, to: to.id, path, offset: off, total, mtime: file.lastModified || 0, conflict: policy });
    const wait = async (why) => {
      t.trail = (t.trail || []).concat({ at: FM.clock(), offset, why }).slice(-10); // goes with a failure's report (transfers.js)
      if (++tries > 5) throw new FM.ApiError(`The upload stopped: ${why} (tried 6 times).`);
      for (let s = Math.min(16, 2 ** (tries - 1)); s > 0; s--) {
        t.say(`${why}: trying again in ${s} s (try ${tries + 1} of 6)`);
        await FM.sleep(1000);
        if (t.ac.signal.aborted) throw new FM.ApiError("Stopped.", { aborted: true });
      }
      t.say("");
      try { offset = (await FM.api.uploadStatus(uid)).received; }
      catch (e) { if (e.status === 404) offset = 0; }
    };
    for (;;) {
      const end = total <= SINGLE ? total : Math.min(total, offset + CHUNK);
      let res;
      try {
        res = await FM.api.put(q(offset), file.slice(offset, end), { onProgress: (n) => t.progress(offset + n, total), signal: t.ac.signal });
      } catch (e) {
        if (e.aborted) { FM.api.uploadCancel(uid); throw e; }
        await wait("the connection broke");
        continue;
      }
      const d = res.data || {};
      if (res.ok) {
        tries = 0;
        if (d.done) return d.skipped ? { skipped: true } : { item: d.item };
        offset = d.received;
        continue;
      }
      if (res.status === 409 && (d.kind || d.code) === "exists") {
        const pol = await FM.ops.askConflicts(d.conflicts || [], toName);
        if (!pol) { FM.api.uploadCancel(uid); return { cancelled: true }; }
        if (d.final) {
          const r2 = await FM.api.uploadFinish(uid, pol);
          return r2.skipped ? { skipped: true } : { item: r2.item };
        }
        policy = pol; offset = 0;
        continue;
      }
      if (res.status === 409 && d.received != null) { offset = d.received; continue; } // the PC has more or less than we thought
      if (res.status === 404 && d.restart && !restarted) { restarted = true; uid = FM.uid(); offset = 0; t.say("The PC forgot this upload (its files program restarted): starting it again"); continue; }
      // 502: the relay cut the request before the files program answered (it stopped, or this browser's sign-in
      // changed on the way): not saved, so it is tried again
      const said = d.why || d.error || "";
      if ((res.status === 500 || res.status === 502 || res.status === 503) && tries < 5) { await wait(said ? said.replace(/\.$/, "") : `the PC answered ${res.status}`); continue; }
      if (res.status === 0) { await wait("no answer from the PC"); continue; }
      throw new FM.ApiError(FM.sentence(said || RelayClient.httpWhy(res.status)), { status: res.status, code: d.kind || d.code || "", signin: res.status === 401 });
    }
  }

  // The pickers, the drop zone and paste.
  function choose(folder) {
    const inp = document.getElementById(folder ? "pick-folder" : "pick-files");
    inp.value = "";
    inp.click();
  }
  function wireDrops() {
    for (const id of ["pick-files", "pick-folder"]) {
      const inp = document.getElementById(id);
      inp.addEventListener("change", () => { if (inp.files && inp.files.length) start(fromInput(inp.files)); });
    }
    const zone = document.querySelector(".dropzone"), main = document.querySelector(".main"), text = zone.querySelector(".dropzone-text");
    let depth = 0, overRow = null;
    const isFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files") && ![...e.dataTransfer.types].includes("application/x-relay-files");
    // a folder row this person may add files to, under the pointer
    const target = (e) => {
      const r = e.target.closest && e.target.closest(".row.dir:not(.locked)");
      return r && FM.canWriteInto(FM.byId(r.dataset.id)) ? r : null;
    };
    const open = () => S.view === "folder" && !S.pick && !!S.folder;
    const mark = (r) => { if (overRow !== r) { if (overRow) overRow.classList.remove("drop-on"); overRow = r; if (r) r.classList.add("drop-on"); } };
    main.addEventListener("dragenter", (e) => { if (!isFiles(e) || !open()) return; e.preventDefault(); depth++; });
    main.addEventListener("dragover", (e) => {
      if (!isFiles(e) || !open()) return;
      e.preventDefault();
      const r = target(e); mark(r);
      const ok = !!r || S.writable; // nothing lights up where files cannot be added (the Shared Folder, for most people)
      zone.hidden = !ok;
      e.dataTransfer.dropEffect = ok ? "copy" : "none";
      if (ok) text.textContent = `Drop to upload to “${r ? FM.byId(r.dataset.id).name : S.crumbs.length <= 1 ? FM.topName() : S.folder.name}”`;
    });
    main.addEventListener("dragleave", (e) => { if (!isFiles(e)) return; if (--depth <= 0) { depth = 0; zone.hidden = true; mark(null); } });
    main.addEventListener("drop", async (e) => {
      if (!isFiles(e) || !open()) return;
      e.preventDefault();
      depth = 0; zone.hidden = true;
      const r = target(e); mark(null);
      const to = r ? FM.byId(r.dataset.id) : S.folder;
      if (!r && !S.writable) return FM.ui.toast("Files cannot be added here.", { bad: true, ms: 6000 });
      let batch;
      try { batch = await fromDrop(e.dataTransfer); } catch (x) { FM.report("upload", x, { what: "the dropped files could not be read" }); return FM.ui.toast("The dropped files could not be read: " + (x.message || x), { bad: true }); }
      start(batch, to);
    });
    addEventListener("dragover", (e) => { if (isFiles(e)) e.preventDefault(); }); // a drop outside the list never opens the file in the tab
    addEventListener("drop", (e) => { if (isFiles(e)) e.preventDefault(); });
    addEventListener("paste", (e) => {
      if (S.view !== "folder" || S.pick || !S.writable || FM.ui.busy || (e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) return;
      const files = e.clipboardData && [...e.clipboardData.files];
      if (files && files.length) { e.preventDefault(); start(fromInput(files)); }
    });
  }
  FM.upload = { start, choose, wireDrops, fromInput };
})();

// ---- keys.js ----
// keys.js: keyboard shortcuts (a computer). Arrows move the cursor (nothing is ticked), Shift+arrows tick the rows they
// pass, Space ticks or unticks the cursor's row, Enter opens, Alt+← goes back, Backspace goes up, R refreshes;
// Ctrl+A / C / X / V; Delete; F2; N, U, D, /, ?. Enter, Delete, F2, D, Ctrl+C / X act on the ticked rows, or with none
// ticked on the cursor's row (Enter on several: each in its own new tab, app.js openAll). What a key may do follows
// the person's rights, as the buttons do (ops.js and view.js decide). Escape closes the top thing (a menu, a dialog,
// the search, the ticks, what was picked up); with nothing left, a page that opened this one in a window may close it.
"use strict";
(function () {
  const S = FM.S;
  const KEYS = [
    ["Click a row", "Open it: a folder goes in, a file opens in a new tab"],
    ["The box on a row", "Tick it (Shift+click: every row from the last one ticked)"],
    ["Right-click, …, or a long press", "The row's menu, with Open with"],
    ["Ctrl+click or middle-click a row", "Open it in a new tab behind this one"],
    ["Enter", "Open"], ["↑ ↓, Home, End", "Move through the list"],
    ["Space", "Tick the row you are on"], ["Shift + ↑ ↓", "Tick the rows you pass"],
    ["Alt+←", "Back"], ["Backspace", "Up one folder"], ["R", "Refresh"], ["Ctrl+A", "Tick everything"],
    ["Ctrl+C, Ctrl+X, Ctrl+V", "Copy, move, paste here"], ["Delete", "Move to the trash"], ["F2", "Rename"], ["N", "New folder"],
    ["U, Shift+U", "Upload files, upload a folder"], ["D", "Download"], ["/", "Search"],
    ["Drag rows onto a folder", "Move them there (hold Ctrl to copy)"], ["Drop files from the computer", "Upload them"],
    ["Escape", "Close, or untick everything"], ["?", "This list"],
  ];
  function help() {
    const t = FM.h("table.keys");
    for (const [k, v] of KEYS) t.append(FM.h("tr", null, FM.h("td", null, FM.h("b", { text: k })), FM.h("td", { text: v })));
    FM.ui.dialog({ title: "Keyboard and mouse", body: [t], actions: [{ text: "Close", value: true, primary: true }] });
  }
  // Shift+moves tick like text is selected: the rows from where the cursor was when Shift began to where it is now
  // (going back unticks them again); rows ticked before stay ticked. A run goes on while nothing else changed the ticks.
  let run = null;
  function move(delta, extend) {
    const rows = FM.sorted(), ids = rows.map((i) => i.id || i.tid);
    if (!ids.length) return;
    const from = ids.indexOf(S.focus);
    let i;
    if (delta === "home") i = 0; else if (delta === "end") i = ids.length - 1;
    else i = from < 0 ? (delta > 0 ? 0 : ids.length - 1) : Math.max(0, Math.min(ids.length - 1, from + delta));
    if (extend && !(S.pick && !S.pick.multiple)) { // while a program is choosing one thing, only one row is ever ticked
      const goesOn = run && run.at === S.focus && run.sel === S.sel && run.size === S.sel.size && ids.includes(run.start);
      const start = goesOn ? run.start : ids[from < 0 ? i : from];
      const a = ids.indexOf(start), was = from < 0 ? a : from;
      const inside = (k, end) => k >= Math.min(a, end) && k <= Math.max(a, end);
      ids.forEach((id, k) => { if (inside(k, i)) { if (FM.tickable(rows[k]) && !(S.pick && rows[k].dir)) S.sel.add(id); } else if (inside(k, was)) S.sel.delete(id); });
      run = { start, at: ids[i], sel: S.sel, size: S.sel.size };
      S.anchor = ids[i];
    }
    S.focus = ids[i];
    FM.view.sel();
    FM.view.focusRow(ids[i]);
  }
  function onKey(e) {
    if (e.defaultPrevented) return;
    const typing = e.target && ((/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type !== "checkbox") || e.target.isContentEditable);
    const k = e.key, ctrl = e.ctrlKey || e.metaKey;
    if (k === "Escape") {
      if (FM.ui.closeTop()) { e.preventDefault(); return; }
      if (typing && e.target.id === "q") { e.preventDefault(); FM.app.closeSearch(); return; }
      if (S.picking) { e.preventDefault(); FM.pick.stop(); return; }
      if (S.sel.size) { e.preventDefault(); S.sel.clear(); FM.view.render(); return; }
      if (S.clip) { e.preventDefault(); S.clip = null; FM.view.render(); return; }
      if (S.view === "search") { e.preventDefault(); FM.app.closeSearch(); return; }
      if (S.view === "trash") { e.preventDefault(); FM.app.back(); return; }
      return; // nothing here used it: a window kit host may close the window
    }
    if (FM.ui.busy) return;
    if ((k === "Enter" || k === " ") && e.target && e.target.closest && e.target.closest("button, a, [role=button], label") && !e.target.closest(".list")) return; // a focused button presses itself
    if (typing) {
      if (k === "ArrowDown" && e.target.id === "q") { e.preventDefault(); document.querySelector(".list").focus(); move(1); }
      return;
    }
    const here = FM.byId(S.focus), ticked = FM.selected();
    const sel = ticked.length ? ticked : here ? [here] : [], one = sel.length === 1 ? sel[0] : null; // the ticked rows, or the cursor's
    const pageRows = Math.max(1, Math.floor(document.querySelector(".list").clientHeight / 46) - 1);
    const folder = S.view === "folder" && !S.pick;
    let used = true;
    if (k === "ArrowDown") move(1, e.shiftKey);
    else if (k === "ArrowUp" && e.altKey) FM.app.up();
    else if (k === "ArrowLeft" && e.altKey && !ctrl && FM.app.backTarget()) FM.app.back(); // with nowhere to go, the browser's own Back
    else if (k === "ArrowUp") move(-1, e.shiftKey);
    else if (k === "PageDown") move(pageRows, e.shiftKey);
    else if (k === "PageUp") move(-pageRows, e.shiftKey);
    else if (k === "Home") move("home", e.shiftKey);
    else if (k === "End") move("end", e.shiftKey);
    else if (k === " ") { if (here) FM.app.tick(S.focus); }
    else if (k === "Enter") { if (!e.repeat) FM.app.openAll(sel); } // the ticked rows, or the cursor's; a held key opens once
    else if (k === "Backspace") FM.app.up();
    else if (ctrl && (k === "a" || k === "A")) FM.app.selectAll();
    else if (ctrl && (k === "c" || k === "C") && S.view !== "trash") FM.ops.pickUp(sel, "copy");
    else if (ctrl && (k === "x" || k === "X") && S.view !== "trash") FM.ops.pickUp(sel, "cut");
    else if (ctrl && (k === "v" || k === "V") && S.clip) FM.ops.paste();
    else if (ctrl && (k === "v" || k === "V")) used = false; // files on the clipboard: the paste event uploads them
    else if (ctrl && (k === "f" || k === "F")) FM.app.openSearch();
    else if (ctrl || e.altKey) used = false;
    else if (k === "Delete" && S.view === "trash") FM.ops.purge(sel);
    else if (k === "Delete") FM.ops.del(sel);
    else if (k === "F2" && one && S.view !== "trash") FM.ops.rename(one);
    else if ((k === "n" || k === "N") && !e.shiftKey) FM.ops.newFolder();
    else if (k === "u" && S.writable && folder) FM.upload.choose(false);
    else if (k === "U" && S.writable && folder) FM.upload.choose(true);
    else if ((k === "d" || k === "D") && S.view !== "trash") FM.ops.download(sel);
    else if (k === "r" || k === "R") FM.app.refreshList();
    else if (k === "/") FM.app.openSearch();
    else if (k === "?" && !FM.isPhone()) help();
    else used = false;
    if (used) e.preventDefault();

  FM.keys = { onKey, help };
})();

// ---- pick.js ----
// pick.js: when a program opens this page in a window (window-kit.js) to choose a file or a folder. One flow covers
// both (Jon, 2026-11-11): tick it, then press Use selected, which sits in the same row as the other buttons and can
// be clicked once something that fits is ticked. No hint box. The one heading is the window's title: "Book reader:
// choose a file or folder". With the program's id (the request's `app`) the chooser starts in that program's folder
// in the person's own files (the one list's `folder`) and shows that program's recent files on top (GET
// app/<app>/recent). `start` names another folder to open in ("Shared Folder/Reader files", the Book reader's books).
// `keep: { label }` adds one unticked checkbox beside Use selected.
// The choice is fetched from the PC with progress and handed over as real File objects on the request's own
// MessagePort: one or more files (with each file's id), a folder as its files (fetched as ONE zip and unpacked here, so
// each file keeps its path), or a folder as one zip made by the PC (with the folder's id). Requests are taken only
// from the parent frame and from allowed origins (window-kit.js checks). Nothing here writes recents or "last": the
// program that asked does that, with the ids it gets back.
"use strict";
(function () {
  const S = FM.S;
  let port = null, ac = null, lastSent = 0, round = 0;

  const what = (p) => (!p.files ? "a folder" : p.folder ? "a file or folder" : p.multiple ? "files" : "a file");
  const heading = (p) => `${p.name}: choose ${what(p)}`;
  function title() { if (!S.pick) return; const t = heading(S.pick); document.title = t; if (FM.embedded) WindowKit.child.title(t); }

  // What Use selected would hand over right now (the ticked rows, or `list`): { ok, label, folder | items } or
  // { ok: false, why } (why is the greyed button's tooltip).
  FM.pickChoice = (list) => {
    const p = S.pick, sel = list || FM.selected();
    const no = (why) => ({ ok: false, why });
    if (!p) return no("");
    if (S.view === "trash") return no("Go back to the files to choose.");
    if (!sel.length) return no(p.folder && p.files ? "Tick a file or a folder first" : p.folder ? "Tick a folder first" : "Tick a file first");
    if (sel.some((i) => i.locked)) return no("That is private.");
    const dirs = sel.filter((i) => i.dir), files = sel.filter((i) => !i.dir);
    if (dirs.length) {
      if (!p.folder) return no("Tick a file, not a folder.");
      if (sel.length > 1) return no("Tick one folder, or files only.");
      return { ok: true, label: `Use “${dirs[0].name}”`, folder: dirs[0] };
    }
    if (!p.files) return no("Tick a folder.");
    if (!files.every(FM.fits)) return no(`${p.name} cannot open that kind of file.`);
    if (!p.multiple && files.length > 1) return no("Tick one file.");
    return { ok: true, label: files.length > 1 ? `Use ${files.length} files` : `Use “${files[0].name}”`, items: files };
  };

  function onRequest(m, p, from) {
    if (port) try { port.postMessage({ type: "cancel" }); } catch (e) {}
    port = p;
    const app = typeof m.app === "string" ? m.app.toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 60) : "";
    const label = m.keep && typeof m.keep.label === "string" ? m.keep.label.trim().slice(0, 80) : "";
    S.pick = { app, name: String(m.host || "A program").slice(0, 80), accept: Array.isArray(m.accept) ? m.accept.map(String) : [], multiple: !!m.multiple, files: m.files !== false,
      folder: m.folder === "files" || m.folder === "zip" ? m.folder : false, keep: label ? { label } : null, keepOn: false,
      start: typeof m.start === "string" ? m.start.trim().slice(0, 400) : "", from };
    S.picking = null; S.recent = []; S.pickStart = ""; S.clip = null;
    S.sel.clear();
    title();
    FM.view.render();
    begin();
  }
  // To the folder a program asked to start in (the request's `start`): a path as a signed-in person sees it ("Shared
  // Folder/Reader files", "Plan Cutter/Garage"), from the top, by name, one listing per step. For a visitor the top is
  // the Shared Folder itself, so a leading "Shared Folder" is the top. Gives { id } when the folder is there,
  // { missing: the name that was not found } when it is not (or this person may not see it), null when the PC did not
  // answer (the listing that follows says so).
  async function walk(top, path) {
    const parts = String(path).split("/").map((s) => s.trim()).filter(Boolean);
    let r = top, id = "root";
    try {
      for (let i = 0; i < parts.length; i++) {
        const name = parts[i], low = name.toLowerCase();
        if (i === 0 && low === "shared folder" && r.folder && r.folder.kind === "shared") continue;
        const it = r.items.find((x) => x.dir && !x.locked && x.name === name) || r.items.find((x) => x.dir && !x.locked && x.name.toLowerCase() === low);
        if (!it) return { missing: name };
        id = it.id;
        if (i < parts.length - 1) r = await FM.api.list(id);
      }
    } catch (e) { return e && (e.status === 404 || e.code === "private") ? { missing: parts[parts.length - 1] } : null; }
    return { id };
  }
  // Where the chooser opens. First the folder the program asked for (`start`), when it is there. Else the program's
  // own folder in this person's files (when the one list names one and it is there). Else the top (their own files;
  // the Shared Folder for a visitor). That program's recent files come first there (the newest five). A `start` that
  // is not there is said in one line, never passed over in silence. Called again when the browser's account changes.
  async function begin() {
    const my = ++round, p = S.pick;
    if (!p) return;
    await FM.apps.load();
    if (my !== round || S.pick !== p) return;
    const prog = p.app ? FM.apps.byId(p.app) : null;
    if (prog) { p.name = prog.name; title(); }
    const own = S.me.account && prog && prog.folder ? prog.folder.toLowerCase() : "";
    const [top, rec] = await Promise.all([p.start || own ? FM.api.list("root").catch(() => null) : null, S.me.account && p.app ? FM.api.recent(p.app).catch(() => []) : []]);
    if (my !== round || S.pick !== p) return;
    let start = "", missing = "";
    if (top && p.start) {
      const found = await walk(top, p.start);
      if (my !== round || S.pick !== p) return;
      if (found && found.id) start = found.id;
      else if (found) missing = found.missing;
    }
    if (!start && top && own) {
      const f = top.items.find((i) => i.dir && !i.kind && !i.locked && i.name.toLowerCase() === own);
      if (f) start = f.id;
    }
    const r = await FM.app.go(start || "root", { noTrail: true });
    if (my !== round || S.pick !== p) return;
    FM.app.resetTrail(); // Back from here goes up, never to wherever the page was before the request
    if (r && r.folder) { S.recent = (Array.isArray(rec) ? rec : []).filter((x) => x && x.id && x.name).slice(0, 5); S.pickStart = r.folder.id; }
    FM.view.render();
    if (missing && r && r.folder) {
      FM.report("pick", `the folder to start in is not there: ${p.start}`, { what: "the chooser opened somewhere else", host: p.name });
      const where = S.crumbs.length > 1 ? `“${r.folder.name}”` : S.me.account ? "Your files" : "the Shared Folder";
      FM.ui.toast(`“${missing}” is not there. Starting in ${where} instead.`, { ms: 8000 });
    }
  }

  function send(msg, force) {
    if (!port) return;
    const now = performance.now();
    if (!force && msg.type === "progress" && now - lastSent < 100) return;
    lastSent = now;
    try { port.postMessage(msg); } catch (e) { FM.report("pick", e, { what: "the program that asked could not take the files", type: msg.type }); FM.ui.toast("The program that asked could not take the files: " + (e.message || e), { bad: true }); }
  }
  function progress(text, loaded, total, name) {
    S.picking = { text, frac: total ? Math.min(1, loaded / total) : 0 };
    FM.view.renderToolbar();
    document.querySelector(".loadbar").hidden = false;
    send({ type: "progress", loaded, total, name });
  }
  // Use selected: fetch the choice and hand it over.
  async function use(list) {
    const ch = FM.pickChoice(list);
    if (!ch.ok || S.picking) return;
    const total = ch.folder ? ch.folder.size || 0 : ch.items.reduce((a, i) => a + (i.size || 0), 0);
    if (total > 1.5e9 && !(await FM.ui.confirm("This is big", [`${FM.size(total)} must be held in this page's memory to hand it over. A phone may run out of memory.`], "Go ahead"))) return;
    ac = new AbortController();
    const who = S.pick.name, keep = !!(S.pick.keep && S.pick.keepOn), mode = S.pick.folder;
    try {
      let out;
      if (ch.folder) {
        const f = ch.folder;
        progress(`Getting “${f.name}”…`, 0, total);
        let hdr = null;
        const zip = await FM.api.blob(FM.api.zipPath([f]), { signal: ac.signal, expect: total, type: "application/zip", onHeaders: (h) => { hdr = h; }, onProgress: (n, t) => progress(`Getting “${f.name}”: ${FM.size(n)}${t ? " of about " + FM.size(t) : ""}`, n, t, f.name) });
        const info = FM.zipInfo(hdr);
        if (mode === "zip") {
          const missing = FM.zipMissing(info, await FM.unzip.count(zip).catch(() => null));
          out = { kind: "zip", folder: f.name, files: [new File([zip], f.name + ".zip", { type: "application/zip", lastModified: f.mtime || Date.now() })], paths: [f.name + ".zip"], missing };
        } else {
          progress(`Unpacking “${f.name}”…`, total, total);
          const r = await FM.unzip.files(zip, f.name, (n, of) => progress(`Unpacking “${f.name}”: ${n} of ${of} files`, n, of));
          out = { kind: "folder", folder: f.name, files: r.files.map((x) => x.file), paths: r.files.map((x) => x.path), missing: FM.zipMissing(info, r.files.length, r.missing) };
        }
        out.folderId = f.id;
        out.ids = out.files.map(() => ""); // the folder's own id is folderId; its files' ids are not known here
        // what the PC left out (its headers name them; its log says why): said here, and told to the program that asked
        if (out.missing) FM.ui.toast(`The PC could not read ${FM.plural(Number((/could not add (\d+)/.exec(out.missing) || [])[1]) || 1, "file")} of “${f.name}”: ${who} was told which.`, { bad: true });
      } else {
        const files = [], paths = [];
        let done = 0;
        for (const it of ch.items) {
          const b = await FM.api.blob(FM.api.filePath(it), { signal: ac.signal, expect: it.size, onProgress: (n) => progress(`Getting “${it.name}”: ${FM.size(done + n)} of ${FM.size(total)}`, done + n, total, it.name) });
          files.push(new File([b], it.name, { type: b.type, lastModified: it.mtime || Date.now() }));
          paths.push(it.name);
          done += it.size || 0;
        }
        out = { kind: "files", files, paths, ids: ch.items.map((i) => i.id), folder: "", folderId: "", missing: "" };
      }
      send(Object.assign({ type: "picked", keep }, out), true);
      S.picking = { text: `Handed to ${who}.`, frac: 1 };
      FM.view.render();
    } catch (e) {
      S.picking = null;
      FM.view.render();
      if (e.aborted) return;
      FM.ops.fail(e, "It could not be fetched", { action: "pick", host: who, items: ch.folder ? [ch.folder] : ch.items });
    } finally { ac = null; }
  }
  function stop() { if (ac) ac.abort(); S.picking = null; FM.view.render(); }
  FM.pick = { onRequest, begin, use, stop, title };
})();

// ---- app.js ----
// app.js: start-up, who is looking (the browser's account, and what follows when it changes), going from folder to
// folder (Back, Refresh), the live updates, the menus, and the pointer: a click or tap opens, a middle-click or
// Ctrl+click opens in a new tab behind this one (each row is a link: the browser's own), only the row's box ticks,
// right-click, a long press or the row's … button for the row's menu (with "Open with"), and dragging rows onto a
// folder. Opened on its own, the browser's Back and Forward go through the folders (the address keeps the folder:
// #f=<id>), the same steps as the page's Back; inside another page's window it keeps its trail to itself.
// Opened at #open=<id>/<name> (a file's row link, in a new tab): it opens that file (openLink).
"use strict";
(function () {
  const S = FM.S;
  const $ = (s) => document.querySelector(s);
  let events = null, live = false, seq = 0, retryTimer = 0, retryWait = 2000, searchAc = null, reloadTimer = 0;
  let rootId = "";       // the real id of this person's top folder ("root" is the PC's word for "mine", whoever asks)
  let relaunch = null;   // a file link's tab (openLink): how to try again, as whoever the browser is now
  FM.embedded = WindowKit.child.inWindow;
  FM.parentOf = (it) => it.parent || "root";
  const who = () => (S.me.account ? S.me.account.id : "");
  const hereName = () => (S.crumbs.length <= 1 ? FM.topName() : S.folder ? S.folder.name : "");

  function setConn(state, why) { S.conn = { state, why }; FM.view.renderStatus(); }
  function scheduleRetry(fn) {
    clearTimeout(retryTimer);
    if (S.error) S.error.retryAt = Date.now() + retryWait;
    retryTimer = setTimeout(fn, retryWait);
    retryWait = Math.min(30000, retryWait * 2);
  }
  // A private folder this person may not open: said in one line, with the way in for someone not signed in.
  function sayPrivate(name) {
    if (S.me.account) return FM.ui.toast(`“${name}” is private: your account cannot see it.`, { bad: true, ms: 7000 });
    FM.ui.toast(`“${name}” is private. Sign in to see it.`, { bad: true, action: () => FM.ops.account(), actionText: "Sign in" });
  }

  async function load(id, o = {}) {
    const my = ++seq;
    S.loading = true;
    if (!o.quiet) FM.view.render();
    try {
      const r = await FM.api.list(id);
      if (my !== seq) return;
      retryWait = 2000; clearTimeout(retryTimer);
      if (FM.reports.waiting.length) FM.reports.flush(); // failures kept while the PC could not be reached go now
      const changedFolder = !S.folder || S.folder.id !== r.folder.id || S.view !== "folder";
      S.view = "folder"; S.folder = r.folder; S.crumbs = r.crumbs; S.items = r.items; S.writable = !!r.writable; S.error = null; S.loading = false;
      S.cache.set(r.folder.id, r);
      if (!id || id === "root") rootId = r.folder.id;
      if (changedFolder) { S.sel.clear(); S.focus = null; S.anchor = null; }
      else for (const k of [...S.sel]) if (!FM.byId(k)) S.sel.delete(k);
      // what an action just made, moved or found here: it flashes and the keyboard's cursor goes to it (never ticked:
      // only a person ticks rows)
      const ids = new Set(S.items.map((i) => i.id));
      const shown = (o.select || []).filter((x) => x && ids.has(x));
      if (shown.length) S.focus = shown[0];
      setConn("on", "Connected");
      FM.view.render();
      if (shown.length) { FM.view.flash(shown); FM.view.focusRow(S.focus); }
      if (changedFolder && !o.quiet && !FM.isPhone()) $(".list").focus({ preventScroll: true });
      if (FM.embedded && !S.pick) WindowKit.child.title(S.crumbs.length <= 1 ? "Cloud File Manager" : r.folder.name + " · Cloud File Manager");
      return r;
    } catch (e) {
      if (my !== seq) return;
      S.loading = false;
      const top = !id || id === "root";
      // a folder this person may not open, or one that is not there (any more): said, and the page stays where it
      // was (or goes to the top when it was nowhere yet)
      if (!top && (e.code === "private" || e.status === 404)) {
        const name = (S.items.find((i) => i.id === id) || {}).name || "That folder";
        if (e.code === "private") sayPrivate(name); else FM.ui.toast(e.message, { bad: true, ms: 7000 });
        if (!S.folder || S.folder.id === id) return load("root");
        FM.view.render();
        return;
      }
      // to the PC's log: the first failure of a run of them (it tries again by itself; each try is not a new one)
      if (!S.error || S.error.why !== e.message) FM.report("list", e, { items: [{ id, name: (S.items.find((i) => i.id === id) || S.folder || {}).name }] });
      const off = e.net || e.status === 502 || e.status === 503; // not reachable, or the PC says it is switched off or busy
      S.error = { why: e.message, title: off ? "Cloud File Manager is off" : "The files could not be listed" };
      setConn(off ? "off" : "bad", e.message.replace(/\.$/, ""));
      scheduleRetry(() => load(id, o));
      FM.view.render();
    }
  }

  function go(id, o = {}) {
    if (S.view === "search") closeSearch(true);
    const from = S.folder;
    if (FM.embedded) { if (!o.noTrail && from && from.id !== id) trail.push({ id: from.id, name: hereName() }); }
    else if (!o.noHistory) {
      const cur = history.state || {};
      if (cur.fm !== id) history.pushState({ fm: id, n: (cur.n || 0) + 1, from: from ? hereName() : "", who: who() }, "", "#f=" + encodeURIComponent(id));
    }
    const cached = S.cache.get(id === "root" ? rootId : id);
    if (cached && !o.noCache) { // shown at once, then refreshed
      S.view = "folder"; S.folder = cached.folder; S.crumbs = cached.crumbs; S.items = cached.items; S.writable = !!cached.writable; S.sel.clear(); S.focus = null; S.error = null;
      FM.view.render();
      return load(id, Object.assign({ quiet: true }, o));
    }
    return load(id, o);
  }
  function up() {
    if (S.view !== "folder") { if (S.view === "search") closeSearch(); else go(S.folder ? S.folder.id : "root"); return; }
    if (S.crumbs.length > 1) go(S.crumbs[S.crumbs.length - 2].id);
  }

  // ---- Back: the folder you were in before ---------------------------------------------------------------------------
  // On its own page the browser's history is the trail: each folder change is a step (#f=<id>, state { fm, n, from,
  // who }: n = this page's steps before it, from = the folder before, who = whose steps they are), so the page's Back,
  // the browser's Back and a phone's Back are the same step. A folder opened straight from a link gets its parents as
  // the steps before it (start), so Back goes up from there; with no step before, Back goes up in its place. At the
  // top with no step before, Back is greyed. Inside another page's window the trail is kept here instead.
  const trail = []; // in a window: the folders before this one, { id, name }
  const stepsBefore = () => (history.state && history.state.n) || 0;
  function backTarget() { // { text: the button's tooltip, up: the parent's id when Back goes up } or null (nowhere to go)
    if (S.view === "search") return { text: "Back to the folder (closes the search)" };
    if (S.view === "trash") return { text: "Back to the files" };
    if (FM.embedded ? trail.length : stepsBefore() > 0) return { text: `Back to “${(FM.embedded ? trail[trail.length - 1].name : history.state.from) || "the folder before"}”` };
    if (S.folder && S.crumbs.length > 1) { const i = S.crumbs.length - 2, p = S.crumbs[i]; return { text: `Up to “${i === 0 ? FM.topName() : p.name}”`, up: p.id }; }
    return null;
  }
  function back() {
    const t = backTarget();
    if (!t) return;
    if (S.view === "search") return closeSearch();
    if (S.view === "trash") return go(S.folder ? S.folder.id : "root", { noHistory: true, noTrail: true });
    if (t.up) { // no step before this one: up, in place of this step (so Back again goes on up, not down)
      if (!FM.embedded) history.replaceState({ fm: t.up, n: 0, from: "", who: who() }, "", "#f=" + encodeURIComponent(t.up));
      return go(t.up, { noHistory: true, noTrail: true });
    }
    if (FM.embedded) return go(trail.pop().id, { noTrail: true });
    history.back(); // the step before: popstate goes there
  }
  // To a folder by its path as this person sees it ("Shared Folder/Books", "Plan Cutter/Garage"): from the top, by
  // name, one listing per step (the trash's Show, after a restore).
  async function goPath(path, selectId) {
    let id = "root";
    try {
      for (const part of String(path || "").split("/").filter(Boolean)) {
        const r = await FM.api.list(id);
        const it = r.items.find((i) => i.dir && i.name === part) || r.items.find((i) => i.dir && i.name.toLowerCase() === part.toLowerCase());
        if (!it) throw new FM.ApiError(`“${part}” is not there.`);
        id = it.id;
      }
    } catch (e) { return FM.ops.fail(e, "That folder could not be opened", { action: "show", path }); }
    await go(id, { select: selectId ? [selectId] : undefined });
  }

  let infoTimer = 0;
  async function reload(o = {}) {
    // something changed (an action here, or the PC said so): what is stored and the trash's size follow a moment later
    clearTimeout(infoTimer); infoTimer = setTimeout(info, 1200);
    if (S.view === "trash") return showTrash(true);
    if (S.view === "search") return runSearch(S.q);
    if (o.wait) await FM.sleep(450); // uploads join the PC's list at its next scan (about 300 ms)
    return load(S.folder ? S.folder.id : "root", Object.assign({ quiet: true }, o));
  }
  // Refresh (its button, R): this folder's listing again from the PC, not the page. The place in the list, the cursor
  // and the ticks stay wherever their items still are; the button turns and the bar runs while it works (at least
  // 400 ms, so a quick answer is still seen). The live updates are reconnected too, in case they had stopped.
  async function refreshList() {
    if (S.refreshing) return;
    S.refreshing = true;
    const done = reload();
    FM.view.render();
    try { await Promise.all([done, FM.sleep(400)]); info(); FM.apps.load().then(noteApps); if (events) events.restart(); }
    finally { S.refreshing = false; FM.view.render(); }
  }
  function noteApps() {
    const was = !!S.notes.apps;
    S.notes.apps = FM.apps.failed && !S.error ? { text: "The list of programs could not be read, so every file opens in the browser for now.", bad: true } : null;
    if (was !== !!S.notes.apps || FM.apps.loaded) FM.view.render(); // rows of files a program owns get its icon and its link
  }
  // What the PC says about this person and itself: the rights that decide the buttons, the trash's size, what they
  // have stored (and the limit while the PC is low on space), the files program's version, its own trouble.
  async function info() {
    try {
      const mine = who();
      const [i, st] = await Promise.all([FM.api.info(), S.me.account ? FM.api.storage().catch(() => null) : null]);
      if (mine !== who()) return; // the account changed while the PC answered: the next one asks again

      S.version = i.version || "";

      S.storage = st && typeof st.bytes === "number" ? { bytes: st.bytes, low: !!st.low, limit: st.limit || 0 } : null;
      S.notes.space = S.storage && S.storage.low && S.storage.limit ? { text: `The PC is low on space: for now each person can store ${FM.size(S.storage.limit)}.` } : null;
      S.notes.privacy = i.privacy_error ? { text: "The Shared Folder cannot be changed for now: the PC's list of private folders is damaged.", bad: true } : null;
      FM.view.render();
    } catch (e) { /* the listing says what is wrong */ }
  }

  // ---- the account changed ---------------------------------------------------------------------------------------------
  // Signed in, signed out, another person, or a new name: on the account page in its window, or in any other tab of
  // this browser. Everything that was this person's goes (the folders kept, the ticks, what was picked up, the steps
  // Back would take), and the page starts again at the top as whoever the browser is now. A switch of user arrives as
  // two changes close together: they are taken as one.
  let acctTimer = 0;
  function accountChanged() {

  async function applyAccount() {

  // ---- search ------------------------------------------------------------------------------------------------------
  function openSearch() {

  }
  async function runSearch(q) {
    q = q.trim();
    if (!q) { closeSearch(); return; }
    if (searchAc) searchAc.abort();
    searchAc = new AbortController();
    const my = ++seq;
    S.view = "search"; S.q = q; S.loading = true;
    try {
      const r = await FM.api.search(q, searchAc.signal);
      if (my !== seq) return;

      if (e.aborted || my !== seq) return;

      FM.view.render();
    }
  }

  // ---- the trash: what this person deleted (everything, for those with everyone's files) ---------------------------------
  async function showTrash(quiet) {
    if (!S.me.account || S.pick) return;
    const my = ++seq;
    if (!quiet) { S.loading = true; FM.view.render(); }
    try {
      const r = await FM.api.trash();
      if (my !== seq) return;
      if (S.view !== "trash") { S.sel.clear(); S.focus = null; }
      S.view = "trash"; S.items = r.items; S.trashBytes = r.bytes; S.loading = false; S.error = null;
      const ids = new Set(S.items.map((i) => i.tid));
      for (const k of [...S.sel]) if (!ids.has(k)) S.sel.delete(k);
      FM.view.render();
    } catch (e) { S.loading = false; FM.view.render(); FM.ops.fail(e, "The trash could not be opened", { action: "trash-list" }); }
  }

  // ---- ticking ---------------------------------------------------------------------------------------------------------
  // The row's box (and Space). While a program is choosing one thing, a new tick takes the old one's place.
  function tick(id, range) {
    const it = FM.byId(id);
    if (!FM.tickable(it)) return;
    const p = S.pick;
    if (p && (!p.multiple || it.dir || FM.selected().some((x) => x.dir))) S.sel = S.sel.has(id) ? new Set() : new Set([id]);
    else if (range) { // Shift: tick from the last row ticked or unticked to this one; never unticks
      const rows = FM.sorted().filter(FM.tickable).map((i) => i.id || i.tid), a = rows.indexOf(S.anchor), b = rows.indexOf(id);
      for (const k of a >= 0 && b >= 0 ? rows.slice(Math.min(a, b), Math.max(a, b) + 1) : [id]) S.sel.add(k);
    } else if (S.sel.has(id)) S.sel.delete(id);
    else S.sel.add(id);
    S.anchor = id;
    FM.view.sel();
  }
  function selectAll() {
    const can = S.items.filter((i) => FM.tickable(i) && !(S.pick && (i.dir || !S.pick.multiple))).map((i) => i.id || i.tid);
    S.sel = can.length && can.every((k) => S.sel.has(k)) ? new Set() : new Set(can);
    FM.view.sel();
  }

  // ---- what an item does when opened (a click or tap, Enter) ---------------------------------------------------------------
  function activate(it) {
    if (!it) return;
    if (S.view === "trash") return FM.ops.restore([it]);
    if (it.locked) return sayPrivate(it.name);
    if (it.dir) return go(it.id);
    if (S.pick) { // a program is choosing: a click ticks the file, and Use selected hands it over
      if (FM.tickable(it)) return tick(it.id);
      return FM.ui.toast(`${S.pick.name} cannot open that kind of file.`, { ms: 4000 });
    }
    FM.ops.open(it);
  }
  // Enter. On several ticked rows: in the trash they are restored; else each opens in its own new tab. One row: what
  // a click on it does. While a program is choosing: Use selected, once something is ticked.
  function openAll(list) {
    if (!list.length) return;
    if (S.pick && FM.selected().length) { const ch = FM.pickChoice(); return ch.ok ? FM.pick.use() : FM.ui.toast(ch.why, { bad: true, ms: 6000 }); }
    if (list.length === 1) return activate(list[0]);
    if (S.view === "trash") return FM.ops.restore(list);
    return FM.ops.openTabs(list);
  }

  // ---- menus -------------------------------------------------------------------------------------------------------------
  // What a row's menu (…, right-click, a long press) or a drag acts on: every ticked row when this one is ticked, else
  // this row alone (it is not ticked for it).
  const forRow = (id) => (S.sel.has(id) ? FM.selected() : [FM.byId(id)].filter(Boolean));
  // the changes this person may make to these rows (the rarer ones: they are also under the More button)
  function changeItems(sel, a) {
    const out = [];
    if (a.rename) out.push({ icon: "rename", text: "Rename", key: "F2", act: () => FM.ops.rename(a.one) });
    if (a.move) out.push({ icon: "move", text: "Move", key: "Ctrl+X", act: () => FM.ops.pickUp(sel, "cut") });
    if (a.copy) out.push({ icon: "copy", text: "Copy", key: "Ctrl+C", act: () => FM.ops.pickUp(sel, "copy") });
    if (a.mark === "private") out.push({ icon: "lock", text: "Make private", act: () => FM.ops.setPrivate(a.one, true) });
    if (a.mark === "public") out.push({ icon: "unlock", text: "Make public", act: () => FM.ops.setPrivate(a.one, false) });
    return out;
  }
  function itemMenu(at, list) {
    const sel = (list || FM.selected()).filter(Boolean), one = sel.length === 1 ? sel[0] : null, n = sel.length;
    if (!n || sel.some((i) => i.locked || i.kind === "shared" || i.kind === "users" || i.kind === "guests")) return;
    const head = { head: one ? one.name : `${n} selected` };
    if (S.view === "trash") return FM.ui.menu([head, { icon: "restore", text: "Restore", act: () => FM.ops.restore(sel) }, { icon: "trash", text: "Delete forever", danger: true, act: () => FM.ops.purge(sel) }], at);
    const a = FM.allow(sel), items = [head];
    if (S.pick) { // a program is choosing: a look at the file, nothing that changes anything
      if (one && !one.dir) items.push({ icon: "open", text: "Look at it in a new tab", act: () => FM.ops.open(one) });
      if (a.download) items.push({ icon: "download", text: one && !one.dir ? "Download" : "Download as a zip", act: () => FM.ops.download(sel) });
      return FM.ui.menu(items, at);
    }
    if (one && one.dir) items.push({ icon: "folder", text: "Open", key: "Enter", act: () => activate(one) });
    if (one && !one.dir) {
      // Open does what a click does. "Open with": the other programs of the one list that can open this kind of file.
      const own = FM.apps.owner(one.name);
      items.push({ icon: "open", text: "Open", key: "Enter", act: () => FM.ops.open(one) });
      for (const p of FM.apps.openers(one.name)) if (p !== own) items.push({ img: FM.apps.icon(p.id, 48), icon: "open", text: `Open with ${p.name}`, act: () => FM.ops.openWith(one, p) });
    }
    if (n > 1 && a.open) items.push({ icon: "open", text: `Open ${n} in new tabs`, key: "Enter", act: () => FM.ops.openTabs(sel) });
    if (a.download) items.push({ icon: "download", text: n > 1 || (one && one.dir) ? "Download as a zip" : "Download", key: "D", act: () => FM.ops.download(sel) });
    if (S.view === "search" && one) items.push({ icon: "folder", text: "Show in its folder", act: () => reveal(one) });
    const ch = changeItems(sel, a);
    if (ch.length) items.push("-", ...ch);
    if (a.del) items.push("-", { icon: "trash", text: "Delete", key: "Delete", danger: true, act: () => FM.ops.del(sel) });
    FM.ui.menu(items, at);
  }
  // The More button: the rarer things. For the ticked rows first (rename, move, copy, private), then the page's own.
  function moreItems() {
    const sel = FM.selected(), a = FM.allow(sel), items = [], phone = FM.isPhone();
    if (S.error) return [{ icon: "info", text: "Debug", act: debug }]; // nothing is listed: only the reason why
    if (sel.length && S.view !== "trash" && !S.pick) {
      const ch = changeItems(sel, a);

    }

      const on = (k, dir) => S.sort.key === k && S.sort.dir === dir;
      items.push("-", { head: "Sort by" }, { icon: "text", text: "Name", on: on("name", 1), act: by("name", 1) }, { icon: "restore", text: "Newest first", on: on("mtime", -1), act: by("mtime", -1) }, { icon: "archive", text: "Biggest first", on: on("size", -1), act: by("size", -1) });
    }
    items.push("-");
    if (S.me.account && S.view !== "trash" && !S.pick) items.push({ icon: "trash", text: S.trashBytes ? `Trash (${FM.size(S.trashBytes)})` : "Trash", act: () => showTrash() });
    if (!phone) items.push({ icon: "keyboard", text: "Keyboard shortcuts", key: "?", act: FM.keys.help });
    items.push({ icon: "info", text: "Debug", act: debug });
    return items;
  }
  const moreMenu = (anchor) => FM.ui.menu(moreItems(), { anchor });
  // a right-click on the list's empty space: what can be done in this folder
  function spaceMenu(at) {
    if (S.view !== "folder" || S.pick) return;
    const items = [];
    if (S.writable) items.push({ icon: "upload", text: "Upload", key: "U", act: () => FM.upload.choose(false) }, { icon: "newfolder", text: "New folder", key: "N", act: FM.ops.newFolder });
    if (S.clip && S.writable) items.push({ icon: "paste", text: "Paste here", key: "Ctrl+V", act: FM.ops.paste });
    items.push("-", { icon: "refresh", text: "Refresh", key: "R", act: refreshList }, ...moreItems());
    FM.ui.menu(items, at);
  }
  const reveal = (it) => go(it.parent || "root", { select: [it.id] });

  // Debug: the technical detail, in one place (the More button). Nothing here is needed to use the page.
  function debug() {
    const c = FM.api.client, w = FM.api.where, a = S.me.account, B = window.FM_BUILD || {};
    const rights = [S.writable ? "change this folder" : "", S.rights.shared ? "change the Shared Folder" : "", S.rights.private ? "see private things" : "", S.rights.everyone ? "everyone's files" : ""].filter(Boolean);
    const rows = [
      ["This page", `${B.version || "?"}, built ${B.built || "?"}`],
      ["Files program", S.version || "not known yet"],
      ["PC Relay", c.info ? `${c.info.version || "?"} · ${c.pcName()}` : "not known yet"],
      ["Address", w.url ? `${w.url} (${w.from === "file" ? "from relay.json" : w.from})` : w.why || "not read yet"],
      ["Connection", `${S.conn.state}${S.conn.why ? ": " + S.conn.why : ""}${c.latency ? ` · ${c.latency} ms` : ""}`],
      ["Live updates", live ? "on" : "off"],
      ["Account", a ? `${a.name} · ${a.kind} · ${a.id}` : "none (a visitor)"],
      ["Rights", rights.join(", ") || "look and download"],
      ["Programs", FM.apps.failed ? `not read: ${FM.apps.failed}` : FM.apps.list.map((p) => p.id).join(", ") || "none"],
      ["Reports waiting", String(FM.reports.waiting.length)],
    ];
