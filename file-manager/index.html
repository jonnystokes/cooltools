<style>
/* ---- base.css ---- */
/* base.css: colours (light and dark follow the device), type, the page frame, buttons. Blue and amber to match
   the Relay Files icon: blue for actions and selection, amber for private. */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #f8f9fc; --raised: #ffffff;
  --text: #171c28; --muted: #5d667a; --faint: #8b93a5; --line: #e2e6ef; --line-2: #eef1f6;
  --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #e3ecff; --accent-soft-2: #d2e0ff; --focus: #2563eb;
  --folder: #3b82f6; --folder-tab: #93c5fd;
  --priv: #c27803; --priv-soft: #fff4dd; --danger: #c62828; --danger-soft: #fdecec; --ok: #16794a; --ok-soft: #e6f6ee;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .08);
  --radius: 10px; --row: 42px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0f17; --surface: #131826; --surface-2: #171d2d; --raised: #1b2234;
    --text: #e8ecf6; --muted: #a0a9bd; --faint: #737d93; --line: #262e42; --line-2: #1d2436;
    --accent: #5b9bff; --accent-ink: #08101f; --accent-soft: #18284a; --accent-soft-2: #213767; --focus: #7cb0ff;
    --folder: #5b9bff; --folder-tab: #2f5aa8;
    --priv: #f5b544; --priv-soft: #33270f; --danger: #ff7a7a; --danger-soft: #3a1717; --ok: #5ad69a; --ok-soft: #12301f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 16px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; touch-action: manipulation; }  /* no double-tap zoom: a quick second tap is never taken as a zoom */
body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow: hidden; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
kbd { font: 600 11px/1 var(--font); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }

.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; min-height: 0; }

/* the header: brand, path, search, account */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 16px; padding-top: env(safe-area-inset-top); flex: none; }
.top-row { display: flex; align-items: center; gap: 12px; height: 56px; min-width: 0; }
apps-button { --apps-sep: var(--line); }  /* the Apps button's plain divider: the same line as the header's own */
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 16px; white-space: nowrap; color: var(--text); }
.brand-name { display: block; }
@media (min-width: 721px) and (max-width: 860px) { .brand-name { display: none; } }  /* a narrow window: the room goes to the path */
.brand-mark { width: 26px; height: 26px; padding: 4px; border-radius: 8px; background: var(--accent); color: #fff; }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; overflow: hidden; }
.top-row > .crumbs { border-left: 1px solid var(--line); padding-left: 4px; }
.crumb { border: 0; background: none; padding: 5px 8px; border-radius: 7px; color: var(--muted); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.crumb:hover { background: var(--line-2); color: var(--text); }
.crumb.here { color: var(--text); font-weight: 600; cursor: default; }
.crumb.here:hover { background: none; }
.crumb.drop-on { background: var(--accent-soft); color: var(--accent); outline: 2px dashed var(--accent); }
.crumb-sep { width: 14px; height: 14px; color: var(--faint); }
.crumbs-row { display: none; }
.search { position: relative; display: flex; align-items: center; width: min(340px, 34vw); }
.search svg { position: absolute; left: 10px; width: 17px; height: 17px; color: var(--faint); pointer-events: none; }
.search input { width: 100%; height: 36px; padding: 0 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); outline: none; }
.search input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input::-webkit-search-cancel-button { cursor: pointer; }
.search .hint-key { position: absolute; right: 9px; pointer-events: none; }
.search input:focus ~ .hint-key, .search input:not(:placeholder-shown) ~ .hint-key { display: none; }
.account { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.account:hover { border-color: var(--accent); }
.account svg { width: 17px; height: 17px; }
.account.signed { background: var(--priv-soft); border-color: transparent; color: var(--priv); font-weight: 600; }
.account.signed:hover { border-color: var(--priv); }

/* buttons */
.iconbtn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 9px; background: none; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--line-2); color: var(--text); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn:disabled:hover { background: none; color: var(--muted); }
.busy svg { animation: spin .9s linear infinite; }  /* Refresh while it works */
@keyframes spin { to { transform: rotate(360deg); } }
.top .search-btn, .top .up-btn, .top .refresh-btn { display: none; }  /* a phone's (phone.css); a computer has the toolbar's */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 550; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { height: 30px; padding: 0 10px; font-size: 13px; }

/* the toolbar */
.toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; min-height: 52px; overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
.toolbar .grow { flex: 1; }
.toolbar .btn { height: 34px; padding: 0 11px; }
.toolbar .hint { color: var(--muted); font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.toolbar .hint svg { width: 16px; height: 16px; color: var(--priv); }

/* the pick bar (a page asked for a file) and notices */
.pickbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--accent-soft-2); flex: none; flex-wrap: wrap; }
.pickbar .pick-text { flex: 1; min-width: 200px; }
.pickbar .pick-text b { font-weight: 650; }
.pickbar .pick-sub { color: var(--muted); font-size: 13px; }
.pickbar .pick-progress { flex-basis: 100%; }
.notice { padding: 10px 16px; background: var(--priv-soft); color: var(--text); border-bottom: 1px solid var(--line); flex: none; display: flex; gap: 10px; align-items: center; }
.notice.bad { background: var(--danger-soft); }
.notice b { font-weight: 650; }

/* main area */
.main { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.loadbar { position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; z-index: 3; }
.loadbar::after { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; background: var(--accent); animation: load 1s ease-in-out infinite; }
@keyframes load { to { left: 100%; } }

/* the status line */
.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 16px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12.5px; flex: none; min-height: 32px; }
.status-left { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-right { display: flex; gap: 12px; align-items: center; white-space: nowrap; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.conn.on::before { background: #22c55e; }
.conn.off::before { background: var(--danger); }
.conn.wait::before { background: #f59e0b; }
.build { color: var(--faint); }

/* ---- list.css ---- */
/* list.css: the file list (a grid of rows), its header, the empty and error states, the drop zone. */
.list { flex: 1; overflow: auto; outline: none; background: var(--surface); position: relative; overscroll-behavior: contain; }
.list-head, .row { display: grid; grid-template-columns: 40px 30px minmax(120px, 1fr) 150px 190px 40px; align-items: center; column-gap: 8px; padding: 0 12px 0 8px; }
.list.trash-view .list-head, .list.trash-view .row { grid-template-columns: 40px 30px minmax(120px, 1fr) minmax(90px, .6fr) 110px 190px 8px; }
.list.search-view .list-head, .list.search-view .row { grid-template-columns: 40px 30px minmax(120px, 1fr) minmax(90px, .7fr) 120px 170px 40px; }
.list-head { position: sticky; top: 0; z-index: 2; height: 36px; background: var(--surface-2); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: .01em; }
.list-head .col { border: 0; background: none; padding: 4px 6px; margin-left: -6px; border-radius: 6px; text-align: left; color: inherit; font-weight: inherit; display: inline-flex; align-items: center; gap: 4px; justify-self: start; }
.list-head .col.num { justify-self: end; margin-left: 0; margin-right: -6px; }
.list-head .col:hover { background: var(--line-2); color: var(--text); }
.list-head .col.sorted { color: var(--text); }
.list-head .col .arrow { font-size: 10px; }
.row { height: var(--row); border-bottom: 1px solid var(--line-2); cursor: pointer; user-select: none; -webkit-user-select: none; position: relative; }
.row:hover { background: var(--surface-2); }
.row.sel { background: var(--accent-soft); }
.row.sel:hover { background: var(--accent-soft-2); }
.row.focus { box-shadow: inset 2px 0 0 var(--accent); }
.list:focus-visible .row.focus { box-shadow: inset 0 0 0 2px var(--focus); }
.row.cut { opacity: .55; }
.row.drop-on { background: var(--accent-soft-2); box-shadow: inset 0 0 0 2px var(--accent); }
.row.nomatch { opacity: .42; }
.row.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: var(--ok-soft); } }
.row .check, .list-head .check { width: 22px; height: 22px; border-radius: 6px; border: 1.6px solid var(--line); background: var(--surface); display: grid; place-items: center; margin: auto; padding: 0; color: transparent; transition: border-color .12s; }
.row .check { position: relative; }
.row .check::before { content: ""; position: absolute; inset: -9px; }  /* the box takes a click a little around it, so a near miss ticks instead of opening */
.row:hover .check { border-color: var(--faint); }
.row.sel .check, .list-head .check[aria-checked=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.list-head .check:hover { border-color: var(--faint); }
.row .check svg, .list-head .check svg { width: 16px; height: 16px; }
.row .ico { width: 24px; height: 24px; color: var(--muted); justify-self: center; }
.row .ico.folder { color: var(--folder); }
.row .ico.image { color: #0ea5a4; } .row .ico.audio { color: #a855f7; } .row .ico.video { color: #e11d48; }
.row .ico.pdf { color: #dc2626; } .row .ico.archive { color: #b45309; } .row .ico.book { color: #0f766e; } .row .ico.code { color: #4f46e5; }
.row .name { display: flex; align-items: center; gap: 7px; min-width: 0; }
.row .name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.dir .name-text { font-weight: 550; }
.row .badge { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px; border-radius: 10px; background: var(--priv-soft); color: var(--priv); font-size: 11.5px; font-weight: 650; flex: none; }
.row .badge svg { width: 12px; height: 12px; }
.row .badge.inherited { background: none; padding: 0 2px; }
.row .sub { display: none; }
.row .size, .row .when, .row .from { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.row .size { text-align: right; }
.row .more { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--faint); display: grid; place-items: center; opacity: 0; }
.row:hover .more, .row.sel .more, .row .more:focus-visible { opacity: 1; }
.row .more:hover { background: var(--line); color: var(--text); }
.row.locked .name-text { color: var(--muted); }
.row.locked .ico { color: var(--priv); }
.row .rename-input { flex: 1; min-width: 0; height: 30px; padding: 0 8px; border: 1.5px solid var(--accent); border-radius: 7px; background: var(--surface); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

.empty { display: grid; place-items: center; text-align: center; padding: 64px 24px; color: var(--muted); }
.empty svg { width: 56px; height: 56px; color: var(--line); margin-bottom: 10px; }
.empty .empty-title { color: var(--text); font-weight: 600; font-size: 16px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }
.fail { display: grid; place-items: center; text-align: center; padding: 56px 24px; }
.fail .fail-card { max-width: 460px; }
.fail .fail-title { font-weight: 650; font-size: 17px; margin-bottom: 6px; }
.fail .fail-why { color: var(--muted); margin-bottom: 14px; }
.fail .fail-retry { color: var(--faint); font-size: 13px; margin-top: 10px; }

.dropzone { position: absolute; inset: 8px; z-index: 5; border: 2.5px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent-soft) 82%, transparent); display: grid; place-items: center; pointer-events: none; }
.dropzone-card { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--accent); font-weight: 650; font-size: 17px; background: var(--surface); padding: 18px 28px; border-radius: 14px; box-shadow: var(--shadow-lg); }
.dropzone-card svg { width: 34px; height: 34px; }

/* ---- ui.css ---- */
/* ui.css: menus, dialogs, toasts, the transfers panel, the selection bar and the add button (phones). */
.menu { position: fixed; z-index: 50; min-width: 220px; max-width: calc(100vw - 16px); padding: 6px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
.menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; text-align: left; white-space: nowrap; }
.menu .mi:hover:not(:disabled), .menu .mi:focus-visible { background: var(--line-2); outline: none; }
.menu .mi svg { width: 18px; height: 18px; color: var(--muted); }
.menu .mi .k { margin-left: auto; color: var(--faint); font-size: 12px; padding-left: 18px; }
.menu .mi.danger { color: var(--danger); }
.menu .mi.danger svg { color: var(--danger); }
.menu .mi:disabled { opacity: .45; cursor: default; }
.menu .msep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu .mhead { padding: 6px 10px 4px; color: var(--muted); font-size: 12px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(8, 12, 22, .42); display: grid; place-items: center; padding: 16px; animation: fade .12s ease-out; }
@keyframes fade { from { opacity: 0; } }
.dialog { width: min(460px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--raised); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 20px; border: 1px solid var(--line); animation: pop .14s ease-out; }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
.dialog h2 { margin: 0 0 8px; font-size: 17px; font-weight: 650; }
.dialog .d-body { color: var(--muted); }
.dialog .d-body p { margin: 0 0 10px; }
.dialog .d-body b { color: var(--text); font-weight: 600; }
.dialog .d-list { margin: 8px 0 12px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); max-height: 180px; overflow: auto; font-size: 13px; color: var(--text); }
.dialog .d-list div { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dialog .d-list .d-meta { color: var(--muted); }
.dialog input[type=text], .dialog input[type=password] { width: 100%; height: 40px; margin: 6px 0 4px; padding: 0 12px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); outline: none; }
.dialog input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dialog .d-msg { min-height: 20px; font-size: 13px; color: var(--danger); margin-top: 4px; }
.dialog .d-msg.info { color: var(--muted); }
.dialog .d-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.dialog .d-check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text); font-size: 13.5px; }
.dialog table.keys { width: 100%; border-collapse: collapse; font-size: 13.5px; color: var(--text); }
.dialog table.keys td { padding: 5px 4px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.dialog table.keys td:first-child { white-space: nowrap; width: 42%; }

.toasts { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(560px, calc(100vw - 24px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px 11px 16px; border-radius: 12px; background: #1f2633; color: #f1f4fa; box-shadow: var(--shadow-lg); animation: pop .16s ease-out; }
@media (prefers-color-scheme: dark) { .toast { background: #e8ecf6; color: #121826; } }
.toast.bad { background: var(--danger); color: #fff; }
.toast .t-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast .t-btn { border: 0; background: none; color: inherit; font-weight: 700; padding: 6px 10px; border-radius: 8px; text-decoration: underline; text-underline-offset: 3px; }
.toast .t-btn:hover { background: rgba(127, 127, 127, .2); }
.toast .t-x { border: 0; background: none; color: inherit; opacity: .8; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; padding: 0; }
.toast .t-x svg { width: 16px; height: 16px; }

.transfers { position: fixed; right: 16px; bottom: 44px; z-index: 40; width: min(400px, calc(100vw - 24px)); max-height: min(60vh, 480px); display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; }
.transfers .tr-head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.transfers.collapsed .tr-head { border-bottom: 0; }
.transfers .tr-title { flex: 1; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.transfers .tr-total { height: 3px; background: var(--line-2); }
.transfers .tr-total i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.transfers .tr-list { overflow: auto; }
.transfers.collapsed .tr-list { display: none; }
.tr-item { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--line-2); }
.tr-item svg { width: 18px; height: 18px; color: var(--muted); }
.tr-item .tr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.tr-item .tr-line { grid-column: 2; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.tr-item .tr-bar { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
.tr-item .tr-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .2s; }
.tr-item.done .tr-bar i { background: var(--ok); }
.tr-item.error .tr-bar i { background: var(--danger); }
.tr-item.error .tr-line { color: var(--danger); }
.tr-item .tr-acts { grid-row: 1 / 3; grid-column: 3; display: flex; gap: 2px; }
.tr-item .tr-acts button { width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.tr-item .tr-acts button:hover { background: var(--line-2); color: var(--text); }
.tr-item .tr-acts svg { width: 16px; height: 16px; }

.selbar { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 45; display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 16px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
.selbar .sb-count { flex: 1; min-width: 0; font-weight: 650; font-size: 14px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.selbar .iconbtn { width: 40px; height: 44px; color: var(--text); }
.selbar .iconbtn.danger { color: var(--danger); }
.fab { position: fixed; right: 18px; bottom: calc(52px + env(safe-area-inset-bottom)); z-index: 44; width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-lg); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; }
.blocked { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; color: var(--muted); }

/* ---- phone.css ---- */
/* phone.css: narrow screens (a phone, or the floating window's full-screen sheet). Two-line rows with big
   targets (the box, the row, ⋯), the path on its own row, search behind a button, actions in a bar that appears
   when a row is ticked, an add button for upload / new folder. Same features, laid out for a thumb. */
@media (max-width: 720px) {
  body { font-size: 15.5px; }
  :root { --row: 60px; }
  .top { padding: 0 6px 0 4px; padding-top: env(safe-area-inset-top); }
  .top-row { height: 52px; gap: 4px; }
  apps-button { --apps-h: 42px; }  /* the stacked Apps button (stack="720"), in the 52 px bar */
  .top .up-btn, .top .refresh-btn { display: inline-grid; }  /* Back (greyed when there is nowhere to go) and Refresh */
  .brand-name { display: block; }
  .app.at-root .crumbs-row { display: none; }
  .brand { flex: 1; min-width: 0; font-size: 17px; }
  .brand-mark { display: none; }
  .brand-name { overflow: hidden; text-overflow: ellipsis; }
  .top-row > .crumbs { display: none; }
  .crumbs-row { display: block; padding: 0 6px 6px; }
  .crumbs-phone { overflow-x: auto; scrollbar-width: none; flex: none; }
  .crumbs-phone::-webkit-scrollbar { display: none; }
  .crumb { font-size: 13.5px; padding: 4px 6px; }
  .search { display: none; }
  .app.searching .search { display: flex; position: absolute; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top)); width: auto; z-index: 20; }
  .app.searching .search input { height: 40px; font-size: 16px; box-shadow: var(--shadow-lg); }
  .search .hint-key { display: none; }
  .top .search-btn { display: inline-grid; }
  .account { height: 36px; padding: 0 9px; font-size: 13px; }
  .account .acc-text { display: none; }
  .toolbar { display: none; }
  .toolbar.phone-keep { display: flex; padding: 6px 8px; min-height: 0; }
  .list-head { display: none; }
  .row, .list.trash-view .row, .list.search-view .row { grid-template-columns: 36px 28px minmax(0, 1fr) 44px; grid-template-rows: auto auto; column-gap: 8px; row-gap: 0; padding: 0 2px 0 4px; height: var(--row); align-content: center; }
  .row .check { grid-row: 1 / 3; grid-column: 1; width: 26px; height: 26px; }
  .row .ico { grid-row: 1 / 3; grid-column: 2; width: 28px; height: 28px; }
  .row .name { grid-column: 3; grid-row: 1; }
  .row .sub { display: block; grid-column: 3; grid-row: 2; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .size, .row .when, .row .from { display: none; }
  .row .more { grid-column: 4; grid-row: 1 / 3; opacity: 1; width: 44px; height: 44px; }
  .row.sel { background: var(--accent-soft); }
  .row.focus { box-shadow: none; }
  .status { padding: 4px 12px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .status .build { display: none; }
  .app.selecting .status, .app.selecting .fab { visibility: hidden; }
  .list { padding-bottom: 84px; }
  .transfers { left: 8px; right: 8px; width: auto; bottom: calc(52px + env(safe-area-inset-bottom)); }
  .app.selecting .transfers { bottom: calc(76px + env(safe-area-inset-bottom)); }
  .toasts { bottom: calc(118px + env(safe-area-inset-bottom)); }
  .scrim { place-items: end center; padding: 0; }
  .dialog { width: 100%; border-radius: 18px 18px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(30px); opacity: .4; } }
  .dialog .d-actions .btn { flex: 1; height: 44px; }

   - Nothing happens until the page calls something: no background traffic of its own.
   - The PC's address (2026-11-08, after the PC was renamed DESKTOP-KRQ9TI2 -> DESKTOP-42): unless the page names
     one (opts.base: a setting, a test, the relay's own origin for a page it serves), it is read from the address
     file on Jon's Cool tools site, ADDRESS_FILE ({"address": "https://..."}), fresh (never a cached copy) before the
     first connection, and again when a connection fails (at most once a minute), so an open page follows a rename.
     After a rename only that file changes; no page is rebuilt. If the file cannot be loaded (no network, a page
     opened from a file while offline, the site down), the address this copy was built with (BUILT_PC) is used and
     the page is told so: R.where is { from: "built-in", why }, and the page's log function (opts.log) and the
     browser's console get the same words. Never silently. (Tried again before a request, at most once a minute.)
   - ONE pass per browser (localStorage "relay-pass", shared by every page of the same site), from signIn(password).
     It is sent in the X-Relay-Pass header (HTTP) or as the WebSocket subprotocol "pass.<p>" (a browser cannot set
     WebSocket headers); never in a URL, never in cookies. Signed in = everything; signed out = view and download
     public things. The PC decides every request; a page's buttons are only buttons.
   - A 401 from the PC means "sign in": the pass (if one was sent) is no longer valid, so it is forgotten, the status
     becomes "signin", and call() answers { ok: false, signin: true, status: 401, why }.
   - Status events: checking / connected / starting / ready / offline / off / signin / reload, each with a plain `why`.
   - Version-checked: a relay that needs a newer client says so (426), and the status becomes "reload".

   const R = RelayClient.create({ app: "reader", log });  // app names the page in the PC's logs; log(text) hears
                                                           // relay-client's notes (which address, and why)
   await R.address();                                      // { url, from: "file" | "built-in" | "page", why }
   await R.ping();                                         // { ok, info, latency } ; info.signed_in, info.services
   R.signedIn();                                           // this browser holds a pass (the last ping says if it is valid)
   await R.signIn(password);                               // { ok, why, device, name }
   await R.signOut();                                      // { ok }
   await R.call("files", "list?folder=root");              // { ok, status, data, why, signin } (JSON in and out)
   await R.call("files", "mkdir", { method: "POST", json: { parent, name } });
   const r = await R.fetch("files", "file/ID/name");       // a Response (a 401 forgets the pass, as above)
   const ws = R.ws("voice", "ws");                         // a WebSocket carrying the pass
   await R.open("voice", (p) => ..., 60000);               // start a program, with progress
   R.url("files", "file/ID/name?dl=1");                    // a plain link (public things only: a link carries no pass)

  const KEY = "relay-pass";
  const store = {
    get(k) { try { return root.localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { if (v) root.localStorage.setItem(k, v); else root.localStorage.removeItem(k); } catch (e) {} },
    keys() { try { return Object.keys(root.localStorage); } catch (e) { return []; } },

// ---- unzip.js ----
// unzip.js: a zip into File objects, with the browser's own decompressor (stored and deflated entries; zip64).
// Used when a page asks for a folder "as its files": the PC sends the folder as ONE zip (one request instead of
// thousands), and the files come out here with their paths. Modelled on the book reader's zip.js (read the
// directory at the end, slice each entry; a stored entry is a slice of the zip, no copy). What the PC had to leave

// ---- ui.js ----

// ---- transfers.js ----
// transfers.js: every upload and download, in one panel: progress, speed, time left, Cancel, Retry, and the

    const w = FM.api.where;
    const built = !FM.api.custom && w.from === "built-in";
    conn.textContent = (S.conn.state === "on" ? "Connected" : S.conn.why) + (FM.api.custom ? ` · PC: ${FM.api.base}` : built ? " · PC address built in (the address file could not be loaded)" : "");
    conn.title = S.conn.why + (S.version ? ` · files program ${S.version}` : "") + ` · PC: ${FM.api.base}` + (built ? ` · ${FM.sentence(w.why)}` : w.from === "file" ? " (from the Cool tools address file)" : "");
  }

  function renderSelbar() {
    const bar = $(".selbar"), app = $(".app");
    const sel = FM.selected();
    const on = FM.isPhone() && sel.length > 0 && S.view !== "trash";
    app.classList.toggle("selecting", on);
    bar.hidden = !on;
    const fab = $(".fab");
    fab.hidden = !(FM.isPhone() && S.writable && S.view === "folder" && !on && !S.clip);
    if (!on) { if (S.clip && FM.isPhone() && S.view === "folder") renderClipbar(bar); return; }
    const n = sel.length, locked = sel.some((i) => i.locked), prot = sel.some((i) => i.protected);
    const b = (act, ic, label, dis, danger) => h("button.iconbtn" + (danger ? ".danger" : ""), { type: "button", data: { act }, disabled: !!dis, title: label, "aria-label": label }, icon(ic));
    const kids = [b("unselect", "close", "Untick all"), h("span.sb-count", { text: `${n} selected` }), b("download", "download", "Download", !n || locked)];
    if (S.writable) kids.push(b("cut", "move", "Move", !n || locked || prot), b("copy", "copy", "Copy", !n || locked), b("delete", "trash", "Delete", !n || locked || prot, true));
    kids.push(b("selmore", "more", "More", !n));
    bar.replaceChildren(...kids);
  }
  function renderClipbar(bar) {
    bar.hidden = false;
    $(".app").classList.add("selecting");
    const n = S.clip.items.length;
    bar.replaceChildren(h("button.iconbtn", { type: "button", data: { act: "clipcancel" }, title: "Put them down", "aria-label": "Put them down" }, icon("close")),
      h("span.sb-count", { text: `${S.clip.mode === "cut" ? "Moving" : "Copying"} ${FM.plural(n, "item")}: open the folder, then` }),
      h("button.btn.primary", { type: "button", data: { act: "paste" } }, icon("paste"), "Paste here"));
  }

  function renderPick() {
    const bar = $(".pickbar");
    const p = S.pick;
    if (!p) { bar.hidden = true; return; }
    bar.hidden = false;
    const what = FM.pickWhat(p);
    const kids = [h("div.pick-text", null, h("div", null, h("b", { text: p.host || "A page" }), ` asks for ${what}.`), h("div.pick-sub", { text: FM.pickHint() }))];
    if (S.picking) {
      kids.push(h("button.btn", { type: "button", data: { act: "pickstop" }, text: "Stop" }));
      const pr = S.picking;
      kids.push(h("div.pick-progress", null, h("div.pick-sub", { text: pr.error ? pr.error : pr.text }), pr.error ? null : h("div.tr-bar", { style: "height:4px;border-radius:2px;background:var(--line-2);overflow:hidden" }, h("i", { style: `display:block;height:100%;background:var(--accent);width:${Math.round((pr.frac || 0) * 100)}%` }))));
    } else {
      const ch = FM.pickChoice();
      kids.push(h("button.btn.primary", { type: "button", data: { act: "pickchoose" }, disabled: !ch.ok, title: ch.why || "" }, icon("check"), ch.label), h("button.btn", { type: "button", data: { act: "pickcancel" }, text: "Cancel" }));
    }
    bar.replaceChildren(...kids);
  }
  function renderNotice() {
    const el = $(".notice");
    if (!S.notice) { el.hidden = true; return; }
    el.hidden = false;
    el.className = "notice" + (S.notice.bad ? " bad" : "");
    el.replaceChildren(h("span", { text: S.notice.text }));
  }

  function render() {
    renderHeader(); renderPick(); renderNotice(); renderToolbar(); renderList(); renderStatus(); renderSelbar();
    $(".loadbar").hidden = !(S.loading || S.refreshing);
  }
  function sel() {
    for (const r of document.querySelectorAll(".list .row")) {
      const id = r.dataset.id, on = S.sel.has(id);
      r.classList.toggle("sel", on);
      r.classList.toggle("focus", S.focus === id);
      r.setAttribute("aria-selected", String(on));
      const c = r.querySelector(".check"); if (c) c.setAttribute("aria-checked", String(on));
    }
    const headCheck = document.querySelector(".list-head .check");
    if (headCheck) {
      const all = S.items.length && S.items.every((i) => S.sel.has(key(i)));
      headCheck.setAttribute("aria-checked", String(!!all));
    }
    renderToolbar(); renderStatus(); renderSelbar(); renderPick();
  }
  function focusRow(id) {
    const r = document.querySelector(`.list .row[data-id="${CSS.escape(id)}"]`);
    if (r) r.scrollIntoView({ block: "nearest" });
  }
  function flash(ids) {
    for (const id of ids) { const r = document.querySelector(`.list .row[data-id="${CSS.escape(id)}"]`); if (r) { r.classList.add("flash"); setTimeout(() => r.classList.remove("flash"), 1500); } }
  }
  FM.view = { render, sel, focusRow, flash, renderStatus, renderPick, renderToolbar, rowEl };
})();

// ---- ops.js ----
// ops.js: what the buttons, menus and keys do. Every change goes to the PC, which has the last word; when it
// answers 409 the page asks (an existing name: Replace / Keep both / Skip; something private going somewhere
// public: say so first) and sends the answer. Every result is said in a toast; delete, move, copy and rename
// can be undone from it. Nothing fails silently: the reason goes in a toast that stays until closed.
"use strict";
(function () {
  const S = FM.S;
  // Downloads up to this size come through the page (progress, Cancel, plain errors); bigger ones go to the
  // browser's own download manager, straight to disk (a page would have to hold them in memory).
  FM.limits = FM.limits || { inPage: 300e6 };
  const toast = (t, o) => FM.ui.toast(t, o);
  const reload = (o) => FM.app.reload(o);

  // A failure: said in a toast that stays, and sent to the PC's log (report.js) with what was being done.
  function fail(e, what, ctx) {
    if (e && e.aborted) return;
    FM.report((ctx && ctx.action) || "action", e, Object.assign({ what }, ctx || {}, { action: undefined }));
    if (e && e.signin) {
      FM.app.signedOut();
      toast(`${what}: the PC wants the password.`, { bad: true, action: () => signIn(), actionText: "Sign in" });
      return;
    }
    toast(`${what}: ${(e && e.message) || e}`, { bad: true });
  }

  // ---- questions ------------------------------------------------------------------------------------------
  async function askConflicts(conflicts, where, verb) {
    const n = conflicts.length;
    const rows = conflicts.map((c) => FM.h("div", null, FM.h("b", { text: c.name || c.path }), FM.h("span.d-meta", { text: c.existing ? `  (there now: ${c.existing.dir ? "a folder" : FM.size(c.existing.size) + ", " + FM.when(c.existing.mtime)})` : "" })));
    const r = await FM.ui.dialog({
      title: n === 1 ? `“${conflicts[0].name || conflicts[0].path}” is already there` : `${n} of them are already there`,
      body: [`${where ? `In “${where}”` : "There"}, ${n === 1 ? "something has" : `${n} items have`} the same name. Nothing is replaced unless you say so: a replaced item goes to the trash, so you can still get it back.`],
      list: n > 1 ? rows : null,
      actions: [{ text: "Cancel", value: false }, { text: "Skip " + (n === 1 ? "it" : "those"), value: "skip" }, { text: "Keep both", value: "keep" }, { text: "Replace", value: "replace", primary: true }],
    });
    return r ? r.value : null;
  }
  const askPublic = (names, where) => FM.ui.confirm(`Make ${names.length === 1 ? "it" : "them"} public?`,
    [`“${where}” is a public folder: anyone with the PC's address can see what is in it, without the password. ${names.length === 1 ? "This private item" : "These private items"} would be seen there:`],
    "Go ahead, make public", { list: names, danger: true });

  // send(body) until the PC says yes or the user says stop; asks about conflicts and privacy on the way.
  async function asking(send, body, where) {
    for (let round = 0; round < 4; round++) {
      try { return await send(body); }
      catch (e) {
        if (e.status === 409 && e.code === "exists" && e.data && e.data.conflicts) {
          const pol = await askConflicts(e.data.conflicts, where);
          if (!pol) return null;
          body.conflict = pol; continue;
        }
        if (e.status === 409 && e.code === "public") {
          if (!(await askPublic(e.data.public || [], where))) return null;
          body.public_ok = true; continue;
        }
        throw e;
      }
    }
    throw new FM.ApiError("The PC kept refusing; nothing more was changed.");
  }
  function sayResults(results, verbDone, where) {
    const ok = results.filter((r) => r.ok && !r.skipped), skipped = results.filter((r) => r.skipped), bad = results.filter((r) => !r.ok);
    for (const r of bad) toast(`“${r.name || "An item"}” was not ${verbDone}: ${r.error}`, { bad: true });
    if (bad.length) FM.report(verbDone, `${bad.length} of ${results.length} not ${verbDone}`, { what: `the PC refused ${bad.length === 1 ? "one item" : bad.length + " items"}`, where, results: bad.slice(0, 50) });
    return { ok, skipped, bad };
  }

  // ---- sign in / out ----------------------------------------------------------------------------------------
  async function signIn(reason) {
    let dlg = null;
    const r = await FM.ui.dialog({
      title: "Sign in to the Cloud File Manager",
      body: [reason || "The PC's password (the same one as Screen Peek's) opens the private folders and lets you add, move, rename and delete. This device remembers the sign-in, for your other Cool tools pages in this browser too."],
      input: { type: "password", autocomplete: "current-password", label: "The PC's password", placeholder: "Password" },
      ref: (d) => { dlg = d; },
      validate: async (pw) => {
        if (!pw) return "Type the password.";
        dlg.msg("Checking…", true);
        const res = await FM.api.signIn(pw);
        if (!res.ok) FM.report("sign-in", res.why, { what: "the sign-in was refused" }); // the reason only, never what was typed
        return res.ok ? "" : res.why;
      },
      actions: [{ text: "Cancel", value: false }, { text: "Sign in", value: true, primary: true }],
    });
    if (!r) return false;
    await FM.app.refresh();
    toast("Signed in: private folders and changes are open on this device.");
    return true;
  }
  async function signOut() {
    await FM.api.signOut();
    S.clip = null;
    await FM.app.refresh();
    toast("Signed out on this device (and on your other Cool tools pages in this browser).");
  }

  // ---- folders and names --------------------------------------------------------------------------------------
  async function newFolder() {
    if (!S.writable || S.view !== "folder") return;
    const names = new Set(S.items.map((i) => i.name.toLowerCase()));
    let name = "New folder";
    for (let n = 2; names.has(name.toLowerCase()); n++) name = `New folder (${n})`;
    const v = await FM.ui.prompt("New folder", { value: name, okText: "Make folder", label: "Folder name", body: [`In “${S.folder.name}”.`], validate: (t) => FM.badName(t.trim()) || (names.has(t.trim().toLowerCase()) ? `“${t.trim()}” is already in this folder.` : "") });
    if (v == null) return;
    try {
      const r = await FM.api.post("mkdir", { parent: S.folder.id, name: v.trim() });
      await reload({ select: [r.item && r.item.id] });
      toast(`Made the folder “${v.trim()}”.`);
    } catch (e) { fail(e, "The folder could not be made", { action: "mkdir", name: v.trim(), parent: S.folder && S.folder.name }); }
  }
  async function rename(it) {
    if (!it || it.locked || it.protected || !S.writable) return;
    const dot = !it.dir ? it.name.lastIndexOf(".") : -1;
    const v = await FM.ui.prompt(`Rename ${it.dir ? "folder" : "file"}`, { value: it.name, select: [0, dot > 0 ? dot : it.name.length], okText: "Rename", label: "New name", validate: (t) => FM.badName(t.trim()) });
    if (v == null || v.trim() === it.name) return;
    const body = { id: it.id, name: v.trim() };
    try {
      const r = await asking((b) => FM.api.post("rename", b), body, S.folder && S.folder.name);
      if (!r) return;
      await reload({ select: [r.item && r.item.id] });
      const back = { id: r.item && r.item.id, name: it.name };
      toast(`Renamed to “${r.item ? r.item.name : v.trim()}”.`, { action: async () => { try { await FM.api.post("rename", back); await reload({ select: [it.id] }); } catch (e) { fail(e, "It could not be renamed back", { action: "rename", items: [back], name: it.name }); } } });
    } catch (e) { fail(e, `“${it.name}” could not be renamed`, { action: "rename", items: [it], name: v.trim() }); }
  }

  // ---- delete (to the trash) ---------------------------------------------------------------------------------
  async function del(items) {
    items = items.filter((i) => !i.locked && !i.protected);
    if (!items.length || !S.writable) return;
    try {
      const r = await FM.api.post("delete", { ids: items.map((i) => i.id) });
      const { ok } = sayResults(r.results, "moved to the trash");
      await reload();
      if (ok.length) {
        const tids = r.trash;
        toast(`${ok.length === 1 ? `“${ok[0].name}”` : FM.plural(ok.length, "item")} moved to the trash.`, { action: () => restore(tids.map((tid) => ({ tid }))), actionText: "Undo" });
      }
    } catch (e) { fail(e, "Nothing was deleted", { action: "delete", items }); }
  }

  // ---- move and copy -----------------------------------------------------------------------------------------
  function pickUp(items, mode) {
    items = items.filter((i) => !i.locked && (mode === "copy" || !i.protected));
    if (!items.length) return;
    S.clip = { mode, items: items.map((i) => ({ id: i.id, name: i.name, dir: i.dir, size: i.size, private: i.private, parent: i.parent })), from: S.folder ? S.folder.id : "root" };
    S.sel.clear();
    FM.view.render();
    toast(`${FM.plural(items.length, "item")} picked up to ${mode === "cut" ? "move" : "copy"}: open the folder you want, then Paste here.`);
  }
  async function paste() {
    if (!S.clip || S.view !== "folder" || !S.writable) return;
    const clip = S.clip;
    const done = await moveTo(clip.items, S.folder, clip.mode === "copy");
    if (done && clip.mode === "cut") S.clip = null;
    FM.view.render();
  }
  // items -> the folder `to` ({id, name}); returns true when something was done.
  async function moveTo(items, to, copy) {
    if (!items.length) return false;
    const where = to.name;
    if (!copy && items.every((i) => FM.parentOf(i) === to.id)) { toast(`They are already in “${where}”.`); return false; }
    const body = { ids: items.map((i) => i.id), to: to.id };
    if (copy && items.some((i) => FM.parentOf(i) === to.id)) body.conflict = "keep"; // a copy into its own folder: "name (2)"
    if (!copy) {
      try {
        const r = await asking((b) => FM.api.post("move", b), body, where);
        if (!r) return false;
        const { ok } = sayResults(r.results, "moved");
        await reload({ select: ok.map((x) => x.new_id) });
        if (ok.length) {
          const from = FM.S.clip ? FM.S.clip.from : null;
          toast(`Moved ${ok.length === 1 ? `“${ok[0].new_name || ok[0].name}”` : FM.plural(ok.length, "item")} to “${where}”.`, from ? { action: async () => {
            try { const b = await asking((x) => FM.api.post("move", x), { ids: ok.map((x) => x.new_id), to: from }, "where they were"); if (b) await reload(); } catch (e) { fail(e, "They could not be moved back", { action: "move", items: ok.map((x) => ({ id: x.new_id, name: x.new_name || x.name })), to: from }); }
          } } : {});
        }
        return true;
      } catch (e) { fail(e, "Nothing was moved", { action: "move", items, to: { id: to.id, name: to.name } }); return false; }
    }
    // A copy runs on the PC with progress, shown with the transfers. The PC answers its questions (409: a name
    // in the way, something private going public) before it starts copying, so they are asked here first.
    const total = items.reduce((a, i) => a + (i.size || 0), 0);
    const t = FM.transfers.add({
      kind: "copy", name: items.length === 1 ? items[0].name : `${items.length} items`, total, where,
      run: async (tr) => {
        const res = await asking((b) => FM.api.copy(b, (p) => { tr.progress(p.bytes, p.total); if (p.total_files > 1) tr.say(`${FM.size(p.bytes)} of ${FM.size(p.total)} · ${p.files} of ${p.total_files} files`); }, tr.ac.signal), body, where);
        if (!res) return { cancelled: true };
        const { ok } = sayResults(res.results, "copied");
        await reload({ select: ok.map((x) => x.new_id) });
        if (ok.length) toast(`Copied ${ok.length === 1 ? `“${ok[0].new_name || ok[0].name}”` : FM.plural(ok.length, "item")} to “${where}”.`, { action: () => del(ok.map((x) => ({ id: x.new_id, name: x.new_name || x.name }))), actionText: "Undo" });
        return {};
      },
      onError: (tr, e) => { if (e.signin) FM.app.signedOut(); },
    });
    await t.done;
    return t.state === "done";
  }

  // ---- private / public --------------------------------------------------------------------------------------
  async function setPrivate(it, on) {
    if (!it || !it.dir || !S.writable) return;
    if (!on) {
      if (it.protected) return toast(`“${it.name}” is always private (the private books live there).`, { bad: true, ms: 6000 });
      if (!it.own_private) return toast(`“${it.name}” is private because it is inside “${it.priv_from}”: make that folder public instead.`, { bad: true, ms: 7000 });
      const ok = await FM.ui.confirm(`Make “${it.name}” public?`, [`Anyone who has the PC's address can then see and download its ${FM.plural(it.files || 0, "file")} (${FM.size(it.size)}), without the password.`, "Folders inside it that are private by their own setting stay private."], "Make public", { danger: true });
      if (!ok) return;
    }
    try {
      const r = await FM.api.post("private", { id: it.id, private: on });
      await reload({ select: [r.item && r.item.id] });
      toast(on ? `“${it.name}” is private: it needs the PC's password from now on.` : `“${it.name}” is public now.`);
    } catch (e) { fail(e, on ? "It is not private" : "It is still private", { action: "private", items: [it], private: on }); }
  }

  // ---- download and open ---------------------------------------------------------------------------------------
  function download(items) {
    items = items.filter((i) => !i.locked);
    if (!items.length) return;
    const one = items.length === 1 ? items[0] : null;
    const zip = !one || one.dir;
    const total = items.reduce((a, i) => a + (i.size || 0), 0);
    const name = one ? (one.dir ? one.name + ".zip" : one.name) : `${items.length} items from ${(S.folder && S.folder.name) || "Relay Files"}.zip`;
    FM.transfers.add({
      kind: "down", name, total,
      run: async (t) => {
        if (total > FM.limits.inPage) { // straight to disk through the browser
          const url = await FM.api.link(items, { zip, name });
          // asked first, so a refusal is said here instead of the page going to an error
          const head = await fetch(url, { method: "HEAD", cache: "no-store", signal: t.ac.signal }).catch((e) => { throw new FM.ApiError(t.ac.signal.aborted ? "Stopped." : "Could not reach the PC (no network, or the PC is off or asleep).", { aborted: t.ac.signal.aborted, net: true }); });
          if (!head.ok) throw new FM.ApiError(head.status === 404 ? "It is no longer on the PC, or the download link expired: try again." : head.status === 401 || head.status === 403 ? "The PC wants the password for it: sign in, then try again." : FM.sentence(RelayClient.httpWhy(head.status)), { status: head.status });
          FM.navigateDownload(url);
          t.say(`Large (${FM.size(total)}): it goes straight to your browser's downloads, which show its progress.`);
          if (zip) leftOut(name, FM.zipInfo(head.headers), null);
          return { handed: true };
        }
        let hdr = null;
        const b = await FM.api.blob(zip ? FM.api.zipPath(items, name) : FM.api.filePath(one) + "?dl=1", { onProgress: t.progress, signal: t.ac.signal, expect: total, type: zip ? "application/zip" : "", onHeaders: (h) => { hdr = h; } });
        FM.saveBlob(b, name);
        if (zip) leftOut(name, FM.zipInfo(hdr), await FM.unzip.count(b).catch(() => null));
        return {};
      },
      onError: (t, e) => { if (e.signin) FM.app.signedOut(); },
    });
  }
  // A zip the PC made without some files (open in another program, moved or changed while it was packed): said in
  // a toast that stays (the PC's headers name them; its log, files.log, says why). files = the files really in the
  // zip (null = not counted): fewer than the PC said means some failed while it was being sent.
  function leftOut(name, info, files) {
    const late = files != null && info.files != null ? Math.max(0, info.files - files) : 0;
    const n = info.skipped + late;
    if (!n) return;
    const shown = info.names.slice(0, 3), more = n - shown.length;
    const names = shown.map((p) => `“${p.split("/").pop()}”`).join(", ");
    toast(`“${name}” ${files == null ? "will be saved" : "was saved"} without ${FM.plural(n, "file")} the PC could not read (open in another program, moved or changed)${names ? ": " + names + (more > 0 ? ` and ${more} more` : "") : ""}. The PC's log (files.log) says why.`, { bad: true });
  }

  // Open = the file's own link in a new tab: the browser shows what it can (text, Markdown, code, pages, pictures,
  // PDF, sound, video; the PC sends each with a type a tab shows) and downloads the rest, closing the tab.
  // A public file's link is known at once; a private one gets a 10-minute ticket link first (a link cannot carry
  // the pass). Never a blank tab filled in later: a download then left it stuck on "Opening…" (2026-11-07).
  function tab(url, name) {
    const w = window.open(url, "_blank");
    if (w) { try { w.opener = null; } catch (e) {} return; }
    FM.report("open", "the browser blocked the new tab", { name });
    toast(`The browser blocked the new tab for “${name}”.`, { bad: true, action: () => tab(url, name), actionText: "Open it" });
  }
  async function open(it) {
    if (!it || it.locked) return;
    if (it.dir) return FM.app.go(it.id);
    if (!it.private) return tab(FM.api.client.url("files", FM.api.filePath(it)), it.name);
    try { tab(await FM.api.link([it], { inline: true }), it.name); }
    catch (e) { fail(e, `“${it.name}” could not be opened`, { action: "open", items: [it] }); }
  }

  // ---- the trash -------------------------------------------------------------------------------------------------
  async function restore(items) {
    if (!items.length) return;
    const body = { tids: items.map((i) => i.tid) };
    try {
      const r = await asking((b) => FM.api.post("trash/restore", b), body, "its old folder");
      if (!r) return;
      const { ok } = sayResults(r.results, "restored");
      await reload({ select: ok.map((x) => x.new_id) });
      if (ok.length) {
        const first = ok[0];
        const folder = first.path && first.path.includes("/") ? first.path.slice(0, first.path.lastIndexOf("/")) : "";
        toast(`Restored ${ok.length === 1 ? `“${first.new_name || first.name}”` : FM.plural(ok.length, "item")}${folder ? ` to “${folder}”` : ""}.`, S.view === "trash" ? { action: () => FM.app.goPath(folder, first.new_id), actionText: "Show" } : {});
      }
    } catch (e) { fail(e, "Nothing was restored", { action: "restore", items }); }
  }
  async function purge(items) {
    if (!items.length) return;
    const size = items.reduce((a, i) => a + (i.size || 0), 0);
    if (!(await FM.ui.confirm(`Delete ${items.length === 1 ? `“${items[0].name}”` : FM.plural(items.length, "item")} for good?`, [`${FM.size(size)} will be gone from the PC. This cannot be undone.`], "Delete for good", { danger: true }))) return;
    try {
      const r = await FM.api.post("trash/delete", { tids: items.map((i) => i.tid) });
      const { ok } = sayResults(r.results, "deleted");
      await reload();
      if (ok.length) toast(`Deleted ${FM.plural(ok.length, "item")} for good (${FM.size(r.freed)} freed).`);
    } catch (e) { fail(e, "Nothing was deleted", { action: "delete-forever", items }); }
  }
  async function emptyTrash() {
    const n = S.items.length, size = S.items.reduce((a, i) => a + (i.size || 0), 0);
    if (!n) return;
    if (!(await FM.ui.confirm("Empty the trash?", [`All ${FM.plural(n, "item")} (${FM.size(size)}) will be gone from the PC. This cannot be undone.`], "Empty the trash", { danger: true }))) return;
    try {
      const r = await FM.api.post("trash/empty", {});
      sayResults(r.results, "deleted");
      await reload();
      toast(`The trash is empty (${FM.size(r.freed)} freed).`);
    } catch (e) { fail(e, "The trash was not emptied", { action: "empty-trash" }); }
  }

  FM.ops = { fail, signIn, signOut, newFolder, rename, del, pickUp, paste, moveTo, setPrivate, download, open, restore, purge, emptyTrash, askConflicts, asking };
})();

// ---- upload.js ----
// upload.js: files into the current folder (or a folder row they were dropped on): from the Upload button, a
// folder picker, a drop (folders walked, their paths kept) or a paste. Before anything is sent the PC checks the
// names, the space and what is already there (POST /check); names Relay Files would hide are left out and
// said; an existing name is asked about once for all. Then each file goes up in one piece (up to 16 MB) or in
// 8 MB chunks that resume after a dropped connection (5 tries, waiting 1, 2, 4, 8, 16 s, said in the panel).
"use strict";
(function () {
  const S = FM.S;
  const SINGLE = 16 * 1024 * 1024, CHUNK = 8 * 1024 * 1024;

  // A drop's folders, walked (the entries must be taken before the first await).
  async function fromDrop(dt) {
    const entries = [...(dt.items || [])].filter((i) => i.kind === "file").map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
    const plain = [...(dt.files || [])];
    if (!entries.length) return { files: plain.map((f) => ({ file: f, path: f.name })), dirs: [] };
    const files = [], dirs = [];
    const readAll = (reader) => new Promise((res, rej) => { const out = []; const step = () => reader.readEntries((b) => { if (!b.length) res(out); else { out.push(...b); step(); } }, rej); step(); });
    async function walk(e, prefix) {
      if (e.isFile) files.push({ file: await new Promise((res, rej) => e.file(res, rej)), path: prefix + e.name });
      else if (e.isDirectory) {
        const kids = await readAll(e.createReader());
        if (!kids.length) dirs.push(prefix + e.name);
        for (const k of kids) await walk(k, prefix + e.name + "/");
      }
    }
    for (const e of entries) await walk(e, "");
    return { files, dirs };
  }
  const fromInput = (list) => ({ files: [...list].map((f) => ({ file: f, path: f.webkitRelativePath || f.name })), dirs: [] });

  async function start(batch, to) {
    to = to || S.folder;
    if (!S.writable) { if (!(await FM.ops.signIn("Uploading needs the PC's password."))) return; to = to.id === S.folder.id ? S.folder : to; }
    let { files, dirs } = batch;
    const hidden = files.filter((f) => f.path.split("/").some(FM.hiddenName));
    files = files.filter((f) => !hidden.includes(f));
    dirs = dirs.filter((d) => !d.split("/").some(FM.hiddenName));
    if (hidden.length) FM.ui.toast(`Left out ${FM.plural(hidden.length, "file")} that Relay Files hides (names starting with a dot or ~$, temporary files, desktop.ini, thumbs.db): ${hidden.slice(0, 3).map((f) => f.path).join(", ")}${hidden.length > 3 ? "…" : ""}`, { ms: 9000 });
    if (!files.length && !dirs.length) return;
    let check;
    try {
      const paths = files.map((f) => ({ path: f.path, size: f.file.size }));
      for (const d of dirs) paths.push({ path: d, dir: true });
      for (const top of new Set(files.filter((f) => f.path.includes("/")).map((f) => f.path.split("/")[0]))) paths.push({ path: top, dir: true });
      check = await FM.api.post("check", { to: to.id, paths });
    } catch (e) { return FM.ops.fail(e, "Nothing was uploaded", { action: "upload-check", to: { id: to.id, name: to.name }, files: files.length, first: files.slice(0, 5).map((f) => f.path) }); }
    if (check.problems.length) {
      const bad = new Set(check.problems.map((p) => p.path));
      const go = await FM.ui.dialog({ title: `${FM.plural(check.problems.length, "name")} cannot go to the PC`,
        body: [files.length > bad.size ? "These are left out; the rest can go up:" : "None of them can go up:"],
        list: check.problems.map((p) => FM.h("div", null, FM.h("b", { text: p.path }), FM.h("span.d-meta", { text: `: ${p.error}` }))),
        actions: files.length > bad.size ? [{ text: "Cancel", value: false }, { text: "Upload the rest", value: true, primary: true }] : [{ text: "OK", value: false, primary: true }] });
      if (!go) return;
      files = files.filter((f) => !bad.has(f.path));
      dirs = dirs.filter((d) => !bad.has(d));
    }
    const need = files.reduce((a, f) => a + f.file.size, 0);
    if (check.free >= 0 && need > check.free - 256e6) {
      FM.report("upload", "not enough space on the PC", { free: check.free, need, files: files.length, to: { id: to.id, name: to.name } });
      return FM.ui.toast(`The PC's disk has ${FM.size(check.free)} free; these files need ${FM.size(need)}. Nothing was uploaded.`, { bad: true });
    }
    let policy = "ask";
    const clash = new Set();
    if (check.conflicts.length) {
      policy = await FM.ops.askConflicts(check.conflicts, to.name);
      if (!policy) return;
      for (const c of check.conflicts) clash.add(c.path);
    }
    for (const d of dirs) {
      try { await FM.api.post("mkdir", { parent: to.id, path: d }); }
      catch (e) { FM.ops.fail(e, `The folder “${d}” was not made`, { action: "mkdir", path: d, to: { id: to.id, name: to.name } }); }
    }
    const ts = files.map((f) => FM.transfers.add({
      kind: "up", name: f.path, total: f.file.size, where: to.name,
      run: (t) => one(t, f.file, to, f.path, clash.has(f.path) ? policy : "ask"),
      onError: (t, e) => { if (e.signin) FM.app.signedOut(); },
    }));
    if (!ts.length) { FM.app.reload(); return; }
    const done = await Promise.all(ts.map((t) => t.done));
    const ok = done.filter((t) => t.state === "done");
    await FM.app.reload({ select: ok.map((t) => t.result && t.result.item && t.result.item.id).filter(Boolean), wait: true });
    if (ok.length) FM.ui.toast(`Uploaded ${ok.length === 1 ? `“${ok[0].name}”` : FM.plural(ok.length, "file")} to “${to.name}”.`);
  }

  // One file: in one piece, or chunk by chunk with a resume after a dropped connection.
  async function one(t, file, to, path, policy) {
    let uid = FM.uid(), offset = 0, tries = 0, restarted = false;
    const total = file.size;
    const q = (off) => "upload?" + new URLSearchParams({ uid, to: to.id, path, offset: off, total, mtime: file.lastModified || 0, conflict: policy });
    const wait = async (why) => {
      t.trail = (t.trail || []).concat({ at: FM.clock(), offset, why }).slice(-10); // goes with a failure's report (transfers.js)
      if (++tries > 5) throw new FM.ApiError(`The upload stopped: ${why} (tried 6 times).`);
      for (let s = Math.min(16, 2 ** (tries - 1)); s > 0; s--) {
        t.say(`${why}: trying again in ${s} s (try ${tries + 1} of 6)`);
        await FM.sleep(1000);
        if (t.ac.signal.aborted) throw new FM.ApiError("Stopped.", { aborted: true });
      }
      t.say("");
      try { offset = (await FM.api.uploadStatus(uid)).received; }
      catch (e) { if (e.status === 404) offset = 0; }
    };
    for (;;) {
      const end = total <= SINGLE ? total : Math.min(total, offset + CHUNK);
      let res;
      try {
        res = await FM.api.put(q(offset), file.slice(offset, end), { onProgress: (n) => t.progress(offset + n, total), signal: t.ac.signal });
      } catch (e) {
        if (e.aborted) { FM.api.uploadCancel(uid); throw e; }
        await wait("the connection broke");
        continue;
      }
      const d = res.data || {};
      if (res.ok) {
        tries = 0;
        if (d.done) return d.skipped ? { skipped: true } : { item: d.item };
        offset = d.received;
        continue;
      }
      if (res.status === 409 && d.code === "exists") {
        const pol = await FM.ops.askConflicts(d.conflicts || [], to.name);
        if (!pol) { FM.api.uploadCancel(uid); return { cancelled: true }; }
        if (d.final) {
          const r2 = await FM.api.uploadFinish(uid, pol);
          return r2.skipped ? { skipped: true } : { item: r2.item };
        }
        policy = pol; offset = 0;
        continue;
      }
      if (res.status === 409 && d.received != null) { offset = d.received; continue; } // the PC has more or less than we thought
      if (res.status === 404 && d.restart && !restarted) { restarted = true; uid = FM.uid(); offset = 0; t.say("The PC forgot this upload (its files program restarted): starting it again"); continue; }
      if ((res.status === 500 || res.status === 502 || res.status === 503) && tries < 5) { await wait(d.error ? d.error.replace(/\.$/, "") : `the PC answered ${res.status}`); continue; }
      if (res.status === 0) { await wait("no answer from the PC"); continue; }
      throw new FM.ApiError(FM.sentence(d.error || RelayClient.httpWhy(res.status)), { status: res.status, signin: res.status === 401 });
    }
  }

  // The pickers, the drop zone and paste.
  function choose(folder) {
    const inp = document.getElementById(folder ? "pick-folder" : "pick-files");
    inp.value = "";
    inp.click();
  }
  function wireDrops() {
    for (const id of ["pick-files", "pick-folder"]) {
      const inp = document.getElementById(id);
      inp.addEventListener("change", () => { if (inp.files && inp.files.length) start(fromInput(inp.files)); });
    }
    const zone = document.querySelector(".dropzone"), main = document.querySelector(".main"), text = zone.querySelector(".dropzone-text");
    let depth = 0, overRow = null;
    const isFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files") && ![...e.dataTransfer.types].includes("application/x-relay-files");
    const target = (e) => {
      const r = e.target.closest && e.target.closest(".row.dir:not(.locked)");
      return r && FM.byId(r.dataset.id) ? r : null;
    };
    const mark = (r) => { if (overRow !== r) { if (overRow) overRow.classList.remove("drop-on"); overRow = r; if (r) r.classList.add("drop-on"); } };
    main.addEventListener("dragenter", (e) => { if (!isFiles(e) || S.view !== "folder") return; e.preventDefault(); depth++; zone.hidden = false; });
    main.addEventListener("dragover", (e) => {
      if (!isFiles(e) || S.view !== "folder") return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
      const r = target(e); mark(r);
      text.textContent = `Drop to upload to “${r ? FM.byId(r.dataset.id).name : S.folder.name}”`;
    });
    main.addEventListener("dragleave", (e) => { if (!isFiles(e)) return; if (--depth <= 0) { depth = 0; zone.hidden = true; mark(null); } });
    main.addEventListener("drop", async (e) => {
      if (!isFiles(e) || S.view !== "folder") return;
      e.preventDefault();
      depth = 0; zone.hidden = true;
      const r = target(e); mark(null);
      const to = r ? FM.byId(r.dataset.id) : S.folder;
      let batch;
      try { batch = await fromDrop(e.dataTransfer); } catch (x) { FM.report("upload", x, { what: "the dropped files could not be read" }); return FM.ui.toast("The dropped files could not be read: " + (x.message || x), { bad: true }); }
      start(batch, to);
    });
    addEventListener("dragover", (e) => { if (isFiles(e)) e.preventDefault(); }); // a drop outside the list never opens the file in the tab
    addEventListener("drop", (e) => { if (isFiles(e)) e.preventDefault(); });
    addEventListener("paste", (e) => {
      if (S.view !== "folder" || FM.ui.busy || (e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) return;
      const files = e.clipboardData && [...e.clipboardData.files];
      if (files && files.length) { e.preventDefault(); start(fromInput(files)); }
    });
  }
  FM.upload = { start, choose, wireDrops, fromInput };
})();

// ---- keys.js ----
// keys.js: keyboard shortcuts (desktop). Arrows move the cursor (nothing is ticked), Shift+arrows tick the rows they
// pass, Space ticks or unticks the cursor's row, Enter opens it, Alt+← goes back, Backspace goes up, R refreshes;
// Ctrl+A / C / X / V; Delete; F2; N, U, D, /, ?. Delete, F2, D, Ctrl+C / X act on the ticked rows, or with none
// ticked on the cursor's row. Escape closes the top thing (a menu, a dialog, the search, the ticks, what was picked
// up); with nothing left, a page that opened this one in a window may close it.
"use strict";
(function () {
  const S = FM.S;
  const KEYS = [
    ["Click or tap a row, Enter", "Open: a folder goes in, a file opens in a new tab"], ["The box on a row, Ctrl+click", "Tick or untick that row"],
    ["Shift+click", "Tick the rows from the last one ticked"], ["↑ ↓, Home, End, Page Up/Down", "Move through the list (nothing is ticked)"],
    ["Space", "Tick or untick the row you are on"], ["Shift + ↑ ↓ (Home, End, Page Up/Down)", "Tick the rows you move over"],
    ["Alt+←, Back", "Back to the folder you were in before (up, if you came straight here)"], ["Backspace, Alt+↑", "Up one folder"],
    ["R, Refresh", "List this folder again from the PC"], ["Ctrl+A", "Tick everything here"], ["Ctrl+C, Ctrl+X, Ctrl+V", "Copy, move (cut), paste here"],
    ["Delete", "Move to the trash (Undo in the message)"], ["F2", "Rename"], ["N", "New folder"], ["U, Shift+U", "Upload files, upload a folder"],
    ["D", "Download"], ["/ or Ctrl+F", "Search all of Relay Files"], ["Drag rows onto a folder", "Move there (hold Ctrl to copy)"],
    ["Drop files from the computer", "Upload (onto a folder row: into it)"], ["Right-click, ⋯", "Actions for the item"], ["Escape", "Close, untick everything, put picked-up items down"], ["?", "This list"],
  ];
  function help() {
    const t = FM.h("table.keys");
    for (const [k, v] of KEYS) t.append(FM.h("tr", null, FM.h("td", null, FM.h("b", { text: k })), FM.h("td", { text: v })));
    FM.ui.dialog({ title: "Keyboard and mouse", body: [t, "Delete, F2, D and Ctrl+C / X act on the ticked rows; with none ticked, on the row you are on."], actions: [{ text: "Close", value: true, primary: true }] });
  }
  // Shift+moves tick like text is selected: the rows from where the cursor was when Shift began to where it is now
  // (going back unticks them again); rows ticked before stay ticked. A run goes on while nothing else changed the ticks.
  let run = null;
  function move(delta, extend) {
    const ids = FM.sorted().map((i) => i.id || i.tid);
    if (!ids.length) return;
    const from = ids.indexOf(S.focus);
    let i;
    if (delta === "home") i = 0; else if (delta === "end") i = ids.length - 1;
    else i = from < 0 ? (delta > 0 ? 0 : ids.length - 1) : Math.max(0, Math.min(ids.length - 1, from + delta));
    if (extend) {
      const goesOn = run && run.at === S.focus && run.sel === S.sel && run.size === S.sel.size && ids.includes(run.start);
      const start = goesOn ? run.start : ids[from < 0 ? i : from];
      const a = ids.indexOf(start), was = from < 0 ? a : from;
      const inside = (k, end) => k >= Math.min(a, end) && k <= Math.max(a, end);
      ids.forEach((id, k) => { if (inside(k, i)) S.sel.add(id); else if (inside(k, was)) S.sel.delete(id); });
      run = { start, at: ids[i], sel: S.sel, size: S.sel.size };
      S.anchor = ids[i];
    }
    S.focus = ids[i];
    FM.view.sel();
    FM.view.focusRow(ids[i]);
  }
  function onKey(e) {
    if (e.defaultPrevented) return;
    const typing = e.target && (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable);
    const k = e.key, ctrl = e.ctrlKey || e.metaKey;
    if (k === "Escape") {
      if (FM.ui.closeTop()) { e.preventDefault(); return; }
      if (typing && e.target.id === "q") { e.preventDefault(); FM.app.closeSearch(); return; }
      if (S.picking) { e.preventDefault(); FM.pick.stop(); return; }
      if (S.sel.size) { e.preventDefault(); S.sel.clear(); FM.view.render(); return; }
      if (S.clip) { e.preventDefault(); S.clip = null; FM.view.render(); return; }
      if (S.view === "search") { e.preventDefault(); FM.app.closeSearch(); return; }
      if (S.view === "trash") { e.preventDefault(); FM.app.go(S.folder ? S.folder.id : "root"); return; }
      return; // nothing here used it: a window kit host may close the window
    }
    if (FM.ui.busy) return;
    if ((k === "Enter" || k === " ") && e.target && e.target.closest && e.target.closest("button, a, [role=button]") && !e.target.closest(".list")) return; // a focused button presses itself
    if (typing) {
      if (k === "ArrowDown" && e.target.id === "q") { e.preventDefault(); document.querySelector(".list").focus(); move(1); }
      return;
    }
    const here = FM.byId(S.focus), ticked = FM.selected();
    const sel = ticked.length ? ticked : here ? [here] : [], one = sel.length === 1 ? sel[0] : null; // the ticked rows, or the cursor's
    const pageRows = Math.max(1, Math.floor(document.querySelector(".list").clientHeight / 42) - 1);
    let used = true;
    if (k === "ArrowDown") move(1, e.shiftKey);
    else if (k === "ArrowUp" && e.altKey) FM.app.up();
    else if (k === "ArrowLeft" && e.altKey && !ctrl && FM.app.backTarget()) FM.app.back(); // with nowhere to go, the browser's own Back
    else if (k === "ArrowUp") move(-1, e.shiftKey);
    else if (k === "PageDown") move(pageRows, e.shiftKey);
    else if (k === "PageUp") move(-pageRows, e.shiftKey);
    else if (k === "Home") move("home", e.shiftKey);
    else if (k === "End") move("end", e.shiftKey);
    else if (k === " ") { if (here) { S.sel.has(S.focus) ? S.sel.delete(S.focus) : S.sel.add(S.focus); S.anchor = S.focus; FM.view.sel(); } }
    else if (k === "Enter") { const it = here || (ticked.length === 1 ? ticked[0] : null); if (it && !e.repeat) FM.app.activate(it); } // a held key opens once
    else if (k === "Backspace") FM.app.up();
    else if (ctrl && (k === "a" || k === "A")) { S.sel = new Set(S.items.map((i) => i.id || i.tid)); FM.view.sel(); }
    else if (ctrl && (k === "c" || k === "C") && S.view !== "trash") FM.ops.pickUp(sel, "copy");
    else if (ctrl && (k === "x" || k === "X") && S.view !== "trash" && S.writable) FM.ops.pickUp(sel, "cut");
    else if (ctrl && (k === "v" || k === "V") && S.clip) FM.ops.paste();
    else if (ctrl && (k === "v" || k === "V")) used = false; // files on the clipboard: the paste event uploads them
    else if (ctrl && (k === "f" || k === "F")) FM.app.openSearch();
    else if (ctrl || e.altKey) used = false;
    else if (k === "Delete" && S.view === "trash") FM.ops.purge(sel);
    else if (k === "Delete" && S.writable) FM.ops.del(sel);
    else if (k === "F2" && one && S.view !== "trash") FM.ops.rename(one);
    else if ((k === "n" || k === "N") && !e.shiftKey) FM.ops.newFolder();
    else if (k === "u" && S.writable && S.view === "folder") FM.upload.choose(false);
    else if (k === "U" && S.writable && S.view === "folder") FM.upload.choose(true);
    else if ((k === "d" || k === "D") && S.view !== "trash") FM.ops.download(sel);
    else if (k === "r" || k === "R") FM.app.refreshList();
    else if (k === "/") FM.app.openSearch();
    else if (k === "?") help();
    else used = false;
    if (used) e.preventDefault();
  }
  FM.keys = { onKey, help };
})();

// ---- pick.js ----
// pick.js: when a page that opened this one in a window (window-kit.js) asks for files. A bar says who asks and
// for what; files that do not fit are dimmed; a click on a file that fits, or Choose for the ticked rows, fetches
// the choice from the PC with progress and hands it over as real File objects on the request's own MessagePort:
// one or more files, a folder as its files (fetched as ONE zip and unpacked here, so each file keeps its path), or
// a folder as one zip made by the PC. Requests are taken only from the parent frame and from allowed origins
// (window-kit.js checks).
"use strict";
(function () {
  const S = FM.S;
  let port = null, ac = null, lastSent = 0;

  FM.pickWhat = (p) => {
    const a = (p.accept || []).filter((x) => x !== "*");
    const f = !p.files ? "" : a.length ? `a${/^\.[aeiou]/i.test(a[0]) ? "n" : ""} ${a.join(" or ")} file${p.multiple ? " (or several)" : ""}` : p.multiple ? "files" : "a file";
    return p.folder ? (f ? `${f} or a folder` : "a folder") : f;
  };
  FM.pickHint = () => {
    const p = S.pick, tap = FM.isPhone() ? "Tap" : "Click";
    if (S.view !== "folder") return "Go back to the folders to choose.";
    if (p.folder && p.files) return `${tap} a file to choose it. For a folder: tick its box and Choose, or open it and Choose with nothing ticked.`;
    if (p.folder) return "Tick a folder's box and Choose, or open the folder and Choose with nothing ticked.";
    return p.multiple ? `${tap} a file to choose it, or tick several and Choose.` : `${tap} it to choose it.`;
  };
  // What Choose would hand over right now: the ticked rows, or `list` (a row's menu, a click on a file).
  FM.pickChoice = (list) => {
    const p = S.pick, sel = list || FM.selected();
    const no = (why) => ({ ok: false, label: "Choose", why });
    if (!p || S.view === "trash") return no("Go back to the folders to choose.");
    if (sel.some((i) => i.locked)) return no("That is private: sign in first.");
    if (p.folder && sel.length === 1 && sel[0].dir) return { ok: true, label: `Choose “${sel[0].name}”`, folder: sel[0] };
    if (p.folder && !sel.length && S.view === "folder" && S.folder) return { ok: true, label: `Choose this folder (“${S.folder.name}”)`, folder: S.folder };
    if (!p.files) return no("Choose a folder.");
    const files = sel.filter((i) => !i.dir);
    if (!files.length || files.length !== sel.length) return no(p.folder ? "Tick a file or one folder." : "Tick a file, or click it.");
    if (!files.every(FM.fits)) return no(`Only ${FM.pickWhat(p)} can be chosen.`);
    if (!p.multiple && files.length > 1) return no("Choose one file.");
    return { ok: true, label: files.length > 1 ? `Choose ${files.length} files` : `Choose “${files[0].name}”`, items: files };
  };

  function onRequest(m, p, from) {

// ---- app.js ----
// app.js: start-up, going from folder to folder (Back, Refresh), the live updates, and the pointer: a click or tap
// opens, the row's box ticks (Shift and Ctrl too), right-click or ⋯ for the actions, and dragging rows onto a folder.
// Opened on its own, the browser's Back and Forward go through the folders (the address keeps the folder:
// #f=<id>), the same steps as the page's Back; inside another page's window it keeps its trail to itself.
"use strict";
(function () {
  const S = FM.S;

    return Array.from(new Uint8Array(d).slice(0, 10), (b) => b.toString(16).padStart(2, "0")).join("");
  };

  function setConn(state, why) { S.conn = { state, why }; FM.view.renderStatus(); }

    // and lost() below says so); a listing asked for just before a sign-in is only late, and nothing is forgotten.
    if (FM.api.hasPass() && !r.private) FM.api.ping(8000).catch(() => {});
    S.signed = !!r.private;
    S.writable = !!r.writable;
    if (S.signed && r.writable === undefined) S.notice = { text: "The PC runs the old, read-only files program: changes need PC Relay 1.1.4 or later (restart PC Relay on the PC).", bad: true, old: true };
    else if (S.notice && S.notice.old) S.notice = null;
  }

  async function load(id, o = {}) {

      S.view = "folder"; S.folder = r.folder; S.crumbs = r.crumbs; S.items = r.items; S.error = null; S.loading = false;
      S.cache.set(r.folder.id, r);

      // only a person ticks rows)
      const shown = (o.select || []).filter((x) => x && ids.has(x));

  async function refreshList() {

    S.refreshing = true;

  }

      S.trashBytes = i.trash ? i.trash.bytes : 0;
      if (i.privacy_error) S.notice = { text: `On the PC: ${i.privacy_error}. Until it is fixed every folder is private and nothing can be changed.`, bad: true };
      else if (S.notice && !S.notice.old) S.notice = null;

  }
  async function refresh() {

  function spaceMenu(at) {

  }
