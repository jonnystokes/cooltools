  const S = FM.S;
  // Downloads up to this size come through the page (progress, Cancel, plain errors); bigger ones go to the
  // browser's own download manager, straight to disk (a page would have to hold them in memory).
  FM.limits = FM.limits || { inPage: 300e6 };
  const toast = (t, o) => FM.ui.toast(t, o);
  const reload = (o) => FM.app.reload(o);

  // A failure: said in a toast that stays, and sent to the PC's log (report.js) with what was being done.
  function fail(e, what, ctx) {
    if (e && e.aborted) return;
    FM.report((ctx && ctx.action) || "action", e, Object.assign({ what }, ctx || {}, { action: undefined }));
    if (e && e.signin) {
      FM.app.signedOut(e.signin);
      toast(`${what}: the PC wants the password.`, { bad: true, action: () => signIn(), actionText: "Sign in" });
      return;
    }
    toast(`${what}: ${(e && e.message) || e}`, { bad: true });
  }

  // ---- questions ------------------------------------------------------------------------------------------
  async function askConflicts(conflicts, where, verb) {
    const n = conflicts.length;
    const rows = conflicts.map((c) => FM.h("div", null, FM.h("b", { text: c.name || c.path }), FM.h("span.d-meta", { text: c.existing ? `  (there now: ${c.existing.dir ? "a folder" : FM.size(c.existing.size) + ", " + FM.when(c.existing.mtime)})` : "" })));
    const r = await FM.ui.dialog({
      title: n === 1 ? `“${conflicts[0].name || conflicts[0].path}” is already there` : `${n} of them are already there`,
      body: [`${where ? `In “${where}”` : "There"}, ${n === 1 ? "something has" : `${n} items have`} the same name. Nothing is replaced unless you say so: a replaced item goes to the trash, so you can still get it back.`],
      list: n > 1 ? rows : null,
      actions: [{ text: "Cancel", value: false }, { text: "Skip " + (n === 1 ? "it" : "those"), value: "skip" }, { text: "Keep both", value: "keep" }, { text: "Replace", value: "replace", primary: true }],
    });
    return r ? r.value : null;
  }
  const askPublic = (names, where) => FM.ui.confirm(`Make ${names.length === 1 ? "it" : "them"} public?`,
    [`“${where}” is a public folder: anyone with the PC's address can see what is in it, without the password. ${names.length === 1 ? "This private item" : "These private items"} would be seen there:`],
    "Go ahead, make public", { list: names, danger: true });

  // send(body) until the PC says yes or the user says stop; asks about conflicts and privacy on the way.
  async function asking(send, body, where) {
    for (let round = 0; round < 4; round++) {
      try { return await send(body); }
      catch (e) {
        if (e.status === 409 && e.code === "exists" && e.data && e.data.conflicts) {
          const pol = await askConflicts(e.data.conflicts, where);
          if (!pol) return null;
          body.conflict = pol; continue;
        }
        if (e.status === 409 && e.code === "public") {
          if (!(await askPublic(e.data.public || [], where))) return null;
          body.public_ok = true; continue;
        }
        throw e;
      }
    }
    throw new FM.ApiError("The PC kept refusing; nothing more was changed.");
  }
  function sayResults(results, verbDone, where) {
    const ok = results.filter((r) => r.ok && !r.skipped), skipped = results.filter((r) => r.skipped), bad = results.filter((r) => !r.ok);
    for (const r of bad) toast(`“${r.name || "An item"}” was not ${verbDone}: ${r.error}`, { bad: true });
    if (bad.length) FM.report(verbDone, `${bad.length} of ${results.length} not ${verbDone}`, { what: `the PC refused ${bad.length === 1 ? "one item" : bad.length + " items"}`, where, results: bad.slice(0, 50) });
    return { ok, skipped, bad };
  }

  // ---- sign in / out ----------------------------------------------------------------------------------------
  async function signIn(reason) {
    let dlg = null;
    const r = await FM.ui.dialog({
      title: "Sign in to Relay Files",
      body: [reason || "The PC's password (the same one as Screen Peek's) opens the private folders and lets you add, move, rename and delete. This device remembers the sign-in."],
      input: { type: "password", autocomplete: "current-password", label: "The PC's password", placeholder: "Password" },
      ref: (d) => { dlg = d; },
      validate: async (pw) => {
        if (!pw) return "Type the password.";
        dlg.msg("Checking…", true);
        const res = await FM.api.signIn(pw);
        if (!res.ok) FM.report("sign-in", res.why, { what: "the sign-in was refused" }); // the reason only, never what was typed
        return res.ok ? "" : res.why;
      },
      actions: [{ text: "Cancel", value: false }, { text: "Sign in", value: true, primary: true }],
    });
    if (!r) return false;
    await FM.app.refresh();
    toast("Signed in: private folders and changes are open on this device.");
    return true;
  }
  async function signOut() {
    await FM.api.signOut();
    S.clip = null;
    await FM.app.refresh();
    toast("Signed out on this device.");
  }

  // ---- folders and names --------------------------------------------------------------------------------------
  async function newFolder() {
    if (!S.writable || S.view !== "folder") return;
    const names = new Set(S.items.map((i) => i.name.toLowerCase()));
    let name = "New folder";
    for (let n = 2; names.has(name.toLowerCase()); n++) name = `New folder (${n})`;
    const v = await FM.ui.prompt("New folder", { value: name, okText: "Make folder", label: "Folder name", body: [`In “${S.folder.name}”.`], validate: (t) => FM.badName(t.trim()) || (names.has(t.trim().toLowerCase()) ? `“${t.trim()}” is already in this folder.` : "") });
    if (v == null) return;
    try {
      const r = await FM.api.post("mkdir", { parent: S.folder.id, name: v.trim() });
      await reload({ select: [r.item && r.item.id] });
      toast(`Made the folder “${v.trim()}”.`);
    } catch (e) { fail(e, "The folder could not be made", { action: "mkdir", name: v.trim(), parent: S.folder && S.folder.name }); }
  }
  async function rename(it) {
    if (!it || it.locked || it.protected || !S.writable) return;
    const dot = !it.dir ? it.name.lastIndexOf(".") : -1;
    const v = await FM.ui.prompt(`Rename ${it.dir ? "folder" : "file"}`, { value: it.name, select: [0, dot > 0 ? dot : it.name.length], okText: "Rename", label: "New name", validate: (t) => FM.badName(t.trim()) });
    if (v == null || v.trim() === it.name) return;
    const body = { id: it.id, name: v.trim() };
    try {
      const r = await asking((b) => FM.api.post("rename", b), body, S.folder && S.folder.name);
      if (!r) return;
      await reload({ select: [r.item && r.item.id] });
      const back = { id: r.item && r.item.id, name: it.name };
      toast(`Renamed to “${r.item ? r.item.name : v.trim()}”.`, { action: async () => { try { await FM.api.post("rename", back); await reload({ select: [it.id] }); } catch (e) { fail(e, "It could not be renamed back", { action: "rename", items: [back], name: it.name }); } } });
    } catch (e) { fail(e, `“${it.name}” could not be renamed`, { action: "rename", items: [it], name: v.trim() }); }
  }

  // ---- delete (to the trash) ---------------------------------------------------------------------------------
  async function del(items) {
    items = items.filter((i) => !i.locked && !i.protected);
    if (!items.length || !S.writable) return;
    try {
      const r = await FM.api.post("delete", { ids: items.map((i) => i.id) });
      const { ok } = sayResults(r.results, "moved to the trash");
      await reload();
      if (ok.length) {
        const tids = r.trash;
        toast(`${ok.length === 1 ? `“${ok[0].name}”` : FM.plural(ok.length, "item")} moved to the trash.`, { action: () => restore(tids.map((tid) => ({ tid }))), actionText: "Undo" });
      }
    } catch (e) { fail(e, "Nothing was deleted", { action: "delete", items }); }
  }

  // ---- move and copy -----------------------------------------------------------------------------------------
  function pickUp(items, mode) {
    items = items.filter((i) => !i.locked && (mode === "copy" || !i.protected));
    if (!items.length) return;
    S.clip = { mode, items: items.map((i) => ({ id: i.id, name: i.name, dir: i.dir, size: i.size, private: i.private, parent: i.parent })), from: S.folder ? S.folder.id : "root" };
    S.sel.clear();
    FM.view.render();
    toast(`${FM.plural(items.length, "item")} picked up to ${mode === "cut" ? "move" : "copy"}: open the folder you want, then Paste here.`);
  }
  async function paste() {
    if (!S.clip || S.view !== "folder" || !S.writable) return;
    const clip = S.clip;
    const done = await moveTo(clip.items, S.folder, clip.mode === "copy");
    if (done && clip.mode === "cut") S.clip = null;
    FM.view.render();
  }
  // items -> the folder `to` ({id, name}); returns true when something was done.
  async function moveTo(items, to, copy) {
    if (!items.length) return false;
    const where = to.name;
    if (!copy && items.every((i) => FM.parentOf(i) === to.id)) { toast(`They are already in “${where}”.`); return false; }
    const body = { ids: items.map((i) => i.id), to: to.id };
    if (copy && items.some((i) => FM.parentOf(i) === to.id)) body.conflict = "keep"; // a copy into its own folder: "name (2)"
    if (!copy) {
      try {
        const r = await asking((b) => FM.api.post("move", b), body, where);
        if (!r) return false;
        const { ok } = sayResults(r.results, "moved");
        await reload({ select: ok.map((x) => x.new_id) });
        if (ok.length) {
          const from = FM.S.clip ? FM.S.clip.from : null;
          toast(`Moved ${ok.length === 1 ? `“${ok[0].new_name || ok[0].name}”` : FM.plural(ok.length, "item")} to “${where}”.`, from ? { action: async () => {
            try { const b = await asking((x) => FM.api.post("move", x), { ids: ok.map((x) => x.new_id), to: from }, "where they were"); if (b) await reload(); } catch (e) { fail(e, "They could not be moved back", { action: "move", items: ok.map((x) => ({ id: x.new_id, name: x.new_name || x.name })), to: from }); }
          } } : {});
        }
        return true;
      } catch (e) { fail(e, "Nothing was moved", { action: "move", items, to: { id: to.id, name: to.name } }); return false; }
    }
    // A copy runs on the PC with progress, shown with the transfers. The PC answers its questions (409: a name
    // in the way, something private going public) before it starts copying, so they are asked here first.
    const total = items.reduce((a, i) => a + (i.size || 0), 0);
    const t = FM.transfers.add({
      kind: "copy", name: items.length === 1 ? items[0].name : `${items.length} items`, total, where,
      run: async (tr) => {
        const res = await asking((b) => FM.api.copy(b, (p) => { tr.progress(p.bytes, p.total); if (p.total_files > 1) tr.say(`${FM.size(p.bytes)} of ${FM.size(p.total)} · ${p.files} of ${p.total_files} files`); }, tr.ac.signal), body, where);
        if (!res) return { cancelled: true };
        const { ok } = sayResults(res.results, "copied");
        await reload({ select: ok.map((x) => x.new_id) });
        if (ok.length) toast(`Copied ${ok.length === 1 ? `“${ok[0].new_name || ok[0].name}”` : FM.plural(ok.length, "item")} to “${where}”.`, { action: () => del(ok.map((x) => ({ id: x.new_id, name: x.new_name || x.name }))), actionText: "Undo" });
        return {};
      },
      onError: (tr, e) => { if (e.signin) FM.app.signedOut(e.signin); },
    });
    await t.done;
    return t.state === "done";
  }

  // ---- private / public --------------------------------------------------------------------------------------
  async function setPrivate(it, on) {
    if (!it || !it.dir || !S.writable) return;
    if (!on) {
      if (it.protected) return toast(`“${it.name}” is always private (the private books live there).`, { bad: true, ms: 6000 });
      if (!it.own_private) return toast(`“${it.name}” is private because it is inside “${it.priv_from}”: make that folder public instead.`, { bad: true, ms: 7000 });
      const ok = await FM.ui.confirm(`Make “${it.name}” public?`, [`Anyone who has the PC's address can then see and download its ${FM.plural(it.files || 0, "file")} (${FM.size(it.size)}), without the password.`, "Folders inside it that are private by their own setting stay private."], "Make public", { danger: true });
      if (!ok) return;
    }
    try {
      const r = await FM.api.post("private", { id: it.id, private: on });
      await reload({ select: [r.item && r.item.id] });
      toast(on ? `“${it.name}” is private: it needs the PC's password from now on.` : `“${it.name}” is public now.`);
    } catch (e) { fail(e, on ? "It is not private" : "It is still private", { action: "private", items: [it], private: on }); }
  }

  // ---- download and open ---------------------------------------------------------------------------------------
  function download(items) {
    items = items.filter((i) => !i.locked);
    if (!items.length) return;
    const one = items.length === 1 ? items[0] : null;
    const zip = !one || one.dir;
    const total = items.reduce((a, i) => a + (i.size || 0), 0);
    const name = one ? (one.dir ? one.name + ".zip" : one.name) : `${items.length} items from ${(S.folder && S.folder.name) || "Relay Files"}.zip`;
    FM.transfers.add({
      kind: "down", name, total,
      run: async (t) => {
        if (total > FM.limits.inPage) { // straight to disk through the browser
          const url = await FM.api.link(items, { zip, name });
          // asked first, so a refusal is said here instead of the page going to an error
          const head = await fetch(url, { method: "HEAD", cache: "no-store", signal: t.ac.signal }).catch((e) => { throw new FM.ApiError(t.ac.signal.aborted ? "Stopped." : "Could not reach the PC (no network, or the PC is off or asleep).", { aborted: t.ac.signal.aborted, net: true }); });
          if (!head.ok) throw new FM.ApiError(head.status === 404 ? "It is no longer on the PC, or the download link expired: try again." : head.status === 401 || head.status === 403 ? "The PC wants the password for it: sign in, then try again." : FM.sentence(RelayClient.httpWhy(head.status)), { status: head.status });
          FM.navigateDownload(url);
          t.say(`Large (${FM.size(total)}): it goes straight to your browser's downloads, which show its progress.`);
          if (zip) leftOut(name, FM.zipInfo(head.headers), null);
          return { handed: true };
        }
        let hdr = null;
        const b = await FM.api.blob(zip ? FM.api.zipPath(items, name) : FM.api.filePath(one) + "?dl=1", { onProgress: t.progress, signal: t.ac.signal, expect: total, type: zip ? "application/zip" : "", onHeaders: (h) => { hdr = h; } });
        FM.saveBlob(b, name);
        if (zip) leftOut(name, FM.zipInfo(hdr), await FM.unzip.count(b).catch(() => null));
        return {};
      },
      onError: (t, e) => { if (e.signin) FM.app.signedOut(e.signin); },
    });
  }
  // A zip the PC made without some files (open in another program, moved or changed while it was packed): said in
  // a toast that stays (the PC's headers name them; its log, files.log, says why). files = the files really in the
  // zip (null = not counted): fewer than the PC said means some failed while it was being sent.
  function leftOut(name, info, files) {
    const late = files != null && info.files != null ? Math.max(0, info.files - files) : 0;
    const n = info.skipped + late;
    if (!n) return;
    const shown = info.names.slice(0, 3), more = n - shown.length;
    const names = shown.map((p) => `“${p.split("/").pop()}”`).join(", ");
    toast(`“${name}” ${files == null ? "will be saved" : "was saved"} without ${FM.plural(n, "file")} the PC could not read (open in another program, moved or changed)${names ? ": " + names + (more > 0 ? ` and ${more} more` : "") : ""}. The PC's log (files.log) says why.`, { bad: true });
  }

  // Open = the file's own link in a new tab: the browser shows what it can (text, Markdown, code, pages, pictures,
  // PDF, sound, video; the PC sends each with a type a tab shows) and downloads the rest, closing the tab.
  // A public file's link is known at once; a private one gets a 10-minute ticket link first (a link cannot carry
  // the pass). Never a blank tab filled in later: a download then left it stuck on "Opening…" (2026-11-07).
  function tab(url, name) {
    const w = window.open(url, "_blank");
    if (w) { try { w.opener = null; } catch (e) {} return; }
    FM.report("open", "the browser blocked the new tab", { name });
    toast(`The browser blocked the new tab for “${name}”.`, { bad: true, action: () => tab(url, name), actionText: "Open it" });
  }
  async function open(it) {
    if (!it || it.locked) return;
    if (it.dir) return FM.app.go(it.id);
    if (!it.private) return tab(FM.api.client.url("files", FM.api.filePath(it)), it.name);
    try { tab(await FM.api.link([it], { inline: true }), it.name); }
    catch (e) { fail(e, `“${it.name}” could not be opened`, { action: "open", items: [it] }); }
  }

  // ---- the trash -------------------------------------------------------------------------------------------------
  async function restore(items) {
    if (!items.length) return;
    const body = { tids: items.map((i) => i.tid) };
    try {
      const r = await asking((b) => FM.api.post("trash/restore", b), body, "its old folder");
      if (!r) return;
      const { ok } = sayResults(r.results, "restored");
      await reload({ select: ok.map((x) => x.new_id) });
      if (ok.length) {
        const first = ok[0];
        const folder = first.path && first.path.includes("/") ? first.path.slice(0, first.path.lastIndexOf("/")) : "";
        toast(`Restored ${ok.length === 1 ? `“${first.new_name || first.name}”` : FM.plural(ok.length, "item")}${folder ? ` to “${folder}”` : ""}.`, S.view === "trash" ? { action: () => FM.app.goPath(folder, first.new_id), actionText: "Show" } : {});
      }
    } catch (e) { fail(e, "Nothing was restored", { action: "restore", items }); }
  }
  async function purge(items) {
    if (!items.length) return;
    const size = items.reduce((a, i) => a + (i.size || 0), 0);
    if (!(await FM.ui.confirm(`Delete ${items.length === 1 ? `“${items[0].name}”` : FM.plural(items.length, "item")} for good?`, [`${FM.size(size)} will be gone from the PC. This cannot be undone.`], "Delete for good", { danger: true }))) return;
    try {
      const r = await FM.api.post("trash/delete", { tids: items.map((i) => i.tid) });
      const { ok } = sayResults(r.results, "deleted");
      await reload();
      if (ok.length) toast(`Deleted ${FM.plural(ok.length, "item")} for good (${FM.size(r.freed)} freed).`);
    } catch (e) { fail(e, "Nothing was deleted", { action: "delete-forever", items }); }
  }
  async function emptyTrash() {
    const n = S.items.length, size = S.items.reduce((a, i) => a + (i.size || 0), 0);
    if (!n) return;
    if (!(await FM.ui.confirm("Empty the trash?", [`All ${FM.plural(n, "item")} (${FM.size(size)}) will be gone from the PC. This cannot be undone.`], "Empty the trash", { danger: true }))) return;
    try {
      const r = await FM.api.post("trash/empty", {});
      sayResults(r.results, "deleted");
      await reload();
      toast(`The trash is empty (${FM.size(r.freed)} freed).`);
    } catch (e) { fail(e, "The trash was not emptied", { action: "empty-trash" }); }
  }

  FM.ops = { fail, signIn, signOut, newFolder, rename, del, pickUp, paste, moveTo, setPrivate, download, open, restore, purge, emptyTrash, askConflicts, asking };
})();

// ---- upload.js ----
// upload.js: files into the current folder (or a folder row they were dropped on): from the Upload button, a
// folder picker, a drop (folders walked, their paths kept) or a paste. Before anything is sent the PC checks the
// names, the space and what is already there (POST /check); names Relay Files would hide are left out and
// said; an existing name is asked about once for all. Then each file goes up in one piece (up to 16 MB) or in
// 8 MB chunks that resume after a dropped connection (5 tries, waiting 1, 2, 4, 8, 16 s, said in the panel).
"use strict";
(function () {
  const S = FM.S;
  const SINGLE = 16 * 1024 * 1024, CHUNK = 8 * 1024 * 1024;

  // A drop's folders, walked (the entries must be taken before the first await).
  async function fromDrop(dt) {
    const entries = [...(dt.items || [])].filter((i) => i.kind === "file").map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
    const plain = [...(dt.files || [])];
    if (!entries.length) return { files: plain.map((f) => ({ file: f, path: f.name })), dirs: [] };
    const files = [], dirs = [];
    const readAll = (reader) => new Promise((res, rej) => { const out = []; const step = () => reader.readEntries((b) => { if (!b.length) res(out); else { out.push(...b); step(); } }, rej); step(); });
    async function walk(e, prefix) {
      if (e.isFile) files.push({ file: await new Promise((res, rej) => e.file(res, rej)), path: prefix + e.name });
      else if (e.isDirectory) {
        const kids = await readAll(e.createReader());
        if (!kids.length) dirs.push(prefix + e.name);
        for (const k of kids) await walk(k, prefix + e.name + "/");
      }
    }
    for (const e of entries) await walk(e, "");
    return { files, dirs };
  }
  const fromInput = (list) => ({ files: [...list].map((f) => ({ file: f, path: f.webkitRelativePath || f.name })), dirs: [] });

  async function start(batch, to) {
    to = to || S.folder;
    if (!S.writable) { if (!(await FM.ops.signIn("Uploading needs the PC's password."))) return; to = to.id === S.folder.id ? S.folder : to; }
    let { files, dirs } = batch;
    const hidden = files.filter((f) => f.path.split("/").some(FM.hiddenName));
    files = files.filter((f) => !hidden.includes(f));
    dirs = dirs.filter((d) => !d.split("/").some(FM.hiddenName));
    if (hidden.length) FM.ui.toast(`Left out ${FM.plural(hidden.length, "file")} that Relay Files hides (names starting with a dot or ~$, temporary files, desktop.ini, thumbs.db): ${hidden.slice(0, 3).map((f) => f.path).join(", ")}${hidden.length > 3 ? "…" : ""}`, { ms: 9000 });
    if (!files.length && !dirs.length) return;
    let check;
    try {
      const paths = files.map((f) => ({ path: f.path, size: f.file.size }));
      for (const d of dirs) paths.push({ path: d, dir: true });
      for (const top of new Set(files.filter((f) => f.path.includes("/")).map((f) => f.path.split("/")[0]))) paths.push({ path: top, dir: true });
      check = await FM.api.post("check", { to: to.id, paths });
    } catch (e) { return FM.ops.fail(e, "Nothing was uploaded", { action: "upload-check", to: { id: to.id, name: to.name }, files: files.length, first: files.slice(0, 5).map((f) => f.path) }); }
    if (check.problems.length) {
      const bad = new Set(check.problems.map((p) => p.path));
      const go = await FM.ui.dialog({ title: `${FM.plural(check.problems.length, "name")} cannot go to the PC`,
        body: [files.length > bad.size ? "These are left out; the rest can go up:" : "None of them can go up:"],
        list: check.problems.map((p) => FM.h("div", null, FM.h("b", { text: p.path }), FM.h("span.d-meta", { text: `: ${p.error}` }))),
        actions: files.length > bad.size ? [{ text: "Cancel", value: false }, { text: "Upload the rest", value: true, primary: true }] : [{ text: "OK", value: false, primary: true }] });
      if (!go) return;
      files = files.filter((f) => !bad.has(f.path));
      dirs = dirs.filter((d) => !bad.has(d));
    }
    const need = files.reduce((a, f) => a + f.file.size, 0);
    if (check.free >= 0 && need > check.free - 256e6) {
      FM.report("upload", "not enough space on the PC", { free: check.free, need, files: files.length, to: { id: to.id, name: to.name } });
      return FM.ui.toast(`The PC's disk has ${FM.size(check.free)} free; these files need ${FM.size(need)}. Nothing was uploaded.`, { bad: true });
    }
    let policy = "ask";
    const clash = new Set();
    if (check.conflicts.length) {
      policy = await FM.ops.askConflicts(check.conflicts, to.name);
      if (!policy) return;
      for (const c of check.conflicts) clash.add(c.path);
    }
    for (const d of dirs) {
      try { await FM.api.post("mkdir", { parent: to.id, path: d }); }
      catch (e) { FM.ops.fail(e, `The folder “${d}” was not made`, { action: "mkdir", path: d, to: { id: to.id, name: to.name } }); }
    }
    const ts = files.map((f) => FM.transfers.add({
      kind: "up", name: f.path, total: f.file.size, where: to.name,
      run: (t) => one(t, f.file, to, f.path, clash.has(f.path) ? policy : "ask"),
      onError: (t, e) => { if (e.signin) FM.app.signedOut(e.signin); },
    }));
    if (!ts.length) { FM.app.reload(); return; }
    const done = await Promise.all(ts.map((t) => t.done));
    const ok = done.filter((t) => t.state === "done");
    await FM.app.reload({ select: ok.map((t) => t.result && t.result.item && t.result.item.id).filter(Boolean), wait: true });
    if (ok.length) FM.ui.toast(`Uploaded ${ok.length === 1 ? `“${ok[0].name}”` : FM.plural(ok.length, "file")} to “${to.name}”.`);
  }

  // One file: in one piece, or chunk by chunk with a resume after a dropped connection.
  async function one(t, file, to, path, policy) {
    let uid = FM.uid(), offset = 0, tries = 0, restarted = false;
    const total = file.size;
    const q = (off) => "upload?" + new URLSearchParams({ uid, to: to.id, path, offset: off, total, mtime: file.lastModified || 0, conflict: policy });
    const wait = async (why) => {
      t.trail = (t.trail || []).concat({ at: FM.clock(), offset, why }).slice(-10); // goes with a failure's report (transfers.js)
      if (++tries > 5) throw new FM.ApiError(`The upload stopped: ${why} (tried 6 times).`);
      for (let s = Math.min(16, 2 ** (tries - 1)); s > 0; s--) {
        t.say(`${why}: trying again in ${s} s (try ${tries + 1} of 6)`);
        await FM.sleep(1000);
        if (t.ac.signal.aborted) throw new FM.ApiError("Stopped.", { aborted: true });
      }
      t.say("");
      try { offset = (await FM.api.uploadStatus(uid)).received; }
      catch (e) { if (e.status === 404) offset = 0; }
    };
    for (;;) {
      const end = total <= SINGLE ? total : Math.min(total, offset + CHUNK);
      let res;
      try {
        res = await FM.api.put(q(offset), file.slice(offset, end), { onProgress: (n) => t.progress(offset + n, total), signal: t.ac.signal });
      } catch (e) {
        if (e.aborted) { FM.api.uploadCancel(uid); throw e; }
        await wait("the connection broke");
        continue;
      }
      const d = res.data || {};
      if (res.ok) {
        tries = 0;
        if (d.done) return d.skipped ? { skipped: true } : { item: d.item };
        offset = d.received;
        continue;
      }
      if (res.status === 409 && d.code === "exists") {
        const pol = await FM.ops.askConflicts(d.conflicts || [], to.name);
        if (!pol) { FM.api.uploadCancel(uid); return { cancelled: true }; }
        if (d.final) {
          const r2 = await FM.api.uploadFinish(uid, pol);
          return r2.skipped ? { skipped: true } : { item: r2.item };
        }
        policy = pol; offset = 0;
        continue;
      }
      if (res.status === 409 && d.received != null) { offset = d.received; continue; } // the PC has more or less than we thought
      if (res.status === 404 && d.restart && !restarted) { restarted = true; uid = FM.uid(); offset = 0; t.say("The PC forgot this upload (its files program restarted): starting it again"); continue; }
      if ((res.status === 500 || res.status === 502 || res.status === 503) && tries < 5) { await wait(d.error ? d.error.replace(/\.$/, "") : `the PC answered ${res.status}`); continue; }
      if (res.status === 0) { await wait("no answer from the PC"); continue; }
      throw new FM.ApiError(FM.sentence(d.error || RelayClient.httpWhy(res.status)), { status: res.status, signin: res.status === 401 ? FM.api.PRIV : "" });
    }
  }

  // The pickers, the drop zone and paste.
  function choose(folder) {
    const inp = document.getElementById(folder ? "pick-folder" : "pick-files");
    inp.value = "";
    inp.click();
  }
  function wireDrops() {
    for (const id of ["pick-files", "pick-folder"]) {
      const inp = document.getElementById(id);
      inp.addEventListener("change", () => { if (inp.files && inp.files.length) start(fromInput(inp.files)); });
    }
    const zone = document.querySelector(".dropzone"), main = document.querySelector(".main"), text = zone.querySelector(".dropzone-text");
    let depth = 0, overRow = null;
    const isFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files") && ![...e.dataTransfer.types].includes("application/x-relay-files");
    const target = (e) => {
      const r = e.target.closest && e.target.closest(".row.dir:not(.locked)");
      return r && FM.byId(r.dataset.id) ? r : null;
    };
    const mark = (r) => { if (overRow !== r) { if (overRow) overRow.classList.remove("drop-on"); overRow = r; if (r) r.classList.add("drop-on"); } };
    main.addEventListener("dragenter", (e) => { if (!isFiles(e) || S.view !== "folder") return; e.preventDefault(); depth++; zone.hidden = false; });
    main.addEventListener("dragover", (e) => {
      if (!isFiles(e) || S.view !== "folder") return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
      const r = target(e); mark(r);
      text.textContent = `Drop to upload to “${r ? FM.byId(r.dataset.id).name : S.folder.name}”`;
    });
    main.addEventListener("dragleave", (e) => { if (!isFiles(e)) return; if (--depth <= 0) { depth = 0; zone.hidden = true; mark(null); } });
    main.addEventListener("drop", async (e) => {
      if (!isFiles(e) || S.view !== "folder") return;
      e.preventDefault();
      depth = 0; zone.hidden = true;
      const r = target(e); mark(null);
      const to = r ? FM.byId(r.dataset.id) : S.folder;
      let batch;
      try { batch = await fromDrop(e.dataTransfer); } catch (x) { FM.report("upload", x, { what: "the dropped files could not be read" }); return FM.ui.toast("The dropped files could not be read: " + (x.message || x), { bad: true }); }
      start(batch, to);
    });
    addEventListener("dragover", (e) => { if (isFiles(e)) e.preventDefault(); }); // a drop outside the list never opens the file in the tab
    addEventListener("drop", (e) => { if (isFiles(e)) e.preventDefault(); });
    addEventListener("paste", (e) => {
      if (S.view !== "folder" || FM.ui.busy || (e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) return;
      const files = e.clipboardData && [...e.clipboardData.files];
      if (files && files.length) { e.preventDefault(); start(fromInput(files)); }
    });
  }
  FM.upload = { start, choose, wireDrops, fromInput };
})();

// ---- keys.js ----
// keys.js: keyboard shortcuts (desktop). Arrows move, Shift extends, Ctrl moves without selecting, Space
// toggles, Enter opens, Backspace goes up; Ctrl+A / C / X / V; Delete; F2; N, U, D, /, ?. Escape closes the top
// thing (a menu, a dialog, the search, the selection, what was picked up); with nothing left, a page that opened
// this one in a window may close it.
"use strict";
(function () {
  const S = FM.S;
  const KEYS = [
    ["↑ ↓, Home, End, Page Up/Down", "Move through the list"], ["Shift + those", "Select a range"], ["Ctrl + ↑ ↓, then Space", "Pick items here and there"],
    ["Click, Ctrl+click, Shift+click", "Select one, add one, select a range"], ["Enter, double-click", "Open a folder; open a file in a new tab"],
    ["Backspace, Alt+↑", "Up one folder"], ["Ctrl+A", "Select everything here"], ["Ctrl+C, Ctrl+X, Ctrl+V", "Copy, move (cut), paste here"],
    ["Delete", "Move to the trash (Undo in the message)"], ["F2", "Rename"], ["N", "New folder"], ["U, Shift+U", "Upload files, upload a folder"],
    ["D", "Download"], ["/ or Ctrl+F", "Search all of Relay Files"], ["Drag rows onto a folder", "Move there (hold Ctrl to copy)"],
    ["Drop files from the computer", "Upload (onto a folder row: into it)"], ["Right-click", "Actions for the item"], ["Escape", "Close, clear the selection, put picked-up items down"], ["?", "This list"],
  ];
  function help() {
    const t = FM.h("table.keys");
    for (const [k, v] of KEYS) t.append(FM.h("tr", null, FM.h("td", null, FM.h("b", { text: k })), FM.h("td", { text: v })));
    FM.ui.dialog({ title: "Keyboard and mouse", body: [t], actions: [{ text: "Close", value: true, primary: true }] });
  }
  function move(delta, extend, keepSel) {
    const items = FM.sorted();
    if (!items.length) return;
    const ids = items.map((i) => i.id || i.tid);
    let i = ids.indexOf(S.focus);
    if (delta === "home") i = 0; else if (delta === "end") i = ids.length - 1;
    else i = i < 0 ? (delta > 0 ? 0 : ids.length - 1) : Math.max(0, Math.min(ids.length - 1, i + delta));
    const id = ids[i];
    S.focus = id;
    if (extend) {
      if (!S.anchor) S.anchor = ids[Math.max(0, ids.indexOf(S.focus))];
      const a = ids.indexOf(S.anchor), b = i;
      S.sel = new Set(ids.slice(Math.min(a, b), Math.max(a, b) + 1));
    } else if (!keepSel) { S.sel = new Set([id]); S.anchor = id; }
    FM.view.sel();
    FM.view.focusRow(id);
  }
  function onKey(e) {
    if (e.defaultPrevented) return;
    const typing = e.target && (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable);
    const k = e.key, ctrl = e.ctrlKey || e.metaKey;
    if (k === "Escape") {
      if (FM.ui.closeTop()) { e.preventDefault(); return; }
      if (typing && e.target.id === "q") { e.preventDefault(); FM.app.closeSearch(); return; }
      if (S.picking) { e.preventDefault(); FM.pick.stop(); return; }
      if (S.sel.size || S.selecting) { e.preventDefault(); S.sel.clear(); S.selecting = false; FM.view.render(); return; }
      if (S.clip) { e.preventDefault(); S.clip = null; FM.view.render(); return; }
      if (S.view === "search") { e.preventDefault(); FM.app.closeSearch(); return; }
      if (S.view === "trash") { e.preventDefault(); FM.app.go(S.folder ? S.folder.id : "root"); return; }
      return; // nothing here used it: a window kit host may close the window
    }
    if (FM.ui.busy) return;
    if ((k === "Enter" || k === " ") && e.target && e.target.closest && e.target.closest("button, a, [role=button]") && !e.target.closest(".list")) return; // a focused button presses itself
    if (typing) {
      if (k === "ArrowDown" && e.target.id === "q") { e.preventDefault(); document.querySelector(".list").focus(); move(1); }
      return;
    }
    const sel = FM.selected(), one = sel.length === 1 ? sel[0] : null;
    const pageRows = Math.max(1, Math.floor(document.querySelector(".list").clientHeight / 42) - 1);
    let used = true;
    if (k === "ArrowDown") move(1, e.shiftKey, ctrl);
    else if (k === "ArrowUp" && e.altKey) FM.app.up();
    else if (k === "ArrowUp") move(-1, e.shiftKey, ctrl);
    else if (k === "PageDown") move(pageRows, e.shiftKey, ctrl);
    else if (k === "PageUp") move(-pageRows, e.shiftKey, ctrl);
    else if (k === "Home") move("home", e.shiftKey, ctrl);
    else if (k === "End") move("end", e.shiftKey, ctrl);
    else if (k === " ") { if (S.focus) { S.sel.has(S.focus) ? S.sel.delete(S.focus) : S.sel.add(S.focus); S.anchor = S.focus; FM.view.sel(); } }
    else if (k === "Enter") { const it = FM.byId(S.focus) || one; if (it) FM.app.activate(it); }
    else if (k === "Backspace") FM.app.up();
    else if (ctrl && (k === "a" || k === "A")) { S.sel = new Set(S.items.map((i) => i.id || i.tid)); FM.view.sel(); }
    else if (ctrl && (k === "c" || k === "C") && S.view !== "trash") FM.ops.pickUp(sel, "copy");
    else if (ctrl && (k === "x" || k === "X") && S.view !== "trash" && S.writable) FM.ops.pickUp(sel, "cut");
    else if (ctrl && (k === "v" || k === "V") && S.clip) FM.ops.paste();
    else if (ctrl && (k === "v" || k === "V")) used = false; // files on the clipboard: the paste event uploads them
    else if (ctrl && (k === "f" || k === "F")) FM.app.openSearch();
    else if (ctrl || e.altKey) used = false;
    else if (k === "Delete" && S.view === "trash") FM.ops.purge(sel);
    else if (k === "Delete" && S.writable) FM.ops.del(sel);
    else if (k === "F2" && one && S.view !== "trash") FM.ops.rename(one);
    else if ((k === "n" || k === "N") && !e.shiftKey) FM.ops.newFolder();
    else if (k === "u" && S.writable && S.view === "folder") FM.upload.choose(false);
    else if (k === "U" && S.writable && S.view === "folder") FM.upload.choose(true);
    else if ((k === "d" || k === "D") && S.view !== "trash") FM.ops.download(sel);
    else if (k === "/") FM.app.openSearch();
    else if (k === "?") help();
    else used = false;
    if (used) e.preventDefault();
  }
  FM.keys = { onKey, help };
})();

// ---- pick.js ----
// pick.js: when a page that opened this one in a window (window-kit.js) asks for files. A bar says who asks and
// for what; files that do not fit are dimmed; Choose (or a double-click) fetches the choice from the PC with
// progress and hands it over as real File objects on the request's own MessagePort: one or more files, a folder
// as its files (fetched as ONE zip and unpacked here, so each file keeps its path), or a folder as one zip made
// by the PC. Requests are taken only from the parent frame and from allowed origins (window-kit.js checks).
"use strict";
(function () {
  const S = FM.S;
  let port = null, ac = null, lastSent = 0;

  FM.pickWhat = (p) => {
    const a = (p.accept || []).filter((x) => x !== "*");
    const f = !p.files ? "" : a.length ? `a${/^\.[aeiou]/i.test(a[0]) ? "n" : ""} ${a.join(" or ")} file${p.multiple ? " (or several)" : ""}` : p.multiple ? "files" : "a file";
    return p.folder ? (f ? `${f} or a folder` : "a folder") : f;
  };
  FM.pickHint = () => {
    const p = S.pick;
    if (S.view !== "folder") return "Go back to the folders to choose.";
    if (p.folder && p.files) return "Select it, then Choose (or double-click a file). For a folder: select it, or open it and Choose with nothing selected.";
    if (p.folder) return "Select a folder, or open it and Choose with nothing selected.";
    return p.multiple ? "Select them, then Choose (or double-click one)." : "Select it, then Choose (or double-click it).";
  };
  // What Choose would hand over right now.
  FM.pickChoice = () => {
    const p = S.pick, sel = FM.selected();
    const no = (why) => ({ ok: false, label: "Choose", why });
    if (!p || S.view === "trash") return no("Go back to the folders to choose.");
    if (sel.some((i) => i.locked)) return no("That is private: sign in first.");
    if (p.folder && sel.length === 1 && sel[0].dir) return { ok: true, label: `Choose “${sel[0].name}”`, folder: sel[0] };
    if (p.folder && !sel.length && S.view === "folder" && S.folder) return { ok: true, label: `Choose this folder (“${S.folder.name}”)`, folder: S.folder };
    if (!p.files) return no("Choose a folder.");
    const files = sel.filter((i) => !i.dir);
    if (!files.length || files.length !== sel.length) return no(p.folder ? "Select a file or one folder." : "Select a file.");
    if (!files.every(FM.fits)) return no(`Only ${FM.pickWhat(p)} can be chosen.`);
    if (!p.multiple && files.length > 1) return no("Choose one file.");
    return { ok: true, label: files.length > 1 ? `Choose ${files.length} files` : `Choose “${files[0].name}”`, items: files };
  };

  function onRequest(m, p, from) {
    if (port) try { port.postMessage({ type: "cancel" }); } catch (e) {}
    port = p;
    S.pick = { accept: Array.isArray(m.accept) ? m.accept.map(String) : [], multiple: !!m.multiple, files: m.files !== false,
      folder: m.folder === "files" || m.folder === "zip" ? m.folder : false, host: String(m.host || from).slice(0, 80), from };
    S.picking = null;
    S.sel.clear();
    FM.view.render();
  }
  function send(msg, force) {
    if (!port) return;
    const now = performance.now();
    if (!force && msg.type === "progress" && now - lastSent < 100) return;
    lastSent = now;
    try { port.postMessage(msg); } catch (e) { FM.report("pick", e, { what: "the page that asked could not take the files", type: msg.type }); FM.ui.toast("The page that asked could not take the files: " + (e.message || e), { bad: true }); }
  }
  function progress(text, loaded, total, name) {
    S.picking = { text, frac: total ? Math.min(1, loaded / total) : 0 };
    FM.view.renderPick();
    send({ type: "progress", loaded, total, name });
  }
  async function choose() {
    const ch = FM.pickChoice();
    if (!ch.ok || S.picking) return;
    const total = ch.folder ? ch.folder.size || 0 : ch.items.reduce((a, i) => a + (i.size || 0), 0);
    if (total > 1.5e9 && !(await FM.ui.confirm("This is big", [`${FM.size(total)} must be held in this page's memory to hand it over. A phone may run out of memory.`], "Go ahead"))) return;
    ac = new AbortController();
    const host = S.pick.host;
    try {
      let out;
      if (ch.folder) {
        const f = ch.folder;
        progress(`Getting “${f.name}” from the PC…`, 0, total);
        let hdr = null;
        const zip = await FM.api.blob(FM.api.zipPath([f]), { signal: ac.signal, expect: total, type: "application/zip", onHeaders: (h) => { hdr = h; }, onProgress: (n, t) => progress(`Getting “${f.name}” from the PC: ${FM.size(n)}${t ? " of about " + FM.size(t) : ""}`, n, t, f.name) });
        const info = FM.zipInfo(hdr);
        if (S.pick.folder === "zip") {
          const missing = FM.zipMissing(info, await FM.unzip.count(zip).catch(() => null));
          out = { kind: "zip", folder: f.name, files: [new File([zip], f.name + ".zip", { type: "application/zip", lastModified: f.mtime || Date.now() })], paths: [f.name + ".zip"], missing };
        } else {
          progress(`Unpacking “${f.name}”…`, total, total);
          const r = await FM.unzip.files(zip, f.name, (n, of) => progress(`Unpacking “${f.name}”: ${n} of ${of} files`, n, of));
          out = { kind: "folder", folder: f.name, files: r.files.map((x) => x.file), paths: r.files.map((x) => x.path), missing: FM.zipMissing(info, r.files.length, r.missing) };
        }
        // what the PC left out (its headers name them; its log says why): said here, and told to the page that asked
        if (out.missing) FM.ui.toast(`The PC could not include ${FM.plural(Number((/could not add (\d+)/.exec(out.missing) || [])[1]) || 1, "file")} of “${f.name}” (open in another program, moved or changed while it was packed): ${host} was told which. The PC's log (files.log) says why.`, { bad: true });
      } else {
        const files = [], paths = [];
        let done = 0;
        for (const it of ch.items) {
          const b = await FM.api.blob(FM.api.filePath(it), { signal: ac.signal, expect: it.size, onProgress: (n) => progress(`Getting “${it.name}” from the PC: ${FM.size(done + n)} of ${FM.size(total)}`, done + n, total, it.name) });
          files.push(new File([b], it.name, { type: b.type, lastModified: it.mtime || Date.now() }));
          paths.push(it.name);
          done += it.size || 0;
        }
        out = { kind: "files", files, paths };
      }
      send(Object.assign({ type: "picked" }, out), true);
      S.picking = { text: `Handed to ${host}.`, frac: 1 };
      FM.view.renderPick();
    } catch (e) {
      S.picking = null;
      FM.view.render();
      if (e.aborted) return;
      if (e.signin) { FM.app.signedOut(e.signin); FM.ops.signIn("That is private: the PC's password, then Choose again."); return; }
      FM.report("pick", e, { what: "the choice could not be fetched from the PC", host, items: ch.folder ? [ch.folder] : ch.items });
      FM.ui.toast(`It could not be fetched from the PC: ${e.message}`, { bad: true });
    } finally { ac = null; }
  }
  function stop() { if (ac) ac.abort(); S.picking = null; FM.view.render(); }
  function cancel() { stop(); send({ type: "cancel" }, true); port = null; S.pick = null; FM.view.render(); }
  FM.pick = { onRequest, choose, stop, cancel };
})();

// ---- app.js ----
// app.js: start-up, going from folder to folder, the live updates, and the pointer: click, Ctrl/Shift-click,
// double-click, right-click, long-press (phone), and dragging rows onto a folder. Opened on its own, the
// browser's Back and Forward go through the folders (the address keeps the folder: #f=<id>); inside another
// page's window it keeps its history to itself.
"use strict";
(function () {
  const S = FM.S;
  const $ = (s) => document.querySelector(s);
  let events = null, seq = 0, retryTimer = 0, retryWait = 2000, searchAc = null, reloadTimer = 0;
  FM.embedded = WindowKit.child.inWindow;
  FM.parentOf = (it) => it.parent || "root";
  // The PC's ids: the first 10 bytes of SHA-256 of the lower-case path (services\files idFor).
  FM.idFor = async (rel) => {
    if (!rel) return "root";
    const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(rel.toLowerCase()));
    return Array.from(new Uint8Array(d).slice(0, 10), (b) => b.toString(16).padStart(2, "0")).join("");
  };

  function setConn(state, why) { S.conn = { state, why }; FM.view.renderStatus(); }
  function scheduleRetry(fn) {
    clearTimeout(retryTimer);
    if (S.error) S.error.retryAt = Date.now() + retryWait;
    retryTimer = setTimeout(fn, retryWait);
    retryWait = Math.min(30000, retryWait * 2);
  }

  function adopt(r) {
    // the PC says whether the pass this device holds is good (r.private): a pass it no longer knows is forgotten
    if (FM.api.hasPass() && !r.private) {
      FM.api.forgetPass();
      FM.report("signed-out", "this device's pass is no longer known on the PC (a new password, or Sign out every browser)");
      FM.ui.toast("This device was signed out on the PC (a new password, or Sign out every browser): sign in again for private folders and changes.", { bad: true, action: () => FM.ops.signIn(), actionText: "Sign in" });
    }
    S.signed = !!r.private;
    S.writable = !!r.writable;
    if (S.signed && r.writable === undefined) S.notice = { text: "The PC runs the old, read-only files program: changes need PC Relay 1.1.4 or later (restart PC Relay on the PC).", bad: true, old: true };
    else if (S.notice && S.notice.old) S.notice = null;
  }

  async function load(id, o = {}) {
    const my = ++seq;
    S.loading = true;
    if (!o.quiet) FM.view.render();
    try {
      const r = await FM.api.list(id);
      if (my !== seq) return;
