  }

  // ---- actions by name (the buttons) ---------------------------------------------------------------------------------------
  const ACTS = {
    up, prev: back, refresh: refreshList, retry: () => (relaunch ? relaunch() : reload()), account: () => FM.ops.account(),
    newfolder: FM.ops.newFolder, upload: () => FM.upload.choose(false),
    download: () => FM.ops.download(FM.selected()), open: () => FM.ops.openMany(FM.selected()), delete: () => FM.ops.del(FM.selected()),
    paste: FM.ops.paste, clipcancel: () => { S.clip = null; FM.view.render(); },
    restore: () => FM.ops.restore(FM.selected()), purge: () => FM.ops.purge(FM.selected()), empty: FM.ops.emptyTrash,
    morebtn: (b) => moreMenu(b), search: openSearch, selectall: selectAll, unselect: () => { S.sel.clear(); FM.view.render(); },
    use: () => FM.pick.use(), pickstop: () => FM.pick.stop(),
  };

  // ---- the pointer on the list ----------------------------------------------------------------------------------------------
  // One click or tap on a row opens it: a folder goes in, a file opens in a new tab (in the trash: the row's actions;
  // while a program is choosing: the file is ticked). Each row is a link (view.js linkOf), and the browser's own link
  // clicks are left to it: a middle-click or Ctrl+click (⌘+click on a Mac) opens the row in a new tab behind this one,
  // Shift+click in a new window, Shift+right-click shows the browser's own menu for the link; this page stays as it
  // is. Only the row's box ticks: a click on it ticks or unticks that row, Shift+click ticks the rows from the last
  // one ticked to it. The row's menu (with "Open with"): right-click, the … button, or a long press on a phone.
  // A double-click or double-tap is one open: after an open the list takes no click for QUIET ms (and never the second
  // click of a mouse double-click), which would else open whatever is now under the pointer in the new folder, or the
  // file a second time. A long press (LONG ms) is not a tap: its lift opens nothing, and nothing in the menu it
  // brought up takes that lift either (ui.js: held).
  const QUIET = 400, LONG = 500;
  function wireList() {
    const list = $(".list");
    let openedAt = -1e9, touchAt = 0, menuAt = 0, pressTimer = 0, pressAt = null;
    const rowOf = (e) => e.target.closest && e.target.closest(".row");
    const linkRow = (r) => r && r.tagName === "A";
    list.addEventListener("click", (e) => {
      const sortBtn = e.target.closest("[data-sort]");
      if (sortBtn) { const k = sortBtn.dataset.sort; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : 1 }; FM.store.set("sort", S.sort); FM.view.render(); return; }
      const actBtn = e.target.closest("[data-act]");
      const r = rowOf(e);
      if (!r) { if (actBtn && ACTS[actBtn.dataset.act]) ACTS[actBtn.dataset.act](actBtn); return; }
      const onBox = !!e.target.closest(".check"), onMore = !!actBtn && actBtn.dataset.act === "more";
      if (!onBox && !onMore && linkRow(r) && (e.ctrlKey || e.metaKey || e.shiftKey)) return; // the browser's: a new tab or window
      e.preventDefault(); // anything else is this page's: the row's link never takes this tab away
      if (performance.now() - openedAt < QUIET || (e.pointerType === "mouse" && e.detail > 1)) return;
      if (e.pointerType === "touch" && touchAt && (menuAt > touchAt || performance.now() - touchAt >= LONG)) return; // the lift of a long press
      const id = r.dataset.id, it = FM.byId(id);
      if (!it) return;
      if (onMore) return itemMenu({ anchor: actBtn, alignRight: true }, forRow(id));
      if (onBox) {
        tick(id, e.shiftKey);
        if (document.activeElement !== list && list.contains(document.activeElement)) list.focus({ preventScroll: true }); // keys stay the list's
        return;
      }
      if (S.pick && !it.dir && !it.locked) return activate(it); // a tick, not an open: no quiet time after it
      openedAt = performance.now();
      if (S.view === "trash") return itemMenu({ x: e.clientX, y: e.clientY }, forRow(id));
      activate(it);
    });
    // a middle-click on the box or … opens nothing (on the rest of the row it is the browser's: the link in a new tab)
    list.addEventListener("auxclick", (e) => { if (e.target.closest && e.target.closest(".row button")) e.preventDefault(); });
    // a press focuses the row's link: once the pointer is up (or a drag of it ends) the keys are the list's again (its
    // cursor, its shortcuts). Not at the press itself: moving the focus then stops the row from being dragged.
    const keysBack = () => { const a = document.activeElement; if (a && a !== list && a.matches && a.matches("a.row")) list.focus({ preventScroll: true }); };
    list.addEventListener("pointerup", keysBack);
    list.addEventListener("dragend", keysBack);
    // A long press on a row (a finger held LONG ms without moving): the row's menu. Where the browser makes its own
    // right-click of it (Chrome on Android) that comes first and this does nothing more.
    const endPress = () => { clearTimeout(pressTimer); pressTimer = 0; pressAt = null; };
    list.addEventListener("pointerdown", (e) => {
      touchAt = e.pointerType === "touch" ? performance.now() : 0;
      endPress();
      const r = rowOf(e);
      if (e.pointerType !== "touch" || !r || e.target.closest("button")) return;
      const id = r.dataset.id, at = { x: e.clientX, y: e.clientY, held: true };
      pressAt = at;
      pressTimer = setTimeout(() => {
        pressTimer = 0; pressAt = null;
        if (menuAt > touchAt || FM.ui.busy) return;
        menuAt = performance.now();
        itemMenu(at, forRow(id));
      }, LONG);
    });
    list.addEventListener("pointermove", (e) => { if (pressAt && Math.hypot(e.clientX - pressAt.x, e.clientY - pressAt.y) > 10) endPress(); });
    for (const t of ["pointerup", "pointercancel", "pointerleave"]) list.addEventListener(t, endPress);
    list.addEventListener("scroll", endPress, { passive: true });
    list.addEventListener("contextmenu", (e) => {
      const r = rowOf(e);
      if (linkRow(r) && e.shiftKey && !e.target.closest("button")) return; // Shift+right-click: the browser's own menu for the link
      e.preventDefault();
      if (performance.now() - menuAt < 1200 && FM.ui.busy) return; // the long press above already showed it
      menuAt = performance.now();
      if (!r) return spaceMenu({ x: e.clientX, y: e.clientY });
      itemMenu({ x: e.clientX, y: e.clientY }, forRow(r.dataset.id));
    });
    // dragging rows onto a folder (or a step of the path): move; with Ctrl: copy (the ticked rows, when the row is ticked)
    const MIME = "application/x-relay-files";
    let dragIds = null;
    list.addEventListener("dragstart", (e) => {
      const r = rowOf(e);
      if (!r || S.view !== "folder" || S.pick) return e.preventDefault();
      const items = forRow(r.dataset.id).filter(FM.canChange);
      if (!items.length) return e.preventDefault();
      dragIds = items.map((i) => i.id);
      e.dataTransfer.clearData(); // not the row's link: a link dropped where nothing takes it would take the tab there
      e.dataTransfer.setData(MIME, JSON.stringify(dragIds));
      e.dataTransfer.setData("text/plain", items.map((i) => i.name).join("\n"));
      e.dataTransfer.effectAllowed = "copyMove";
    });
    list.addEventListener("dragend", () => { dragIds = null; for (const x of document.querySelectorAll(".drop-on")) x.classList.remove("drop-on"); });
    const dropTarget = (e) => {
      if (!e.dataTransfer || ![...e.dataTransfer.types].includes(MIME)) return null;
      const crumb = e.target.closest && e.target.closest(".crumb[data-crumb]");
      if (crumb && crumb.dataset.crumb !== (S.folder && S.folder.id)) {
        const known = S.cache.get(crumb.dataset.crumb === "root" ? rootId : crumb.dataset.crumb); // a folder passed through: the PC said whether things go in
        return known && !known.writable ? null : { el: crumb, id: crumb.dataset.crumb, name: crumb.textContent };
      }
      const r = e.target.closest && e.target.closest(".row.dir:not(.locked)");
      if (r && !(dragIds || []).includes(r.dataset.id)) { const it = FM.byId(r.dataset.id); return FM.canWriteInto(it) ? { el: r, id: it.id, name: it.name } : null; }
      return null;
    };
    let lit = null;
    const light = (el) => { if (lit !== el) { if (lit) lit.classList.remove("drop-on"); lit = el; if (el) el.classList.add("drop-on"); } };
    for (const zone of [list, $(".top")]) {
      zone.addEventListener("dragover", (e) => { const t = dropTarget(e); light(t && t.el); if (t) { e.preventDefault(); e.dataTransfer.dropEffect = e.ctrlKey || e.altKey ? "copy" : "move"; } });
      zone.addEventListener("dragleave", (e) => { if (lit && !lit.contains(e.relatedTarget)) light(null); });
      zone.addEventListener("drop", (e) => {
        const t = dropTarget(e);
        light(null);
        if (!t) return;
        e.preventDefault();
        let ids = [];
        try { ids = JSON.parse(e.dataTransfer.getData(MIME) || "[]"); } catch (x) {}
        const items = ids.map((id) => FM.byId(id)).filter(Boolean);
        if (items.length) FM.ops.moveTo(items, { id: t.id, name: t.name }, e.ctrlKey || e.altKey);
      });
    }
  }

  // "This program is open": told to the PC once a minute while the page shows (the time spent is drawn from it). Not
  // inside another program's window (that program counts), and no timer runs while the page is hidden.
  let seenTimer = 0, seenAt = 0;
  function seenLoop() {
    clearInterval(seenTimer); seenTimer = 0;
    if (FM.embedded || document.hidden) return;
    const tell = () => { if (Date.now() - seenAt >= 55000) { seenAt = Date.now(); FM.api.seen(); } };
    tell();
    seenTimer = setInterval(tell, 60000);
  }

  function wire() {
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b || b.closest(".list") || b.disabled) return;
      const fn = ACTS[b.dataset.act];
      if (fn) { e.preventDefault(); fn(b); }
    });
    document.addEventListener("click", (e) => { const c = e.target.closest(".crumb[data-crumb]"); if (c && !c.classList.contains("here")) go(c.dataset.crumb); });
    wireList();
    const q = $("#q");
    let qt = 0;
    q.addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => runSearch(q.value), 250); });
    q.addEventListener("blur", () => { if (!q.value) $(".app").classList.remove("searching"); });
    document.addEventListener("keydown", FM.keys.onKey);
    FM.upload.wireDrops();
    addEventListener("popstate", (e) => {
      if (FM.embedded || !e.state || !e.state.fm) return;
      if ((e.state.who || "") !== who()) { // a step of someone who was signed in here before: the top, in its place
        history.replaceState({ fm: "root", n: 0, from: "", who: who() }, "", location.pathname + location.search);
        return go("root", { noHistory: true });
      }
      go(e.state.fm, { noHistory: true });
    });
    // a row's link pasted into this tab's address bar changes only the part after #, so the page would not start
    // again: it does (the page's own steps carry their state, and are popstate's)
    addEventListener("hashchange", () => { if (!FM.embedded && !(history.state && history.state.fm) && /^#(open|f)=/.test(location.hash)) location.reload(); });
    addEventListener("online", () => { if (S.error) { retryWait = 2000; reload(); } });
    document.addEventListener("visibilitychange", () => { seenLoop(); if (!document.hidden) { if (S.error) reload(); else if (events) events.restart(); } });
    // the account page says a new picture this way (relay-client's account event covers every other change)
    addEventListener("storage", (e) => { if (e.key === "relay-picture") FM.redrawChip(); });
    let wasPhone = FM.isPhone();
    addEventListener("resize", () => { const p = FM.isPhone(); if (p !== wasPhone) { wasPhone = p; FM.view.render(); } });
  }
  function listen() {
    events = FM.api.events((m) => {
      if (m.type === "open") { live = true; if (S.conn.state !== "on" && !S.error) setConn("on", "Connected"); return; }
      if (m.type === "closed") { live = false; return; }
      if (m.type !== "changed") return;
      const f = m.folders || [];
      for (const id of f) S.cache.delete(id);
      const mine = S.view === "folder" && S.folder && (f.includes(S.folder.id) || S.items.some((i) => f.includes(i.id)));
      if (mine || S.view === "search") { clearTimeout(reloadTimer); reloadTimer = setTimeout(() => reload(), 150); }
    });
  }

  async function boot() {
    const blocked = WindowKit.child.refusedBy;
    if (blocked) {
      document.body.replaceChildren(FM.h("div.blocked", null, FM.h("div", null, FM.h("h2", { text: "The Cloud File Manager cannot open here" }), FM.h("p", { text: `This page is inside ${blocked}, which is not one of Jon's pages. Open it on its own instead.` }))));
      return;
    }
    S.me.account = FM.api.account(); // who this browser is, at once (the PC's answers follow)
    wire();
    FM.api.onAccount(accountChanged);
    const op = !FM.embedded && /^#open=([0-9a-f]+)(?:\/(.*))?$/.exec(location.hash);
    if (op) { let name = ""; try { name = decodeURIComponent(op[2] || ""); } catch (e) {} return openLink(op[1], name); }
    return start();
  }

  // ---- a file opened from its row's link (#open=<id>/<name>, view.js linkOf) ---------------------------------------------
  // A middle-click, Ctrl+click or the browser's own "Open link in new tab" on a file that has no plain link (a
  // person's own file, a private one) opens this page in the new tab: a link cannot carry the pass, but this tab
  // shares the browser's account, so it asks the PC for the file's 10-minute ticket and goes there. A file a tab shows
  // (FM.tabShows) is shown in this tab; any other comes down through the page as Download does, then the tab closes
  // (as a link's download closes its tab). What fails is said here with a way on: Sign in, Try again, or the Cloud
  // File Manager itself. The header (the Apps button, the account) stays reachable.
  function launchCard(title, text, buttons = []) {
    let el = document.querySelector(".launch");
    if (!el) { el = FM.h("div.fail.launch", { role: "status" }); $(".main").append(el); }
    const card = FM.h("div.fail-card", null, FM.h("div.fail-title", { text: title }), text ? FM.h("div.fail-why", { text }) : null);
    const acts = FM.h("div.launch-acts");
    for (const [label, fn, primary] of buttons) { const b = FM.h("button.btn" + (primary ? ".primary" : ""), { type: "button", text: label }); b.addEventListener("click", fn); acts.append(b); }
    if (buttons.length) card.append(acts);
    el.replaceChildren(card);
  }
  async function openLink(id, name) {
    const it = { id, name: name || "the file", private: true, path: "" };
    relaunch = () => openLink(id, name);
    const toFM = ["Open the Cloud File Manager", () => { relaunch = null; const el = document.querySelector(".launch"); if (el) el.remove(); history.replaceState(null, "", location.pathname + location.search); S.loading = false; start(); }];
    const again = ["Try again", () => openLink(id, name), true];
    const shut = (title) => { window.close(); setTimeout(() => launchCard(title, "This tab can be closed now.", [toFM]), 700); }; // a tab some other way opened stays
    S.loading = true; FM.view.render();
    document.title = `${it.name} · Cloud File Manager`;
    launchCard(`Opening “${it.name}”…`, "");
    let url, head;
    try {
      const t = await FM.api.json("POST", "ticket", { json: { ids: [id], inline: true } });
      url = FM.api.client.url("files", t.url);
      head = await fetch(url, { method: "HEAD", cache: "no-store" }).catch(() => { throw new FM.ApiError("Could not reach the PC (no network, or the PC is off or asleep).", { net: true }); });
      if (!head.ok) throw new FM.ApiError(FM.sentence(RelayClient.httpWhy(head.status)), { status: head.status });
      setConn("on", "Connected");
    } catch (e) {
      setConn(e.net ? "off" : "on", e.net ? e.message.replace(/\.$/, "") : "Connected");
      // not this person's to see (or nobody is signed in): the account page is the way on; a change there tries again
      if (e.signin || e.code === "private" || (e.status === 404 && !S.me.account)) return launchCard(`“${it.name}” needs a sign-in`, S.me.account ? "This account cannot see it." : "Sign in to open it.", [[S.me.account ? "Account" : "Sign in", () => FM.ops.account(), true], toFM]);
      FM.report("open", e, { what: "a file opened from its link in a new tab", items: [it] });
      return launchCard(`“${it.name}” could not be opened`, e.message, [again, toFM]);
    }
    relaunch = null;
    if (FM.tabShows(head.headers.get("content-type"))) {
      location.replace(url);
      // still here after a while: the browser downloaded it after all, or the PC is slow to answer
      setTimeout(() => launchCard(`“${it.name}” has not opened yet`, "If a tab cannot show this kind of file, it went to your browser's downloads, and this tab can be closed.", [["Close this tab", () => shut(`“${it.name}”`), true], toFM]), 8000);
      return;
    }
    it.size = Number(head.headers.get("content-length")) || 0;
    launchCard(`Downloading “${it.name}”…`, "A tab cannot show this kind of file. It goes to your browser's downloads, then this tab closes.");
    const t = FM.ops.download([it]);
    await t.done;
    if (t.state === "done") { launchCard(`“${it.name}” is in your downloads`, "This tab closes by itself."); return setTimeout(() => shut(`“${it.name}” is in your downloads`), 1000); }
    if (t.state === "handed") return launchCard(`“${it.name}” goes to your browser's downloads`, "It is big, so the browser downloads it itself. This tab can be closed.", [["Close this tab", () => shut(`“${it.name}”`), true], toFM]);
    launchCard(`“${it.name}” could not be downloaded`, t.error || "It was stopped.", [again, toFM]);
  }

  // ---- the file manager itself: the folder in the address (#f=), or the top --------------------------------------------
  async function start() {
    S.me.account = FM.api.account();
    FM.view.render();
    if (FM.embedded) { // ready at once: a request can wait for the first listing
      WindowKit.child.onPick(FM.pick.onRequest);
      WindowKit.child.ready({ app: "file-manager", pick: true });
    }
    FM.api.ping(8000).then((r) => { if (!r.ok && !S.items.length) setConn("off", FM.capital(r.why)); else FM.view.renderStatus(); }).catch(() => {});
    FM.apps.load().then(noteApps); // the one list of programs: who opens what
    const m = /#f=([^&]+)/.exec(location.hash);
    const first = !FM.embedded && m ? decodeURIComponent(m[1]) : "root";
    const st = history.state, again = !FM.embedded && !!st && st.fm === first && typeof st.n === "number" && (st.who || "") === who(); // a reload: its steps are there
    if (!FM.embedded && !again) history.replaceState({ fm: first, n: 0, from: "", who: who() }, "", location.hash || "");
    const r = await load(first);
    // opened straight at a folder below the top (a link, a bookmark, a row's link in a new tab): its parents become
    // the steps before it, so Back (the page's, the browser's, a phone's) goes up from it, one folder at a time
    if (!FM.embedded && !again && r && r.folder && r.folder.id === first && r.crumbs.length > 1 && history.state && history.state.fm === first && !history.state.n) {
      r.crumbs.forEach((c, i) => history[i ? "pushState" : "replaceState"]({ fm: c.id, n: i, from: i ? (i === 1 ? FM.topName() : r.crumbs[i - 1].name) : "", who: who() }, "", "#f=" + encodeURIComponent(c.id)));
      FM.view.render();
    }
    info();
    listen();
    seenLoop();
  }
  FM.app = { go, up, back, backTarget, goPath, load, reload, refreshList, activate, openAll, openSearch, closeSearch, runSearch, showTrash, tick, selectAll, moreMenu, debug,
    resetTrail: () => { trail.length = 0; }, get events() { return events; } };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
</body>
</html>
