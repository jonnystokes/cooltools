    cut: () => FM.ops.pickUp(FM.selected(), "cut"), copy: () => FM.ops.pickUp(FM.selected(), "copy"), paste: FM.ops.paste,
    clipcancel: () => { S.clip = null; FM.view.render(); }, delete: () => FM.ops.del(FM.selected()),
    private: () => FM.ops.setPrivate(FM.selected()[0], true), public: () => FM.ops.setPrivate(FM.selected()[0], false),
    trash: () => showTrash(), back: () => go(S.folder ? S.folder.id : "root"), restore: () => FM.ops.restore(FM.selected()),
    purge: () => FM.ops.purge(FM.selected()), empty: FM.ops.emptyTrash, reveal: () => reveal(FM.selected()[0]),
    closesearch: () => closeSearch(), search: openSearch, account: (b) => accountMenu(b),
    selectall: () => { const all = S.items.every((i) => S.sel.has(i.id || i.tid)); S.sel = all ? new Set() : new Set(S.items.map((i) => i.id || i.tid)); FM.view.sel(); },
    unselect: () => { S.sel.clear(); FM.view.render(); }, selmore: (b) => itemMenu({ anchor: b }),
    fab: (b) => FM.ui.menu([{ icon: "upload", text: "Upload files", act: () => FM.upload.choose(false) }, { icon: "folder", text: "Upload a folder", act: () => FM.upload.choose(true) }, { icon: "newfolder", text: "New folder", act: FM.ops.newFolder }], { anchor: b }),
    pickchoose: () => FM.pick.choose(), pickcancel: () => FM.pick.cancel(), pickstop: () => FM.pick.stop(),
  };

  // ---- the pointer on the list ----------------------------------------------------------------------------------------------
  // One click or tap on a row opens it: a folder goes in, a file opens in a new tab (a page that asked for a file gets
  // it; in the trash: the row's actions). The row's box ticks it: a click on the box ticks or unticks that row,
  // Shift+click ticks the rows from the last one ticked to it, Ctrl+click is that row alone; Shift or Ctrl on the row
  // itself ticks instead of opening. Nothing else ticks a row: not a click, not ⋯ or right-click, not a drag.
  // A double-click or double-tap is one open: after an open the list takes no click for QUIET ms (and never the second
  // click of a mouse double-click), which would else open whatever is now under the pointer in the new folder, or the
  // file a second time. A long press on a phone (LONG ms or more) is not a tap: its lift opens nothing; where the browser
  // makes it a right-click (Chrome on Android) it shows the row's actions.
  const QUIET = 400, LONG = 500;
  function wireList() {
    const list = $(".list");
    let openedAt = -1e9, touchAt = 0, menuAt = 0;
    const rowOf = (e) => e.target.closest && e.target.closest(".row");
    function tick(id, range) { // range (Shift): tick from the last row ticked or unticked to this one; never unticks
      const ids = FM.sorted().map((i) => i.id || i.tid), a = ids.indexOf(S.anchor), b = ids.indexOf(id);
      if (range) for (const k of a >= 0 && b >= 0 ? ids.slice(Math.min(a, b), Math.max(a, b) + 1) : [id]) S.sel.add(k);
      else if (S.sel.has(id)) S.sel.delete(id);
      else S.sel.add(id);
      S.anchor = id;
      FM.view.sel();
    }
    list.addEventListener("click", (e) => {
      const sortBtn = e.target.closest("[data-sort]");
      if (sortBtn) { const k = sortBtn.dataset.sort; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : 1 }; FM.store.set("sort", S.sort); FM.view.render(); return; }
      const actBtn = e.target.closest("[data-act]");
      const r = rowOf(e);
      if (!r) { if (actBtn && ACTS[actBtn.dataset.act]) ACTS[actBtn.dataset.act](actBtn); return; }
      if (performance.now() - openedAt < QUIET || (e.pointerType === "mouse" && e.detail > 1)) return;
      if (e.pointerType === "touch" && touchAt && (menuAt > touchAt || performance.now() - touchAt >= LONG)) return; // the lift of a long press
      const id = r.dataset.id, it = FM.byId(id);
      if (!it) return;
      if (actBtn && actBtn.dataset.act === "more") return itemMenu({ anchor: actBtn, alignRight: true }, forRow(id));
      if (e.target.closest(".check") || e.shiftKey || e.ctrlKey || e.metaKey) {
        tick(id, e.shiftKey);
        if (document.activeElement !== list && list.contains(document.activeElement)) list.focus({ preventScroll: true }); // keys stay the list's
        return;
      }
      openedAt = performance.now();
      if (S.view === "trash") return itemMenu({ x: e.clientX, y: e.clientY }, forRow(id));
      activate(it);
    });
    list.addEventListener("pointerdown", (e) => { touchAt = e.pointerType === "touch" ? performance.now() : 0; });
    list.addEventListener("contextmenu", (e) => {
      const r = rowOf(e);
      e.preventDefault();
      menuAt = performance.now();
      if (!r) return spaceMenu({ x: e.clientX, y: e.clientY });
      itemMenu({ x: e.clientX, y: e.clientY }, forRow(r.dataset.id));
    });
    // dragging rows onto a folder (or a step of the path): move; with Ctrl: copy (the ticked rows, when the row is ticked)
    const MIME = "application/x-relay-files";
    let dragIds = null;
    list.addEventListener("dragstart", (e) => {
      const r = rowOf(e);
      if (!r || !S.writable || S.view !== "folder") return e.preventDefault();
      const items = forRow(r.dataset.id).filter((i) => !i.locked);
      if (!items.length) return e.preventDefault();
      dragIds = items.map((i) => i.id);
      e.dataTransfer.setData(MIME, JSON.stringify(dragIds));
      e.dataTransfer.setData("text/plain", items.map((i) => i.name).join("\n"));
      e.dataTransfer.effectAllowed = "copyMove";
    });
    list.addEventListener("dragend", () => { dragIds = null; for (const x of document.querySelectorAll(".drop-on")) x.classList.remove("drop-on"); });
    const dropTarget = (e) => {
      if (!e.dataTransfer || ![...e.dataTransfer.types].includes(MIME)) return null;
      const crumb = e.target.closest && e.target.closest(".crumb[data-crumb]");
      if (crumb && crumb.dataset.crumb !== (S.folder && S.folder.id)) return { el: crumb, id: crumb.dataset.crumb, name: crumb.textContent };
      const r = e.target.closest && e.target.closest(".row.dir:not(.locked)");
      if (r && !(dragIds || []).includes(r.dataset.id)) { const it = FM.byId(r.dataset.id); return it ? { el: r, id: it.id, name: it.name } : null; }
      return null;
    };
    let lit = null;
    const light = (el) => { if (lit !== el) { if (lit) lit.classList.remove("drop-on"); lit = el; if (el) el.classList.add("drop-on"); } };
    for (const zone of [list, $(".top")]) {
      zone.addEventListener("dragover", (e) => { const t = dropTarget(e); light(t && t.el); if (t) { e.preventDefault(); e.dataTransfer.dropEffect = e.ctrlKey || e.altKey ? "copy" : "move"; } });
      zone.addEventListener("dragleave", (e) => { if (lit && !lit.contains(e.relatedTarget)) light(null); });
      zone.addEventListener("drop", (e) => {
        const t = dropTarget(e);
        light(null);
        if (!t) return;
        e.preventDefault();
        let ids = [];
        try { ids = JSON.parse(e.dataTransfer.getData(MIME) || "[]"); } catch (x) {}
        const items = ids.map((id) => FM.byId(id)).filter(Boolean);
        if (items.length) FM.ops.moveTo(items, { id: t.id, name: t.name }, e.ctrlKey || e.altKey);
      });
    }
  }

  function wire() {
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b || b.closest(".list") || b.disabled) return;
      const fn = ACTS[b.dataset.act];
      if (fn) { e.preventDefault(); fn(b); }
    });
    document.addEventListener("click", (e) => { const c = e.target.closest(".crumb[data-crumb]"); if (c && !c.classList.contains("here")) go(c.dataset.crumb); });
    wireList();
    const q = $("#q");
    let qt = 0;
    q.addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => runSearch(q.value), 250); });
    q.addEventListener("blur", () => { if (!q.value) $(".app").classList.remove("searching"); });
    document.addEventListener("keydown", FM.keys.onKey);
    FM.upload.wireDrops();
    addEventListener("popstate", (e) => { if (!FM.embedded && e.state && e.state.fm) go(e.state.fm, { noHistory: true }); });
    addEventListener("online", () => { if (S.error) { retryWait = 2000; reload(); } });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (S.error) reload(); else if (events) events.restart(); } });
    let wasPhone = FM.isPhone();
    addEventListener("resize", () => { const p = FM.isPhone(); if (p !== wasPhone) { wasPhone = p; FM.view.render(); } });
  }
  function listen() {
    events = FM.api.events((m) => {
      if (m.type === "open") { if (S.conn.state !== "on" && !S.error) setConn("on", "Connected"); return; }
      if (m.type !== "changed") return;
      const f = m.folders || [];
      for (const id of f) S.cache.delete(id);
      const mine = S.view === "folder" && S.folder && (f.includes(S.folder.id) || S.items.some((i) => f.includes(i.id)));
      if (mine || S.view === "search") { clearTimeout(reloadTimer); reloadTimer = setTimeout(() => reload(), 150); }
    });
  }

  async function boot() {
    const blocked = WindowKit.child.refusedBy;
    if (blocked) {
      document.body.replaceChildren(FM.h("div.blocked", null, FM.h("div", null, FM.h("h2", { text: "The Cloud File Manager cannot open here" }), FM.h("p", { text: `This page is inside ${blocked}, which is not one of Jon's pages. Open it on its own instead.` }))));
      return;
    }
    wire();
    FM.api.onLost(lost);
    FM.api.onChange(() => { refresh(); });   // signed in or out on another page of this site (one pass per browser)
    FM.view.render();
    if (FM.embedded) { // ready at once: a request can wait for the first listing
      WindowKit.child.onPick(FM.pick.onRequest);
      WindowKit.child.ready({ app: "file-manager", pick: true });
    }
    FM.api.ping(8000).then((r) => { if (!r.ok && !S.items.length) setConn("off", FM.capital(r.why)); }).catch(() => {});
    const m = /#f=([^&]+)/.exec(location.hash);
    const start = !FM.embedded && m ? decodeURIComponent(m[1]) : "root";
    const st = history.state, again = !FM.embedded && !!st && st.fm === start && typeof st.n === "number"; // a reload: its steps are there
    if (!FM.embedded && !again) history.replaceState({ fm: start, n: 0, from: "" }, "", location.hash || "");
    const r = await load(start);
    // opened straight at a folder below the top (a link, a bookmark): its parents become the steps before it, so Back
    // (the page's, the browser's, a phone's) goes up from it, one folder at a time
    if (!FM.embedded && !again && r && r.folder && r.folder.id === start && r.crumbs.length > 1 && history.state && history.state.fm === start && !history.state.n) {
      r.crumbs.forEach((c, i) => history[i ? "pushState" : "replaceState"]({ fm: c.id, n: i, from: i ? r.crumbs[i - 1].name : "" }, "", "#f=" + encodeURIComponent(c.id)));
      FM.view.render();
    }
    info();
    listen();
  }
  FM.app = { go, up, back, backTarget, goPath, load, reload, refresh, refreshList, signedOut, activate, openSearch, closeSearch, runSearch, showTrash, get events() { return events; } };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
</body>
</html>
