<style>
/* ---- base.css ---- */
/* base.css: colours (light and dark follow the device), type, the page frame, the buttons. Blue for actions and
   ticked rows; teal for the Shared Folder; violet for other people's files (Users, Guests); amber for private. Few buttons,
   big ones, plain labels (the calm pass, 2026-11-11). */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #f8f9fc; --raised: #ffffff;
  --text: #171c28; --muted: #5d667a; --faint: #8b93a5; --line: #e2e6ef; --line-2: #eef1f6;
  --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #e3ecff; --accent-soft-2: #d2e0ff; --focus: #2563eb;
  --folder: #3b82f6; --folder-tab: #93c5fd;
  --priv: #c27803; --priv-soft: #fff4dd; --danger: #c62828; --danger-soft: #fdecec; --ok: #16794a; --ok-soft: #e6f6ee;
  --people: #7c3aed; --people-soft: #f1eaff; --people-soft-2: #e6dbff; --shared: #0f766e; --shared-soft: #ddf4ef; --shared-soft-2: #c5ebe3;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .08);
  --radius: 10px; --row: 46px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0f17; --surface: #131826; --surface-2: #171d2d; --raised: #1b2234;
    --text: #e8ecf6; --muted: #a0a9bd; --faint: #737d93; --line: #262e42; --line-2: #1d2436;
    --accent: #5b9bff; --accent-ink: #08101f; --accent-soft: #18284a; --accent-soft-2: #213767; --focus: #7cb0ff;
    --folder: #5b9bff; --folder-tab: #2f5aa8;
    --priv: #f5b544; --priv-soft: #33270f; --danger: #ff7a7a; --danger-soft: #3a1717; --ok: #5ad69a; --ok-soft: #12301f;
    --people: #b79bff; --people-soft: #261d44; --people-soft-2: #32275a; --shared: #2dd4bf; --shared-soft: #0f2d2a; --shared-soft-2: #15403b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 16px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; touch-action: manipulation; }  /* no double-tap zoom: a quick second tap is never taken as a zoom */
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow: hidden; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
kbd { font: 600 11px/1 var(--font); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }

.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; min-height: 0; }

/* the header: the Apps button, the name, the path, search, the account chip */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 16px; padding-top: env(safe-area-inset-top); flex: none; }
.top-row { display: flex; align-items: center; gap: 12px; height: 60px; min-width: 0; }
apps-button { --apps-sep: var(--line); --apps-h: 40px; }  /* the Apps button's plain divider: the same line as the header's own */
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 16.5px; white-space: nowrap; color: var(--text); }
.brand-name { display: block; }
@media (min-width: 721px) and (max-width: 900px) { .brand-name { display: none; } }  /* a narrow window: the room goes to the path */
.brand-mark { width: 28px; height: 28px; padding: 4px; border-radius: 8px; background: var(--accent); color: #fff; }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; overflow: hidden; }
.top-row > .crumbs { border-left: 1px solid var(--line); padding-left: 6px; }
.crumb { border: 0; background: none; padding: 6px 9px; border-radius: 8px; color: var(--muted); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.crumb:hover { background: var(--line-2); color: var(--text); }
.crumb.here { color: var(--text); font-weight: 600; cursor: default; }
.crumb.here:hover { background: none; }
.crumb.drop-on { background: var(--accent-soft); color: var(--accent); outline: 2px dashed var(--accent); }
.crumb-sep { width: 14px; height: 14px; color: var(--faint); }
.crumbs-row { display: none; }
.search { position: relative; display: flex; align-items: center; width: min(300px, 30vw); }
.search svg { position: absolute; left: 11px; width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
.search input { width: 100%; height: 40px; padding: 0 34px 0 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); outline: none; }
.search input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input::-webkit-search-cancel-button { cursor: pointer; }
.search .hint-key { position: absolute; right: 10px; pointer-events: none; }
.search input:focus ~ .hint-key, .search input:not(:placeholder-shown) ~ .hint-key { display: none; }
/* the account chip: who this browser is (the picture or the initial, and the name), or Sign in */
.account { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; max-width: 220px; font-weight: 600; flex: none; }
.account:hover { border-color: var(--accent); }
.account.visitor { padding: 0 16px 0 12px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.account.visitor:hover { filter: brightness(1.08); }
.account svg { width: 18px; height: 18px; }
.account .acc-text { overflow: hidden; text-overflow: ellipsis; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft-2); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* buttons: big, plain, few */
.iconbtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 10px; background: none; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--line-2); color: var(--text); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn:disabled:hover { background: none; color: var(--muted); }
.busy svg { animation: spin .9s linear infinite; }  /* Refresh while it works */
@keyframes spin { to { transform: rotate(360deg); } }
.top .search-btn, .top .refresh-btn { display: none; }  /* a phone's (phone.css); a computer has the search box and the toolbar's Refresh */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 600; white-space: nowrap; flex: none; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.bare { width: 40px; padding: 0; color: var(--muted); }

/* the toolbar: one row, the same place on a computer and a phone */
.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; min-height: 61px; overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar .grow { flex: 1; }
.toolbar .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px 0 12px; border-radius: 16px; border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px; white-space: nowrap; flex: none; }
.toolbar .chip svg { width: 14px; height: 14px; }
.toolbar .chip:hover { background: var(--accent-soft-2); }
.toolbar .bar-text { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* a program is choosing: the one checkbox it may ask for, beside Use selected */
.keep-check { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 6px; cursor: pointer; font-weight: 550; min-width: 0; }
.keep-check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex: none; }

/* one-line notices, and the line that says whose files these are */
.notice { padding: 8px 16px; background: var(--priv-soft); color: var(--text); border-bottom: 1px solid var(--line); flex: none; font-size: 14px; }
.notice.bad { background: var(--danger-soft); }
.notice div + div { margin-top: 2px; }
.whose { display: flex; align-items: center; gap: 9px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex: none; font-size: 14px; background: var(--surface-2); min-width: 0; }
.whose svg { width: 18px; height: 18px; color: var(--muted); }
.whose-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.whose-text b { color: var(--text); font-weight: 650; }
.whose-end { margin-left: auto; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.whose.zone-shared { background: var(--shared-soft); }
.whose.zone-shared svg { color: var(--shared); }
.whose.zone-people, .whose.zone-other { background: var(--people-soft); }
.whose.zone-people svg, .whose.zone-other svg { color: var(--people); }
.whose.zone-trash svg { color: var(--danger); }

/* main area */
.main { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.loadbar { position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; z-index: 3; }
.loadbar::after { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; background: var(--accent); animation: load 1s ease-in-out infinite; }
@keyframes load { to { left: 100%; } }

/* the status line: what is here, and the connection; both short, neither ever runs off the screen */
.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 16px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; flex: none; min-height: 32px; min-width: 0; }
.status-left { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-right { display: flex; gap: 12px; align-items: center; white-space: nowrap; flex: none; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.conn.on::before { background: #22c55e; }     /* green: fine */
.conn.wait::before { background: #f59e0b; }   /* amber: on its way */
.conn.off::before { background: var(--faint); }   /* grey: off */
.conn.bad::before { background: var(--danger); }  /* red: a fault */

/* ---- list.css ---- */
/* list.css: the file list (a grid of rows), its header, the ways in (Shared Folder, Users, Guests: drawn differently
   from a normal folder), the empty and error states, the drop zone. */
.list { flex: 1; overflow: auto; outline: none; background: var(--surface); position: relative; overscroll-behavior: contain; }
.list-head, .row { display: grid; grid-template-columns: 40px 30px minmax(120px, 1fr) 150px 190px 40px; align-items: center; column-gap: 8px; padding: 0 12px 0 8px; }
.list.trash-view .list-head, .list.trash-view .row { grid-template-columns: 40px 30px minmax(120px, 1fr) minmax(90px, .6fr) 110px 250px 8px; }
.list.search-view .list-head, .list.search-view .row { grid-template-columns: 40px 30px minmax(120px, 1fr) minmax(90px, .7fr) 120px 170px 40px; }
.list .row.recent { grid-template-columns: 40px 30px minmax(120px, 1fr) minmax(90px, .7fr) 190px 40px; }  /* a program's recent files: name, where, when */
.list-head { position: sticky; top: 0; z-index: 2; height: 36px; background: var(--surface-2); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: .01em; }
.list-head .col { border: 0; background: none; padding: 4px 6px; margin-left: -6px; border-radius: 6px; text-align: left; color: inherit; font-weight: inherit; display: inline-flex; align-items: center; gap: 4px; justify-self: start; }
.list-head .col.num { justify-self: end; margin-left: 0; margin-right: -6px; }
.list-head button.col:hover { background: var(--line-2); color: var(--text); }
.list-head .col.sorted { color: var(--text); }
.list-head .col .arrow { font-size: 10px; }
.list-label { padding: 12px 16px 6px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.list-hint { padding: 22px 24px; color: var(--muted); text-align: center; }
.row { height: var(--row); border-bottom: 1px solid var(--line-2); cursor: pointer; user-select: none; -webkit-user-select: none; position: relative; }
a.row { color: inherit; text-decoration: none; -webkit-touch-callout: none; }  /* a row is its item's link (view.js linkOf): it looks like a row */
.row:hover { background: var(--surface-2); }
.row.sel { background: var(--accent-soft); }
.row.sel:hover { background: var(--accent-soft-2); }
.row.focus { box-shadow: inset 2px 0 0 var(--accent); }
.list:focus-visible .row.focus { box-shadow: inset 0 0 0 2px var(--focus); }
.row.cut { opacity: .55; }
.row.drop-on { background: var(--accent-soft-2); box-shadow: inset 0 0 0 2px var(--accent); }
.row.nomatch { opacity: .42; cursor: default; }
.row.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: var(--ok-soft); } }
.row .check, .list-head .check { width: 24px; height: 24px; border-radius: 7px; border: 1.8px solid var(--faint); background: var(--surface); display: grid; place-items: center; margin: auto; padding: 0; color: transparent; transition: border-color .12s; }
.row .check { position: relative; }
.row .check::before { content: ""; position: absolute; inset: -9px; }  /* the box takes a click a little around it, so a near miss ticks instead of opening */
.row:hover .check, .list-head .check:hover { border-color: var(--muted); }
.row.sel .check, .list-head .check[aria-checked=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row .check svg, .list-head .check svg { width: 16px; height: 16px; }
.nocheck { width: 24px; height: 24px; margin: auto; }
.row .ico { width: 24px; height: 24px; color: var(--muted); justify-self: center; }
.row .ico.folder { color: var(--folder); }
.row .ico.image { color: #0ea5a4; } .row .ico.audio { color: #a855f7; } .row .ico.video { color: #e11d48; }
.row .ico.pdf { color: #dc2626; } .row .ico.archive { color: #b45309; } .row .ico.book { color: #0f766e; } .row .ico.code { color: #4f46e5; }
.row .ico.person { color: var(--people); }
.row img.ico.app { border-radius: 6px; object-fit: cover; }  /* a file one of the programs owns: that program's icon */
.row .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.dir .name-text { font-weight: 550; }
.row .badge { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px; border-radius: 10px; background: var(--priv-soft); color: var(--priv); font-size: 11.5px; font-weight: 650; flex: none; }
.row .badge svg { width: 12px; height: 12px; }
.row .badge.inherited { background: none; padding: 0 2px; }
.row .sub { display: none; }
.row .size, .row .when, .row .from { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.row .size { text-align: right; }
.row .more { width: 34px; height: 34px; border: 0; border-radius: 9px; background: none; color: var(--muted); display: grid; place-items: center; opacity: .5; padding: 0; }
.row:hover .more, .row.sel .more, .row .more:focus-visible { opacity: 1; }
.row .more:hover { background: var(--line); color: var(--text); }
.row.locked { cursor: default; }
.row.locked .name-text { color: var(--muted); }
.row.locked .ico { color: var(--priv); }

/* The ways in. The Shared Folder is not a normal folder: everyone sees what is in it. Its own icon, a teal band, a
   line saying what it is. Users and Guests (for those who get them) the same way in violet. No box: nothing is done
   to them, they are only gone into. */
.row.way { height: calc(var(--row) + 10px); background: var(--shared-soft); border-bottom-color: var(--surface); box-shadow: inset 4px 0 0 var(--shared); }
.row.way:hover { background: var(--shared-soft-2); }
.row.way .name-text { font-weight: 650; flex: none; }
.row.way .ico { width: 28px; height: 28px; color: var(--shared); }
.row.way .way-text { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row.way-users, .row.way-guests { background: var(--people-soft); box-shadow: inset 4px 0 0 var(--people); }
.row.way-users:hover, .row.way-guests:hover { background: var(--people-soft-2); }
.row.way-users .ico, .row.way-guests .ico { color: var(--people); }

.empty { display: grid; place-items: center; text-align: center; padding: 64px 24px; color: var(--muted); }
.empty svg { width: 56px; height: 56px; color: var(--line); margin-bottom: 10px; }
.empty .empty-title { color: var(--text); font-weight: 600; font-size: 16px; margin-bottom: 4px; }
.fail { display: grid; place-items: center; text-align: center; padding: 56px 24px; }
.fail .fail-card { max-width: 460px; }
.fail .fail-title { font-weight: 650; font-size: 18px; margin-bottom: 6px; }
.fail .fail-why { color: var(--muted); margin-bottom: 16px; overflow-wrap: anywhere; }
.fail .fail-retry { color: var(--faint); font-size: 13px; margin-top: 10px; }
/* a file opened from its link in a new tab (app.js openLink): over the list, under the header */
.fail.launch { position: absolute; inset: 0; z-index: 6; background: var(--surface); align-content: center; }
.launch .launch-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

.dropzone { position: absolute; inset: 8px; z-index: 5; border: 2.5px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent-soft) 82%, transparent); display: grid; place-items: center; pointer-events: none; }
.dropzone-card { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--accent); font-weight: 650; font-size: 17px; background: var(--surface); padding: 18px 28px; border-radius: 14px; box-shadow: var(--shadow-lg); }
.dropzone-card svg { width: 34px; height: 34px; }

/* ---- ui.css ---- */
/* ui.css: menus, dialogs, toasts, the transfers panel. */
.menu { position: fixed; z-index: 50; min-width: 230px; max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px); overflow: auto; padding: 6px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
.menu .mi { display: flex; align-items: center; gap: 11px; width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: none; text-align: left; white-space: nowrap; }
.menu .mi:hover:not(:disabled), .menu .mi:focus-visible { background: var(--line-2); outline: none; }
.menu .mi svg { width: 19px; height: 19px; color: var(--muted); }
.menu .mi .mi-img { width: 22px; height: 22px; border-radius: 5px; margin: 0 -1.5px; flex: none; }  /* a program's own icon ("Open with") */
.menu .mi .mi-gap { width: 19px; flex: none; }
.menu .mi .mi-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.menu .mi .mi-on { color: var(--accent); }
.menu .mi .k { margin-left: auto; color: var(--faint); font-size: 12px; padding-left: 18px; }
.menu .mi.danger { color: var(--danger); }
.menu .mi.danger svg { color: var(--danger); }
.menu .mi:disabled { opacity: .45; cursor: default; }
.menu .msep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu .mhead { padding: 6px 12px 4px; color: var(--muted); font-size: 12.5px; font-weight: 600; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(8, 12, 22, .42); display: grid; place-items: center; padding: 16px; animation: fade .12s ease-out; }
@keyframes fade { from { opacity: 0; } }
.dialog { width: min(460px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--raised); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 20px; border: 1px solid var(--line); animation: pop .14s ease-out; }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
.dialog h2 { margin: 0 0 8px; font-size: 18px; font-weight: 650; overflow-wrap: anywhere; }
.dialog .d-body { color: var(--muted); }
.dialog .d-body p { margin: 0 0 10px; }
.dialog .d-body b { color: var(--text); font-weight: 600; }
.dialog .d-list { margin: 8px 0 12px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); max-height: 180px; overflow: auto; font-size: 13px; color: var(--text); }
.dialog .d-list div { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dialog .d-list .d-meta { color: var(--muted); }
.dialog input[type=text], .dialog input[type=password] { width: 100%; height: 44px; margin: 6px 0 4px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); outline: none; }
.dialog input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dialog .d-msg { min-height: 20px; font-size: 13px; color: var(--danger); margin-top: 4px; }
.dialog .d-msg.info { color: var(--muted); }
.dialog .d-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.dialog .d-check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text); font-size: 13.5px; }
.dialog table.keys { width: 100%; border-collapse: collapse; font-size: 13.5px; color: var(--text); }
.dialog table.keys td { padding: 5px 4px; border-bottom: 1px solid var(--line-2); vertical-align: top; overflow-wrap: anywhere; }
.dialog table.keys td:first-child { width: 42%; }

.toasts { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(560px, calc(100vw - 24px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px 11px 16px; border-radius: 12px; background: #1f2633; color: #f1f4fa; box-shadow: var(--shadow-lg); animation: pop .16s ease-out; }
@media (prefers-color-scheme: dark) { .toast { background: #e8ecf6; color: #121826; } }
.toast.bad { background: var(--danger); color: #fff; }
@media (prefers-color-scheme: dark) { .toast.bad { background: #8f1d1d; color: #fff; } }
.toast .t-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast .t-btn { border: 0; background: none; color: inherit; font-weight: 700; padding: 6px 10px; border-radius: 8px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.toast .t-btn:hover { background: rgba(127, 127, 127, .2); }
.toast .t-x { border: 0; background: none; color: inherit; opacity: .8; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; padding: 0; flex: none; }
.toast .t-x svg { width: 16px; height: 16px; }

.transfers { position: fixed; right: 16px; bottom: 44px; z-index: 40; width: min(400px, calc(100vw - 24px)); max-height: min(60vh, 480px); display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; }
.transfers .tr-head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.transfers.collapsed .tr-head { border-bottom: 0; }
.transfers .tr-title { flex: 1; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.transfers .tr-total { height: 3px; background: var(--line-2); }
.transfers .tr-total i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.transfers .tr-list { overflow: auto; }
.transfers.collapsed .tr-list { display: none; }
.tr-item { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--line-2); }
.tr-item svg { width: 18px; height: 18px; color: var(--muted); }
.tr-item .tr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.tr-item .tr-line { grid-column: 2; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.tr-item .tr-bar { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
.tr-item .tr-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .2s; }
.tr-item.done .tr-bar i { background: var(--ok); }
.tr-item.error .tr-bar i { background: var(--danger); }
.tr-item.error .tr-line { color: var(--danger); }
.tr-item .tr-acts { grid-row: 1 / 3; grid-column: 3; display: flex; gap: 2px; }
.tr-item .tr-acts button { width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.tr-item .tr-acts button:hover { background: var(--line-2); color: var(--text); }
.tr-item .tr-acts svg { width: 16px; height: 16px; }

.blocked { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; color: var(--muted); }

/* ---- phone.css ---- */
/* phone.css: narrow screens (a phone, or the floating window's full-screen sheet). The same page in the same order:
   the header, the row of buttons (the sign above the word, big enough for a thumb), the line saying whose files
   these are, two-line rows with big targets (the box, the row, …), the path on its own row below the top, search
   behind a button. */
@media (max-width: 720px) {
  body { font-size: 15.5px; }
  :root { --row: 60px; }
  .top { padding: 0 8px 0 4px; padding-top: env(safe-area-inset-top); }
  .top-row { height: 54px; gap: 4px; }
  apps-button { --apps-h: 42px; }  /* the stacked Apps button (stack="720") */
  .top .refresh-btn, .top .search-btn { display: inline-grid; }
  .brand { flex: 1; min-width: 0; font-size: 15.5px; padding-left: 2px; }
  .brand-mark { display: none; }
  .brand-name { white-space: normal; line-height: 1.15; overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }  /* two short lines, never cut off */
  .top-row > .crumbs { display: none; }
  .app.at-root .crumbs-row { display: none; }
  .crumbs-row { display: block; padding: 0 6px 6px; }
  .crumbs-phone { overflow-x: auto; scrollbar-width: none; flex: none; }
  .crumbs-phone::-webkit-scrollbar { display: none; }
  .crumb { font-size: 13.5px; padding: 4px 6px; }
  .search { display: none; }
  .app.searching .search { display: flex; position: absolute; left: 8px; right: 8px; top: calc(7px + env(safe-area-inset-top)); width: auto; z-index: 20; }
  .app.searching .search input { height: 40px; font-size: 16px; box-shadow: var(--shadow-lg); }
  .search .hint-key { display: none; }
  .account { height: 38px; padding: 0 4px; max-width: 130px; }
  .account.signed .acc-text { display: none; }  /* the picture or the initial alone: the line above the list has the name */
  .account.visitor { padding: 0 12px 0 9px; font-size: 14px; }

  .toolbar { padding: 6px 8px; gap: 6px; min-height: 0; }
  .toolbar .btn { flex-direction: column; gap: 1px; height: 54px; min-width: 62px; padding: 0 9px; font-size: 12.5px; border-radius: 12px; }
  .toolbar .btn svg { width: 22px; height: 22px; }
  .toolbar .btn.count { min-width: 50px; color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .toolbar .btn.count .btn-text { font-size: 14px; font-weight: 700; }
  .toolbar .bar-text { white-space: normal; font-size: 13px; line-height: 1.25; }
  .keep-check { flex: 1; font-size: 13.5px; line-height: 1.2; }
  .notice, .whose { padding: 7px 12px; font-size: 13.5px; }

  .list-head { display: none; }
  .row, .list.trash-view .row, .list.search-view .row, .list .row.recent { grid-template-columns: 38px 30px minmax(0, 1fr) 44px; grid-template-rows: auto auto; column-gap: 8px; row-gap: 0; padding: 0 2px 0 4px; height: var(--row); align-content: center; }
  .row .check, .row .nocheck { grid-row: 1 / 3; grid-column: 1; width: 28px; height: 28px; }
  .row .ico { grid-row: 1 / 3; grid-column: 2; width: 28px; height: 28px; }
  .row .name { grid-column: 3; grid-row: 1; }
  .row .sub { display: block; grid-column: 3; grid-row: 2; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .size, .row .when, .row .from, .row.way .way-text { display: none; }
  .row .more, .row > span:last-child { grid-column: 4; grid-row: 1 / 3; }
  .row .more { opacity: 1; width: 44px; height: 44px; }
  .row.focus { box-shadow: none; }
  .row.way { height: calc(var(--row) + 6px); }
  .row.way.focus { box-shadow: inset 4px 0 0 var(--shared); }
  .row.way-users.focus, .row.way-guests.focus { box-shadow: inset 4px 0 0 var(--people); }
  .list-label { padding: 10px 12px 4px; }
  .list { padding-bottom: 24px; }

  .status { padding: 4px 12px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); font-size: 12.5px; min-height: 28px; }
  .transfers { left: 8px; right: 8px; width: auto; bottom: calc(40px + env(safe-area-inset-bottom)); }
  .toasts { bottom: calc(44px + env(safe-area-inset-bottom)); }
  .scrim { place-items: end center; padding: 0; }
  .dialog { width: 100%; border-radius: 18px 18px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(30px); opacity: .4; } }
  .dialog .d-actions .btn { flex: 1; height: 46px; }
  .dialog input[type=text], .dialog input[type=password] { height: 48px; font-size: 16px; }
  .menu { left: 8px !important; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); top: auto !important; border-radius: 16px; padding: 8px; max-height: 80dvh; }
  .menu .mi { height: 48px; font-size: 15.5px; }
  .menu .mi .k { display: none; }
}

<script>
// ---- relay-client.js ----
/* relay-client.js 3: the PC Relay client (ONE source: Projects\pc-relay\client\relay-client.js; each page's build
   copies it in, so never edit a copy). Talks to PC Relay 3 (accounts) on Jon's PC. The relay decides every request;
   this file carries the pass, remembers who this browser is, and says plainly what the PC answered.
   The exact requests: Projects\cool-tools-upgrade\API-relay.md.

   - Nothing happens until the page calls something: no background traffic of its own (seen() is the page's call).
   - The PC's address: read from relay.json beside the programs ("../relay.json" from a program's page, or
     opts.addressFile), fresh before the first connection and again after a failed one (at most once a minute).
     {"address": "https://..."}; http only for 127.0.0.1 and localhost (the stage). No address is built in: if the file
     cannot be read the cloud is simply off, with a plain reason (status "off", where.why). opts.base names the address
     instead (tests, the relay's own window on the local door).
   - Kept in this browser (localStorage, shared by every page of the site): "relay-pass" ({pass, device, at}) and
     "relay-account" ({id, name, kind, number, at}), so the name shows at once, even with the cloud off. Another tab's
     sign-in, sign-out or change arrives as an "account" event.
   - The pass goes in the X-Relay-Pass header (HTTP) or the WebSocket subprotocol "pass.<p>"; never in a URL.
   - When the PC says the pass is not valid any more (X-Relay-Info: pass-unknown, or the ping's pass "unknown"), the
     pass and the account are forgotten and "account" fires with null. me() forgets them only on a whole answer that
     says {account: null}. An answer cut off, garbled or late, a timeout or a network error never ends a sign-in:
     it is a result with ok false and kind "network" or "timeout".
   - Errors from the relay are { why, kind }; every result here carries why and kind.

   const R = RelayClient.create({ app: "plan-cutter", log });
   await R.ping();                 // { ok, latency, info }
   R.account();                    // at once, from this browser: { id, name, kind, number } or null
   await R.me();                   // from the PC: { ok, account, can, programs, network, limited }
   R.can("files.shared.change");  R.canUse("voice");      // from the last me()
   await R.accountsHere();         // { ok, accounts: [{ id, name, kind, number, picture, hasPassword }] }
   await R.signIn(name, password); // { ok, kind, why, account }
   await R.signOut();              // { ok }
   await R.guest();                // { ok, account }  (a guest for this browser; itself when it has an account)
   await R.setup({ name, password });   // { ok, kind, why, account }
   await R.update({ name, password });  // { ok, kind, why, account }   (password: null removes it)

  // 1 s .. 30 s while it fails. restart(): again with the browser's present pass (after the account changed).

    ApiError,
    get client() { return c(); },
    get base() { return c().base; },
    get where() { return c().where; },                // { url, from: "file" | "page" | "none" | "unread", why }
    account: () => c().account(),                     // at once, from this browser: { id, name, kind, number } or null
    hasPass: () => c().signedIn(),
    onAccount: (fn) => { c(); acctFns.add(fn); },     // the browser's account changed (fn(account or null))

    info: () => json("GET", "info"),

    search: (q, signal) => json("GET", "search?q=" + encodeURIComponent(q), { signal }),
    trash: () => json("GET", "trash"),
    apps: () => json("GET", "apps", { timeout: 15000 }),                                    // the one list of programs
    recent: (app) => json("GET", `app/${encodeURIComponent(app)}/recent`, { timeout: 15000 }),   // a program's recent files
    storage: () => json("GET", "me/storage", { timeout: 15000 }),                           // { bytes, files, low, limit? }
    post: (path, body, opts) => json("POST", path, Object.assign({ json: body || {}, timeout: 120000 }, opts || {})),

    // A link the browser's own downloads (or a new tab) can open without the pass. A file in the Shared Folder that
    // is not private has its own plain link. Everything else (a person's own files, private things, a zip of a
    // folder or of several items) goes through a ticket: a link good for 10 minutes that gives what this person may
    // see. Anyone may ask for one, for what they can already see.
    async link(items, opts = {}) {
      const one = items.length === 1 ? items[0] : null;
      if (one && !one.dir && !opts.zip && FM.isPublic(one)) return c().url("files", `file/${one.id}/${encodeURIComponent(one.name)}${opts.inline ? "" : "?dl=1"}`);

      return c().url("files", t.url);
    },

    zipPath: (items, name) => items.length === 1 && items[0].dir ? "zip/" + items[0].id : "zip?" + new URLSearchParams({ ids: items.map((i) => i.id).join(","), name: name || "" }),
    pictureUrl: (id) => c().url("files", "picture/" + encodeURIComponent(id)),
  };
})();

// ---- apps.js ----
// apps.js: the one list of Jon's programs, read from the PC when the page runs (GET apps: the cloud's hidden
// .relay-apps\apps.json, which the Apps kit's build writes from app-kit\programs.json). Nothing about programs is
// built into this page. From the list: which program owns an extension (a click on such a file opens it in that
// program), which programs can open a file ("Open with"), their names, icons and folders. A program marked
// "listed": false is in the list only so the PC knows its id (a demo, the starter template): never offered here.
"use strict";
(function () {
  let programs = [], loaded = false, failed = "", job = null;
  const okPath = (p) => typeof p === "string" && /^[a-z0-9][a-z0-9._\-/]*$/i.test(p) && !p.includes("..") && !p.includes("//");
  const exts = (a) => (Array.isArray(a) ? a.map((x) => String(x).trim().toLowerCase()).filter((x) => /^\.[a-z0-9][a-z0-9._-]*$/.test(x)) : []);

    const list = Array.isArray(data) ? data : data && Array.isArray(data.programs) ? data.programs : [];
    programs = list.filter((p) => p && typeof p.id === "string" && /^[a-z0-9][a-z0-9-]*$/.test(p.id)).map((p) => ({
      id: p.id, name: String(p.name || p.id).slice(0, 60), path: okPath(p.path) ? p.path : "", folder: typeof p.folder === "string" ? p.folder : "",
      extensions: exts(p.extensions), opens: exts(p.opens), listed: p.listed !== false,
    }));
    loaded = true; failed = "";
  }
  // load(): read the list (again). Never throws: without the list, files open as the browser opens them, and the
  // page says so in one line (view.js) for as long as the list cannot be read.
  function load() {
    if (!job) job = FM.api.apps().then(adopt, (e) => { failed = (e && e.message) || "it could not be read"; if (!e || !e.net) FM.report("apps", e, { what: "the list of programs could not be read" }); })
      .finally(() => { job = null; });
    return job;
  }
  const usable = (p) => p.listed && p.path;
  // the program a click opens this file in: the one that has its extension as its own
  const owner = (name) => { const e = FM.dotExt(name); return (e && programs.find((p) => usable(p) && p.extensions.includes(e))) || null; };
  // every program that can open it ("Open with"): its owner first, then the ones that list the extension under opens
  function openers(name) {
    const e = FM.dotExt(name);
    if (!e) return [];
    return programs.filter((p) => usable(p) && p.extensions.includes(e)).concat(programs.filter((p) => usable(p) && !p.extensions.includes(e) && p.opens.includes(e)));
  }
  FM.apps = {
    load, owner, openers,
    get loaded() { return loaded; },
    get failed() { return failed; },
    get list() { return programs.slice(); },
    byId: (id) => programs.find((p) => p.id === id) || null,
    // the program's page told to open that file, beside this page on the site: ../<path>#open=<file id>
    url: (p, fileId) => new URL("../" + p.path, location.href.split("#")[0]).href + "#open=" + encodeURIComponent(fileId),
    icon: (id, size) => FM.api.client.url("files", `apps/icon/${encodeURIComponent(id)}-${size || 48}.png`),
  };
})();

// ---- report.js ----
// report.js: the page's own failures go to the PC's log (the files program's files.log, through PC Relay: POST log),
// so a failure someone saw can be looked up later: what was being done, on what, the message they saw, the PC's
// answer (its status and error), the transfer's tries, the page's version. Script errors too. Sent in the background,
// a few at a time; kept in this browser (up to 100, localStorage "fm-reports") while the PC cannot be reached, and
// sent when it answers again. Never a password, a pass or a download ticket (a ticket link is blanked; the PC blanks
// again). Since files 3.0 (2026-11-11) the PC takes them from anyone, a visitor too (60 per device in 10 minutes).
//   FM.report(action, error, extra)   error: an FM.ApiError, an Error or a plain message; extra: { what, items,
//                                     name, path, folder, transfer, detail, ... } (anything JSON)
"use strict";
(function () {
  const KEY = "reports", MAX = 100, BATCH = 20;
  let queue = FM.store.get(KEY, []);
  if (!Array.isArray(queue)) queue = [];
  let timer = 0, sending = false, wait = 3000, sent = 0;
  const save = () => FM.store.set(KEY, queue);
  const clean = (s, n) => String(s == null ? "" : s).replace(/\/t\/[A-Za-z0-9_-]{16,}/g, "/t/[ticket]").slice(0, n || 2000);
  // a value as plain data: strings blanked of tickets and cut, lists cut, at most 4 levels deep
  function plain(v, depth) {
    if (v == null || typeof v === "number" || typeof v === "boolean") return v;
    if (typeof v === "string") return clean(v);
    if (depth > 3) return "[cut]";
    if (Array.isArray(v)) return v.slice(0, 50).map((x) => plain(x, depth + 1));
    if (typeof v === "object") {
      const out = {};
      for (const [k, x] of Object.entries(v).slice(0, 40)) if (typeof x !== "function") out[k] = plain(x, depth + 1);
      return out;
    }
    return clean(String(v));
  }
  function itemOf(it) {
    if (!it) return null;
    if (typeof it === "string") return { name: it };
    return { id: it.id || it.tid || undefined, name: it.name, path: it.path || undefined, dir: it.dir || undefined, size: it.size || undefined, private: it.private || undefined };
  }

  function report(action, e, extra) {
    try {
      if (e && e.aborted) return; // the person stopped it
      const S = FM.S || {};
      const r = { at: new Date().toISOString(), action: String(action || "page"), page: (window.FM_BUILD && FM_BUILD.version) || "" };
      if (e != null) {
        if (typeof e === "string") r.error = clean(e);
        else {
          r.error = clean(e.message || String(e));
          if (e.status != null) r.status = e.status;
          if (e.code) r.code = clean(e.code, 100);
          if (e.net) r.net = true;
          if (e.signin) r.signin = true;
          if (e.data && typeof e.data === "object" && Object.keys(e.data).length) r.answer = plain(e.data, 1); // the PC's own answer
          if (e.stack && !(e instanceof FM.ApiError)) r.detail = clean(e.stack, 6000);
        }
      }
      const x = Object.assign({}, extra || {});
      if (x.items) x.items = [].concat(x.items).slice(0, 50).map(itemOf);
      for (const [k, v] of Object.entries(x)) if (v !== undefined) r[k] = plain(v, 1);
      if (!r.folder && S.folder) r.folder = { id: S.folder.id, name: S.folder.name };
      if (S.view && S.view !== "folder") r.view = S.view;
      r.who = S.me && S.me.account ? S.me.account.kind : "visitor"; // the kind only: the PC's own line names the account
      if (FM.embedded) r.embedded = (S.pick && clean(S.pick.host, 80)) || true; // inside another page's window
      r.online = navigator.onLine;
      if (navigator.connection && navigator.connection.effectiveType) r.network = navigator.connection.effectiveType;
      r.where = location.origin + location.pathname;
      queue.push(r);
      if (queue.length > MAX) queue.splice(0, queue.length - MAX);
      save();
      soon(600);
    } catch (x) { /* a report must never break the page */ }
  }
  function soon(ms) { clearTimeout(timer); timer = setTimeout(flush, ms); }

  // Send what is waiting, BATCH at a time. A failure keeps them (and waits longer); a refusal of the report
  // itself (400: the PC cannot read it) drops that batch, so it is not sent for ever.
  async function flush() {
    clearTimeout(timer);
    if (sending || !queue.length || !FM.api) return;
    sending = true;
    try {
      while (queue.length) {
        const batch = queue.slice(0, BATCH);
        let r;
        try { r = await FM.api.raw("POST", "log", { json: { reports: batch }, timeout: 15000 }); }
        catch (e) { break; }
        if (r.ok || r.status === 400 || r.status === 413) { queue.splice(0, batch.length); save(); sent += batch.length; wait = 3000; continue; }
        break; // the PC is busy, switched off or not reachable: later
      }
    } finally { sending = false; }
    if (queue.length) { soon(wait); wait = Math.min(300000, wait * 2); }
  }

  // Script errors: the page's own bugs, with where they were (browser extensions' errors left out).
  addEventListener("error", (ev) => {
    const src = ev.filename || "";
    if (/^(chrome|moz|safari)-extension:/.test(src) || /ResizeObserver loop/.test(ev.message || "")) return;
    report("page-error", ev.error || ev.message || "a script error", { source: src ? `${src}:${ev.lineno}:${ev.colno}` : undefined });
  });
  addEventListener("unhandledrejection", (ev) => {
    const e = ev.reason;
    if (e && (e.aborted || e.name === "AbortError")) return;
    report("page-error", e instanceof Error ? e : String(e), { what: "a promise failed with nothing to catch it" });
  });
  addEventListener("online", () => { wait = 3000; soon(500); });
  if (queue.length) soon(4000); // the ones kept from an earlier visit

  FM.report = report;
  FM.reports = { flush, get waiting() { return queue.slice(); }, get sent() { return sent; } };
})();

// ---- unzip.js ----
// unzip.js: a zip into File objects, with the browser's own decompressor (stored and deflated entries; zip64).
// Used when a page asks for a folder "as its files": the PC sends the folder as ONE zip (one request instead of
// thousands), and the files come out here with their paths. Modelled on the book reader's zip.js (read the

// ---- ui.js ----
// ui.js: dialogs, menus and toasts. A dialog keeps the focus inside it (Tab cycles), Enter does the main
// button, Escape cancels; a menu opens at the pointer (a sheet from the bottom on a phone) and closes on any
// outside tap or Escape. Toasts say what happened; an error stays until it is closed (nothing fails silently).
"use strict";
(function () {
  const { h, icon } = FM;
  let menuEl = null, menuBack = null, menuAt = 0;
  const dialogs = [];
  // A tap or click outside closes a menu or a dialog, but not in its first 400 ms: a row opens on one click (app.js),
  // and the second half of a double-click or double-tap must not close the sign-in box or menu that click opened.
  const GRACE = 400;

  function closeMenu() {
    if (!menuEl) return false;

  // the end: the choice in use) }, "-" (a line), { head: "text" }]

  // resolves { value, text, checked } or null (cancelled).

  async function prompt(title, o = {}) {

      actions: [{ text: "Cancel", value: false }, { text: o.okText || "OK", value: true, primary: true }] });

// ---- transfers.js ----
// transfers.js: every upload and download, in one panel: progress, speed, time left, Cancel, Retry, and the
// reason when one fails (it stays until dismissed). Up to 3 uploads and 2 downloads run at once; the rest wait.
// A transfer is { kind, name, total, run(t) }: run does the work and calls t.progress(loaded, total).
"use strict";
(function () {
  const { h, icon } = FM;

      t.loaded = loaded;
      if (total) t.total = total;
      const now = performance.now();
      t.samples.push([now, loaded]);
      while (t.samples.length > 2 && now - t.samples[0][0] > 3000) t.samples.shift();
      const [t0, l0] = t.samples[0];
      if (now - t0 > 400) t.speed = (loaded - l0) / ((now - t0) / 1000);
      paint();
    };
    t.say = (note) => { t.note = note || ""; paint(); };
    t.cancel = () => {
      if (t.state === "queued") { t.state = "cancelled"; paint(); pump(); return; }
      if (t.state === "active" && t.ac) t.ac.abort();

    const why = !act.length ? "" : `${FM.plural(act.length, act.every((t) => t.kind === "up") ? "upload" : act.every((t) => t.kind === "down") ? "download" : "transfer")} still running`;

    } else {

    }

      icon(act.some((t) => t.kind === "up") || (!act.length && ups.length >= downs.length) ? "upload" : "download"), h("span.tr-title", { text: title }));

    head.addEventListener("click", toggle);
    head.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });

    const ul = h("div.tr-list");
    for (const t of list.slice().reverse()) {

// ---- view.js ----
// view.js: the page's state (FM.S) and drawing it. render() redraws everything from the state; sel() only the parts

// What is drawn follows the person (files 3.0, 2026-11-11): their own files, the Shared Folder (drawn differently),

    focus: null,             // the keyboard's cursor (arrows move it; Enter opens it; Space ticks it)
    anchor: null,            // the last row ticked or unticked: Shift+click on a box ticks from there

      if (a.download) kids.push(tb("download", "download", "Download", { key: "D" }));

  function renderWhose() {
    const el = $(".whose"), p = place();

  function renderStatus() {
    const sel = FM.selected();

    if (S.view === "trash") left = `${FM.plural(S.items.length, "item")} · ${FM.size(S.items.reduce((a, i) => a + (i.size || 0), 0))}`;
    else if (S.view === "search") left = S.loading ? "Searching…" : `${FM.plural(S.items.length, "match", "matches")}${S.more ? " (the first 300)" : ""}`;
    else if (S.folder) {
      const real = S.items.filter((i) => !WAYS[i.kind]);
      const dirs = real.filter((i) => i.dir).length, files = real.length - dirs;
      left = `${FM.plural(dirs, "folder")}, ${FM.plural(files, "file")}`;
    } else left = "";
    if (sel.length) left = `${sel.length} selected (${FM.size(sel.reduce((a, i) => a + (i.size || 0), 0))}) · ` + left;

    $(".status-left").textContent = left;

    // fine, amber is on its way, grey is off, red is a fault
    const conn = $(".conn"), st = ["on", "off", "bad"].includes(S.conn.state) ? S.conn.state : "wait";
    conn.className = "conn " + st;
    conn.textContent = st === "on" ? "Connected" : st === "off" ? "Cloud File Manager is off." : st === "bad" ? "Not working" : "Connecting…";
    conn.title = S.conn.why || "";
  }

  // One-line notices, never more than they must be: something is picked up, the PC is low on space, the PC's own trouble.
  function renderNotes() {
    const el = $(".notice");
    const list = [];
    if (S.clip && !S.pick) list.push({ text: `${S.clip.mode === "cut" ? "Moving" : "Copying"} ${FM.plural(S.clip.items.length, "item")}: go to the folder, then press Paste here.` });
    for (const k of ["space", "apps", "privacy"]) if (S.notes[k]) list.push(S.notes[k]);
    el.hidden = !list.length;
    if (!list.length) return;
