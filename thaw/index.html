<main id="game"><canvas id="globe"></canvas></main>
<script>
/* relay-client.js 3: the PC Relay client (ONE source: Projects\pc-relay\client\relay-client.js; each page's build
   copies it in, so never edit a copy). Talks to PC Relay 3 (accounts) on Jon's PC. The relay decides every request;
   this file carries the pass, remembers who this browser is, and says plainly what the PC answered.
   The exact requests: Projects\cool-tools-upgrade\API-relay.md.

   - Nothing happens until the page calls something: no background traffic of its own (seen() is the page's call).
   - The PC's address: read from relay.json beside the programs ("../relay.json" from a program's page, or
     opts.addressFile), fresh before the first connection and again after a failed one (at most once a minute).
     {"address": "https://..."}; http only for 127.0.0.1 and localhost (the stage). No address is built in: if the file
     cannot be read the cloud is simply off, with a plain reason (status "off", where.why). opts.base names the address
     instead (tests, the relay's own window on the local door).
   - Kept in this browser (localStorage, shared by every page of the site): "relay-pass" ({pass, device, at}) and
     "relay-account" ({id, name, kind, number, at}), so the name shows at once, even with the cloud off. Another tab's
     sign-in, sign-out or change arrives as an "account" event.
   - The pass goes in the X-Relay-Pass header (HTTP) or the WebSocket subprotocol "pass.<p>"; never in a URL.
   - When the PC says the pass is not valid any more (X-Relay-Info: pass-unknown, or the ping's pass "unknown"), the
     pass and the account are forgotten and "account" fires with null. me() forgets them only on a whole answer that
     says {account: null}. An answer cut off, garbled or late, a timeout or a network error never ends a sign-in:
     it is a result with ok false and kind "network" or "timeout".
   - Errors from the relay are { why, kind }; every result here carries why and kind.

   const R = RelayClient.create({ app: "plan-cutter", log });
   await R.ping();                 // { ok, latency, info }
   R.account();                    // at once, from this browser: { id, name, kind, number } or null
   await R.me();                   // from the PC: { ok, account, can, programs, network, limited }
   R.can("files.shared.change");  R.canUse("voice");      // from the last me()
   await R.accountsHere();         // { ok, accounts: [{ id, name, kind, number, picture, hasPassword }] }
   await R.signIn(name, password); // { ok, kind, why, account }
   await R.signOut();              // { ok }
   await R.guest();                // { ok, account }  (a guest for this browser; itself when it has an account)
   await R.setup({ name, password });   // { ok, kind, why, account }
   await R.update({ name, password });  // { ok, kind, why, account }   (password: null removes it)
   R.seen();                       // "this app is open" (call once a minute while the page is visible)
   R.on("account", fn);            // fn(account or null)
   R.on("status", fn);             // fn({ state: checking|connected|off|offline|starting|ready|reload, why })
   await R.api("people");          // any /relay/ request: { ok, status, data, why, kind }
   R.call, R.fetch, R.url, R.ws, R.open, R.pcName, R.address, R.watch     // as in relay-client 2
*/
(function (root) {
  "use strict";
  const VERSION = 3;
  const RECHECK_MS = 60000, ADDRESS_MS = 6000;
  const PASS_KEY = "relay-pass", ACCOUNT_KEY = "relay-account", NAME_KEY = "relay-pc-name", YOUR_PC = "your PC";
  const trim = (u) => String(u || "").trim().replace(/\/+$/, "");
  const goodAddress = (a) =>
    /^https:\/\/[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:\d{1,5})?$/i.test(a) ||
    /^http:\/\/(127\.0\.0\.1|localhost)(:\d{1,5})?$/i.test(a);
  const store = {
    get(k) { try { return root.localStorage.getItem(k) || ""; } catch (e) { return mem[k] || ""; } },
    set(k, v) {
      try { if (v) root.localStorage.setItem(k, v); else root.localStorage.removeItem(k); }
      catch (e) { if (v) mem[k] = v; else delete mem[k]; }
    },
  };
  const mem = {}; // when localStorage is not available (a sandboxed page): this page only
  const json = (k) => { try { const j = JSON.parse(store.get(k) || "null"); return j && typeof j === "object" ? j : null; } catch (e) { return null; } };
  const cleanName = (n) => (typeof n === "string" ? Array.from(n.replace(/[\x00-\x1f\x7f-\x9f]/g, "").trim()).slice(0, 64).join("").trim() : "");
  const shortAcct = (a) => (a && a.id ? { id: a.id, name: String(a.name || ""), kind: String(a.kind || ""), number: a.number || 0 } : null);

  function httpWhy(status) {
    return ({ 400: "the PC refused that request", 401: "sign-in needed", 403: "not allowed", 404: "not found on the PC",
      409: "that clashes with something on the PC", 410: "this page is out of date: reload it", 426: "this page is out of date: reload it",
      429: "too many requests: wait a minute", 502: "the program on the PC did not answer", 503: "the PC said it is busy or switched off" })[status] || `the PC answered ${status}`;
  }
  function netWhy(err, ms) {
    if (err && err.name === "AbortError") return `no answer from the PC within ${Math.round(ms / 1000)} s`;
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "this device is offline";
    return "could not reach the PC (no network, or the PC is off or asleep)";
  }
  function netKind(err) {
    if (err && err.name === "AbortError") return "timeout";
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "offline";
    return "network";
  }
  const kindOf = (status) => status === 401 ? "signin" : status === 426 || status === 410 ? "reload" : "http";

  class Relay {
    constructor(opts) {
      opts = opts || {};
      this.app = String(opts.app || "page").toLowerCase().replace(/[^a-z0-9-]/g, "");
      this.log = typeof opts.log === "function" ? opts.log : null;
      this.addressFile = opts.addressFile || "";
      this.status = { state: "idle", why: "", at: Date.now() };
      this.info = null;
      this.latency = 0;
      this.bytes = 0;
      this._me = null;
      this._subs = { status: new Set(), account: new Set() };
      this._job = null;
      this._readAt = 0;
      this._acctSeen = JSON.stringify(shortAcct(json(ACCOUNT_KEY)));
      this._setBase(opts.base);
      if (typeof opts.onStatus === "function") this._subs.status.add(opts.onStatus);
      if (typeof addEventListener === "function") {
        addEventListener("storage", (e) => { if (!e || e.key === ACCOUNT_KEY || e.key === PASS_KEY || e.key === null) this._acctChanged(); });
      }
    }
    // ---- the PC's address ---------------------------------------------------------------------------------------
    _setBase(url) {
      this.given = trim(url);
      this.base = this.given;
      this.where = this.given ? { url: this.given, from: "page", why: "" } : { url: "", from: "unread", why: "" };
      this._readAt = 0;
    }
    setBase(url) { if (trim(url) !== this.given) this._setBase(url); }
    _fileUrl() {
      if (this.addressFile) return this.addressFile;
      try { return new URL("../relay.json", root.location.href).href; } catch (e) { return "../relay.json"; }
    }
    async address() { await this._ready(); return this.where; }
    async _ready() {
      if (this.given) return;
      const w = this.where.from;
      if (w === "unread" || (w === "none" && Date.now() - this._readAt >= RECHECK_MS)) await this._read();
    }
    _read() {
      if (!this._job) this._job = this._readNow().finally(() => { this._job = null; });
      return this._job;
    }
    async _recheck() {
      if (this.given || this._job || Date.now() - this._readAt < RECHECK_MS) return false;
      const was = this.base;
      await this._read();
      return this.base !== was;
    }
    async _readNow() {
      this._readAt = Date.now();
      const file = this._fileUrl(), was = this.where;
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ADDRESS_MS);
      let why = "";
      try {
        const sep = file.includes("?") ? "&" : "?";
        const r = await fetch(`${file}${sep}t=${Date.now()}`, { cache: "no-store", credentials: "omit", signal: ac.signal });
        if (!r.ok) throw new Error(`the site answered ${r.status}`);
        const j = await r.json().catch(() => null);
        const a = trim(j && j.address);
        if (!goodAddress(a)) throw new Error(j ? "it holds no usable address" : "it is not JSON");
        if (this.given) return;
        this.base = a;
        this.where = { url: a, from: "file", why: "" };
        if (was.url !== a) this._note(`the PC's address: ${a} (from ${file})`, false);
        return;
      } catch (e) {
        why = e && e.name === "AbortError" ? `no answer within ${ADDRESS_MS / 1000} s`
          : typeof navigator !== "undefined" && navigator.onLine === false ? "this device is offline"
          : e && e.name === "TypeError" ? "the site could not be reached"
          : String((e && e.message) || e);
      } finally { clearTimeout(timer); }
      if (this.given || was.from === "file") return; // read fine earlier in this page's life: that address stays
      const text = `the PC's address (${file}) could not be read (${why}): the cloud is off`;
      this.base = "";
      this.where = { url: "", from: "none", why: text };
      if (was.why !== text) this._note(text, true);
    }
    _note(text, warn) {
      if (this.log) { try { this.log(text); } catch (e) {} }
      try { if (typeof console !== "undefined") (warn ? console.warn : console.info)("relay-client: " + text); } catch (e) {}
    }
    // ---- events ----
    on(what, fn) {
      if (typeof what === "function") { fn = what; what = "status"; }
      const set = this._subs[what];
      if (!set || typeof fn !== "function") return () => {};
      set.add(fn);
      return () => set.delete(fn);
    }
    _set(state, extra) {
      this.status = Object.assign({ state, why: "", at: Date.now() }, extra || {});
      for (const f of this._subs.status) { try { f(this.status); } catch (e) {} }
    }
    _acctChanged() {
      const now = JSON.stringify(this.account());
      if (now === this._acctSeen) return;
      this._acctSeen = now;
      const a = this.account();
      // another person (or nobody) now: the rights the last me() gave are not theirs; can() says no until me() is asked again
      if (!a || !this._me || !this._me.account || this._me.account.id !== a.id) this._me = null;
      for (const f of this._subs.account) { try { f(a); } catch (e) {} }
    }
    // ---- the pass and the account, kept in this browser ----
    _pass() { const r = json(PASS_KEY); return r && typeof r.pass === "string" ? r.pass : ""; }
    _keep(pass, account) {
      if (pass !== undefined) store.set(PASS_KEY, pass ? JSON.stringify({ pass, at: Date.now() }) : "");
      if (account !== undefined) store.set(ACCOUNT_KEY, account ? JSON.stringify(Object.assign(shortAcct(account), { at: Date.now() })) : "");
      this._acctChanged();
    }
    _forget(why) {
      if (!this._pass() && !this.account()) return;
      this._me = null;
      this._keep("", null);
      this._note("this browser's sign-in ended on the PC" + (why ? ` (${why})` : ""), false);
    }
    // An answer speaks only about the pass its request carried. While it was on its way, another tab of this browser
    // may have signed in or switched user: the browser then holds a new pass, and an answer about the old one ("pass
    // unknown", "no account", an older account) must not wipe or overwrite the new sign-in. _current(sent) says whether
    // the pass sent is still the one kept.
    _current(sent) { return sent === this._pass(); }
    _info(r, sent) { // every answer: the PC may say the pass is not valid any more
      const i = (r.headers && r.headers.get("X-Relay-Info")) || "";
      if (/pass-unknown/.test(i) && this._current(sent)) this._forget("the PC does not know it");
    }
    account() { return shortAcct(json(ACCOUNT_KEY)); }
    signedIn() { return !!this._pass(); }
    can(flag) { return !!(this._me && this._me.can.includes(flag)); }
    canUse(prog) { return prog === "files" || !!(this._me && this._me.programs.includes(prog)); }
    headers(extra) {
      const h = { "X-Relay-Client": this.app + "/" + VERSION };
      const p = this._pass();
      if (p) h["X-Relay-Pass"] = p;
      return Object.assign(h, extra || {});
    }
    // ---- addresses ----
    url(service, path) { return `${this.base}/svc/${service}/${String(path || "").replace(/^\/+/, "")}`; }
    wsUrl(service, path) { return this.url(service, path).replace(/^http/, "ws"); }
    wsProtocols() { const p = this._pass(); return p ? ["relay", "pass." + p] : ["relay"]; }
    ws(service, path) { return new WebSocket(this.wsUrl(service, path), this.wsProtocols()); }
    _off() { return { ok: false, status: 0, data: null, why: this.where.why || "the cloud is off", kind: "off" }; }
    // fetch through the relay: a Response (throws when the PC cannot be reached, or the address is not known)
    async fetch(service, path, opts) {
      opts = Object.assign({}, opts || {});
      const timeout = opts.timeout || 0; delete opts.timeout;
      await this._ready();
      if (!this.base) throw new TypeError(this.where.why || "the cloud is off");

<script>
/* cloud-kit.js 1: every program opens and saves through the Cloud File Manager with this one script.
   ONE source: Projects\file-manager\kit\cloud-kit.js. A program's build copies it in after relay-client.js (3) and
   window-kit.js; never edit a copy. How to use it, with an example to copy: kit\CLOUD-KIT.md.

     const cloud = CloudKit.for({ app: "plan-cutter", ext: ".plan-cutter", relay: R });
     await cloud.start();                          // is the cloud on, who is this, send up what was kept on this device
     let doc = await cloud.openLast();             // the last document, or null
     doc = await cloud.open({ anchor: button });   // the small Open chooser: Cloud File Manager, This device
     doc = await cloud.openById(id);               // "#open=<id>" from the file manager

     await cloud.save(doc, text);                  // now: into this browser first, then to the cloud
     const auto = cloud.autosave(doc, () => text); // auto.touch() on every change, auto.stop() when it is closed
     await cloud.rename(doc, "Garage");   await cloud.list();

   What it holds to (each has a test in test\cloud-kit.test.mjs):
   - A save goes into this browser first (IndexedDB "cloud-kit"), then to the cloud as that day's file. The cloud off,
     or not answering: the work stays in this browser, the words say so, and it goes up by itself when the cloud is back.
   - Nobody signed in: the first save makes a guest, silently. A document whose owner signed out waits for them.
   - A new day starts a new dated file. Another device saved the same day's file: both are kept (theirs as
     "<name> <date> (2)"), a small notice says so, nobody is asked anything.
   - The browser refuses to keep a copy (full, private mode): said once, plainly; saving to the cloud goes on.
   - When the page is hidden or closed, what was not yet saved is handed to the browser at once.
   - No timer runs while the page is hidden. "This program is open" (seen) is said once a minute while it is in view.
   Nothing here throws for a failure it expects: results carry ok and why, and cloud.state says where things stand. */
(function (root) {
  "use strict";
  const VERSION = 1;
  const DB = "cloud-kit", SEP = "\n", HIGH = String.fromCharCode(0xffff);
  const SAVE_AFTER = 1500, SAVE_MAX = 8000, SEEN_EVERY = 60000, RETRY = [5000, 10000, 20000, 30000], NOTE_MS = 15000, KEEP_DOCS = 12;
  const KEY = /^[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}$/;

  // Every word a person reads comes from here, so every program says the same thing.
  const W = {
    cloud: "Cloud File Manager", device: "This device", deviceFile: "This device: a file", deviceFolder: "This device: a folder",
    connecting: "Connecting…", connected: "Connected", saving: "Saving…", saved: "Saved",
    off: "Cloud File Manager is off.", kept: "Saved on this device.", notSaved: "Not saved.",
    notInCloud: "Not saved in Cloud File Manager.", signIn: "Sign in to save.", reload: "This page is out of date. Reload it.",
    isOff: "It is off right now", untitled: "Untitled", account: "Account",
    noCopy: "This browser cannot keep a copy on this device. Your work is saved in Cloud File Manager only.",
    noCopyOff: "This browser cannot keep a copy on this device, and Cloud File Manager is off. Keep this page open.",
    nothing: "There is nothing to save.",
    badKey: "That name cannot be used for a setting.",
    clash: (n) => `“${n}” was changed on another device too. Both versions are kept.`,
    clashTab: (n) => `“${n}” was changed in another tab too. Both versions are kept.`,
    taken: (n) => `There is already a document named “${n}”.`,
    savedAs: (was, now) => `Saved as “${now}”: there is already a document named “${was}”.`,
    cantOpen: (n, why) => `${n ? `“${n}”` : "That file"} could not be opened${why ? ": " + why : "."}`,
  };

  // ---- small things ---------------------------------------------------------------------------------------------
  const pad = (n) => String(n).padStart(2, "0");
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const lower = (s) => String(s).toLowerCase();
  const rnd = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const q = encodeURIComponent;
  const soft = (p, v) => p.then((x) => x, () => v);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const hidden = () => !!root.document && root.document.visibilityState === "hidden";
  const isBlob = (x) => typeof Blob !== "undefined" && x instanceof Blob;
  const savable = (x) => typeof x === "string" || x instanceof ArrayBuffer || ArrayBuffer.isView(x) || isBlob(x);
  // a reason as the PC or relay-client words it ("could not reach the PC (...)"), as a sentence a person reads

  const keptIn = (rec) => { if (rec.kept) rec.keptIn = rec.app + SEP + rec.owner; else delete rec.keptIn; return rec; };

      for (let i = 0; i < 8; i++) s += d[i].toString(16).padStart(2, "0");

    } catch (e) { return ""; }
  }
  // what a document may be called: Windows' rules and the cloud's own (it hides dot names), in plain words
  function badName(n) {
    if (!n.trim()) return "A name cannot be empty.";
    if (n.length > 80) return "That name is too long.";
    const m = /[\\/:*?"<>|]/.exec(n);
    if (m) return `A name cannot contain ${m[0]}`;
    if (/[\x00-\x1f\x7f]/.test(n)) return "A name cannot contain control characters.";
    if (/[. ]$/.test(n)) return "A name cannot end with a dot or a space.";
    if (/^(\.|~\$)/.test(n) || /\.(tmp|part|partial|crdownload)$/i.test(n) || /^(desktop\.ini|thumbs\.db)$/i.test(n)) return "That name cannot be used. Choose another.";
    if (/^(con|prn|aux|nul|conin\$|conout\$|com\d|lpt\d)$/i.test(n.split(".")[0].trim())) return "Windows keeps that name for itself. Choose another.";

    if (!taken.has(lower(name))) return name;
    const m = /^(.*) \((\d{1,3})\)$/.exec(name), stem = m ? m[1] : name;
    for (let n = m ? +m[2] + 1 : 2; n < 1000; n++) { const c = `${stem} (${n})`; if (!taken.has(lower(c))) return c; }
    return `${stem} (${rnd()})`;
  }
  // the id of a document's file for one day, from the cloud's answer to a rename ({ doc: { files: [{ id, date, copy }] } })
  function fileId(d, date) {
    const files = (d && d.doc && d.doc.files) || [], f = files.find((x) => x.date === date && !x.copy) || files[0];
    return (f && f.id) || "";
  }
  const accepts = (a) => [].concat(a || []).map((x) => lower(x).trim()).filter(Boolean).map((x) => (x === "*" || x.startsWith(".") ? x : "." + x));
  function nameIn(disposition) { // Content-Disposition: inline; filename="a.txt"; filename*=UTF-8''a.txt
    const m = /filename\*=UTF-8''([^;]+)/i.exec(disposition || "") || /filename="([^"]*)"/i.exec(disposition || "");
    try { return m ? decodeURIComponent(m[1]) : ""; } catch (e) { return m ? m[1] : ""; }
  }
  // light or dark: what the page really looks like, however it themes itself
  function isDark() {
    try {
      for (const el of [document.body, document.documentElement]) {
        const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?/.exec(getComputedStyle(el).backgroundColor);
        if (m && (m[4] === undefined || +m[4] > 0.5)) return 0.2126 * m[1] + 0.7152 * m[2] + 0.0722 * m[3] < 110;
      }

    } catch (e) { return false; }
  }

  // ---- this browser's copy (IndexedDB "cloud-kit") --------------------------------------------------------------
  // docs: one record per document { key, app, owner, name, cloudName, version, date, id, rev, hash, size, at, kept }
  // (key = app \n owner \n name in lower case; owner "" = nobody yet); bodies: its content under the same key;
  // values: cloud.data values; marks: what was open last. kept = not in the cloud yet. rev names one content: a
  // record written by another tab has another rev.
  function makeDevice() {
    let db = null, opening = null;
    const dev = { ok: true, why: "" };
    const fail = (e) => { dev.ok = false; dev.why = String((e && e.message) || e || "refused"); };
    function open() {
      if (db) return Promise.resolve(db);
      return opening || (opening = new Promise((res) => {
        let rq;
        try { rq = root.indexedDB.open(DB, 1); } catch (e) { fail(e); return res(null); }
        rq.onupgradeneeded = () => {
          const d = rq.result;
          d.createObjectStore("docs", { keyPath: "key" }).createIndex("kept", "keptIn");

          d.createObjectStore("values", { keyPath: "key" }).createIndex("kept", "keptIn");
          d.createObjectStore("marks", { keyPath: "key" });

          const d = (db = rq.result);

          res(d);
        };
        rq.onerror = (ev) => { fail(rq.error); if (ev && ev.preventDefault) ev.preventDefault(); res(null); };
        rq.onblocked = () => { fail("blocked"); res(null); };
      }).then((d) => { opening = null; return d; }));
    }
    // run: one transaction. body(t, done, on) issues the requests (on(request, fn): fn gets its result); the promise
    // resolves with what was handed to done() once everything is committed, and rejects when the browser refuses.
    function run(stores, mode, body, strict) {
      return open().then((d) => new Promise((res, rej) => {
        if (!d) return rej(new Error(dev.why || "no storage"));
        let t, out, thrown = null;
        try { t = d.transaction(stores, mode, strict ? { durability: "strict" } : undefined); } catch (e) { return rej(e); }
        const stop = (e) => { thrown = thrown || e; try { t.abort(); } catch (x) {} rej(thrown); };
        const on = (rq, fn) => { rq.onsuccess = () => { try { fn(rq.result); } catch (e) { stop(e); } }; };
        t.oncomplete = () => res(out);
        t.onabort = t.onerror = () => rej(thrown || t.error || new Error("refused"));
        try { body(t, (v) => { out = v; }, on); } catch (e) { stop(e); }
      })).then((v) => { if (mode === "readwrite") { dev.ok = true; dev.why = ""; } return v; }, (e) => { fail(e); throw e; });
    }
    const range = (app, owner) => IDBKeyRange.bound(app + SEP + owner + SEP, app + SEP + owner + SEP + HIGH);
    dev.open = () => open().then((d) => !!d);
    // putDoc: the document's newest content. A version another tab saved here that has not reached the cloud is not
    // lost: it stays as a copy of its own (displaced), and goes up as "<name> <date> (2)".
    dev.putDoc = (rec, body, expect) => run(["docs", "bodies"], "readwrite", (t, done, on) => {
      const docs = t.objectStore("docs"), bodies = t.objectStore("bodies");
      done({});
      on(docs.get(rec.key), (cur) => {
        if (cur && cur.kept && cur.rev !== expect && !(rec.hash && cur.hash === rec.hash)) {
          on(bodies.get(rec.key), (old) => { const c = Object.assign({}, cur, { key: rec.key + SEP + "#" + cur.rev, copyOf: cur.name }); docs.put(c); bodies.put(old, c.key); done({ displaced: true }); });
        }
        docs.put(rec);
        bodies.put(body, rec.key);
      });
    }, rec.kept);
    // putNow: as the page is hidden or closed. Handed to the browser at once, with nothing to wait for.
    dev.putNow = (rec, body) => {
      if (!db) return false;
      try {
        const t = db.transaction(["docs", "bodies"], "readwrite", { durability: "strict" });
        t.objectStore("docs").put(rec);
        t.objectStore("bodies").put(body, rec.key);
        if (t.commit) t.commit();
        return true;
      } catch (e) { return false; }
    };
    // settle: the cloud has taken the content named rev. The record learns the cloud's version either way; it stops
    // being "kept" only if it still holds that content (a newer save may have arrived meanwhile).
    dev.settle = (key, rev, base) => run(["docs"], "readwrite", (t, done, on) => {
      const s = t.objectStore("docs");
      done(false);
      on(s.get(key), (cur) => { if (!cur) return; Object.assign(cur, base); if (cur.rev === rev) cur.kept = false; s.put(keptIn(cur)); done(cur.rev === rev); });
    });

      done(null);
      on(t.objectStore("docs").get(key), (rec) => { if (rec) on(t.objectStore("bodies").get(key), (body) => done({ rec, body })); });
    });
    dev.body = (key) => run(["bodies"], "readonly", (t, done, on) => on(t.objectStore("bodies").get(key), done));
    dev.docs = (app, owner) => run(["docs"], "readonly", (t, done, on) => on(t.objectStore("docs").getAll(range(app, owner)), (all) => done(all.filter((r) => !r.copyOf))));
    dev.del = (keys) => run(["docs", "bodies"], "readwrite", (t) => { for (const k of keys) { t.objectStore("docs").delete(k); t.objectStore("bodies").delete(k); } });
    // move: a rename, or nobody's document becoming a person's. change(rec) gives the record its new key and name.
    dev.move = (from, change) => run(["docs", "bodies"], "readwrite", (t, done, on) => {
      const docs = t.objectStore("docs"), bodies = t.objectStore("bodies");
      done(null);
      on(docs.get(from), (cur) => {
        if (cur) on(bodies.get(from), (body) => { const rec = keptIn(change(cur)); if (rec.key !== from) { docs.delete(from); bodies.delete(from); } docs.put(rec); bodies.put(body, rec.key); done(rec); });
      });
    }, true);
    dev.kept = (store, app, owner) => run([store], "readonly", (t, done, on) => on(t.objectStore(store).index("kept").getAll(app + SEP + owner), done));
    dev.count = (app, docOwners, valueOwner) => run(["docs", "values"], "readonly", (t, done, on) => {
      let n = 0;
      const add = (store, owner) => on(t.objectStore(store).index("kept").count(app + SEP + owner), (c) => done((n += c)));
      done(0);
      for (const o of docOwners) add("docs", o);
      if (valueOwner) add("values", valueOwner);
    });
    dev.get = (store, key) => run([store], "readonly", (t, done, on) => on(t.objectStore(store).get(key), (v) => done(v || null)));
    dev.put = (store, rec) => run([store], "readwrite", (t) => { t.objectStore(store).put(keptIn(rec)); }, !!rec.kept);
    dev.remove = (store, key) => run([store], "readwrite", (t) => { t.objectStore(store).delete(key); });
    return dev;
  }

  // ---- what the indicator says ----------------------------------------------------------------------------------
  // tone: ok (green), busy (green, moving), wait (amber: needs a look), off (grey), bad (red)
  function wordsFor(s) {
    if (s.cloud === "checking") return { tone: "off", words: [W.connecting] };
    if (s.unsaved) return { tone: "bad", words: s.cloud === "off" ? [W.notSaved, W.off] : [W.notSaved] };
    if (s.signIn) return { tone: "wait", words: s.kept ? [W.signIn, W.kept] : [W.signIn] };
    if (s.cloud === "off") return { tone: "off", words: s.kept ? [W.off, W.kept] : [s.why === W.reload ? W.reload : W.off] };
    if (s.saving) return { tone: "busy", words: [W.saving] };
    if (s.problem) return { tone: "bad", words: s.kept ? [W.notInCloud, W.kept] : [W.notInCloud] };
    if (s.kept) return { tone: "wait", words: [W.kept] };

  // ---- one program's cloud ---------------------------------------------------------------------------------------
  const kits = new Map(), waiting = new Set(), metas = new WeakMap();

  function meta(doc) {

  }

  class Kit {
    constructor(o) {

      this.name = o.name || "";

      this.accountPage = o.accountPage || "../settings/account.html";
      this.saveAfter = o.saveAfter || SAVE_AFTER;

      this._q = Promise.resolve(); // one cloud write at a time
      this._autos = new Set();
      this._open = new Map(); // key -> the document open in this page (held weakly)
      this._known = new Set(); // lower-case names of this person's documents, as far as this page knows
      this._vjobs = new Map();
      this._busy = 0;
      this._reach = false;
      this._tries = 0;
      this.state = { cloud: "checking", why: "", account: this.R.account(), saving: false, kept: 0, savedAt: 0, device: true, problem: "", signIn: false, unsaved: false, notice: "" };
      Object.assign(this.state, wordsFor(this.state));
      this.data = { get: (k) => this._dataGet(k), set: (k, v) => this._dataSet(k, v), update: (k, fn) => this._dataUpdate(k, fn) };
    }

    // ---- state and events ----
    on(what, fn) {
      const set = this._subs[what];
      if (!set || typeof fn !== "function") return () => {};
      set.add(fn);
      return () => set.delete(fn);
    }
    _emit(what, v) { for (const f of this._subs[what]) { try { f(v); } catch (e) { console.error("cloud-kit:", e); } } }

    // ---- start: is the cloud on, who is this, send up what was kept ----
    start() {

    _listen() {

out vec4 o;
void main() {
  vec2 q = discAt();
  float r = length(q);
  float glow = exp(-max(r - 1.0, 0.0) * 34.0);
  vec3 space = vec3(0.004, 0.005, 0.010) + uGlow * glow * 0.35;
  float cover = clamp((1.0 - r) / uPx + 0.5, 0.0, 1.0);
  vec3 nv = r < 1.0 ? vec3(q, sqrt(1.0 - r * r)) : vec3(q / r, 0.0);
  vec3 w = uCam * nv;
  vec3 c = texture(uPaint, mapUv(lonLat(w))).rgb;
  c *= c;
  float light = smoothstep(-0.08, 0.25, dot(w, uSunDir));
  c = c * (0.05 + 0.95 * light * (0.35 + 0.65 * max(dot(w, uSunDir), 0.0))) + uGlow * 0.25 * light * pow(1.0 - nv.z, 3.0);
  o = vec4(sqrt(mix(space, c, cover)), 1.0);
}
`;var Uf=`// The model's cells, made smooth: 72 x 38 texels in, four times as many each way out, through a cubic curve so no
// cell edge shows; and blended over time from what was on screen (uPrev) toward the newest state (uNext).
uniform sampler2D uPrev;      // the smooth picture as it stood when uNext arrived
uniform sampler2D uNext;      // 72 x 38: the bands, with a row of pole means under and over them
uniform float uT;             // 0 = uPrev, 1 = uNext
in vec2 vNdc;
out vec4 o;

vec4 cubic(float v) {
  vec4 n = vec4(1.0, 2.0, 3.0, 4.0) - v;
  vec4 s = n * n * n;
  float x = s.x, y = s.y - 4.0 * s.x, z = s.z - 4.0 * s.y + 6.0 * s.x;
  return vec4(x, y, z, 6.0 - x - y - z) * (1.0 / 6.0);
}
// Smooth lookup (a cubic B-spline) built from four ordinary lookups. p is in texels.
vec4 smoothTexel(sampler2D t, vec2 p, vec2 size) {
  p -= 0.5;
  vec2 f = fract(p);
  p -= f;
  vec4 xc = cubic(f.x), yc = cubic(f.y);
  vec4 c = p.xxyy + vec2(-0.5, 1.5).xyxy;
  vec4 s = vec4(xc.xz + xc.yw, yc.xz + yc.yw);
  vec4 at = (c + vec4(xc.yw, yc.yw) / s) / size.xxyy;
  vec4 s0 = textureLod(t, at.xz, 0.0), s1 = textureLod(t, at.yz, 0.0), s2 = textureLod(t, at.xw, 0.0), s3 = textureLod(t, at.yw, 0.0);
  float sx = s.x / (s.x + s.y), sy = s.z / (s.z + s.w);
  return mix(mix(s3, s2, sx), mix(s1, s0, sx), sy);
}

void main() {
  vec2 uv = vNdc * 0.5 + 0.5;
  // rows: 0 is the south pole's mean, 1..36 the bands, 37 the north pole's mean. The last 2.5 degrees at each
  // end run from the band's centre to the pole row, so the pole itself has one value.
  float row = uv.y * 36.0 + 1.0;
  row = row < 1.5 ? 0.5 + (row - 1.0) * 2.0 : (row > 36.5 ? 37.5 - (37.0 - row) * 2.0 : row);
  vec4 next = smoothTexel(uNext, vec2(uv.x * 72.0, row), vec2(72.0, 38.0));
  o = mix(textureLod(uPrev, uv, 0.0), next, uT);
}
`;var Yf=`// How thick the cloud is over each pixel of the disc, drawn at half size. The model's cloud cover says how
// much; the noise, carried round by winds that blow in bands, says where. Two copies of the pattern are kept, each
// carried for a while and then started afresh, and blended, so the winds never stretch the cloud out of shape.
// Out: red = thickness / 4 | green = how likely lightning is here | blue, alpha unused
uniform sampler2D uC3;        // ... | ... | rain | ...
uniform sampler2D uC4;        // cloud | water | temperature | brightness
uniform sampler3D uNoise;
uniform vec4 uFlow;           // place in the blend cycle 0..1 | wind bands | shear over one cycle, radians | steady turn, radians
uniform vec4 uCloudK;         // steam 0..1 | noise detail at the disc's centre | - | -
uniform vec3 uOffA, uOffB;    // where each copy of the pattern starts
out vec4 o;

// Great soft shapes, a little swirled: a slow noise bends the place a finer one is read at.
float pattern(vec3 p, float lod) {
  vec4 a = textureLod(uNoise, p * 0.9, max(lod - 0.15, 0.0));
  vec4 b = textureLod(uNoise, p * 3.1 + (a.xyz - 0.5) * 0.7, max(lod + 1.63, 0.0));
  return (a.r - 0.5) * 0.50 + (b.r - 0.5) * 0.45 + (b.g - 0.5) * 0.20;
}

void main() {
  vec2 q = discAt();
  float r2 = dot(q, q);
  if (r2 >= 1.0) { o = vec4(0.0); return; }
  vec3 nv = vec3(q, sqrt(1.0 - r2));
  vec3 w = uCam * nv;
  vec2 ll = lonLat(w);
  vec2 uv = mapUv(ll);
  float lod = uCloudK.y - 0.5 * log2(max(nv.z, 0.05));
  vec4 c4 = textureLod(uC4, uv, 0.0);
  float rain = textureLod(uC3, uv, 0.0).b;
  float steam = uCloudK.x;
  float cover = clamp(max(c4.r, steam), 0.0, 1.0);

  // the winds: every latitude turns at its own speed; the pattern is squeezed along the axis so it lies in
  // streaks along the bands (a steam planet's deck is all bands)
  float speed = 0.35 + 0.65 * cos(2.0 * uFlow.y * ll.y);
  float t1 = fract(uFlow.x), t2 = fract(uFlow.x + 0.5);
  float w1 = 1.0 - abs(2.0 * t1 - 1.0), w2 = 1.0 - w1;
  vec3 squeeze = vec3(1.0, 1.0, mix(1.45, 3.4, steam));
  float n1 = pattern(turnZ(w, uFlow.w + speed * (t1 - 0.5) * uFlow.z) * squeeze + uOffA, lod);
  float n2 = pattern(turnZ(w, uFlow.w + speed * (t2 - 0.5) * uFlow.z) * squeeze + uOffB, lod);
  float n = (n1 * w1 + n2 * w2) / sqrt(w1 * w1 + w2 * w2);
  // finer wisps, carried round whole
  vec4 f = textureLod(uNoise, turnZ(w, uFlow.w) * squeeze * 11.0, max(lod + 3.46, 0.0));
  n += ((f.r - 0.5) * 0.14 + (f.b - 0.29) * 0.07) * (1.0 - 0.7 * steam);

  // where this pixel stands among all pixels (0..1), against how much of the sky the model has covered
  float rank = smoothstep(-0.31, 0.31, n);
  float th = max(rank - (1.0 - cover), 0.0) / max(cover, 0.08);
  th = th * (0.12 + 2.9 * cover * cover) * (1.0 - steam)        // little cloud: thin veils
    + steam * (1.5 + 1.7 * rank);                              // steam: a thick deck, thicker and thinner in bands
  float storm = smoothstep(0.42, 0.8, c4.r) * (0.3 + 0.7 * smoothstep(0.2, 0.7, rain)) * smoothstep(0.5, 1.6, th);
  o = vec4(min(th * 0.25, 1.0), storm, 0.0, 1.0);
}
`;var qf=`// The last step: the picture (drawn at its own size) onto the canvas, with the glow added, bright values eased
// toward white instead of cut off, a slight darkening toward the corners, and a grain of noise that hides banding.
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec4 uTone;           // exposure | glow | 1: keep colours exactly (overlays) | darkening toward the corners
in vec2 vNdc;
out vec4 o;

vec3 shoulder(vec3 x) {
  const float a = 0.55;
  return mix(x, a + (1.0 - a) * (1.0 - exp(-(x - a) / (1.0 - a))), step(a, x));
}
vec3 toScreen(vec3 c) {
  return mix(c * 12.92, 1.055 * pow(max(c, 0.0031308), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}

void main() {
  vec2 uv = vNdc * 0.5 + 0.5;
  vec3 c = textureLod(uScene, uv, 0.0).rgb + textureLod(uBloom, uv, 0.0).rgb * uTone.y;
  c = max(c * uTone.x, 0.0);
  c = mix(shoulder(c), min(c, 1.0), uTone.z);
  c *= 1.0 - uTone.w * dot(vNdc, vNdc);
  c = toScreen(c);
  float grain = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  o = vec4(c + (grain - 0.5) / 255.0, 1.0);
}
`;var Xf=`// Marks drawn on the globe over everything else: the patch of the tool being aimed, the rings and dust of
// impacts and eruptions, puffs where a tool was used, where a comet will land, and the lines of latitude.
// Each mark is a circle on the sphere: a centre, a radius, a kind and a clock.
uniform vec4 uMarkAt[8];      // centre (planet coordinates) | radius in radians
uniform vec4 uMarkLook[8];    // kind | clock 0..1 | strength | seconds
uniform vec4 uMarkCol[8];
uniform int uMarkN;
uniform vec4 uLines;          // lines of latitude: strength | 1 on a locked planet | - | -
out vec4 o;

void main() {
  vec2 q = discAt();
  float r2 = dot(q, q), r = sqrt(r2);
  float inside = clamp((1.0 - r) / uPx + 0.5, 0.0, 1.0);
  vec3 nv = r2 < 1.0 ? vec3(q, sqrt(1.0 - r2)) : vec3(q / r, 0.0);
  float mu = max(nv.z, 0.12);
  vec3 w = uCam * nv;
  vec3 col = vec3(0.0);
  float a = 0.0;

  // ---- lines of latitude every 15 degrees, the equator stronger; a small mark at each pole ----
  // (a mid blue: it shows as a darker line on ice and as a lighter one on sea or rock)
  float lat = degrees(asin(clamp(w.z, -1.0, 1.0)));
  float px = max(fwidth(lat), 1e-4);                             // one drawn pixel, in degrees of latitude
  float thin = 1.0 - smoothstep(1.0, 2.6, px);                   // where lines crowd at the edge they fade out
  float off = abs(fract(lat / 15.0 + 0.5) - 0.5) * 15.0;
  float line = clamp(1.1 - off / px, 0.0, 1.0) * step(abs(lat), 80.0) * step(7.5, abs(lat));
  float eq = clamp(1.4 - abs(lat) / px, 0.0, 1.0);
  float la = uLines.x * thin * max(line * 0.24, eq * 0.50);
  vec3 lineC = vec3(0.34, 0.56, 0.84);
  // the poles: a ring, a dot and four ticks. On a locked planet the north end is the point under the star
  // (a ring with rays, warm) and the south end the point opposite (two rings, cool).
  float away = 90.0 - abs(lat);                                  // degrees from the nearer pole
  float lonAt = atan(w.y, w.x + 1e-9);
  float lon4 = abs(fract(lonAt / (PI * 0.5) + 0.5) - 0.5) * (PI * 0.5);
  float lon8 = abs(fract(lonAt / (PI * 0.25) + 0.5) - 0.5) * (PI * 0.25);
  float lock = uLines.y, north = step(0.0, w.z);
  // (each shape twice: \`g\` pixels wider and dark underneath, so the mark shows on ice and on cloud too)
  float pole = 0.0, under = 0.0;
  for (int k = 0; k < 2; k++) {
    float g = k == 0 ? 1.8 : 0.0;
    float ring = clamp(1.3 + g - abs(away - 2.6) / px, 0.0, 1.0);
    float dot_ = clamp((0.6 - away) / px + 0.5 + g, 0.0, 1.0);
    float ticks = clamp(1.2 + g - lon4 * away / px, 0.0, 1.0) * step(3.6, away + g * px) * step(away - g * px, 5.8);
    float rays = clamp(1.2 + g - lon8 * away / px, 0.0, 1.0) * step(3.8, away + g * px) * step(away - g * px, 6.4);
    float ring2 = clamp(1.3 + g - abs(away - 4.4) / px, 0.0, 1.0);
    float shape = mix(max(max(ring, dot_), ticks), mix(max(ring, ring2), max(max(ring, dot_), rays), north), lock);
    if (k == 0) under = shape; else pole = shape;
  }
  float seen = uLines.x * (1.0 - smoothstep(1.5, 3.5, px));
  vec3 poleC = mix(vec3(0.70, 0.86, 1.0), mix(vec3(0.56, 0.72, 1.0), vec3(1.0, 0.82, 0.42), north), lock);
  float ua = seen * under * 0.5, pa = seen * pole * 0.92;
  col = lineC * la * (1.0 - ua);
  a = la * (1.0 - ua) + ua;
  col = col * (1.0 - pa) + poleC * pa;
  a = a * (1.0 - pa) + pa;

  for (int i = 0; i < 8; i++) {
    if (i >= uMarkN) break;
    vec3 c = uMarkAt[i].xyz;
    float rad = uMarkAt[i].w;
    float ang = acos(clamp(dot(w, c), -1.0, 1.0));
    float x = ang / rad;                                        // 0 at the centre, 1 at the edge
    float e = uPx / mu / rad;                                   // one pixel, in the same measure
    int kind = int(uMarkLook[i].x + 0.5);
    float t = uMarkLook[i].y, s = uMarkLook[i].z;
    vec3 mc = uMarkCol[i].rgb;
    // a bearing round the centre, for dashes and ticks
    vec3 ref = abs(c.z) < 0.95 ? vec3(0.0, 0.0, 1.0) : vec3(1.0, 0.0, 0.0);
    vec3 t1 = normalize(cross(ref, c)), t2 = cross(c, t1);
    float bx = dot(w, t1), by = dot(w, t2);
    float bearing = atan(by, bx);
    float ma = 0.0;
    vec3 add = vec3(0.0);
    if (kind == 0) {
      // the tool's patch: a clear ring, a light fill, a slow shimmer running round
      float ring = exp(-pow((x - 1.0) / (1.6 * e + 0.004), 2.0));
      float fill = (1.0 - smoothstep(1.0 - 2.0 * e, 1.0, x)) * (0.07 + 0.11 * x * x);
      float run = 0.75 + 0.25 * sin(bearing * 6.0 - uMarkLook[i].w * 2.2);
      ma = s * clamp(ring * run + fill, 0.0, 1.0);
      add = mc * s * ring * 0.35;
    } else if (kind == 1) {
      // the tool cannot be used here: a broken grey ring with a cross through it
      float ring = exp(-pow((x - 1.0) / (1.6 * e + 0.004), 2.0)) * step(0.5, fract(bearing * 12.0 / TAU));
      float lim = 1.0 - smoothstep(0.62, 0.66, x);
      float bars = (1.0 - smoothstep(1.2 * e * rad, 2.6 * e * rad, abs(bx - by) * 0.7071)) + (1.0 - smoothstep(1.2 * e * rad, 2.6 * e * rad, abs(bx + by) * 0.7071));
      ma = s * clamp(ring + bars * lim * 0.85 + (1.0 - smoothstep(0.98, 1.0, x)) * 0.10, 0.0, 1.0);
    } else if (kind == 2) {
      // a shock ring running outward
      float ring = exp(-pow((x - t) / (0.035 + 2.0 * e), 2.0)) * pow(1.0 - t, 1.5);
      add = mc * s * ring * 2.5;
      ma = s * ring * 0.25;
    } else if (kind == 3) {
      // a spreading cloud of dust or ash, mottled, thinning as it grows
      float grow = 0.25 + 0.75 * sqrt(t);
      float mot = 0.75 + 0.25 * sin(bearing * 5.0 + x * 9.0) * sin(bearing * 3.0 - x * 14.0 + 1.7);
      ma = s * (1.0 - smoothstep(grow * 0.45, grow, x * mot)) * (1.0 - t) * 0.85;
    } else if (kind == 4) {
      // a soft puff where a tool was used: a ring that opens and fades, with specks
      float ring = exp(-pow((x - (0.25 + 0.75 * t)) / 0.22, 2.0)) * (1.0 - t) * (1.0 - smoothstep(0.95, 1.05, x));
      float speck = pow(0.5 + 0.5 * sin(bearing * 23.0 + x * 31.0) * sin(bearing * 17.0 - x * 23.0), 6.0);
      ma = s * ring * (0.45 + 0.55 * speck);
      add = mc * s * ring * speck * 0.6 * uMarkCol[i].a;
    } else if (kind == 5) {
      // where a comet will land: a small ring that draws in, with four ticks
      float beat = fract(uMarkLook[i].w * 0.6);
      float ring = exp(-pow((x - (1.0 - 0.55 * beat)) / (1.5 * e + 0.02), 2.0)) * (1.0 - beat * 0.6);
      float tick = (1.0 - smoothstep(0.03, 0.08, abs(fract(bearing * 4.0 / TAU + 0.5) - 0.5))) * step(1.0, x) * (1.0 - smoothstep(1.35, 1.4, x));
      ma = s * clamp(ring + tick, 0.0, 1.0) * 0.8;
      add = mc * s * ring * 0.4;
    } else {
      // the edge of a mirror's patch: a faint ring
      ma = s * exp(-pow((x - 1.0) / (1.4 * e + 0.003), 2.0)) * 0.35;
    }
    col = mc * ma + col * (1.0 - ma) + add;
    a = ma + a * (1.0 - ma);
  }
  o = vec4(col, a) * inside;
}
`;var jf=`// One slice of the noise block every other shader draws its detail from. The block repeats in all three
// directions, so it can be laid through the planet any number of times with no seam.
//   red, green, alpha: three different cloudy noises (three octaves each), 0.5 = middle
//   blue: a cell pattern, bright in the middle of each cell and dark along the cracks between cells
//         (ice floes and their leads, pits, veins of lava)
uniform float uSlice;         // 0..1 through the block
in vec2 vNdc;
out vec4 o;

uvec3 pcg3d(uvec3 v) {
  v = v * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> 16u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}
vec3 rnd(ivec3 c, int period, uint seed) {
  ivec3 m = (c + period * 4) % period;           // (c is never below -1)
  return vec3(pcg3d(uvec3(m) + uvec3(seed, seed * 7u + 3u, seed * 13u + 5u))) * (1.0 / 4294967295.0);
}
float grad(ivec3 c, vec3 f, int period, uint seed) { return dot(rnd(c, period, seed) * 2.0 - 1.0, f); }
float gnoise(vec3 p, int period, uint seed) {
  vec3 i = floor(p), f = p - i;
  vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  ivec3 c = ivec3(i);
  float a = mix(grad(c, f, period, seed), grad(c + ivec3(1, 0, 0), f - vec3(1.0, 0.0, 0.0), period, seed), u.x);
  float b = mix(grad(c + ivec3(0, 1, 0), f - vec3(0.0, 1.0, 0.0), period, seed), grad(c + ivec3(1, 1, 0), f - vec3(1.0, 1.0, 0.0), period, seed), u.x);
  float d = mix(grad(c + ivec3(0, 0, 1), f - vec3(0.0, 0.0, 1.0), period, seed), grad(c + ivec3(1, 0, 1), f - vec3(1.0, 0.0, 1.0), period, seed), u.x);
  float e = mix(grad(c + ivec3(0, 1, 1), f - vec3(0.0, 1.0, 1.0), period, seed), grad(c + ivec3(1, 1, 1), f - vec3(1.0, 1.0, 1.0), period, seed), u.x);
  return mix(mix(a, b, u.y), mix(d, e, u.y), u.z);
}
float cloudy(vec3 p, int base, uint seed) {
  return gnoise(p * float(base), base, seed) * 0.57 + gnoise(p * float(base * 2), base * 2, seed + 17u) * 0.29
    + gnoise(p * float(base * 4), base * 4, seed + 34u) * 0.14;
}
// Points scattered one to a cell: how much farther the second nearest is than the nearest. 0 on the borders
// between the cells of the nearest points, large in the middle of a cell.
float cells(vec3 p01, int n, uint seed) {
  vec3 p = p01 * float(n);
  ivec3 base = ivec3(floor(p));
  float d1 = 9.0, d2 = 9.0;
  for (int k = 0; k < 27; k++) {
    ivec3 c = base + ivec3(k % 3, (k / 3) % 3, k / 9) - 1;
    float d = distance(p, vec3(c) + rnd(c, n, seed));
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
  }
  return d2 - d1;
}

void main() {
  vec3 p = vec3(vNdc * 0.5 + 0.5, uSlice);
  float r = cloudy(p, 4, 1u), g = cloudy(p, 4, 101u), a = cloudy(p, 5, 301u);
  float b = clamp(1.9 * cells(p, 6, 201u) * (0.62 + 0.38 * clamp(cells(p, 13, 251u) * 3.0, 0.0, 1.0)), 0.0, 1.0);
  o = vec4(0.5 + r * 1.45, 0.5 + g * 1.45, b, 0.5 + a * 1.45);
}
`;var Zf=`// An overlay: one of the model's numbers as a colour map, on a planet drawn plain and evenly lit so the map is
// easy to read: grey relief, a dark line along every coast, the sea a shade darker. The colours come from a strip
// of 256 that is made from the same scale the screen's legend shows.
uniform sampler2D uTerrain;
uniform sampler2D uCa;        // the cell texture that holds the value
uniform sampler2D uCb;        // a second one, for values spread over two (life)
uniform sampler2D uStrip;     // 256 x 1
uniform sampler3D uNoise;
uniform vec4 uMaskA, uMaskB;  // which channels add up to the value
uniform vec4 uTerr;           // sea level m | 1 / spread of the heights | relief shading | detail added to the heights, m
uniform vec4 uLod;            // map detail at the disc's centre | noise detail there | - | -
out vec4 o;

void main() {
  vec2 q = discAt();
  float r2 = dot(q, q), r = sqrt(r2);
  float cover = clamp((1.0 - r) / uPx + 0.5, 0.0, 1.0);
  if (cover <= 0.0) { o = vec4(0.0); return; }
  vec3 nv = r2 < 1.0 ? vec3(q, sqrt(1.0 - r2)) : vec3(q / r, 0.0);
  float mu = nv.z;
  vec3 w = uCam * nv;
  vec2 ll = lonLat(w);
  vec2 uv = mapUv(ll);
  float fore = -0.5 * log2(max(mu, 0.05));
  float lodT = max(uLod.x + fore - 0.5 * log2(max(cos(ll.y), 0.05)), 0.0);
  vec4 terr = textureLod(uTerrain, uv, lodT);
  // (the same three lookups as surface.frag, so the coast is in the same place)
  vec4 n0 = textureLod(uNoise, w * 1.7 + vec3(0.13, 0.71, 0.37), max(uLod.y + fore + 0.77, 0.0));
  vec4 n1 = textureLod(uNoise, w * 5.3 + (n0.xyz - 0.5) * 0.3, max(uLod.y + fore + 2.41, 0.0));
  vec4 n2 = textureLod(uNoise, w * 23.7 + (n1.xyz - 0.5) * 0.06, max(uLod.y + fore + 4.57, 0.0));
  float h = terr.r + uTerr.w * ((n1.r - 0.5) * 0.6 + (n2.r - 0.5) * 0.4 + (n2.a - 0.5) * 0.2);
  float depth = uTerr.x - h;
  float slope = length(terr.ba);
  float aa = (slope * 1000.0 + uTerr.w * 45.0) * uPx / max(mu, 0.25) + 0.5;
  float sea = smoothstep(-aa, aa, depth);
  float coast = 1.0 - smoothstep(aa * 0.5, aa * 1.5, abs(depth));

  float v = clamp(dot(textureLod(uCa, uv, 0.0), uMaskA) + dot(textureLod(uCb, uv, 0.0), uMaskB), 0.0, 1.0);

`;var oa=`// Shared by every pass that draws on the planet's disc. The planet is a sphere of radius 1 seen along parallel
// rays; q is a pixel's place in planet radii from the centre of the disc (view.ts uses the same sums).
const float PI = 3.14159265359;
const float TAU = 6.28318530718;
uniform vec2 uToQ;      // clip space to planet radii
uniform vec2 uCtr;      // the planet's centre, in clip space
uniform mat3 uCam;      // view to planet: columns right, up, toward the viewer
uniform float uPx;      // one drawn pixel, in planet radii
in vec2 vNdc;

// This pixel's place on the disc, in planet radii from its centre.
vec2 discAt() { return (vNdc - uCtr) * uToQ; }

// Longitude and latitude (radians) of a point of the unit sphere, in planet coordinates.
vec2 lonLat(vec3 w) {
  float lon = abs(w.x) + abs(w.y) > 1e-6 ? atan(w.y, w.x) : 0.0;
  return vec2(lon, asin(clamp(w.z, -1.0, 1.0)));
}
// The same as a place in the maps: u from longitude -180 eastward, v from the south pole north.
vec2 mapUv(vec2 ll) { return vec2(ll.x / TAU + 0.5, ll.y / PI + 0.5); }

vec3 turnZ(vec3 p, float a) {
  float c = cos(a), s = sin(a);
  return vec3(c * p.x - s * p.y, s * p.x + c * p.y, p.z);
}
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

uniform vec4 uRect;
out vec2 vNdc;
void main() {
  vNdc = uRect.xy + aPos * uRect.zw;
  gl_Position = vec4(vNdc, 0.0, 1.0);
}
`;var Qf=`// Everything above the ground: the lit air (its tint over the disc and its glow beyond the edge), the clouds,
// bright haze and dust veils as films, and on the night side lightning and aurora. Laid over the ground with
// "one, one minus alpha", so the colour here is already multiplied by its cover.
uniform sampler2D uCloudBuf;
uniform sampler3D uNoise;
uniform vec4 uCloudMap;       // clip space to the cloud buffer
uniform vec2 uCloudSun;       // a step toward the star, in the cloud buffer
uniform vec3 uSunDir;         // planet coordinates
uniform vec3 uSunView;        // view coordinates
uniform vec3 uSunColor;
uniform vec3 uAirColor;
uniform vec3 uSunsetColor;
uniform vec4 uAirK;           // strength | height of the glow | steam | softness of the day's edge
uniform vec4 uFilm;           // bright haze: colour, cover
uniform vec4 uVeil;           // dust veil: colour, cover
uniform vec3 uCloudColor;
uniform vec4 uCloudLook;      // how much cloud to draw (0: none) | noise detail at the disc's centre | light at night | lightning rate
uniform vec4 uAurora;         // magnetic axis (planet coordinates) | strength
uniform vec3 uAuroraColor;
uniform vec4 uTimeK;          // seconds | a flare's wash | a pulse of the air (tools) | how far past the edge this is drawn

uniform vec4 uMirror[6];      // centre of each mirror's patch (xyz) | 1 / its radius in radians
uniform float uMirrorPow[6];

  vec3 nv = r2 < 1.0 ? vec3(q, sqrt(1.0 - r2)) : vec3(q / r, 0.0);

  float tw = uAirK.w;
  float back = max(-uSunView.z, 0.0);                           // 1 when the star is right behind the planet
  float out_ = max(r - 1.0, 0.0);
  float up = out_ / uAirK.y;
  float fade = 1.0 - smoothstep(0.45 * uTimeK.w, uTimeK.w, out_);        // nothing is left where the drawing stops

  float low = exp(-pow((ndl + 0.02) / 0.09, 2.0));               // the star stands low here: sunset colours

  vec2 g = vec2(ll.x, ll.y) * 6.5;

  col += vec3(0.72, 0.8, 1.0) * flash * cb.g * night * 5.0 * inside * uCloudLook.x;

  // ---- films: bright haze high up, then a veil of dust ----

  col += uPulseColor * ring * (inside * 0.5 + (1.0 - inside) * exp(-up * 0.5) * 0.5 * fade);

`;var Jf=`// The small things in space, one rectangle each: the planet's star, mirrors' glints, comets, the flash and the
// plume of an impact or eruption, and the shade. Colour out is already multiplied by cover (alpha 0 = pure light).
uniform vec4 uAt;             // centre x, y in planet radii | size in planet radii | kind
uniform vec4 uCol;            // colour | strength
uniform vec4 uArg;            // a direction x, y | two numbers the kind uses
out vec4 o;

void main() {
  vec2 p = (discAt() - uAt.xy) / uAt.z;
  float d = length(p);
  int kind = int(uAt.w + 0.5);
  vec2 ax = uArg.xy;
  float along = dot(p, ax), across = dot(p, vec2(-ax.y, ax.x));

`;var th=`// The stars: points on a far sphere. The planet is drawn with parallel rays, but the sky behind it is drawn as a
// camera with a lens would see it, so that the stars (and the planet's own star) move across when the view turns.
layout(location = 0) in vec3 aDir;      // where the star is, in the sky's own coordinates
layout(location = 1) in vec4 aLook;     // colour, brightness 0..1
uniform mat3 uSky;            // sky to view
uniform vec2 uFocal;          // lens: clip-space units for a tangent of 1
uniform float uPoint;         // drawn pixels for a point of size 1
uniform vec2 uCtr;            // the planet's centre, in clip space: the lens looks past it
out vec3 vColor;
void main() {
  vec3 d = uSky * aDir;
  if (d.z > -0.2) { gl_Position = vec4(3.0, 3.0, 3.0, 1.0); gl_PointSize = 1.0; vColor = vec3(0.0); return; }
  gl_Position = vec4(uCtr + d.xy / -d.z * uFocal, 0.0, 1.0);
  float b = aLook.a;
  float size = (1.6 + 3.2 * b * b) * uPoint;
  gl_PointSize = max(size, 2.0);
  // a point smaller than two pixels is drawn two pixels wide and dimmer instead
  vColor = aLook.rgb * (0.10 + 1.9 * b * b * b) * min(1.0, size * size / 4.0);
}
`;var nh=`// The ground, the sea, the ice and the life of the planet, lit by its star. One pixel of the disc at a time:
// the model's cells (made smooth, see cells.frag) say how much of each thing is here; the height map and the
// noise say exactly where, so nothing shows as squares.
uniform sampler2D uTerrain;   // height m | rank among the ground around | slope east | slope north (km per radian)
uniform sampler2D uRiver;     // nearness to a river's line | the river's size
uniform sampler2D uC0;        // white share | ice thickness | carbon dioxide frost | lakes
uniform sampler2D uC1;        // soil moisture | dark dust | rock dust | heat
uniform sampler2D uC2;        // life 0..3
uniform sampler2D uC3;        // life 4, 5 | rain | brightness of the bare ground
uniform sampler2D uCloudBuf;  // cloud thickness as drawn this frame (for shadows)
uniform sampler3D uNoise;

uniform vec3 uSunDir;         // planet coordinates
uniform vec3 uSunColor;
uniform vec3 uAmbDay;         // light from the sky by day
uniform vec3 uAmbNight;       // what is left at night
uniform vec4 uLightK;         // softness of the day's edge | strength of cloud shadows | glow of sea life | -
uniform vec4 uTerr;           // sea level m | 1 / spread of the heights | relief shading | detail added to the heights, m
uniform vec4 uLod;            // map detail at the disc's centre | noise detail there | river pixels to a drawn pixel | 1 / depth where the sea turns dark
uniform vec3 uRockLow, uRockHigh, uSand, uSeaShallow, uSeaDeep, uIce, uSnow, uFrost;
uniform vec3 uLifeColor[6];
uniform vec4 uLifeHab[6];     // where each strain lives: land | sea | ice | shore
uniform vec4 uMirror[6];      // centre of each mirror's patch (xyz) | 1 / its radius in radians
uniform float uMirrorPow[6];
uniform vec4 uCloudMap;       // clip space to the cloud buffer
uniform vec2 uCloudSun;       // a step toward the star, in the cloud buffer
uniform vec3 uSkyRefl;        // the sky as the sea mirrors it
out vec4 o;

// Where a noise value stands among all its values, 0..1 (the cloudy channels; the cell channel).
float pct(float x) { return smoothstep(0.104, 0.896, x); }
float pctCell(float x) { return 1.0 - exp(-3.0 * x); }

float crack(float x) { return 1.0 - smoothstep(0.07, 0.19, x); }

void main() {
  vec2 q = discAt();

  float fore = -0.5 * log2(max(mu, 0.05));
  float squeeze = -0.5 * log2(max(cos(ll.y), 0.05));            // the maps' pixels are narrow toward the poles

  float lodT = max(uLod.x + fore + squeeze, 0.0);

  float lodN = uLod.y + fore;
  vec4 n0 = textureLod(uNoise, w * 1.7 + vec3(0.13, 0.71, 0.37), max(lodN + 0.77, 0.0));
  vec4 n1 = textureLod(uNoise, w * 5.3 + (n0.xyz - 0.5) * 0.3, max(lodN + 2.41, 0.0));
  vec4 n2 = textureLod(uNoise, w * 23.7 + (n1.xyz - 0.5) * 0.06, max(lodN + 4.57, 0.0));
  vec4 c0 = textureLod(uC0, uv, 0.0);
  vec4 c1 = textureLod(uC1, uv, 0.0);
  vec4 c2 = textureLod(uC2, uv, 0.0);

  float h = terr.r + uTerr.w * ((n1.r - 0.5) * 0.6 + (n2.r - 0.5) * 0.4 + (n2.a - 0.5) * 0.2);

  // ---- the sea: pale in the shallows, dark over the deeps, with slow streaks of current ----
  vec3 water = mix(uSeaShallow, uSeaDeep, 1.0 - exp(-max(depth, 0.0) * uLod.w));
  water *= 0.86 + 0.28 * n0.g;

  // ---- white: the highest ground of a cell first, the edge broken by noise; on the sea, floes ----
